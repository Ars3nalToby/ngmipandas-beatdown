// Suit look for every astronaut in the collection (helmet + black visor, no face showing)
const SUITS = {
  astro_gmi: { color: '#c9a227', metal: 0.95, rough: 0.22, badge: 'GMI', badgeColor: '#4d3a05' },
  dark_gmi: { shell: '#1c1c21', color: '#151515', metal: 0.15, rough: 0.55, tee: 'wife\nchanging\nmoney', visor: 'GMI' },
  astro_5833: { color: '#d32f2f', pattern: 'checker', metal: 0, rough: 0.8 },
  astro_1778: { shell: '#2b2b30', color: '#121212', metal: 0.35, rough: 0.4, badge: 'GMI', badgeColor: '#6b7280' },
  astro_8817: { color: '#1a1712', pattern: 'glitter', metal: 0.6, rough: 0.35 },
  astro_3424: { color: '#c62828', metal: 0.85, rough: 0.25, badge: 'GMI', badgeColor: '#fde047', glowBadge: true },
  astro_149: { color: '#a9bde0', metal: 1, rough: 0.12, badge: 'GMI', badgeColor: '#1e3a8a' },
  astro_997: { color: '#8d8aa8', metal: 0.15, rough: 0.6, badge: 'GMI', badgeColor: '#ede9fe' }
};

const suitTexCache = new Map();
function makeSuitTexture(suit) {
  if (!suitTexCache.has(suit)) {
    const t = drawSuitTexture(suit);
    t.userData.shared = true;
    suitTexCache.set(suit, t);
  }
  return suitTexCache.get(suit);
}
function drawSuitTexture(suit) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = suit.color;
  g.fillRect(0, 0, 512, 256);
  if (suit.pattern === 'checker') {
    const sq = 32;
    for (let y = 0; y < 256; y += sq) for (let x = 0; x < 512; x += sq) {
      if (((x + y) / sq) % 2 === 0) { g.fillStyle = '#f5f5f4'; g.fillRect(x, y, sq, sq); }
    }
  } else if (suit.pattern === 'glitter') {
    for (let i = 0; i < 2600; i++) {
      g.fillStyle = Math.random() < 0.7 ? '#d4a640' : '#fff1b0';
      const r = Math.random() * 2.4 + 0.6;
      g.fillRect(Math.random() * 512, Math.random() * 256, r, r);
    }
  }
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  if (suit.tee) {
    g.fillStyle = '#f4f4f5';
    g.fillRect(176, 40, 160, 190);
    g.fillStyle = '#111111';
    g.font = '800 26px "Rubik", sans-serif';
    suit.tee.split('\n').forEach((t, i) => g.fillText(t, 256, 100 + i * 34));
  } else if (suit.badge) {
    if (suit.glowBadge) { g.shadowColor = suit.badgeColor; g.shadowBlur = 18; }
    g.fillStyle = suit.badgeColor;
    g.font = '900 52px "Arial Black", sans-serif';
    g.fillText(suit.badge, 256, 120);
    g.shadowBlur = 0;
  }
  return srgbTex(new THREE.CanvasTexture(c));
}

// ============================================================================
// AUDIO: every sound is synthesised live with WebAudio (no files to load)
// ============================================================================
const sfx = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null, recDest = null;
  let muted = false, lastHit = 0, musicTimer = null, nextStepTime = 0, step = 0, intensity = 0;
  let curBus = null; // when set, sounds route through a panner + muffle filter (positional audio)

  const ensure = () => {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      // iOS 17+: play game audio even when the ringer/silent switch is on
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.ratio.value = 5;
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(comp);
      comp.connect(ctx.destination);
      sfxBus = ctx.createGain();
      sfxBus.gain.value = 0.85;
      sfxBus.connect(master);
      musicBus = ctx.createGain();
      musicBus.gain.value = 0.42;
      musicBus.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state !== 'running' && ctx.state !== 'closed') {
      try { const pr = ctx.resume(); if (pr && pr.catch) pr.catch(() => {}); } catch (e) {}
    }
    return ctx;
  };

  const env = (g, t, peak, dur) => {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  };

  const tone = (type, f0, f1, dur, vol, bus, at, filterHz) => {
    const t = at || ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    env(g, t, vol, dur);
    if (filterHz) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(filterHz, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(80, filterHz * 0.25), t + dur);
      o.connect(f);
      f.connect(g);
    } else {
      o.connect(g);
    }
    g.connect(bus || curBus || sfxBus);
    o.start(t);
    o.stop(t + dur + 0.05);
  };

  const hiss = (dur, vol, type, f0, f1, bus, at) => {
    const t = at || ctx.currentTime;
    const n = ctx.createBufferSource();
    n.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    env(g, t, vol, dur);
    n.connect(f);
    f.connect(g);
    g.connect(bus || curBus || sfxBus);
    n.start(t, Math.random() * 0.5);
    n.stop(t + dur + 0.05);
  };

  const play = (name, vol = 1, p = 1, pan = null, muffle = 0) => {
    if (!ctx || muted || vol <= 0.02) return;
    const now = ctx.currentTime;
    if (pan !== null || muffle > 0) {
      // left/right by direction, duller with distance or through walls
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = Math.max(450, 16000 * Math.pow(1 - Math.min(0.9, muffle), 2.2));
      if (ctx.createStereoPanner) {
        const sp = ctx.createStereoPanner();
        sp.pan.value = Math.max(-1, Math.min(1, pan || 0));
        lp.connect(sp);
        sp.connect(sfxBus);
      } else lp.connect(sfxBus);
      curBus = lp;
    }
    try {
    switch (name) {
      case 'hit':
        if (now - lastHit < 0.045) return;

// Procedural noise canvas (value noise, a few octaves) -> used for stone, patina, bump, moon craters
function noiseCanvas(size, scale, octaves, seed = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const G = 64;
  const grid = new Float32Array(G * G);
  let st = seed * 9301 + 49297;
  for (let i = 0; i < grid.length; i++) {
    st = (st * 9301 + 49297) % 233280;
    grid[i] = st / 233280;
  }
  const at = (x, y) => grid[((y % G + G) % G) * G + ((x % G + G) % G)];
  const smooth = t => t * t * (3 - 2 * t);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let v = 0, amp = 0.5, f = scale / size;
      for (let o = 0; o < octaves; o++) {
        const fx = x * f, fy = y * f;
        const ix = Math.floor(fx), iy = Math.floor(fy);
        const tx = smooth(fx - ix), ty = smooth(fy - iy);
        const a = at(ix, iy), b = at(ix + 1, iy), cc = at(ix, iy + 1), d = at(ix + 1, iy + 1);
        v += amp * ((a + (b - a) * tx) + ((cc + (d - cc) * tx) - (a + (b - a) * tx)) * ty);
        amp *= 0.5;
        f *= 2;
      }
      const k = (y * size + x) * 4;
      const g = Math.max(0, Math.min(255, v * 255));
      img.data[k] = img.data[k + 1] = img.data[k + 2] = g;
      img.data[k + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

// ---------- cinematic post: bloom + ACES + split-tone grade + vignette + grain + subtle CA ----------
function createPost(renderer, scene, camera) {
  const isGL2 = renderer.capabilities.isWebGL2;
  const canHalf = isGL2 && (renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float'));
  const type = canHalf ? THREE.HalfFloatType : THREE.UnsignedByteType;
  const size = new THREE.Vector2();
  renderer.getDrawingBufferSize(size);
  const rtScene = new THREE.WebGLRenderTarget(size.x, size.y, { type, samples: isGL2 ? 4 : 0 });
  const rtA = new THREE.WebGLRenderTarget(1, 1, { type });
  const rtB = new THREE.WebGLRenderTarget(1, 1, { type });
  const quadScene = new THREE.Scene();
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
  quad.frustumCulled = false;
  quadScene.add(quad);
  const vs = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
  const mat = (uniforms, fs) => new THREE.ShaderMaterial({ uniforms, vertexShader: vs, fragmentShader: fs, depthTest: false, depthWrite: false, toneMapped: false });
  const bright = mat({ tex: { value: null }, threshold: { value: 0.9 } },
    'uniform sampler2D tex; uniform float threshold; varying vec2 vUv;' +
    'void main(){ vec3 c = texture2D(tex, vUv).rgb; float l = max(max(c.r, c.g), c.b);' +
    'gl_FragColor = vec4(c * smoothstep(threshold, threshold + 0.8, l), 1.0); }');
  const blur = mat({ tex: { value: null }, dir: { value: new THREE.Vector2() } },
    'uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;' +
    'void main(){ vec3 c = texture2D(tex, vUv).rgb * 0.227;' +
    'c += texture2D(tex, vUv + dir * 1.385).rgb * 0.316; c += texture2D(tex, vUv - dir * 1.385).rgb * 0.316;' +
    'c += texture2D(tex, vUv + dir * 3.231).rgb * 0.070; c += texture2D(tex, vUv - dir * 3.231).rgb * 0.070;' +
    'gl_FragColor = vec4(c, 1.0); }');
  const comp = mat(
    { tScene: { value: null }, tBloom: { value: null }, time: { value: 0 }, res: { value: new THREE.Vector2() }, bloomStrength: { value: 0.55 }, exposure: { value: 0.88 }, flash: { value: 0 } },
    `uniform sampler2D tScene; uniform sampler2D tBloom; uniform float time; uniform vec2 res; uniform float bloomStrength; uniform float exposure; uniform float flash; varying vec2 vUv;
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
    float rnd(vec2 co){ return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453); }

  };

  const pass = (m, target) => {
    quad.material = m;
    renderer.setRenderTarget(target);
    renderer.render(quadScene, quadCam);
  };
  return {
    comp,
    setSize,
    render(t) {
      renderer.setRenderTarget(rtScene);
      renderer.render(scene, camera);
      bright.uniforms.tex.value = rtScene.texture;
      pass(bright, rtA);

        blur.uniforms.tex.value = rtA.texture;
        blur.uniforms.dir.value.set(i / rtA.width, 0);

  };

// PBR upgrade for panda parts: fur gets sheen, metal/helmets get a lacquer clearcoat
const physCache = new Map();
function upgradePandaMaterials(root) {
  if (!GFX_CINEMATIC) return;
  const conv = m => {
    if (!m || !m.isMeshStandardMaterial || m.isMeshPhysicalMaterial) return m;
    if (physCache.has(m)) return physCache.get(m);
    const pm = new THREE.MeshPhysicalMaterial({
      color: m.color, map: m.map, roughness: m.roughness, metalness: m.metalness,
      emissive: m.emissive, emissiveIntensity: m.emissiveIntensity, emissiveMap: m.emissiveMap,
      transparent: m.transparent, opacity: m.opacity, side: m.side, vertexColors: m.vertexColors

      pm.clearcoat = 1;
      pm.clearcoatRoughness = 0.22;
      pm.roughness = Math.max(0.18, m.roughness);
    } else if (m.roughness >= 0.4) {
      pm.sheen = 0.35;
      pm.sheenRoughness = 0.85;
      pm.sheenColor = m.color.clone().multiplyScalar(0.5);
      pm.roughness = Math.min(1, m.roughness + 0.05);
    } else {
      pm.clearcoat = 0.5;
      pm.clearcoatRoughness = 0.3;
    }
    physCache.set(m, pm);
    return pm;
  };
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
  });
}

let arenaTexCache = null;
function makeArenaTextures() {
  if (arenaTexCache) return arenaTexCache;
  const S = 1024, C = S / 2;
  const n1 = noiseCanvas(S, 18, 5, 3);
  const n2 = noiseCanvas(S, 90, 3, 7);
  const draw = (mode) => {
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const ctx = c.getContext('2d');
    if (mode === 'albedo') {
      const bg = ctx.createRadialGradient(C, C, 0, C, C, C);
      bg.addColorStop(0, '#5a524a');
      bg.addColorStop(0.6, '#3d3832');
      bg.addColorStop(0.86, '#2c2824');
      bg.addColorStop(1, '#1d1a17');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, S, S);
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = 0.9;
      ctx.drawImage(n1, 0, 0);
      ctx.globalAlpha = 0.35;
      ctx.drawImage(n2, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = mode === 'bump' ? '#9a9a9a' : '#b8b8b8';
      ctx.fillRect(0, 0, S, S);
      ctx.globalAlpha = mode === 'bump' ? 0.75 : 0.55;
      ctx.drawImage(mode === 'bump' ? n2 : n1, 0, 0);
      ctx.globalAlpha = 1;
    }

    const seam = mode === 'albedo' ? 'rgba(10,8,6,0.75)' : mode === 'bump' ? '#202020' : '#ffffff';
    ctx.strokeStyle = seam;
    ctx.lineWidth = 5;
    const rings = [0.16, 0.32, 0.5, 0.68, 0.86];
    rings.forEach(f => { ctx.beginPath(); ctx.arc(C, C, C * f, 0, Math.PI * 2); ctx.stroke(); });
    rings.forEach((f, i) => {
      const inner = i === 0 ? 0 : rings[i - 1];
      const count = 6 + i * 5;
      for (let k = 0; k < count; k++) {
        const a = (k / count) * Math.PI * 2 + i * 0.31;
        ctx.beginPath();
        ctx.moveTo(C + Math.cos(a) * C * inner, C + Math.sin(a) * C * inner);

    };
    sign('WAGMI FM', '#1e1b4b', '#f0abfc', -14, 13, -20.5, 0, 9);

    sign('HODL', '#0c4a6e', '#67e8f9', -22.6, 9, -4, Math.PI / 2, 7);

    for (let i = 0; i < 9; i++) {

      crate.position.set((Math.random() - 0.5) * 30, 0.8, -6 - Math.random() * 12);
      crate.rotation.y = Math.random();
      town.add(crate);
    }
    const gunKeys = ['ak', 'smg', 'shotgun', 'rpg', 'gatling', 'golden'];
    const shooters = [];
    for (let i = 0; i < (IS_TOUCH ? 4 : 6); i++) {

      m.userData.leftArmGroup.rotation.x = -0.35;
      town.add(m);
      shooters.push({ m, team, row: (Math.floor(i / 2) - 1) * 5, ph: Math.random() * 6, cd: 0.3 + Math.random(), hitT: 0, x0: team ? 7 : -7 });
    }
    const flashTex = makeGlowTexture('rgba(255,236,170,1)', 'rgba(255,140,40,0)');
    const tracers = [];
    for (let i = 0; i < 10; i++) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
      const ln = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
      const fl = new THREE.Sprite(new THREE.SpriteMaterial({ map: flashTex, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
      fl.scale.set(1.3, 1.3, 1);
      town.add(ln, fl);
      tracers.push({ ln, fl, t: 0 });
    }
    let tri = 0;
    const booms = [];
    for (let i = 0; i < 3; i++) {
      const b = new THREE.Sprite(new THREE.SpriteMaterial({ map: flashTex, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
      town.add(b);
      booms.push({ s: b, t: 0 });
    }
    let boomCd = 2.5, bi = 0;
    const warmSun = new THREE.DirectionalLight(0xffa36b, 0);
    warmSun.position.set(25, 30, 35);
    scene.add(warmSun);
    const boomLight = new THREE.PointLight(0xffa040, 0, 30, 1.6);
    scene.add(boomLight);
    const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();

    const bgA = new THREE.Color(0x050816), bgB = new THREE.Color(0x2a1030);
    let k = modeRef.current === 'shootout' ? 1 : 0;
    let lastT = 0, px = 0, py = 0, pxs = 0, pys = 0;
    const onMove = e => {
      px = (e.clientX / window.innerWidth) * 2 - 1;
      py = (e.clientY / window.innerHeight) * 2 - 1;
    };
    window.addEventListener('pointermove', onMove);

    let id;
    const loop = t => {
      id = requestAnimationFrame(loop);
      const s = t * 0.001;
      const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
      lastT = t;
      const target = modeRef.current === 'shootout' ? 1 : 0;
      k += (target - k) * Math.min(1, dt * 2.6);
      if (Math.abs(target - k) < 0.002) k = target;
      const bump = Math.sin(Math.PI * k);
      const inTown = k > 0.5;
      arena.visible = !inTown;
      moon.visible = !inTown;
      town.visible = inTown;
      stars.material.opacity = inTown ? 0.35 : 0.85;
      scene.background.copy(bgA).lerp(bgB, k);
      scene.fog.color.copy(scene.background);
      scene.fog.density = (inTown ? 0.006 : 0.008) + bump * 0.06;
      warmSun.intensity = inTown ? 1.7 : 0;
      dl.intensity = inTown ? 0.5 : 1.6;
      pxs += (px - pxs) * Math.min(1, dt * 3);
      pys += (py - pys) * Math.min(1, dt * 3);
      cam.fov = 45 + bump * 28;
      cam.updateProjectionMatrix();
      if (inTown) {
        cam.position.set(Math.sin(s * 0.12) * 7 + pxs * 3, 8.5 + bump * 10 - pys * 1.5, 30);
        cam.lookAt(0, 3, -4);
        shooters.forEach(sh => {
          const z = sh.row - 8 + Math.sin(s * 0.9 + sh.ph) * 2.2;
          sh.hitT = Math.max(0, sh.hitT - dt);
          sh.m.position.set(sh.x0 + Math.sin(s * 0.6 + sh.ph) * 0.8, sh.hitT > 0 ? Math.sin((sh.hitT / 0.25) * Math.PI) * 0.5 : 0, z);
          sh.m.rotation.y = sh.team ? -Math.PI / 2 : Math.PI / 2;
          sh.cd -= dt;
          if (sh.cd <= 0) {
            sh.cd = 0.25 + Math.random() * 0.9;
            const foes = shooters.filter(o => o.team !== sh.team);
            const tg = foes[Math.floor(Math.random() * foes.length)];
            const dir = sh.team ? -1 : 1;
            tmpA.set(sh.m.position.x + dir * 1.25, 1.25, sh.m.position.z - 0.15);
            tmpB.set(tg.m.position.x, 1.1 + Math.random() * 0.8, tg.m.position.z + (Math.random() - 0.5) * 1.5);
            const tr = tracers[tri++ % tracers.length];
            const pa = tr.ln.geometry.attributes.position;
            pa.setXYZ(0, tmpA.x, tmpA.y, tmpA.z);
            pa.setXYZ(1, tmpB.x, tmpB.y, tmpB.z);
            pa.needsUpdate = true;
            tr.fl.position.copy(tmpA);
            tr.t = 0.08;
            if (Math.random() < 0.35) tg.hitT = 0.25;
          }
        });
        tracers.forEach(tr => {
          tr.t = Math.max(0, tr.t - dt);
          tr.ln.material.opacity = tr.t > 0 ? 0.95 : 0;
          tr.fl.material.opacity = tr.t > 0 ? 1 : 0;
        });
        boomCd -= dt;
        if (boomCd <= 0) {
          boomCd = 2.2 + Math.random() * 2.5;
          const b = booms[bi++ % booms.length];
          b.t = 0.7;
          b.s.position.set((Math.random() - 0.5) * 22, 1.5, -12 - Math.random() * 8);
          boomLight.position.copy(b.s.position);
          boomLight.intensity = 9;
        }
        booms.forEach(b => {
          b.t = Math.max(0, b.t - dt);
          const p = 1 - b.t / 0.7;
          b.s.material.opacity = b.t > 0 ? (1 - p) : 0;
          const sc = 2 + p * 9;
          b.s.scale.set(sc, sc, 1);
        });
        boomLight.intensity = Math.max(0, boomLight.intensity - dt * 16);
        renderer.render(scene, cam);
        return;
      }
      boomLight.intensity = 0;
      arena.rotation.y = s * 0.08;
      walkers.forEach(wk => {
        wk.a += wk.sp * 0.016 * wk.dir;
        wk.m.position.set(Math.cos(wk.a) * wk.r, Math.max(0, Math.sin(s * 3 + wk.hop)) * 1.6, Math.sin(wk.a) * wk.r);
        wk.m.rotation.y = -wk.a + (wk.dir > 0 ? Math.PI : 0);
        const ud = wk.m.userData;
        if (ud && ud.rightArmGroup) ud.rightArmGroup.position.z = Math.sin(s * 4 + wk.hop) > 0.7 ? 0.65 : 0.2;
      });
      stars.rotation.y = s * 0.01;
      cam.position.set(Math.sin(s * 0.15) * 6 + pxs * 4, 26 + bump * 14 - pys * 2, 46);
      cam.lookAt(0, 0, 0);
      renderer.render(scene, cam);
    };
    id = requestAnimationFrame(loop);
    const onResize = () => {
      [w, h] = size();
      cam.aspect = w / h;
      cam.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    window.addEventListener('resize', onResize);
    return () => {
      cancelAnimationFrame(id);
      window.removeEventListener('resize', onResize);
      window.removeEventListener('pointermove', onMove);
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
      el.innerHTML = '';
    };
  }, []);
  return <div ref={ref} className="absolute inset-0" />;
}

// Rotating 3D preview of a panda class for the character select cards
function makePreviewScene(config, w, h, solo = true, noPed = false) {
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(30, w / h, 0.1, 100);
  cam.position.set(0, 2.7, 10.2);
  cam.lookAt(0, 2.15, 0);
  scene.add(new THREE.HemisphereLight(0x8fa4d8, 0x2a1d14, 0.55));
  const key = new THREE.DirectionalLight(0xffd2a1, 2.3);
  key.position.set(4, 6, 6);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x7d9cff, 0.6);
  fill.position.set(-5, 2, 3);
  scene.add(fill);
  const rim = new THREE.PointLight(config.accent, 4, 18, 1.4);
  rim.position.set(-2.5, 4, -3);
  scene.add(rim);
  const rim2 = new THREE.PointLight(0xffffff, 1.5, 18, 1.4);
  rim2.position.set(3, 4.5, -3);
  scene.add(rim2);
  const hero = buildNgmiPandaMesh(config, false, config.accent);
  hero.rotation.y = 0.35;
  scene.add(hero);
  const minion = buildNgmiPandaMesh(config, true, config.accent);
  minion.position.set(1.9, 0, 0.9);
  minion.rotation.y = -0.5;
  if (!solo) scene.add(minion);
  const ped = new THREE.Mesh(
    new THREE.CylinderGeometry(2.6, 2.8, 0.3, 64),
    new THREE.MeshStandardMaterial({ color: 0x1a1816, metalness: 0.2, roughness: 0.35, emissive: config.accent, emissiveIntensity: 0.06 })
  );
  ped.position.y = -0.16;
  if (!noPed) scene.add(ped);
  return { scene, cam, hero, minion };
}

let previewSnapshots = null;
function getPreviewSnapshots() {
  if (previewSnapshots) return previewSnapshots;
  previewSnapshots = {};
  let r = null;
  try {
    r = styleRenderer(new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }));
    r.setPixelRatio(1);
    r.setSize(480, 340, false);
    PANDA_CLASSES.forEach(c => {
      const { scene, cam } = makePreviewScene(c, 480, 340);
      r.clear();
      r.render(scene, cam);
      previewSnapshots[c.id] = r.domElement.toDataURL('image/png');
    });
  } catch (e) {}
  if (r) {
    r.dispose();
    if (r.forceContextLoss) r.forceContextLoss();
  }
  return previewSnapshots;
}

// ---------- HIGHLIGHT CLIPS ----------
// Two overlapping MediaRecorders keep the last 30-60 s of gameplay. A multi-kill (or the 🎬 button)
// finalises the older one, so every clip is a standalone 30-60 s video that ends just after the action.
const CLIP_OK = typeof window !== 'undefined' && !!window.MediaRecorder && typeof HTMLCanvasElement !== 'undefined' && !!HTMLCanvasElement.prototype.captureStream;
const pickClipMime = () => {
  const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return list.find(m => { try { return MediaRecorder.isTypeSupported(m); } catch (e) { return false; } }) || '';
};
function createClipper({ src, onClip, crosshair = false, stat = null }) {
  if (!CLIP_OK || !src) return null;
  const mime = pickClipMime();
  const cv = document.createElement('canvas');
  const g = cv.getContext('2d');
  const longSide = IS_TOUCH ? 720 : 1280;
  const size = () => {
    const w = src.width || 1280, h = src.height || 720;
    const k = Math.min(1, longSide / Math.max(w, h));
    cv.width = Math.max(2, Math.round((w * k) / 2) * 2);
    cv.height = Math.max(2, Math.round((h * k) / 2) * 2);
  };
  size();
  let stream;
  try { stream = cv.captureStream(30); } catch (e) { return null; }
  try {
    const aud = sfx.stream();
    if (aud) aud.getAudioTracks().forEach(t => stream.addTrack(t));
  } catch (e) {}
  const recs = [];
  let alive = true, pending = null, lastFrame = 0, callout = null;
  const startRec = () => {
    if (!alive) return;
    let mr;
    try {
      mr = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: IS_TOUCH ? 2200000 : 4000000 } : { videoBitsPerSecond: 3000000 });
    } catch (e) { return; }
    const r = { mr, chunks: [], t0: performance.now(), keep: false, t1: 0, label: '' };
    mr.ondataavailable = e => { if (e.data && e.data.size) r.chunks.push(e.data); };
    mr.onstop = () => {
      if (r.keep && r.chunks.length) {
        const type = ((mr.mimeType || mime || 'video/webm').split(';')[0]) || 'video/webm';
        const blob = new Blob(r.chunks, { type });
        onClip({ blob, secs: Math.max(1, Math.round((r.t1 - r.t0) / 1000)), ext: type.includes('mp4') ? 'mp4' : 'webm', label: r.label || 'HIGHLIGHT' });
      }
      r.chunks = [];
    };
    try { mr.start(1000); } catch (e) { return; }
    recs.push(r);
  };
  startRec();
  const rotate = setInterval(() => {
    const now = performance.now();
    recs.forEach(r => { if (!r.keep && r.mr.state === 'recording' && now - r.t0 >= 60000) { try { r.mr.stop(); } catch (e) {} } });
    for (let i = recs.length - 1; i >= 0; i--) if (recs[i].mr.state === 'inactive') recs.splice(i, 1);
    const newest = recs[recs.length - 1];
    if (!newest || now - newest.t0 >= 30000) startRec();
  }, 1000);
  const finalize = label => {
    pending = null;
    if (!alive) return;
    const now = performance.now();
    const r = recs.filter(x => !x.keep && x.mr.state === 'recording').sort((a, b) => a.t0 - b.t0)[0];
    if (!r) return;
    r.keep = true;
    r.t1 = now;
    r.label = label;
    try { r.mr.stop(); } catch (e) {}
    const i = recs.indexOf(r);
    if (i >= 0) recs.splice(i, 1);
    const newest = recs[recs.length - 1];
    if (!newest || now - newest.t0 > 15000) startRec();
  };
  // debounce: keeps rolling while kills keep coming (max ~10 s) so the whole streak is in the clip
  const highlight = (label, delay = 3500) => {
    const now = performance.now();
    if (pending) {
      clearTimeout(pending.t);
      pending.label = label;
      if (now - pending.first > 10000) { finalize(label); return; }
    } else pending = { first: now, label };
    pending.t = setTimeout(() => finalize(pending ? pending.label : label), delay);
  };
  const outline = (txt, x, y, fill, lw) => {
    g.lineWidth = lw;
    g.strokeStyle = 'rgba(0,0,0,0.85)';
    g.strokeText(txt, x, y);
    g.fillStyle = fill;
    g.fillText(txt, x, y);
  };
  // copying the game screen into the recorder isn't free: ~24 fps on phones, and when the game
  // itself is struggling (slow = true) the highlight reel drops to ~10 fps so gameplay stays smooth
  const frame = (slow = false) => {
    if (!alive) return;
    const now = performance.now();
    if (now - lastFrame < (slow ? 100 : IS_TOUCH ? 41 : 30)) return;
    lastFrame = now;
    if (Math.abs(src.width / src.height - cv.width / cv.height) > 0.02) size();
    try { g.drawImage(src, 0, 0, cv.width, cv.height); } catch (e) { return; }
    const W = cv.width, H = cv.height, k = Math.min(W, H) / 720;
    g.lineJoin = 'round';
    if (crosshair) {
      g.strokeStyle = 'rgba(0,0,0,0.7)';
      g.lineWidth = 4 * k;
      const cx = W / 2, cy = H / 2, a = 9 * k, b = 3 * k;
      const plus = () => { g.beginPath(); g.moveTo(cx - a - b, cy); g.lineTo(cx - b, cy); g.moveTo(cx + b, cy); g.lineTo(cx + a + b, cy); g.moveTo(cx, cy - a - b); g.lineTo(cx, cy - b); g.moveTo(cx, cy + b); g.lineTo(cx, cy + a + b); g.stroke(); };
      plus();
      g.strokeStyle = '#ffffff';
      g.lineWidth = 2 * k;
      plus();
    }
    g.textBaseline = 'top';
    g.textAlign = 'left';
    g.font = `900 ${Math.round(26 * k)}px Bungee, 'Arial Black', sans-serif`;
    outline('🐼 NGMI PANDAS', 18 * k, 16 * k, '#34d399', 6 * k);
    if (stat) {
      g.font = `900 ${Math.round(18 * k)}px Rubik, 'Arial Black', sans-serif`;
      outline(stat(), 20 * k, 52 * k, '#ffffff', 5 * k);
    }
    g.textAlign = 'right';
    g.textBaseline = 'bottom';
    g.font = `800 ${Math.round(16 * k)}px Rubik, Arial, sans-serif`;
    outline('play free · ngmipandas-beatdown.vercel.app', W - 16 * k, H - 14 * k, 'rgba(255,255,255,0.92)', 4 * k);
    if (callout && now < callout.until) {
      const age = (now - callout.t0) / 1000;
      const pop = age < 0.18 ? 0.6 + (age / 0.18) * 0.55 : age < 0.3 ? 1.15 - ((age - 0.18) / 0.12) * 0.15 : 1;
      const fade = Math.min(1, (callout.until - now) / 300);
      g.save();
      g.globalAlpha = fade;
      g.translate(W / 2, H * 0.26);
      g.scale(pop, pop);
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = `900 ${Math.round(Math.min(64 * k, (W * 0.9) / Math.max(6, callout.text.length) * 1.5))}px Bungee, 'Arial Black', sans-serif`;
      outline(callout.text, 0, 0, callout.color || '#facc15', 10 * k);
      g.restore();
    }
  };
  const destroy = () => {
    alive = false;
    clearInterval(rotate);
    if (pending) clearTimeout(pending.t);
    recs.forEach(r => { try { if (r.mr.state !== 'inactive') r.mr.stop(); } catch (e) {} });
    try { stream.getVideoTracks().forEach(t => t.stop()); } catch (e) {}
  };
  return {
    frame,
    highlight,
    flash: (text, color) => { callout = { text, color, t0: performance.now(), until: performance.now() + 1700 }; },
    destroy
  };
}

// clips live in IndexedDB so they survive going back to the lobby or closing the tab (newest 12 kept)
const clipDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('ngmi_clips', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('clips', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));

    loaded = true;

      hero.position.y = Math.sin(t * 0.0022) * 0.08;
      const ud = hero.userData;
      if (ud && ud.headGroup) ud.headGroup.position.y = 2.08 + Math.sin(t * 0.003) * 0.04;

      renderer.render(scene, cam);
    };
    id = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(id);
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
      el.innerHTML = '';
    };
  }, [config, cosmetic]);
  return <div ref={ref} className="absolute inset-0" />;

  const ctx = canvas.getContext('2d');

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // name pill
  ctx.font = '900 40px "Arial Black", sans-serif';
  const label = isLocal ? `★ YOU · ${name}` : name;
  const tw = Math.min(w - 8, ctx.measureText(label).width + 36);

  ctx.fillText(label, w / 2, 35, w - 30);

}

        arr[i * 3 + 2] = col.b;

      gg.setAttribute('color', new THREE.BufferAttribute(arr, 3));

    gg.applyMatrix4(matrixOf(c));

        if (ny > 0.7) f = Math.max(f, 0.97);
        else if (ny < -0.7) f *= 0.72;

      }

    mat.vertexColors = true;
  }

}
// Bake a whole static map into a few draw calls. The original pieces stay (detached) in `solids`
// so bullets and line-of-sight still test small boxes instead of one giant mesh.
function mergeSceneStatic(scene, keepRefs) {
  const keep = new Set();
  const scan = (v, depth = 0) => {
    if (!v || typeof v !== 'object' || depth > 4) return;
    if (v.isMaterial) keep.add(v);
    else if (v.isObject3D) v.traverse(c => { keep.add(c); if (c.material) keep.add(c.material); });
    else if (Array.isArray(v)) v.forEach(x => scan(x, depth + 1));
    else Object.values(v).forEach(x => scan(x, depth + 1));
  };
  scan(keepRefs);
  scene.updateMatrixWorld(true);
  const buckets = new Map(), lines = new Map();
  const visit = o => {
    if (keep.has(o) || !o.visible) return;
    if (o.isMesh) {
      if (mergeable(o, keep)) {
        const k = mergeKey(o, '');
        if (!buckets.has(k)) buckets.set(k, []);
        buckets.get(k).push(o);
      }
      return;
    }
    if (o.isLineSegments && !o.children.length && o.geometry.attributes.position && !o.geometry.index) {
      const k = o.material.uuid;
      if (!lines.has(k)) lines.set(k, []);
      lines.get(k).push(o);
      return;
    }
    o.children.slice().forEach(visit);
  };
  scene.children.slice().forEach(visit);
  let before = 0, after = 0;
  buckets.forEach(list => {
    before += list.length;
    if (list.length < 2) { after += 1; return; }
    scene.add(bakeMeshes(list, c => c.matrixWorld, true));
    after += 1;
    list.forEach(c => c.parent && c.parent.remove(c)); // detached, still raycastable via `solids`
  });
  lines.forEach(list => {
    before += list.length;
    after += 1;
    if (list.length < 2) return;
    const geos = list.map(l => l.geometry.clone().applyMatrix4(l.matrixWorld));
    scene.add(new THREE.LineSegments(concatGeometries(geos), list[0].material));
    geos.forEach(x => x.dispose());
    list.forEach(l => l.parent && l.parent.remove(l));
  });
  return { before, after };
}

// Every panda of the same kind looks identical, so each kind is built (and baked) once and then
// copied: the copies share geometry + materials, which makes spawning gang members nearly free.
const PANDA_TEMPLATES = new Map();
function buildNgmiPandaMesh(config, isMinion = false, gangColor = null) {
  const word = isMinion ? (Math.random() > 0.5 ? 'GM' : 'WAGMI') : '';
  const key = `${config.id}|${isMinion ? 1 : 0}|${gangColor}|${word}|${GFX_CINEMATIC ? 1 : 0}`;
  let tpl = PANDA_TEMPLATES.get(key);
  if (!tpl) {
    tpl = buildPandaFresh(config, isMinion, gangColor, word);
    tpl.traverse(o => {
      if (o.geometry) o.geometry.userData.shared = true;
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.userData.shared = true; });
    });
    PANDA_TEMPLATES.set(key, tpl);
  }
  // clone without serialising userData (it holds object handles), then point the handles at the copy
  const ud = tpl.userData;
  tpl.userData = {};
  const copy = tpl.clone(true);
  tpl.userData = ud;
  const src = [], dst = [];
  tpl.traverse(o => src.push(o));
  copy.traverse(o => dst.push(o));
  const remap = v => {
    if (v && v.isObject3D) return dst[src.indexOf(v)] || v;
    return v;
  };
  copy.userData = {};
  Object.keys(ud).forEach(k => { copy.userData[k] = remap(ud[k]); });
  return copy;
}

function makeInkTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#0d0c12';
  g.strokeStyle = '#0d0c12';
  g.beginPath();
  g.arc(64, 64, 26, 0, Math.PI * 2);
  g.fill();
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, r = 24 + Math.random() * 34, sz = 2 + Math.random() * 8;
    g.lineWidth = sz * 0.9;
    g.beginPath();
    g.moveTo(64, 64);
    g.lineTo(64 + Math.cos(a) * r, 64 + Math.sin(a) * r);
    g.stroke();
    g.beginPath();
    g.arc(64 + Math.cos(a) * r, 64 + Math.sin(a) * r, sz, 0, Math.PI * 2);
    g.fill();
  }
  return srgbTex(new THREE.CanvasTexture(c));
}

    'MOON EDEN MARKET': ['render', 0xaeb8bf], 'NGMI DINER': ['render', 0xd6c194], 'WAGMI FM 99.9': ['render', 0x8f8a99], 'DIAMOND HANDS CO': ['render', 0xa6b39a],
    'NGMI CHEMIST ➕': ['render', 0xe4e2da], ARCADE: ['render', 0x6a6578],
    'HODL GYM': ['block', 0xa2b2ae], 'SAFE HOUSE': ['block', 0xa9acaf], GARAGE: ['block', 0x9a9ea2],
    WAREHOUSE: ['metal', 0x9a8f7c]

  };

function makeSmokeTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  for (let i = 0; i < 16; i++) {
    const x = 64 + (Math.random() - 0.5) * 46, y = 64 + (Math.random() - 0.5) * 46, r = 16 + Math.random() * 28;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.32)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
  return srgbTex(new THREE.CanvasTexture(c));
}

function buildSiegeMap(scene, cinematic) {
  const colliders = [], solids = [];

  const box = (x, z, w, h, d, color, o = {}) => {
    const y0 = o.y || 0;
    const geo = new THREE.BoxGeometry(w, h, d);
    const m = new THREE.Mesh(geo, o.mat || new THREE.MeshStandardMaterial({ color, roughness: 0.85 }));
    m.position.set(x, y0 + h / 2, z);
    m.castShadow = cinematic;
    m.receiveShadow = true;
    scene.add(m);
    if (!o.noEdge) {
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
      e.position.copy(m.position);
      scene.add(e);
    }
    if (!o.noCollide) {
      colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, bottom: y0, top: y0 + h });
      solids.push(m);
    }
    return m;
  };
  const plane = (w, h, mat, x, y, z, rotY) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(x, y, z);
    m.rotation.y = rotY;

    return m;

  const signMat = (text, bg, fg, w, h) => {
    const cw = 512, ch = Math.max(64, Math.round(512 * h / w));

        // survivors camping a rooftop? zombies climb the wall after them
        if (dy > 2 && zz.stuckT > 0.5 && zz.onGround && !def.boss) {
          zz.vel.y = Math.sqrt(2 * 26 * (dy + 1.8));

        }
      }
      if (frozen) { dx = 0; dz = 0; }

          const side = zz.avoid || (Math.random() < 0.5 ? 1 : -1);
          let found = false;
          for (const ang of [0.6, 1.2, 1.8, 2.4]) {
            const ca = Math.cos(ang * side), sa = Math.sin(ang * side);

    let medPlan = null, medPlanAt = -1e9;
    const planMedRun = () => {
      const t0 = performance.now();
      if (t0 - medPlanAt < 450) return medPlan;

      if (hurt.isMe && (me.medkits || 0) > 0) return null;
      const dist = (p, q) => Math.hypot(p.pos.x - q.pos.x, p.pos.z - q.pos.z);
      const carriers = alive.filter(f => f.isBot && !f.downed && f !== hurt && (f.medkits || 0) > 0).sort((p, q) => dist(p, hurt) - dist(q, hurt));
      if (carriers.length) {

      const crew = alive.filter(f => f.isBot && !f.downed && f !== hurt);

      if (!crew.length || !spots.length) return null;
      let best = null;
      for (const sp of spots) {

          const d = Math.hypot(sp.x - f.pos.x, sp.z - f.pos.z);
          if (!best || d < best.d) best = { sp, f, d };

      }
      if (!best || best.d > 95) return null;
      const escort = crew.filter(f => f !== best.f).sort((p, q) => dist(p, best.f) - dist(q, best.f))[0] || null;

    const updateSquadBot = (b, dt, frozen) => {

        if (!zz || !zz.mesh) continue;
        if (net.isHost) {
          updateZombie(zz, dt, frozen);
          if (zz.dead || !zz.mesh) continue;
        } else if (zz.tx !== undefined) {
          const k = Math.min(1, dt * 10);
          const px = zz.pos.x, pz = zz.pos.z;
          zz.pos.x += (zz.tx - zz.pos.x) * k;
          zz.pos.y += (zz.ty - zz.pos.y) * k;
          zz.pos.z += (zz.tz - zz.pos.z) * k;
          if (dt > 0) {
            zz.vel.x = (zz.pos.x - px) / dt;
            zz.vel.z = (zz.pos.z - pz) / dt;
          }
          let df = zz.tface - zz.face;
          df = Math.atan2(Math.sin(df), Math.cos(df));
          zz.face += df * Math.min(1, dt * 10);
          if (zz.rise > 0) zz.rise = Math.max(0, zz.rise - dt * 0.2);
        }
        const def = zz.def, s0 = zz.s, m = zz.mesh, ud = m.userData;
        const sp = Math.hypot(zz.vel.x, zz.vel.z);
        zz.walk += dt * (2 + sp * 1.5);
        const gait = Math.min(1, sp / 2);
        const ss = Math.sin(zz.walk);
        if ((zz.stepS || 0) * ss < 0 && gait > 0.3 && dt > 0) zStep(zz);
        zz.stepS = ss;
        if (dt > 0 && !zz.def.boss && Math.random() < dt * 0.35 && zz.pos.distanceTo(camera.position) < 7) play3d('zbreath', zz.pos, 0.8, 0.8 + Math.random() * 0.4, 9);
        if (zz.swing > 0.95 && dt > 0) play3d('zswipe', zz.pos, 0.9, 1, 14);
        zz.flinch = Math.max(0, zz.flinch - dt * 1.6);
        zz.swing = Math.max(0, zz.swing - dt * 3.5);
        const riseOff = zz.rise > 0 ? -Math.min(1, zz.rise / 0.9) * s0 * 1.6 : 0;
        if (def.crawl) {
          ud.arms[0].rotation.x = -0.3 + Math.sin(zz.walk) * 0.9;
          ud.arms[1].rotation.x = -0.3 - Math.sin(zz.walk) * 0.9;
          m.rotation.set(1.3 - zz.flinch * 0.6, zz.face, Math.sin(zz.walk) * 0.1);
          m.position.set(zz.pos.x, zz.pos.y + riseOff, zz.pos.z);
        } else {
          ud.legs[0].rotation.x = Math.sin(zz.walk) * 0.75 * gait * ud.limp;
          ud.legs[1].rotation.x = -Math.sin(zz.walk) * 0.75 * gait;
          let armX = -0.12 + Math.sin(zz.walk * 0.5) * 0.12 * gait;
          if (zz.swing > 0) armX = -0.12 - Math.sin(zz.swing * Math.PI) * 1.3;
          if (def.boss && zz.act === 2) armX = -2.4; // both arms up before the slam
          ud.arms[0].rotation.x = ud.hang === 0 && zz.swing <= 0 ? 1.25 : armX + Math.sin(zz.walk * 0.5 + 1) * 0.1;
          ud.arms[1].rotation.x = def.boss && zz.act === 3 ? -2.7 : ud.hang === 1 && zz.swing <= 0 ? 1.25 : armX - Math.sin(zz.walk * 0.5 + 1) * 0.1;
          ud.head.rotation.x = zz.act === 4 ? -0.7 : zz.flinch * -1.2;
          const lean = (zz.kind === 'runner' || zz.rush ? 0.32 : 0.14) * gait - zz.flinch * 1.3;
          m.rotation.set(lean, zz.face, Math.sin(zz.walk * 0.5) * 0.06 * gait);
          m.position.set(zz.pos.x, zz.pos.y + riseOff + Math.abs(Math.sin(zz.walk)) * 0.06 * s0 * gait, zz.pos.z);
        }
        if (zz.rise > 0 && Math.random() < dt * 14) puff(new THREE.Vector3(zz.pos.x + rnd() * 1.2, 0.2, zz.pos.z + rnd() * 1.2), '#5b4a3a', 2, 3);
        if (zz.burnT > 0 && Math.random() < dt * 20) spawnFx({ pos: new THREE.Vector3(zz.pos.x + rnd() * s0 * 0.6, zz.pos.y + Math.random() * s0 * 1.5, zz.pos.z + rnd() * s0 * 0.6), size: 0.25 * s0, grow: 1.2, life: 0.4, color: Math.random() < 0.5 ? 0xff7a1a : 0xffc04a, add: true, opacity: 0.9, vy: 3, drag: 1 });
        if (def.boss && zz.enraged && !zz.enrageShown) {
          zz.enrageShown = true;
          announceNow('😡 THE RUG LORD IS ENRAGED', '#ef4444');
          sfx.play('roar');
        }
        if (groanT <= 0 && Math.random() < dt * 0.6) {
          const d0 = zz.pos.distanceTo(camera.position);
          if (d0 < (def.boss ? 70 : 34)) {
            play3d(def.boss ? 'roar' : 'groan', zz.pos, def.boss ? 0.45 : 0.75, def.boss ? 1 : 0.75 + Math.random() * 0.5 + (zz.kind === 'runner' ? 0.3 : 0) - (zz.kind === 'brute' ? 0.25 : 0), def.boss ? 80 : 34, true);
            groanT = 0.4;
          }
        }
      }
      // corpses fall, lie still, then sink into the ground
      for (let i = corpses.length - 1; i >= 0; i--) {
        const c = corpses[i];
        c.t += dt;
        const ud = c.m.userData;
        if (c.dir) c.m.rotation.x = c.rx0 + (c.dir * 1.45 - c.rx0) * Math.min(1, c.t / 0.45);
        ud.arms.forEach((a, j) => { a.rotation.x += ((j ? 0.6 : -0.4) - a.rotation.x) * Math.min(1, dt * 4); });
        if (c.t > 3.2) c.m.position.y -= dt * 1.1;
        if (c.t > 4.4) {
          poolZMesh(c.kind, c.m);
          corpses.splice(i, 1);
        }
      }
      // acid pools hurt anyone standing in them
      for (let i = acids.length - 1; i >= 0; i--) {
        const a = acids[i];
        a.t -= dt;
        a.m.material.opacity = Math.min(0.55, a.t * 0.4) * (0.85 + Math.sin(now * 0.01 + i) * 0.15);
        if (Math.random() < dt * 6) spawnFx({ pos: new THREE.Vector3(a.x + rnd() * 3.5, a.y + 0.1, a.z + rnd() * 3.5), size: 0.2, grow: 0.6, life: 0.6, color: 0xbef264, add: true, opacity: 0.7, vy: 1.2 });
        if (a.auth && net.isHost) {
          a.tick -= dt;
          if (a.tick <= 0) {
            a.tick = 0.5;
            fighters.forEach(f => {
              if (f.dead || Math.hypot(f.pos.x - a.x, f.pos.z - a.z) > 2.4 || Math.abs(f.pos.y - a.y) > 1.6) return;
              damage(f, { id: 'zspit', name: 'FUD SPITTER' }, Math.round(7 * zd.dmgMul), false);
            });
          }
        }
        if (a.t <= 0) {
          scene.remove(a.m);
          a.m.material.dispose();
          acids.splice(i, 1);
        }
      }
      for (let i = zRocks.length - 1; i >= 0; i--) {
        const rk = zRocks[i];
        rk.life -= dt;
        rk.v.y -= 20 * dt;
        const from = rk.m.position.clone();
        const step = rk.v.length() * dt;
        const dir = rk.v.clone().normalize();
        const next = from.clone().addScaledVector(rk.v, dt);
        rk.m.rotation.x += dt * 5;
        rk.m.rotation.z += dt * 3;
        let hitP = null;
        const wh = step > 0 ? wallHit(from, dir, step) : null;
        if (wh) hitP = wh.point.clone();
        if (!hitP && fighters.some(f => !f.dead && Math.hypot(f.pos.x - next.x, f.pos.y + 1.2 - next.y, f.pos.z - next.z) < 1.6)) hitP = next;
        if (!hitP && (next.y <= 0.3 || rk.life <= 0)) hitP = next;
        if (hitP) {
          scene.remove(rk.m);
          zRocks.splice(i, 1);
          rockImpact(hitP, rk.auth && net.isHost, rk.kind);
          continue;
        }
        rk.m.position.copy(next);
        if (Math.random() < 0.5) {
          if (rk.kind === 'spit') spawnFx({ pos: from, size: 0.3, life: 0.35, color: 0xa3e635, add: true, opacity: 0.7 });
          else puff(from, '#8a7560', 1, 0.8);
        }
      }
    };

    // ---------- pickups ----------
    const pickups = map.pickupSpots.map(([px, pz, kind, py = 0]) => {
      const [x, z] = py > 0 ? [px, pz] : freeSpot(px, pz);
      const def = SHOOT_PICKUPS[kind];
      const grp = new THREE.Group();
      const icon = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeEmojiTexture(def.icon), transparent: true }));
      icon.scale.set(1.3, 1.3, 1);
      icon.position.y = 1.4;
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.75, 1.0, 28), new THREE.MeshBasicMaterial({ color: def.color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.05;
      const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.75, 0.3, 16), new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 }));
      ped.position.y = 0.15;
      grp.add(icon, ring, ped);
      grp.position.set(x, py, z);
      scene.add(grp);
      return { x, y: py, z, kind, grp, icon, t: 0, ph: Math.random() * 6 };
    });

    // ---------- input ----------
    const keys = {};
    const onKeyDown = e => {
      if (e.code === 'Tab') {
        e.preventDefault();
        setShowBoard(true);
      }
      if (e.repeat) return;
      keys[e.code] = true;
      const c = ctl.current;
      if (e.code === 'Space') { e.preventDefault(); c.jump = true; }
      if (e.code === 'KeyR') c.reload = true;
      if (e.code === 'KeyV') c.dance = true;
      if (e.code === 'KeyC' && clipRef.current) { clipRef.current.highlight('MY CLIP', 1200); setClipToast('🎬 Saving the last 30–60 s…'); }
      if (e.code === 'KeyG') c.strike = true;
      if (e.code === 'KeyF') c.nade = true;
      if (e.code === 'KeyH') c.med = true;
      if (e.code === 'KeyT') c.onme = true;
      if (e.code === 'KeyQ') c.swap = true;
      if (/^Digit[1-6]$/.test(e.code)) {
        const n = Number(e.code.slice(5)) - 1;
        // 6 always means "my hand weapon", wherever it sits in the list
        const mi = me.weapons.findIndex(w => isMelee(w.key));
        c.slot = n === 5 ? (mi >= 0 ? mi : undefined) : n;
      }
      if (e.code === 'KeyZ') c.ads = true;
      if (e.code === 'KeyE') c.shove = true;
      if (e.code === 'KeyM') {
        const m = !sfx.isMuted();
        sfx.setMuted(m);
        setMutedS(m);
      }
    };
    const onKeyUp = e => {
      keys[e.code] = false;
      if (e.code === 'KeyZ') ctl.current.ads = false;
      if (e.code === 'Tab') setShowBoard(false);
    };
    const locked = () => document.pointerLockElement === renderer.domElement;
    const releaseInputs = () => {
      Object.keys(keys).forEach(k => { keys[k] = false; });
      ctl.current.firing = false;
      ctl.current.ads = false;
      me.semiHeld = false;
    };
    const onLockChange = () => { if (!locked()) releaseInputs(); };
    document.addEventListener('pointerlockchange', onLockChange);
    window.addEventListener('blur', releaseInputs);
    const onMouseMove = e => {
      if (!locked() || me.dead) return;
      const sens = 0.0022 * sensRef.current / (1 + (SHOOT_WEAPONS[me.weapons[me.slot].key].zoom - 1) * me.adsT);
      me.yaw -= e.movementX * sens;
      me.swayX = Math.max(-0.07, Math.min(0.07, (me.swayX || 0) + e.movementX * 0.0007));
      me.swayY = Math.max(-0.05, Math.min(0.05, (me.swayY || 0) + e.movementY * 0.0006));
      me.pitch = Math.max(-1.45, Math.min(1.45, me.pitch - e.movementY * sens));
    };
    const onMouseDown = e => {
      if (!locked()) return;
      if (e.button === 0) ctl.current.firing = true;
      if (e.button === 2) ctl.current.shove = true; // right click = shove (scope/ADS moved to hold Z)
    };
    const onMouseUp = e => {
      if (e.button === 0) { ctl.current.firing = false; me.semiHeld = false; }
    };
    const noMenu = e => e.preventDefault();
    let lastWheel = 0;
    const onWheel = e => {
      if (!locked()) return;
      e.preventDefault();
      const t = performance.now();
      if (t - lastWheel < 90) return;
      lastWheel = t;
      ctl.current.cycle = e.deltaY > 0 ? 1 : -1;
    };
    document.addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mousedown', onMouseDown);
    document.addEventListener('mouseup', onMouseUp);
    el.addEventListener('contextmenu', noMenu);
    const blockTouch = ev => {
      if (ev.target && ev.target.closest && ev.target.closest('[data-scroll]')) return;
      ev.preventDefault();
    };
    document.addEventListener('touchmove', blockTouch, { passive: false });

    // ---------- match ----------
    const match = { left: SHOOT_SECONDS, countdown: 3.2, over: false, shown: 4, evIdx: 0 };
    let everLocked = false;

    // ---------- surprise events: low gravity, bull run, golden AK airdrops ----------
    const world = { moonT: 0, bullT: 0, frenzyT: 0 };
    const drops = [];
    const spawnAirdrop = () => {
      const dropList = map.dropSpots || map.spawns;
      const s0 = dropList[(match.evIdx * 5 + 3) % dropList.length];
      const [x, z] = freeSpot(s0[0] * 0.55, s0[1] * 0.55);
      const grp = new THREE.Group();
      const crate = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), new THREE.MeshStandardMaterial({ color: 0xd4a640, metalness: 0.9, roughness: 0.25, emissive: 0x5a3a00, emissiveIntensity: 0.7 }));
      crate.position.y = 0.8;
      const chute = new THREE.Mesh(new THREE.SphereGeometry(3, 18, 8, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xf43f5e, side: THREE.DoubleSide, roughness: 0.85 }));
      chute.position.y = 6;
      const lines = [];
      [[-0.8, -0.8], [0.8, -0.8], [-0.8, 0.8], [0.8, 0.8]].forEach(([ox, oz]) => { lines.push(new THREE.Vector3(ox, 1.6, oz), new THREE.Vector3(ox * 3.4, 6, oz * 3.4)); });
      const strings = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lines), new THREE.LineBasicMaterial({ color: 0xf8fafc }));
      grp.add(crate, chute, strings);
      grp.position.set(x, 55, z);
      scene.add(grp);
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 140, 16, 1, true), new THREE.MeshBasicMaterial({ color: 0xffd34d, transparent: true, opacity: 0.2, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, fog: false }));
      beam.position.set(x, 70, z);
      scene.add(beam);
      drops.push({ id: match.evIdx, grp, chute, strings, beam, x, z, landed: false });
      announceNow('👑 GOLDEN AK AIRDROP INCOMING', '#facc15');
      pushFeed('📦 Golden AK airdrop! Follow the light', '#facc15');
      sfx.play('powerup');
    };
    const startEvent = kind => {
      if (kind === 'moon') {
        world.moonT = 15;
        announceNow('🌕 TO THE MOON · LOW GRAVITY', '#c4b5fd');
        sfx.play('streak');
      } else if (kind === 'bull') {
        world.bullT = 15;
        announceNow('🐂 BULL RUN · EVERYONE FASTER', '#4ade80');
        sfx.play('streak');
      } else spawnAirdrop();
    };
    const EVENTS = [[150, 'moon'], [125, 'drop'], [95, 'bull'], [70, 'drop'], [45, 'moon'], [25, 'drop']];
    const objVis = siege ? map.objectives.map(o => {
      const ring = new THREE.Mesh(new THREE.RingGeometry(o.r - 0.45, o.r, 64), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false, fog: false }));
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(o.x, 0.07, o.z);
      const disc = new THREE.Mesh(new THREE.CircleGeometry(o.r - 0.45, 48), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1, side: THREE.DoubleSide, depthWrite: false, fog: false }));
      disc.rotation.x = -Math.PI / 2;
      disc.position.set(o.x, 0.06, o.z);
      const beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 80, 16, 1, true), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.18, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, fog: false }));
      beacon.position.set(o.x, 40, o.z);
      const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: createLabelTexture(`${o.key} · ${o.name}`, 'transparent', '#ffffff', 512, 96, 54), transparent: true, depthTest: false, sizeAttenuation: false }));
      label.scale.set(0.22, 0.042, 1);
      label.position.set(o.x, 7, o.z);
      label.renderOrder = 40;
      scene.add(ring, disc, beacon, label);
      return { o, ring, disc, beacon, label };
    }) : [];
    const objectiveTaken = idx => {
      const o = map.objectives[idx];
      announceNow(`${o.key} · ${o.name} CAPTURED`, SIEGE_TEAMS.atk.color);
      pushFeed(`⚔️ Raiders captured ${o.name}${idx === 0 ? ' · +75s' : ''}`, SIEGE_TEAMS.atk.color);
      sfx.play('streak');
      if (idx === 0) {
        setTimeout(() => announceNow(me.team === 'atk' ? '⚔️ PUSH THE VAULT!' : '🛡️ FALL BACK TO THE VAULT!', me.team === 'atk' ? SIEGE_TEAMS.atk.color : SIEGE_TEAMS.def.color), 1800);
      }
    };
    const endMatch = (winner = null) => {
      if (match.over) return;
      match.over = true;
      ctl.current.firing = false;
      if (document.pointerLockElement) document.exitPointerLock();
      // no freeze: everyone breaks into a victory dance while the camera orbits you
      fighters.forEach(f => { if (f.isBot && !f.dead && !f.downed) f.danceT = 99; });
      if (!me.dead && !me.downed) me.dancing = true;
      const board = [...fighters].map(f => ({ id: f.id, name: f.name, color: f.color, isMe: f.isMe, kills: f.kills, deaths: f.deaths })).sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);
      const rank = board.findIndex(r => r.isMe) + 1;
      if (zombie) {
        const won = winner === 'won';
        sfx.setRush(false);
        const survived = won ? zd.wave : Math.max(0, zd.wave - 1);
        const p0 = loadProfile();
        const key = zmode === 'incoming' ? 'zBestIncoming' : 'zBestRaid';
        const prevBest = p0[key] || 0;
        if (survived > prevBest) saveProfile({ ...p0, [key]: survived });
        announceNow(won ? '🏆 RUG LORD DEFEATED' : '💀 OVERRUN', won ? '#facc15' : '#f87171');
        sfx.play(won ? 'streak' : 'ko');
        const xpRes = awardXp({ zkills: me.kills, deaths: me.deaths, won: won || (zmode === 'incoming' && survived >= 5), headshots: me.headshots || 0, waves: survived });
        setTimeout(() => setResults({ board, rank, zombie: { won, survived, wave: zd.wave, best: Math.max(prevBest, survived), newBest: survived > prevBest, mode: zmode }, xp: xpRes, story: null }), 1400);
        return;
      }
      announceNow(rank === 1 ? 'VICTORY 🏆' : 'MATCH OVER', rank === 1 ? '#facc15' : '#ffffff');
      sfx.play(rank === 1 ? 'streak' : 'ko');
      if (siege) {
        const won = winner === me.team;
        announceNow(won ? 'VICTORY 🏆' : 'DEFEAT', won ? '#facc15' : '#f87171');
      }
      const didWin = siege ? winner === me.team : rank === 1;
      const xpRes = awardXp({ kills: me.kills, deaths: me.deaths, won: didWin, headshots: me.headshots || 0, bestStreak: me.maxStreak || 0 });
      const storyRes = storyEval(story, { game: 'shootout', variant: siege ? 'siege' : 'ffa', kills: me.kills, bestStreak: me.maxStreak || 0, won: didWin, team: me.team, rank });
      setTimeout(() => setResults({ board, rank, winner, myTeam: me.team, xp: xpRes, story: storyRes }), 1400);
    };

    // ---------- MQTT ----------
    const upsertRemote = (id, nm, c, tm) => {
      let f = fighters.find(x => x.id === id);
      if (!f) {
        const klass = PANDA_CLASSES.find(k => k.id === c) || PANDA_CLASSES[0];
        f = createFighter(id, nm, klass, { remote: true, team: zombie ? 'surv' : siege ? tm || 'atk' : null });
        f.tx = f.pos.x;
        f.tz = f.pos.z;
      }
      net.seen[id] = performance.now();
      return f;
    };
    const applyRemote = (f, d) => {
      f.tx = d.x; f.ty = d.y; f.tz = d.z; f.tface = d.f;
      f.hp = d.hp; f.dead = !!d.dd; f.kills = d.k || 0; f.deaths = d.dt || 0;
      f.dancing = !!d.dn;
      f.remoteProt = !!d.sp;
      if (zombie) {
        const wasDown = f.downed;
        f.downed = !!d.dw && !f.dead;
        f.rv = netNum(d.rv, 0, 100) / 100;
        if (f.downed && !wasDown) pushFeed(`🆘 ${f.name} is down!`, '#f87171');
        else if (wasDown && !f.downed && !f.dead) pushFeed(`💚 ${f.name} is back up`, '#4ade80');
        f.revTo = typeof d.rt === 'string' && d.rt ? d.rt.slice(0, 40) : null;
        if (Array.isArray(d.cl)) {
          const sq = netNum(d.cl[0], 0, 1e7);
          if (f.clSeq === undefined) f.clSeq = sq;
          else if (sq !== f.clSeq) {
            f.clSeq = sq;
            const code = CALL_IDS[netNum(d.cl[1], -1, 99, -1)];
            if (code) callout(f, code);
          }
        }
      }
      if (f.mesh && d.cos !== undefined && f.cosApplied !== d.cos) {
        applyCosmetic(f.mesh, d.cos);
        f.cosApplied = d.cos;
      }
      if (d.w && f.mesh && SHOOT_WEAPONS[d.w]) swapGun(f, f.mesh, d.w);
    };
    const onMsg = (tp, payload) => {
      let d;
      try { d = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!d || d.id === myId) return;
      if (d.t === 's') {
        const isNew = !net.peers[d.id];
        net.peers[d.id] = performance.now();
        const f = upsertRemote(d.id, d.n, d.c, d.tm);
        applyRemote(f, d);
        if (isNew) pushFeed(`🟢 ${d.n} joined`, '#38bdf8');

        if (net.isHost) {
          pkt.left = Math.round(match.left * 10) / 10;
          pkt.b = fighters.filter(f => f.isBot).map(b => ({ i: b.id, n: b.name, c: b.cls.id, x: r2(b.pos.x), y: r2(b.pos.y), z: r2(b.pos.z), f: r2(b.face), hp: Math.round(b.hp), dd: b.dead ? 1 : 0, k: b.kills, dt: b.deaths, dn: b.danceT > 0 ? 1 : 0, w: b.golden ? 'golden' : b.wkey || 'ak', sp: b.protT > 0 ? 1 : 0, tm: b.team, dw: b.downed ? 1 : 0, rv: Math.round((b.revive || 0) * 100), cl: [b.callSeq || 0, b.callIdx == null ? -1 : b.callIdx] }));
          if (siege) pkt.obj = [obj.stage, Math.round(obj.prog), obj.contested ? 1 : 0, obj.capturing ? 1 : 0];
          if (zombie) {
            net.zTick = (net.zTick || 0) + 1;
            if (zombies.length <= 20 || net.zTick % 2 === 0) pkt.zs = packZ();
            pkt.zd = packZd();
            pkt.zfx = net.pendingZfx;
          }
        }
        send(pkt);
        net.pendingTr = [];
        net.pendingEx = [];
        net.pendingZfx = [];
      }

      // ----- HUD + housekeeping (10 Hz) -----
      if (now - lastHud > 100) {
        lastHud = now;
        Object.keys(net.peers).forEach(id => {
          if (now - net.peers[id] > 5000) { delete net.peers[id]; pushFeed('🔴 a player left', '#94a3b8'); }
        });
        [...fighters].forEach(f => { if (f.remote && now - (net.seen[f.id] || 0) > 5000) removeFighter(f); });
        const hostId = [myId, ...Object.keys(net.peers)].sort()[0];
        net.hostId = hostId;
        const amHost = hostId === myId;
        if (amHost !== net.isHost) {
          net.isHost = amHost;
          if (!amHost) fighters.filter(f => f.isBot).forEach(removeFighter);
        }
        if (net.isHost && fillBots && !fighters.some(f => f.isBot)) spawnBots(Math.max(0, (zombie ? 3 : 7) - Object.keys(net.peers).length));
        if (zombie && net.isHost && fighters.length > 4) {
          // friends take bot slots: keep the squad at four
          const spare = fighters.filter(f => f.isBot).sort((a, b) => (b.dead ? 1 : 0) - (a.dead ? 1 : 0)).slice(0, fighters.length - 4);
          spare.forEach(f => { pushFeed(`🤖 ${f.name} hands their slot to a friend`, '#94a3b8'); removeFighter(f); });
        }

        camera.getWorldDirection(fwd);
        const aimRes = me.dead ? null : traceShot(camera.getWorldPosition(new THREE.Vector3()), fwd, me, IS_TOUCH ? 1.2 : 1);
        me.autoAim = !!(aimRes && ((aimRes.fighter && !aimRes.fighter.dead) || (aimRes.zombie && aimRes.zombie.hp > 0)));
        const proj = (x, y, z) => {
          const v = new THREE.Vector3(x, y, z).project(camera);
          let px = (v.x * 0.5 + 0.5) * 100, py = (-v.y * 0.5 + 0.5) * 100;
          if (v.z > 1) { px = 100 - px; py = 92; }
          return { x: Math.max(4, Math.min(96, px)), y: Math.max(10, Math.min(90, py)), d: Math.round(Math.hypot(x - me.pos.x, z - me.pos.z)) };
        };
        let zHud = null, squad = [], zmarks = [], reviving = null;
        if (zombie) {
          drawMini(now);
          let nz = 1e9;
          zombies.forEach(o => { const dd = Math.hypot(o.pos.x - me.pos.x, o.pos.z - me.pos.z); if (dd < nz) nz = dd; });
          sfx.setIntensity(me.dead ? 0.2 : nz < 9 ? 1 : nz < 20 ? 0.65 : nz < 40 ? 0.3 : 0.05);
          const boss = zombies.find(o => o.def.boss);
          const left = Math.max(0, zd.toSpawn - zd.spawned) + (zd.horde < 3 ? zd.hordeLeft : 0) + zombies.length;
          zHud = { wave: zd.wave, phase: zd.phase, t: Math.max(0, Math.ceil(zd.t)), left, horde: zd.horde, bossWave: zd.bossWave, final: isFinalWave(zd.wave), mode: zmode, boss: boss ? { hp: Math.max(0, boss.hp), max: boss.maxHp, enraged: !!boss.enraged } : null };
          squad = fighters.map(f => ({ id: f.id, name: f.name, color: f.color, hp: Math.max(0, Math.round(f.hp)), downed: !!f.downed, dead: f.dead, isMe: f.isMe, bot: f.isBot, kills: f.kills || 0, meds: f.medkits || 0, near: !f.isMe && !f.dead ? Math.round(Math.hypot(f.pos.x - me.pos.x, f.pos.z - me.pos.z)) : 0 }));
          if ((zd.horde === 1 || zd.horde === 2) && !me.dead) zmarks.push({ k: '⚠️', c: '#ef4444', ...proj(zd.hordeAt[0], 3, zd.hordeAt[1]) });
          if (boss && !me.dead) zmarks.push({ k: '👹', c: '#a855f7', ...proj(boss.pos.x, boss.pos.y + boss.def.s * 2, boss.pos.z) });
          if (huntOn() && !me.dead) zombies.forEach(o => { if (!o.def.boss && !o.dead) zmarks.push({ k: '🧟', c: '#a3e635', ...proj(o.pos.x, o.pos.y + o.s * 1.9, o.pos.z) }); });
          if (huntOn() && !huntSaid) {
            huntSaid = true;
            pushFeed(`🎯 Last ${zombies.length} zombie${zombies.length > 1 ? 's' : ''} marked on your screen + minimap`, '#a3e635');
          } else if (!huntOn()) huntSaid = false;
          fighters.forEach(f => {
            if (f.isMe || !f.downed || f.dead) return;
            zmarks.push({ k: '🆘', c: '#f87171', name: f.name, ...proj(f.pos.x, f.pos.y + 2, f.pos.z) });
            if (me.revTo === f.id) reviving = { name: f.name, p: Math.min(1, (f.isBot && net.isHost ? f.revive : f.rv) || 0) };
          });
        }
        const w = me.weapons[me.slot];
        const def = SHOOT_WEAPONS[w.key];
        const board = [...fighters].map(f => ({ id: f.id, name: f.name, color: f.color, isMe: f.isMe, kills: f.kills, deaths: f.deaths, bot: f.isBot })).sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);
        setHud({
          hp: Math.max(0, Math.round(me.hp)),
          mag: w.mag,
          acc: (me.shots || 0) >= 5 ? Math.round(100 * (me.hits || 0) / me.shots) : null,
          wmelee: !!def.melee,
          reserve: Infinity,
          wname: w.dual ? 'DUAL RPG-7 · ×2' : def.name,
          wkey: w.key,
          reloading: me.reloadT > 0 ? 1 - me.reloadT / def.reload : 0,
          kills: me.kills,
          deaths: me.deaths,
          left: Math.max(0, Math.ceil(match.left)),
          feed: feed.slice(),
          dead: me.dead ? { by: me.deathBy ? me.deathBy.name : '', hs: me.deathBy && me.deathBy.hs, t: Math.max(0, Math.ceil(me.respawnT)) } : null,
          board,
          aim: aimRes && aimRes.fighter ? { name: aimRes.fighter.name, hp: Math.max(0, Math.round(aimRes.fighter.hp)), color: aimRes.fighter.color } : aimRes && aimRes.zombie && aimRes.zombie.hp > 0 ? { name: aimRes.zombie.name, hp: Math.max(0, Math.round((aimRes.zombie.hp / aimRes.zombie.maxHp) * 100)), color: aimRes.zombie.color } : null,
          zombie: zHud,
          squad,
          zmarks,
          reviving,
          downed: me.downed && !me.dead ? { bleed: Math.max(0, Math.ceil(me.bleed)), revive: me.revive || 0 } : null,
          nades: me.grenades || 0,
          meds: me.medkits || 0,
          frenzy: zombie ? Math.max(0, Math.ceil(world.frenzyT)) : 0,
          reviveHint: zombie && me.nearDowned && !me.revTo && !me.dead ? me.nearDowned.name : null,
          ladderHint: !!me.nearLadder && !me.climbing,
          siege,
          team: me.team,
          obj: siege ? { stage: obj.stage, prog: Math.min(100, Math.round(obj.prog)), contested: obj.contested, capturing: obj.capturing, name: obj.stage < 2 ? `${map.objectives[obj.stage].key} · ${map.objectives[obj.stage].name}` : 'ALL CAPTURED' } : null,
          marker: (() => {
            if (!siege || obj.stage > 1 || me.dead) return null;
            const o = map.objectives[obj.stage];
            const v = new THREE.Vector3(o.x, 4, o.z).project(camera);
            let x = (v.x * 0.5 + 0.5) * 100, y = (-v.y * 0.5 + 0.5) * 100;
            if (v.z > 1) { x = 100 - x; y = 92; }
            return { k: o.key, x: Math.max(4, Math.min(96, x)), y: Math.max(10, Math.min(90, y)), d: Math.round(Math.hypot(o.x - me.pos.x, o.z - me.pos.z)) };
          })(),
          scope: w.key === 'sniper' && me.adsT > 0.8 && !me.dead,
          weapons: me.weapons.map((wp, i) => ({ key: wp.key, short: wp.dual ? 'DUAL RPG' : SHOOT_WEAPONS[wp.key].short, icon: wp.dual ? '🚀🚀' : SHOOT_WEAPONS[wp.key].icon, active: i === me.slot })),
          moon: Math.max(0, Math.ceil(world.moonT)),
          bull: Math.max(0, Math.ceil(world.bullT)),
          prot: me.protT > 0 && !me.dead,
          strike: !!me.strikeReady && !me.dead,
          hurt: me.hurtAt && now - me.hurtAt < 1200 && me.hurtFrom !== undefined && !me.dead ? { ang: (-(me.hurtFrom - me.yaw - Math.PI) * 180) / Math.PI, age: now - me.hurtAt } : null,
          started: everLocked,
          dancing: me.dancing,
          spin: me.spin,
          locked: IS_TOUCH || locked(),
          peers: 1 + Object.keys(net.peers).length,
          net: net.status
        });
      }
    };
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf);
      if (clipRef.current) { clipRef.current.destroy(); clipRef.current = null; }
      sfx.stopMusic();
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('resize', onResize);
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mousedown', onMouseDown);
      document.removeEventListener('mouseup', onMouseUp);
      document.removeEventListener('touchmove', blockTouch);
      document.removeEventListener('wheel', onWheel);
      document.removeEventListener('pointerlockchange', onLockChange);
      window.removeEventListener('blur', releaseInputs);
      if (document.pointerLockElement) document.exitPointerLock();
      try { if (net.client) net.client.end(true); } catch (e) {}
      if (GUN_ENV) { GUN_ENV.dispose(); GUN_ENV = null; }
      if (post) post.dispose();
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
      el.innerHTML = '';
      el.style.filter = '';
    };
  }, []);

  const c = ctl.current;
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const leader = hud.board[0];
  const resetJoy = () => {
    c.joyPtr = null;
    c.mx = 0;
    c.mz = 0;
    if (joyKnobRef.current) joyKnobRef.current.style.transform = 'translate(-50%, -50%)';
    if (joyBaseRef.current) { joyBaseRef.current.style.left = ''; joyBaseRef.current.style.top = ''; }
  };

  return (
    <div className="game-layer absolute inset-0 z-30 bg-[#9ed0f2] text-white select-none overflow-hidden">
      <div ref={mountRef} className="absolute inset-0" />
      <div className="absolute inset-0 pointer-events-none" style={{ background: `radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,${variant === 'zombie' ? 0.5 : 0.28}) 100%)` }} />

      {/* crosshair + hit marker */}
      {!hud.scope && !hud.dead && (
        <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none">
          <div className="relative w-6 h-6">
            <span className="absolute left-1/2 top-0 w-[2px] h-[7px] -translate-x-1/2 bg-white shadow-[0_0_0_1px_rgba(0,0,0,0.75)]" />
            <span className="absolute left-1/2 bottom-0 w-[2px] h-[7px] -translate-x-1/2 bg-white shadow-[0_0_0_1px_rgba(0,0,0,0.75)]" />
            <span className="absolute top-1/2 left-0 h-[2px] w-[7px] -translate-y-1/2 bg-white shadow-[0_0_0_1px_rgba(0,0,0,0.75)]" />
            <span className="absolute top-1/2 right-0 h-[2px] w-[7px] -translate-y-1/2 bg-white shadow-[0_0_0_1px_rgba(0,0,0,0.75)]" />
          </div>
        </div>
      )}
      <div ref={hitRef} className="absolute left-1/2 top-1/2 pointer-events-none font-black text-3xl leading-none" style={{ opacity: 0, transform: 'translate(-50%,-50%)', textShadow: '0 0 3px #000' }}>✕</div>
      {hud.scope && (
        <div className="absolute inset-0 pointer-events-none" style={{ background: 'radial-gradient(circle at center, transparent 0, transparent 32vmin, rgba(0,0,0,0.96) 32.4vmin)' }}>
          <div className="absolute left-1/2 top-0 bottom-0 w-px bg-black/80" />
          <div className="absolute top-1/2 left-0 right-0 h-px bg-black/80" />
          <div className="absolute left-1/2 top-1/2 w-2 h-2 -translate-x-1/2 -translate-y-1/2 rounded-full bg-red-500" />
        </div>
      )}
      <div ref={hurtRef} className="absolute inset-0 pointer-events-none" style={{ opacity: 0, background: 'radial-gradient(circle at center, transparent 45%, rgba(220,20,20,0.75) 100%)' }} />

      {hud.aim && !hud.dead && (
        <div className="absolute left-1/2 top-[56%] -translate-x-1/2 pointer-events-none text-center">
          <div className="text-[15px] md:text-lg font-black" style={{ color: hud.aim.color, textShadow: '0 1px 3px #000' }}>{hud.aim.name}</div>
          <div className="w-24 h-1.5 bg-black/50 rounded mt-0.5 overflow-hidden"><div className="h-full bg-rose-500" style={{ width: `${hud.aim.hp}%` }} /></div>
        </div>
      )}

      {/* top centre: timer */}
      <div className="absolute left-1/2 -translate-x-1/2 top-0 safe-top flex flex-col items-center gap-1 pointer-events-none">
        {hud.zombie ? (
          <>
            <div className="font-game text-2xl md:text-4xl px-4 py-1 rounded-xl bg-slate-950/85 text-lime-300 shadow border border-lime-400/40">
              {hud.zombie.bossWave ? (hud.zombie.final ? '👑 FINAL WAVE' : `👹 BOSS WAVE ${hud.zombie.wave}`) : `🧟 WAVE ${hud.zombie.wave || 1}`}
              {hud.zombie.mode !== 'incoming' && <span className="text-slate-400 text-sm md:text-base"> / {ZOMBIE_RAID_WAVES}</span>}
            </div>
            <div className={`text-[14px] md:text-xl font-black px-3 py-1 rounded-lg ${hud.zombie.horde === 1 || hud.zombie.horde === 2 ? 'bg-rose-600/90 text-white animate-pulse' : 'bg-slate-900/80 text-slate-100'}`}>
              {hud.zombie.phase === 'boot' ? '🔦 SURVIVORS · STICK TOGETHER'
                : hud.zombie.phase === 'prep' ? `NEXT WAVE IN ${hud.zombie.t}s · grab weapons`
                : hud.zombie.phase === 'clear' ? '✅ WAVE CLEARED'
                : hud.zombie.horde === 1 ? '⚠️ HORDE INCOMING · face the marker'
                : hud.zombie.horde === 2 ? `🧟 HORDE RUSH · ${hud.zombie.left} LEFT`
                : `🧟 ${hud.zombie.left} ZOMBIES LEFT`}
            </div>
            {hud.frenzy > 0 && (
              <div className="text-sm md:text-lg font-black px-3 py-1 rounded-full bg-amber-400 text-slate-950 animate-pulse">♾️ BOTTOMLESS MAGS · {hud.frenzy}s</div>
            )}
            {hud.zombie.boss && (
              <div className="w-[260px] md:w-[460px] bg-slate-950/85 rounded-xl px-3 py-2 border border-purple-500/60">
                <div className="flex justify-between text-sm md:text-lg font-black">
                  <span className="text-purple-300">{hud.zombie.final ? '👑 THE RUG LORD · FINAL FORM' : '👹 THE RUG LORD'}{hud.zombie.boss.enraged ? ' · 😡' : ''}</span>
                  <span className="font-mono text-white">{Math.ceil(hud.zombie.boss.hp)}</span>
                </div>
                <div className="h-2.5 mt-1 bg-slate-700 rounded overflow-hidden">
                  <div className={`h-full ${hud.zombie.boss.enraged ? 'bg-rose-500' : 'bg-purple-500'}`} style={{ width: `${Math.max(0, (hud.zombie.boss.hp / hud.zombie.boss.max) * 100)}%` }} />
                </div>
              </div>
            )}
          </>
        ) : (
        <>
        <div className={`font-game text-lg md:text-2xl px-3 py-0.5 rounded-lg bg-white/90 text-slate-900 shadow ${hud.left <= 30 ? 'text-rose-600 animate-pulse' : ''}`}>{fmt(hud.left)}</div>
        {hud.siege && hud.obj ? (
          <div className="w-[230px] md:w-[340px] bg-slate-950/80 rounded-xl px-2.5 py-1.5 text-center">
            <div className="flex items-center justify-between gap-2 text-[9px] md:text-[11px] font-black">
              <span style={{ color: SIEGE_TEAMS[hud.team].color }}>{SIEGE_TEAMS[hud.team].icon} {hud.team === 'atk' ? 'ATTACK' : 'DEFEND'}</span>
              <span className="truncate">{hud.obj.name}</span>
            </div>
            <div className="h-2 mt-1 bg-slate-700 rounded overflow-hidden">
              <div className={`h-full ${hud.obj.contested ? 'bg-amber-400 animate-pulse' : 'bg-rose-500'}`} style={{ width: `${hud.obj.prog}%` }} />
            </div>
            <div className="text-[9px] font-bold mt-0.5 text-slate-300">
              {hud.obj.contested ? '⚔️ CONTESTED' : hud.obj.capturing ? `CAPTURING · ${hud.obj.prog}%` : hud.team === 'atk' ? 'Stand in the zone to capture' : 'Keep the Raiders out of the zone'}
            </div>
          </div>
        ) : (
          <div className="text-[9px] md:text-[10px] font-black px-2 py-0.5 rounded bg-slate-900/70">FIRST TO {KILL_TARGET} · {leader ? `${leader.name} ${leader.kills}` : ''}</div>
        )}
        </>
        )}
        {story !== null && CHAPTERS[story] && (
          <div className="text-[9px] md:text-[10px] font-black px-2 py-0.5 rounded-full border max-w-[70vw] truncate" style={{ background: 'rgba(2,6,23,0.8)', borderColor: CHAPTERS[story].color, color: CHAPTERS[story].color }}>📖 CH.{CHAPTERS[story].n} · {CHAPTERS[story].goal}</div>
        )}
        {(hud.moon > 0 || hud.bull > 0) && (
          <div className="text-[10px] md:text-xs font-black px-2.5 py-0.5 rounded-full bg-indigo-600/90 animate-pulse">
            {hud.moon > 0 ? `🌕 LOW GRAVITY ${hud.moon}s ` : ''}{hud.bull > 0 ? `🐂 BULL RUN ${hud.bull}s` : ''}
          </div>
        )}
      </div>

      {/* top left */}
      <div className="absolute left-0 top-0 safe-top safe-x pointer-events-auto">
        <div className="flex items-center gap-2 bg-slate-950/75 rounded-xl px-2.5 py-1.5">
          {hud.zombie ? (
            <div className="leading-none"><span className="text-[11px] md:text-sm text-lime-200 font-black block">🧟 YOU KILLED</span><span className="font-game text-3xl md:text-4xl text-lime-300">{hud.kills}</span></div>
          ) : (
            <div className="leading-none"><span className="text-[11px] md:text-sm text-slate-300 font-black block">K / D</span><span className="font-game text-2xl md:text-3xl text-emerald-300">{hud.kills}<span className="text-slate-500">/</span><span className="text-rose-300">{hud.deaths}</span></span></div>
          )}
          {hud.acc != null && (
            <div className="leading-none"><span className="text-[11px] md:text-sm text-slate-300 font-black block">ACC</span><span className={`font-game text-xl md:text-2xl ${hud.acc >= 60 ? 'text-emerald-300' : hud.acc >= 35 ? 'text-amber-300' : 'text-rose-300'}`}>{hud.acc}%</span></div>
          )}
          <span className="hidden md:inline text-[10px] font-bold text-cyan-300">● {hud.net} ({hud.peers})</span>
          <button onClick={() => { const m = !muted; sfx.setMuted(m); setMutedS(m); }} className="touch-btn w-8 h-8 rounded-lg bg-slate-800 text-sm cursor-pointer">{muted ? '🔇' : '🔊'}</button>
          {IS_TOUCH && clips.length > 0 && (
            <button onClick={() => setShowClips(true)} className="touch-btn h-8 px-2 rounded-lg bg-rose-600/90 text-[11px] font-black text-white cursor-pointer">🎬 {clips.length}</button>
          )}
          {IS_TOUCH ? (
            <button onClick={() => setTouchMenu(true)} className="touch-btn w-8 h-8 rounded-lg bg-slate-800 text-sm cursor-pointer">⚙️</button>
          ) : (
            <button onClick={onExit} className="touch-btn h-8 px-2 rounded-lg bg-slate-800 text-[11px] font-black cursor-pointer">✕<span className="hidden md:inline"> LOBBY</span></button>
          )}
        </div>
      </div>

      {/* top right: mini scoreboard + feed */}
      <div className="absolute right-0 top-0 safe-top safe-x pointer-events-none flex flex-col items-end gap-1.5">
        {hud.zombie ? (
          <canvas ref={miniRef} width={IS_TOUCH ? 112 : 176} height={IS_TOUCH ? 112 : 176} className={`${IS_TOUCH ? 'w-[112px] h-[112px]' : 'w-[176px] h-[176px]'} rounded-full shadow-xl`} />
        ) : (
        <div className="bg-white/90 text-slate-900 rounded-lg p-1.5 w-[130px] md:w-[200px] shadow">
          {hud.board.slice(0, IS_SMALL() ? 3 : 5).map((r, i) => (
            <div key={r.id} className={`flex items-center justify-between text-[10px] md:text-[11px] px-1 rounded ${r.isMe ? 'bg-emerald-200 font-black' : 'font-semibold'}`}>
              <span className="truncate"><span className="inline-block w-2 h-2 rounded-full mr-1" style={{ background: r.color }} />{i + 1}. {r.name}</span>
              <span className="font-mono shrink-0">{r.kills}/{r.deaths}</span>
            </div>
          ))}
        </div>
        )}
        <div className={`${IS_TOUCH ? (hud.zombie ? 'hidden' : 'hidden md:flex') : 'flex'} flex-col items-end gap-1`}>
          {hud.feed.map(f => (
            <div key={f.id} className="text-[13px] md:text-sm font-bold px-2 py-0.5 rounded bg-slate-950/75" style={{ color: f.color }}>{f.msg}</div>
          ))}
        </div>
      </div>

const PROFILE_KEY = 'ngmi_profile_v1';

const netNum = (v, lo, hi, d = 0) => (typeof v === 'number' && Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d);
const cleanRoom = r => (String(r || '').toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 16) || 'NGMI-888');
const COSMETICS = [
  { id: 'none', name: 'None', icon: '🚫', lvl: 1 },
  { id: 'party', name: 'Party Hat', icon: '🎉', lvl: 2 },
