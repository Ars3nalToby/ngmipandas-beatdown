];
const xpForLevel = l => 400 + l * 250;
const defaultProfile = () => ({ xp: 0, level: 1, kills: 0, deaths: 0, wins: 0, matches: 0, bestStreak: 0, headshots: 0, cosmetic: 'none', sens: 1, botLevel: 'normal', voice: true, autoFire: true, touchSens: 1, clips: true, story: 0 });
function loadProfile() {
  try {
    const p = JSON.parse(localStorage.getItem(PROFILE_KEY));
    if (p && typeof p.xp === 'number') return { ...defaultProfile(), ...p };
  } catch (e) {}
  return defaultProfile();
}
function saveProfile(p) {
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) {}
}
function awardXp({ kills = 0, deaths = 0, won = false, headshots = 0, bestStreak = 0, zkills = 0, waves = 0 }) {
  const p = loadProfile();
  const before = p.level;
  const parts = [['Match played', 150]];
  if (zkills || waves) {
    parts.push([`Zombies ×${zkills}`, zkills * 20]);
    if (waves) parts.push([`Waves survived ×${waves}`, waves * 120]);
  } else parts.push([`Eliminations ×${kills}`, kills * 100]);
  if (headshots) parts.push([`Headshots ×${headshots}`, headshots * 25]);
  if (won) parts.push(['Victory', 500]);
  const gained = parts.reduce((a, b) => a + b[1], 0);
  p.xp += gained;
  p.kills += kills;
  p.deaths += deaths;
  p.matches += 1;
  if (won) p.wins += 1;
  p.headshots += headshots;
  p.bestStreak = Math.max(p.bestStreak, bestStreak);
  while (p.xp >= xpForLevel(p.level)) {
    p.xp -= xpForLevel(p.level);
    p.level += 1;
  }
  saveProfile(p);
  return { gained, parts, before, after: p.level, unlocked: COSMETICS.filter(c => c.lvl > before && c.lvl <= p.level), profile: p };
}
function applyCosmetic(mesh, id) {
  const ud = mesh && mesh.userData;
  if (!ud || !ud.headGroup) return;

    halo.rotation.x = Math.PI / 2;

    const cr = makeCrown();

    g.add(cr);
  } else if (id === 'jetpack') {
    parent = mesh;
    const metal = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.9, roughness: 0.3 });
    [-0.26, 0.26].forEach(x => {
      const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.85, 14), metal);

      flame.rotation.x = Math.PI;
      flame.position.set(x, 0.5, -0.75);
      flame.onBeforeRender = () => { const k = 0.8 + Math.random() * 0.4; flame.scale.set(1, k, 1); };
      g.add(tank, tip, flame);
    });
  } else if (id === 'diamond') {
    parent = mesh;
    const dm = new THREE.MeshStandardMaterial({ color: 0x7dd3fc, emissive: 0x38bdf8, emissiveIntensity: 0.9, metalness: 0.3, roughness: 0.1 });
    for (let i = 0; i < 6; i++) {

const MQTT_URL = 'wss://broker.emqx.io:8084/mqtt';
let mqttLoading = null;
function loadMqtt() {
  if (window.mqtt) return Promise.resolve(window.mqtt);
  if (!mqttLoading) {
    mqttLoading = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js';
      sc.async = true;
      sc.onload = () => res(window.mqtt);
      sc.onerror = () => { mqttLoading = null; rej(new Error('mqtt load failed')); };
      document.body.appendChild(sc);
    });
  }
  return mqttLoading;
}
// Lobby only: listens (never sends) to see who is fighting in a room right now.
function useRoomPresence(room, active) {
  const [names, setNames] = useState(null);
  useEffect(() => {
    if (!active) { setNames(null); return undefined; }
    let alive = true;
    let client = null;
    const seen = {};
    const topic = `ngmipandas/beatdown3d/v3/${cleanRoom(room)}`;
    const startT = setTimeout(() => {
      loadMqtt().then(mq => {
        if (!alive || !mq) return;
        client = mq.connect(MQTT_URL, { clientId: `ngmi_lobby_${Math.random().toString(36).slice(2, 9)}`, clean: true, connectTimeout: 4000 });
        client.on('connect', () => client.subscribe(topic));
        client.on('message', (t, payload) => {
          try {
            const d = JSON.parse(payload.toString());
            if (d && d.t === 's' && typeof d.id === 'string' && d.id.length < 40) seen[d.id] = { t: Date.now(), name: String(d.name || 'Panda').slice(0, 16) };
          } catch (e) {}
        });
      }).catch(() => {});
    }, 500);
    const tick = setInterval(() => {
      const now = Date.now();
      Object.keys(seen).forEach(k => { if (now - seen[k].t > 5000) delete seen[k]; });
      setNames(Object.values(seen).map(v => v.name));
    }, 1000);
    return () => {
      alive = false;
      clearTimeout(startT);
      clearInterval(tick);
      if (client) { try { client.end(true); } catch (e) {} }
    };
  }, [room, active]);
  return names;
}

      rock.position.set(Math.cos(a) * rr, -12 + Math.random() * 26, Math.sin(a) * rr - 20);
      scene.add(rock);
      asteroids.push({ rock, spin: (Math.random() - 0.5) * 0.8, ph: Math.random() * 6 });
    }

    const bumpers = [];
    [Math.PI / 2, Math.PI * 7 / 6, Math.PI * 11 / 6].forEach(a => {
      const grp = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(1.6, 1.8, 1.4, 32),
        new THREE.MeshStandardMaterial({ color: 0x7a5a32, emissive: 0xff5a1a, emissiveIntensity: 0.35, metalness: 1, roughness: 0.32 })
      );
      body.position.y = 0.7;
      const cap = new THREE.Mesh(
        new THREE.TorusGeometry(1.45, 0.22, 12, 36),
        new THREE.MeshStandardMaterial({ color: 0x2a1004, emissive: 0xff8a3c, emissiveIntensity: 2.2 })
      );
      cap.rotation.x = Math.PI / 2;
      cap.position.y = 1.45;
      grp.add(body);
      grp.add(cap);
      grp.position.set(Math.cos(a) * 15, 0, Math.sin(a) * 15);
      scene.add(grp);
      bumpers.push({ grp, mat: body.material, x: grp.position.x, z: grp.position.z, pulse: 0 });
    });

    const rimTorus = new THREE.Mesh(new THREE.TorusGeometry(ARENA_RADIUS - 0.15, 0.32, 12, 120), bronze);
    rimTorus.rotation.x = Math.PI / 2;
    rimTorus.position.y = 0.05;
    rimTorus.receiveShadow = true;
    arenaGroup.add(rimTorus);
    const edgeRing = new THREE.Mesh(
      new THREE.RingGeometry(ARENA_RADIUS - 2.2, ARENA_RADIUS - 1.95, 120),
      new THREE.MeshBasicMaterial({ color: 0xff6a2a, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
    );
    edgeRing.rotation.x = -Math.PI / 2;
    edgeRing.position.y = 0.04;
    arenaGroup.add(edgeRing);


    const fighters = [];
    const wildMinions = [];
    const shockwaves = [];
    const floatingMemes = [];
    // ---------- GPU memory: free what we throw away, recycle gang pandas ----------
    // Each panda mesh carries ~60 geometries/materials. Recruits, throws and lost gang
    // members used to be built fresh and dropped without freeing, so a long match kept
    // growing GPU memory (iOS Safari reloads the page when it runs out).
    const disposeObj = o => {
      if (!o) return;
      o.traverse(c => {
        if (c.geometry && !c.geometry.userData.shared) c.geometry.dispose();
        const mats = Array.isArray(c.material) ? c.material : c.material ? [c.material] : [];
        mats.forEach(mt => {
          if (mt.userData.shared) return; // shared with other pandas of the same kind
          if (mt.map && !mt.map.userData.shared) mt.map.dispose();
          mt.dispose();
        });
      });
    };
    const pandaPool = {};
    const takePanda = (cls, color) => {
      const k = `${cls.id}|${color}`;
      const list = pandaPool[k];
      let m = list && list.pop();
      if (m) {
        m.rotation.set(0, 0, 0);
        m.scale.copy(m.userData.baseScale);
        m.visible = true;
      } else {
        m = buildNgmiPandaMesh(cls, true, color);
        m.userData.poolKey = k;
        m.userData.baseScale = m.scale.clone();
      }
      return m;
    };
    const releasePanda = m => {
      if (!m) return;
      scene.remove(m);
      const k = m.userData.poolKey;
      if (k) {
        const l = pandaPool[k] || (pandaPool[k] = []);
        if (l.length < 24 && !l.includes(m)) { l.push(m); return; }
        if (l.includes(m)) return;
      }
      disposeObj(m);
    };
    const shockGeo = new THREE.RingGeometry(0.6, 1.25, 36);

    let gangColorIdx = 0;
    const createFighterEntity = (id, name, pandaClass, isLocal, isBot, startAngle, index) => {
      const dist = isLocal ? 7 : 16 + (index % 2) * 6;
      const x = Math.cos(startAngle) * dist;
      const z = Math.sin(startAngle) * dist;
      let hash = 0;
      for (let k = 0; k < id.length; k++) hash = (hash * 31 + id.charCodeAt(k)) >>> 0;
      const gangColor = isLocal ? LOCAL_GANG_COLOR : isBot ? GANG_COLORS[gangColorIdx++ % GANG_COLORS.length] : GANG_COLORS[hash % GANG_COLORS.length];

      const mesh = buildNgmiPandaMesh(pandaClass, false, gangColor);
      mesh.position.set(x, 0, z);
      scene.add(mesh);

      // Floating name tag + damage %
      const tagCanvas = document.createElement('canvas');
      tagCanvas.width = 512;
      tagCanvas.height = 176;
      drawNameTag(tagCanvas, name, 0, gangColor, isLocal);
      const tagTex = srgbTex(new THREE.CanvasTexture(tagCanvas));
      const tagSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tagTex, transparent: true, depthTest: false }));
      tagSprite.scale.set(6.2, 2.13, 1);
      tagSprite.position.set(x, 5.9, z);
      tagSprite.renderOrder = 10;
      scene.add(tagSprite);

      if (isLocal) {
        const arrow = new THREE.Mesh(
          new THREE.ConeGeometry(0.42, 0.8, 4),
          new THREE.MeshBasicMaterial({ color: LOCAL_GANG_COLOR })
        );
        arrow.rotation.x = Math.PI;
        arrow.position.y = 4.95;
        mesh.add(arrow);
        mesh.userData.youArrow = arrow;
      }

      const minions = [];
      const initialCount = isLocal ? 4 : 3 + (index % 3);
      for (let m = 0; m < initialCount; m++) {
        const mMesh = takePanda(pandaClass, gangColor);
        mMesh.position.set(x + (Math.random() - 0.5) * 3, 0, z + (Math.random() - 0.5) * 3);
        scene.add(mMesh);
        minions.push({ mesh: mMesh, angleOffset: (m * Math.PI * 2) / 6, punchTimer: 0 });
      }

      return {
        id,
        name,
        pandaClass,
        isLocal,
        isBot,
        mesh,
        minions,
        gangColor,
        tag: { canvas: tagCanvas, tex: tagTex, sprite: tagSprite, shown: 0 },
        baseScale: mesh.scale.x,
        vx: 0,
        vy: 0,
        vz: 0,
        dmg: 0,
        stun: 0,
        squash: 0,
        punchCd: 0,
        jumps: 2,
        pounding: false,
        deaths: 0,
        lastHitAt: 0,
        streak: 0,
        buffs: { speed: 0, armor: 0, pump: 0 },
        bubble: (() => {
          const b = new THREE.Mesh(
            new THREE.SphereGeometry(1.75, 24, 18),
            new THREE.MeshBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.28, depthWrite: false })
          );
          b.position.y = 1.3;
          b.visible = false;
          mesh.add(b);
          return b;
        })(),
        kos: 0,
        swarmTimer: 0,
        punchAnim: 0,
        aiTargetId: null,
        aiTimer: 0,
        lastHitBy: null
      };
    };

    const localFighter = createFighterEntity(
      myIdRef.current,
      playerName || 'NGMI_Leader',
      selectedClass,
      true,
      false,
      Math.random() * Math.PI * 2,
      0
    );
    fighters.push(localFighter);
    applyCosmetic(localFighter.mesh, prof.cosmetic);

    const removeFighter = f => {
      scene.remove(f.mesh);
      scene.remove(f.tag.sprite);
      disposeObj(f.mesh);
      disposeObj(f.tag.sprite);
      if (f.tornadoFx) { scene.remove(f.tornadoFx); f.tornadoFx = null; }
      f.minions.forEach(m => releasePanda(m.mesh));
      f.minions = [];
      const i = fighters.indexOf(f);
      if (i !== -1) fighters.splice(i, 1);
    };
    // ---------- room size: humans first, AI pandas fill the empty slots ----------
    const ROOM_SLOTS = 8;
    let botSeq = 0;
    const spawnBots = count => {
      for (let i = 0; i < count; i++) {
        const seq = botSeq++;
        const angle = Math.random() * Math.PI * 2;
        const botClass = PANDA_CLASSES[(seq + 1) % PANDA_CLASSES.length];
        fighters.push(createFighterEntity(`${myIdRef.current}_b${seq}`, RIVAL_NAMES[seq % RIVAL_NAMES.length], botClass, false, true, angle, seq + 1));
      }
    };
    const storyMode = storyRunRef.current !== null && !!CHAPTERS[storyRunRef.current];
    if (storyMode) remotePlayersRef.current = {};
    // players seen in the last few seconds (kept across PLAY AGAIN, so a rematch knows the room at once)
    const livePeers = () => {
      const t = performance.now();
      return Object.keys(remotePlayersRef.current).filter(pid => t - remotePlayersRef.current[pid].lastSeen < 5000);
    };
    const startPeers = storyMode ? [] : livePeers();
    const net = { isHost: [myIdRef.current, ...startPeers].sort()[0] === myIdRef.current, remoteSeen: {}, hostId: myIdRef.current, hitRate: {} };
    const makeWhale = f => {
      f.isWhale = true;
      f.baseScale *= 1.75;
      f.mesh.scale.setScalar(f.baseScale);
      f.pandaClass = { ...f.pandaClass, mass: 3.2, power: 2.2, speed: 0.78 };
      announceNow('🐋 A WHALE HAS ENTERED THE ARENA', '#38bdf8');
      sfx.play('streak');
      pushKillFeed('🐋 Ring out the Whale for +3 K.O. and +4 pandas!', '#38bdf8');
    };
    const whaleHunt = storyMode && CHAPTERS[storyRunRef.current].whale;
    // story chapters always have rivals to ring out, even if "Fill with bots" is off
    const wantBots = fillWithBots || storyMode;
    let whaleTimer = whaleHunt ? 18 : 55;
    const botsWanted = humans => (wantBots ? Math.max(0, ROOM_SLOTS - humans) : 0);
    if (net.isHost) spawnBots(botsWanted(1 + startPeers.length));

    const spawnWildPanda = () => {
      if (wildMinions.length >= 14) return;
      const angle = Math.random() * Math.PI * 2;
      const r = 5 + Math.random() * (ARENA_RADIUS - 9);
      const randomClass = PANDA_CLASSES[Math.floor(Math.random() * 2)];
      const mesh = takePanda(randomClass, WILD_COLOR);
      mesh.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
      scene.add(mesh);
      wildMinions.push({ mesh, bobOffset: Math.random() * Math.PI * 2 });
    };

    for (let i = 0; i < 9; i++) spawnWildPanda();

    const triggerShockwave = (x, z, colorHex, maxRadius = 8) => {
      const geo = shockGeo;
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.95
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(x, 0.18, z);
      scene.add(mesh);
      shockwaves.push({ mesh, mat, scale: 1, maxScale: maxRadius });
    };

    const spawnMemeSprite = (x, y, z, text, color = '#22c55e') => {
      const tex = createLabelTexture(text, 'transparent', color, 512, 128, 52, '#000000');
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.position.set(x + (Math.random() - 0.5) * 1.5, y + 2.8, z);
      sprite.scale.set(5.5, 1.4, 1);
      scene.add(sprite);
      floatingMemes.push({ sprite, mat, life: 1.0 });
    };

    const addMinionToFighter = (fighter) => {
      if (fighter.minions.length >= 16) return;
      const mMesh = takePanda(fighter.pandaClass, fighter.gangColor);
      mMesh.position.copy(fighter.mesh.position);
      mMesh.position.y = Math.max(0, mMesh.position.y);
      scene.add(mMesh);
      fighter.minions.push({
        mesh: mMesh,
        angleOffset: Math.random() * Math.PI * 2,
        punchTimer: 0
      });
      if (fighter.isLocal) setMyGangSize(fighter.minions.length + 1);
    };

    // ---------- GAME FEEL: particles, flying minions, shake, hit-stop ----------
    const particles = [];
    const debris = [];
    const particleGeo = new THREE.BoxGeometry(0.28, 0.28, 0.28);
    const partPool = [];
    const fx = { shake: 0, hitStop: 0, liqTimer: 0, combo: 0, comboTimer: 0, slowmo: 0, postFlash: 0 };

    const burst = (x, y, z, color, count = 12, speed = 12) => {
      for (let i = 0; i < count && particles.length < 320; i++) {
        let m = partPool.pop();
        if (!m) m = new THREE.Mesh(particleGeo, new THREE.MeshBasicMaterial({ transparent: true, opacity: 1 }));
        const mat = m.material;
        mat.color.set(color);
        mat.opacity = 1;
        m.rotation.set(0, 0, 0);
        m.position.set(x, y, z);
        scene.add(m);
        const a = Math.random() * Math.PI * 2;
        const sp = speed * (0.4 + Math.random() * 0.8);
        particles.push({ m, mat, vx: Math.cos(a) * sp, vy: 4 + Math.random() * speed, vz: Math.sin(a) * sp, life: 0.55 + Math.random() * 0.35 });
      }
    };

    // Knock a minion off a gang so it visibly flies away instead of vanishing
    const flingMinion = (fighter, dirX, dirZ) => {
      const lost = fighter.minions.pop();
      if (!lost) return;
      debris.push({ mesh: lost.mesh, vx: dirX * 18 + (Math.random() - 0.5) * 8, vy: 14 + Math.random() * 6, vz: dirZ * 18 + (Math.random() - 0.5) * 8, life: 2.2 });
      if (fighter.isLocal) setMyGangSize(fighter.minions.length + 1);
    };

    const knockbackMult = () => (fx.liqTimer > 0 ? 1.35 : 1.0) * (matchRef.finalRush ? 1.5 : 1.0);
    const matchRef = { finalRush: false };
    const volAt = pos => Math.max(0, 1 - pos.distanceTo(localFighter.mesh.position) / 48);
    const flash = (strength = 0.45) => {
      const el = flashRef.current;
      if (!el) return;
      el.style.transition = 'none';
      el.style.opacity = String(strength);
      requestAnimationFrame(() => {
        el.style.transition = 'opacity 0.35s ease-out';
        el.style.opacity = '0';
      });
    };
    const announceNow = (text, color) => {
      if (bdClipRef.current) bdClipRef.current.flash(text, color);
      setAnnounce({ text, color, id: Date.now() });
      setTimeout(() => setAnnounce(a => (a && a.text === text ? null : a)), 1900);
    };

    // Smash-Bros style knockback: more damage % => flies further and higher
    const launch = (target, attacker, dirX, dirZ, base, upward, dmgAdd) => {
      if (target.respawnLock > 0) return 0;
      if (target.isLocal || target.isBot) target.dmg = Math.min(999, target.dmg + dmgAdd);
      const ratio = attacker.pandaClass.power / target.pandaClass.mass;
      const armor = target.buffs.armor > 0 ? 0.4 : 1;
      const pump = attacker.buffs.pump > 0 ? 1.7 : 1;
      const kb = Math.min(110, base * ratio * (1 + target.dmg / 45) * knockbackMult() * armor * pump);
      target.lastHitBy = attacker;
      target.lastHitAt = performance.now();
      const p = target.mesh.position;
      const isCrit = kb > 32;
      burst(p.x, p.y + 1.5, p.z, attacker.gangColor, 6 + Math.round(kb / 6), 6 + kb * 0.25);
      const vol = (target.isLocal || attacker.isLocal) ? 1 : volAt(p) * 0.7;
      if (attacker.isLocal && kb > stats.biggestHit) stats.biggestHit = kb;
      if (attacker.isLocal && !(attacker.tornadoT > 0)) ult.v = Math.min(100, ult.v + Math.min(5, 0.6 + kb * 0.1));
      if (target.isLocal && kb > 18) buzz(14);
      if (isCrit) { impactLight.position.set(p.x, p.y + 2.2, p.z); impactLight.intensity = Math.min(7, 2 + kb * 0.06); }
      if (isCrit) {
        sfx.play('crit', vol);
        burst(p.x, p.y + 1.5, p.z, '#ffffff', 14, 16);
        spawnMemeSprite(p.x, 2.2, p.z, 'CRIT!! 💥', '#ffffff');
        if (target.isLocal || attacker.isLocal) flash(target.isLocal ? 0.5 : 0.3);
      } else {
        sfx.play('hit', vol, 0.85 + Math.random() * 0.4);
      }
      if (!target.isLocal && !target.isBot) {
        // remote fighter: its owner applies the knockback with its own %
        send({ t: 'h', id: myIdRef.current, to: target.id, from: attacker.id, dx: dirX, dz: dirZ, b: base, u: upward, dm: dmgAdd, pw: attacker.pandaClass.power * (attacker.buffs.pump > 0 ? 1.7 : 1), fl: base > 8 ? 1 : 0 });
        return kb;
      }
      target.vx += dirX * kb;
      target.vz += dirZ * kb;
      target.vy = Math.max(target.vy, upward + kb * 0.16);
      target.stun = Math.max(target.stun, Math.min(1.4, 0.2 + kb / 55));
      if (target.isLocal || attacker.isLocal) {
        fx.shake = Math.min(1.6, fx.shake + kb / 45);
        if (kb > 22) fx.shake = Math.min(1.6, fx.shake + (isCrit ? 0.35 : 0.15));
      }
      if (attacker.isLocal) {
        fx.combo = fx.comboTimer > 0 ? fx.combo + 1 : 1;
        stats.bestCombo = Math.max(stats.bestCombo, fx.combo);
        fx.comboTimer = 1.4;
        if (fx.combo >= 3) {
          spawnMemeSprite(p.x, 2.6, p.z, `x${fx.combo} COMBO! 🔥`, '#fb923c');
          sfx.play('combo', 0.9, Math.pow(2, Math.min(fx.combo - 3, 12) / 12));
        }
      }
      return kb;
    };

    // ---------- match flow ----------
    const match = { left: MATCH_SECONDS, countdown: 3.3, over: false, finalRush: false };
    const stats = { bestCombo: 0, biggestHit: 0, falls: 0 };
    ['3', '2', '1'].forEach((n, i) => setTimeout(() => { announceNow(n, '#ffffff'); sfx.play('pop', 1, 0.8); }, 150 + i * 1000));
    setTimeout(() => { announceNow('FIGHT!', '#00ffa3'); sfx.play('streak'); }, 3150);
    setMatchTime(MATCH_SECONDS);

    // ---------- RUG PULL: a slice of the floor collapses ----------
    let rug = null;
    const RUG_INNER = 13;
    const angleOf = (x, z) => {
      let a = Math.atan2(-z, x);
      if (a < 0) a += Math.PI * 2;
      return a;
    };
    const inRug = pos => {
      if (!rug || rug.phase !== 'open') return false;
      const r = Math.hypot(pos.x, pos.z);
      if (r < RUG_INNER) return false;
      let d = angleOf(pos.x, pos.z) - rug.a0;
      if (d < 0) d += Math.PI * 2;
      return d <= rug.len;
    };
    const crackTex = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = 'rgba(60,10,0,0.5)';
      g.fillRect(0, 0, 512, 512);
      g.strokeStyle = '#ff7a2a';
      g.shadowColor = '#ff3d00';
      g.shadowBlur = 16;
      g.lineCap = 'round';
      for (let k = 0; k < 30; k++) {
        let x = Math.random() * 512, y = Math.random() * 512;
        g.lineWidth = 1 + Math.random() * 3.5;
        g.beginPath();
        g.moveTo(x, y);
        for (let j = 0; j < 7; j++) {
          x += (Math.random() - 0.5) * 90;
          y += (Math.random() - 0.5) * 90;
          g.lineTo(x, y);
        }
        g.stroke();
      }
      const t = srgbTex(new THREE.CanvasTexture(c));
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(0.07, 0.07);
      return t;
    })();
    const sectorShape = (a0, len, r0, r1) => {
      const sh = new THREE.Shape();
      sh.absarc(0, 0, r1, a0, a0 + len, false);
      sh.absarc(0, 0, r0, a0 + len, a0, true);
      return sh;
    };
    const slabTex = arenaTex.map.clone();
    slabTex.repeat.set(1 / (2 * ARENA_RADIUS), 1 / (2 * ARENA_RADIUS));
    slabTex.offset.set(0.5, 0.5);
    slabTex.needsUpdate = true;
    const slabTop = new THREE.MeshStandardMaterial({ map: slabTex, bumpMap: arenaTex.bump, bumpScale: 0.3, roughness: 0.9 });
    const makeSlab = () => {
      const geo = new THREE.ExtrudeGeometry(sectorShape(rug.a0, rug.len, RUG_INNER, ARENA_RADIUS), { depth: 3, bevelEnabled: false, curveSegments: 24 });
      const m = new THREE.Mesh(geo, [slabTop, floorSide]);
      m.rotation.x = -Math.PI / 2;
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    };
    const sectorPoint = () => {
      const a = rug.a0 + Math.random() * rug.len;
      const r = RUG_INNER + Math.random() * (ARENA_RADIUS - RUG_INNER);
      return [Math.cos(a) * r, -Math.sin(a) * r];
    };
    const startRug = () => {
      const a0 = Math.random() * Math.PI * 2;
      const len = Math.PI / 3;
      const mat = new THREE.MeshBasicMaterial({ map: crackTex, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
      const mesh = new THREE.Mesh(new THREE.ShapeGeometry(sectorShape(a0, len, RUG_INNER, ARENA_RADIUS + 0.4), 24), mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = 0.09;
      scene.add(mesh);
      rug = { a0, len, phase: 'warn', t: 3, mesh, mat, slab: null, slabVy: 0, extras: [] };
      announceNow('⚠️ RUG PULL INCOMING!', '#ff6a2a');
      setArenaEventText('⚠️ RUG PULL: GET OFF THE CRACKING FLOOR!');
      sfx.play('fall', 0.7);
    };
    const openRug = () => {
      scene.remove(rug.mesh);
      rug.slab = makeSlab();
      rug.slab.position.y = -2.98;
      rug.slabVy = 2;
      rug.spin = (Math.random() - 0.5) * 0.9;
      const abyss = new THREE.Mesh(
        new THREE.ShapeGeometry(sectorShape(rug.a0, rug.len, RUG_INNER, ARENA_RADIUS + 0.6), 24),
        new THREE.MeshBasicMaterial({ color: 0x020104, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 })
      );
      abyss.rotation.x = -Math.PI / 2;
      abyss.position.y = 0.03;
      scene.add(abyss);
      const pts = sectorShape(rug.a0, rug.len, RUG_INNER, ARENA_RADIUS).getPoints(48).map(v => new THREE.Vector3(v.x, 0.12, -v.y));
      const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xff7a2a, transparent: true }));
      scene.add(edge);
      const mid = rug.a0 + rug.len / 2;
      const rr = (RUG_INNER + ARENA_RADIUS) / 2;
      const vortex = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlowTexture('rgba(255,90,20,0.9)', 'rgba(120,20,160,0)'), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
      vortex.position.set(Math.cos(mid) * rr, -7, -Math.sin(mid) * rr);
      vortex.scale.set(26, 26, 1);
      scene.add(vortex);
      rug.extras = [abyss, edge, vortex];
      rug.edgeMat = edge.material;
      rug.vortex = vortex;
    };

    // ---------- WEAPONS ----------
    const projectiles = [];
    const makeWeaponMesh = kind => {
      const g = new THREE.Group();
      if (kind === 'hammer') {
        const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 1.5, 8), new THREE.MeshStandardMaterial({ color: 0x4a2c17, roughness: 0.7 }));
        handle.position.y = 0.55;
        const headM = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.42, 0.42), new THREE.MeshStandardMaterial({ color: 0x8c6a3c, metalness: 1, roughness: 0.35 }));
        headM.position.y = 1.3;
        const plate = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.32, 0.32), new THREE.MeshStandardMaterial({ color: 0xd4a640, emissive: 0xff8a20, emissiveIntensity: 0.8 }));
        plate.position.set(0.4, 1.3, 0);
        g.add(handle, headM, plate);
        g.rotation.x = 0.9;
        g.position.set(0.1, -0.1, 0.55);
      } else {
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 1.5, 14), new THREE.MeshStandardMaterial({ color: 0x2f3a2a, roughness: 0.55, metalness: 0.4 }));
        tube.rotation.x = Math.PI / 2;
        const mouthM = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.05, 8, 16), new THREE.MeshStandardMaterial({ color: 0xb91c1c, emissive: 0xff3b1a, emissiveIntensity: 0.9 }));
        mouthM.position.z = 0.75;
        g.add(tube, mouthM);
        g.position.set(0.05, 0.35, 0.3);
      }
      return g;
    };
    const giveWeapon = (f, kind) => {
      if (f.weapon) f.mesh.userData.rightArmGroup.remove(f.weapon.mesh);
      const mesh = makeWeaponMesh(kind);
      f.mesh.userData.rightArmGroup.add(mesh);
      f.weapon = { kind, uses: kind === 'hammer' ? 5 : 3, cd: 0, mesh, swing: 0 };
    };
    const dropWeapon = f => {
      if (!f.weapon) return;
      f.mesh.userData.rightArmGroup.remove(f.weapon.mesh);
      f.weapon = null;
      f.mesh.userData.rightArmGroup.rotation.x = 0;
    };
    const forwardOf = f => {
      const r = f.mesh.rotation.y;
      return [Math.sin(r), Math.cos(r)];
    };
    const useWeapon = f => {
      const w = f.weapon;
      if (!w || w.cd > 0) return false;
      const [fx0, fz0] = forwardOf(f);
      const p = f.mesh.position;
      if (w.kind === 'hammer') {
        w.cd = 0.45;
        w.swing = 0.3;
        sfx.play('smash', f.isLocal ? 0.9 : volAt(p) * 0.5);
        burst(p.x + fx0 * 3, 0.8, p.z + fz0 * 3, '#ffb347', 10, 8);
        fighters.forEach(o => {
          if (o.id === f.id) return;
          const dx = o.mesh.position.x - p.x, dz = o.mesh.position.z - p.z;
          const d = Math.hypot(dx, dz);
          if (d < 5.8 && d > 0.01 && (dx * fx0 + dz * fz0) / d > 0.35) {
            launch(o, f, dx / d, dz / d, 15, 11, 18);
          }
        });
      } else {
        w.cd = 0.7;
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffb070 }));
        mesh.position.set(p.x + fx0 * 2.2, p.y + 1.6, p.z + fz0 * 2.2);
        scene.add(mesh);
        projectiles.push({ mesh, owner: f, vx: fx0 * 38, vz: fz0 * 38, life: 1.3 });
        sfx.play('swarm', f.isLocal ? 0.7 : volAt(p) * 0.4);
        if (f.isLocal) fx.shake = Math.min(1.6, fx.shake + 0.25);
      }
      w.uses -= 1;
      if (w.uses <= 0) setTimeout(() => dropWeapon(f), 350);
      return true;
    };
    const explode = (x, z, owner) => {
      triggerShockwave(x, z, 0xff6a2a, 7);
      burst(x, 1, z, '#ff6a2a', 26, 16);
      burst(x, 1, z, '#ffd27a', 12, 10);
      sfx.play('crit', owner.isLocal ? 1 : volAt(new THREE.Vector3(x, 0, z)) * 0.7);
      fighters.forEach(o => {
        if (o.id === owner.id) return;
        const dx = o.mesh.position.x - x, dz = o.mesh.position.z - z;
        const d = Math.hypot(dx, dz);
        if (d < 6.5) {
          const nx = d > 0.01 ? dx / d : 1, nz = d > 0.01 ? dz / d : 0;
          launch(o, owner, nx, nz, 9 + 9 * (1 - d / 6.5), 10, 16);
        }
      });
      const lp = localFighter.mesh.position;
      if (Math.hypot(lp.x - x, lp.z - z) < 14) fx.shake = Math.min(1.6, fx.shake + 0.6);
    };

    const powerups = [];
    const spawnPowerup = () => {
      if (powerups.length >= 3) return;
      const type = POWERUPS[Math.floor(Math.random() * POWERUPS.length)];
      const a = Math.random() * Math.PI * 2;
      const r = 4 + Math.random() * (ARENA_RADIUS - 10);
      const grp = new THREE.Group();
      const icon = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeEmojiTexture(type.icon), transparent: true }));
      icon.scale.set(2.4, 2.4, 1);
      icon.position.y = 1.9;
      grp.add(icon);
      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.9, 0.9, 9, 20, 1, true),
        new THREE.MeshBasicMaterial({ color: type.color, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false })
      );
      beam.position.y = 4.5;
      grp.add(beam);
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(1.0, 1.35, 32),
        new THREE.MeshBasicMaterial({ color: type.color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.06;
      grp.add(ring);
      grp.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      scene.add(grp);
      powerups.push({ grp, icon, type, ph: Math.random() * 6 });
    };

    const applyPowerup = (f, type) => {
      if (type.id === 'burger') f.buffs.speed = 7;
      if (type.id === 'diamond') f.buffs.armor = 8;
      if (type.id === 'rocket') f.buffs.pump = 6;
      if (type.id === 'hammer' || type.id === 'launcher') giveWeapon(f, type.id);
      if (type.id === 'gift') {
        addMinionToFighter(f);
        addMinionToFighter(f);
        addMinionToFighter(f);
      }
      const pos = f.mesh.position;
      burst(pos.x, 1.5, pos.z, type.color, 16, 10);
      if (f.isLocal) {
        spawnMemeSprite(pos.x, 2.4, pos.z, type.label, type.color);
        if (type.id === 'rocket') cdState.smash = 0;
      }
      sfx.play('powerup', f.isLocal ? 1 : volAt(pos) * 0.6);
    };

    const topic = `ngmipandas/beatdown3d/v3/${cleanRoom(roomCode)}`;
    const send = obj => {
      const c = mqttClientRef.current;
      if (c && c.connected) {
        try { c.publish(topic, JSON.stringify(obj)); } catch (e) {}
      }
    };
    const upsertRemote = (id, name, classId) => {
      let f = fighters.find(x => x.id === id);
      if (!f) {
        const pClass = PANDA_CLASSES.find(c => c.id === classId) || PANDA_CLASSES[0];
        f = createFighterEntity(id, name, pClass, false, false, 0, fighters.length);
        f.remote = true;
        if (id.endsWith('_whale')) makeWhale(f);
        fighters.push(f);
      }
      net.remoteSeen[id] = performance.now();
      return f;
    };
    const applyRemoteState = (f, d) => {
      if (!d || !Number.isFinite(d.x) || !Number.isFinite(d.z)) return;
      if (d.cos !== undefined && f.cosApplied !== d.cos) {
        applyCosmetic(f.mesh, d.cos);
        f.cosApplied = d.cos;
      }
      f.targetX = netNum(d.x, -120, 120);
      f.targetY = netNum(d.y, -60, 80);
      f.targetZ = netNum(d.z, -120, 120);
      f.dmg = netNum(d.d, 0, 999);
      f.kos = Math.round(netNum(d.k, 0, 999));
      f.deaths = Math.round(netNum(d.dt, 0, 999));
      f.streak = Math.round(netNum(d.st, 0, 99));
      const want = Math.round(netNum(d.m, 0, 16));
      while (f.minions.length < want) addMinionToFighter(f);
      while (f.minions.length > want) releasePanda(f.minions.pop().mesh);
    };

    let onNetMessage = null;
    const initMultiplayer = () => {
      if (!window.mqtt) return;
      let client = mqttClientRef.current;
      if (client && client.__topic === topic && !client.disconnecting) {
        // same room as last round: keep the live connection (no reconnect gap between rounds)
        setNetStatus(client.connected ? 'LIVE ONLINE' : 'CONNECTING...');
      } else {
        if (client) { try { client.end(true); } catch (e) {} }
        setNetStatus('CONNECTING...');
        client = window.mqtt.connect(MQTT_URL, {
          clientId: `ngmi_${myIdRef.current}`,
          clean: true,
          connectTimeout: 4000
        });
        client.__topic = topic;
        mqttClientRef.current = client;
        client.on('connect', () => {
          setNetStatus('LIVE ONLINE');
          client.subscribe(topic);
        });
      }

      onNetMessage = (t, payload) => {
        let data;
        try {
          data = JSON.parse(payload.toString());
        } catch (err) {
          return;
        }
        if (!data || typeof data !== 'object' || typeof data.id !== 'string' || data.id === myIdRef.current) return;
        if (typeof data.name === 'string') data.name = data.name.slice(0, 24);
        else if (data.t === 's') data.name = 'Panda';

        if (data.t === 's') {
          // full state from another human (and their bots if they are the host)
          const isNew = !remotePlayersRef.current[data.id];
          remotePlayersRef.current[data.id] = { name: data.name, lastSeen: performance.now() };
          const f = upsertRemote(data.id, data.name, data.c);
          applyRemoteState(f, data);
          if (isNew) pushKillFeed(`🟢 ${data.name} joined Room ${roomCode}!`, '#38bdf8');
          const evs = typeof data.ev === 'string' ? data.ev.split(',') : [];
          if (evs.includes('dash')) doDash(f, Math.sin(f.mesh.rotation.y), Math.cos(f.mesh.rotation.y));
          if (evs.includes('cannon')) fireCannon(f);
          if (evs.includes('tornado')) startTornado(f);
          if (evs.includes('smash')) {
            triggerShockwave(f.mesh.position.x, f.mesh.position.z, f.gangColor, 9);
            sfx.play('smash', volAt(f.mesh.position) * 0.6);
          }
          if (Array.isArray(data.b) && data.id === net.hostId) {
            data.b.slice(0, 16).forEach(b => { if (b && typeof b.i === 'string') applyRemoteState(upsertRemote(b.i, String(b.n || 'Bot').slice(0, 24), b.c), b); });
            const keep = new Set(data.b.map(b => b && b.i));
            [...fighters].forEach(f => { if (f.remote && f.id.startsWith(`${data.id}_`) && !keep.has(f.id)) removeFighter(f); });
          }
          if (data.id === net.hostId && !data.ov && !match.over && Number.isFinite(data.left) && data.left > 0 && Math.abs(match.left - data.left) > 1.5) {
            match.left = Math.min(MATCH_SECONDS, data.left);
          }
        } else if (data.t === 'h') {
          // someone hit one of MY fighters: I own their physics, so I apply it
          const target = fighters.find(x => x.id === data.to && (x.isLocal || x.isBot));
          if (!target) return;
          // rate limit per sender: real play never gets near 30 hits a second
          const nowH = performance.now();
          const rl = net.hitRate[data.id] || (net.hitRate[data.id] = { t: nowH, n: 0 });
          if (nowH - rl.t > 1000) { rl.t = nowH; rl.n = 0; }
          if (++rl.n > 30) return;
          let hdx = netNum(data.dx, -1, 1), hdz = netNum(data.dz, -1, 1);
          const hl = Math.hypot(hdx, hdz);
          if (hl < 0.01) return;
          hdx /= hl;
          hdz /= hl;
          const src = fighters.find(x => x.id === data.from);
          const attacker = {
            id: data.from,
            name: src ? src.name : 'Someone',
            gangColor: src ? src.gangColor : '#ffffff',
            pandaClass: { power: netNum(data.pw, 0.3, 3, 1) },
            buffs: { pump: 0 },
            isLocal: false
          };
          launch(target, attacker, hdx, hdz, netNum(data.b, 0, 24), netNum(data.u, 0, 14), netNum(data.dm, 0, 28));
          if (src) target.lastHitBy = src;
          target.lastHitAt = performance.now();
          if (data.fl && Math.random() < 0.5) flingMinion(target, data.dx, data.dz);
        } else if (data.t === 'k') {
          // a fighter owned by someone else got ringed out by one of MINE
          const killer = fighters.find(x => x.id === data.killer && (x.isLocal || x.isBot));
          if (killer) creditKO(killer, String(data.vn || 'someone').slice(0, 24), netNum(data.vx, -120, 120), netNum(data.vz, -120, 120), netNum(data.vs, 0, 99), !!data.vw);
          else pushKillFeed(`💥 ${data.kn}'s gang RINGED OUT ${data.vn}!`, '#facc15');
        }
      };
      client.on('message', onNetMessage);
    };

    let netCancelled = false;
    if (storyMode) {
      // story chapters are single-player: never join a public room
      if (mqttClientRef.current) { try { mqttClientRef.current.end(true); } catch (e) {} mqttClientRef.current = null; }
      setNetStatus('STORY · OFFLINE');
    } else if (window.mqtt) {
      initMultiplayer();
    } else {
      // the match may already be over (back to lobby) by the time the script loads
      loadMqtt().then(() => { if (!netCancelled) initMultiplayer(); }).catch(() => setNetStatus('OFFLINE · BOTS ONLY'));
    }

    const cdState = { smash: 0, dash: 0, cannon: 0 };
    const pressBuf = { smash: -1e9, dash: -1e9, cannon: -1e9 };
    const INPUT_BUFFER_MS = { smash: 320, dash: 380, cannon: 320 };
    let lastDeniedAt = -1e9;
    const ult = { v: 0 }; // 🌪️ tornado meter: fills as your gang lands hits and K.O.s
    const camLook = new THREE.Vector3(0, 1, -3);
    // adaptive resolution: drop pixel ratio when the phone can't hold ~45fps, raise it back when it can
    const perf = { acc: 0, n: 0, t: 0, warm: 3, pr: renderer.getPixelRatio(), max: renderer.getPixelRatio() };
    const setPR = v => {
      perf.pr = Math.round(v * 100) / 100;
      renderer.setPixelRatio(perf.pr);
      if (post) post.setSize();
    };
    let lastNetBroadcast = 0;
    let lastHudSync = 0;
    let hazardTimer = 0;
    let powerTimer = 5;
    let animationFrameId;
    let prevTime = performance.now();

    const creditKO = (killer, victimName, vx, vz, victimStreak = 0, victimWhale = false) => {
      killer.kos += 1;
      killer.ringouts = (killer.ringouts || 0) + 1;
      addMinionToFighter(killer);
      if (victimStreak >= 3) {
        killer.kos += 1;
        if (killer.isLocal) announceNow('👑 BOUNTY CLAIMED! +1 K.O.', '#facc15');
        pushKillFeed(`👑 ${killer.name} claimed the bounty on ${victimName}!`, '#facc15');
      }
      if (victimWhale) {
        killer.kos += 2;
        if (killer.isLocal) killer.whaleKOs = (killer.whaleKOs || 0) + 1;
        for (let w = 0; w < 4; w++) addMinionToFighter(killer);
        announceNow(`🐋 ${killer.isLocal ? 'YOU' : killer.name} HUNTED THE WHALE!`, '#38bdf8');
      }
      killer.streak = (killer.streak || 0) + 1;
      killer.maxStreak = Math.max(killer.maxStreak || 0, killer.streak);
      if (killer.isLocal) {
        ult.v = Math.min(100, ult.v + 22);
        buzz([20, 30, 50]);
        setMyKos(killer.kos);
        fx.shake = 1.6;
        spawnMemeSprite(vx * 0.7, 3, vz * 0.7, 'K.O.!! 💥', '#facc15');
        flash(0.35);
        fx.postFlash = 0.25;
        sfx.play('ko');
        if (/paperhands/i.test(victimName || '')) setTimeout(() => announceNow('🧻 YOU RUGGED THE RUGGER!', '#fb7185'), 900);
        const STREAKS = { 2: ['DOUBLE K.O.!', '#38bdf8'], 3: ['TRIPLE K.O.!!', '#a855f7'], 4: ['RAMPAGE!!!', '#f97316'], 5: ['UNSTOPPABLE GMI!!!', '#facc15'] };
        const st = STREAKS[Math.min(killer.streak, 5)];
        if (killer.streak >= 2 && bdClipRef.current) bdClipRef.current.highlight(st ? st[0].replace(/!+$/, '') : 'MULTI K.O.');
        if (st) {
          announceNow(st[0], st[1]);
          sfx.play('streak');
        }
      }
      pushKillFeed(`💥 ${killer.name}'s gang RINGED OUT ${victimName}!`, '#facc15');
    };

    // Ring smash shockwave. Airborne targets dodge it (jump to dodge!)
    const doSmash = (attacker, radius, powerMul, label) => {
      const px = attacker.mesh.position.x;
      const pz = attacker.mesh.position.z;
      attacker.punchAnim = 0.45;
      triggerShockwave(px, pz, 0xfacc15, radius);
      spawnMemeSprite(px, 1.8, pz, label, '#facc15');
      sfx.play('smash', attacker.isLocal ? 1 : volAt(attacker.mesh.position) * 0.6);
      if (attacker.isLocal) fx.shake = Math.min(1.6, fx.shake + 0.5 * powerMul);
      burst(px, 0.6, pz, '#facc15', 18, 14);
      fighters.forEach(other => {
        if (other.id === attacker.id) return;
        if (other.mesh.position.y > 1.6) {
          if (other.isLocal) spawnMemeSprite(other.mesh.position.x, 2, other.mesh.position.z, 'DODGED! 😎', '#38bdf8');
          return;
        }
        const dx = other.mesh.position.x - px;
        const dz = other.mesh.position.z - pz;
        const dist = Math.hypot(dx, dz);
        if (dist < radius && dist > 0.01) {
          const closeness = (radius - dist) / radius;
          launch(other, attacker, dx / dist, dz / dist, (7 + 9 * closeness) * powerMul, 8, (14 + 10 * closeness) * powerMul);
          if (Math.random() < 0.5) flingMinion(other, dx / dist, dz / dist);
        }
      });
    };

    // ---------- NEW MOVES ----------
    // 🐂 DASH: short burst that bowls over anyone in the way
    const doDash = (f, dx, dz) => {
      f.dashT = 0.2;
      f.dashDir = [dx, dz];
      f.dashHit = {};
      f.vx = dx * 46;
      f.vz = dz * 46;
      if (f.mesh.position.y <= 0.05) f.vy = Math.max(f.vy, 2.5);
      f.mesh.rotation.y = Math.atan2(dx, dz);
      f.squash = 0.35;
      sfx.play('dash', f.isLocal ? 1 : volAt(f.mesh.position) * 0.5);
      burst(f.mesh.position.x, 0.4, f.mesh.position.z, '#e2e8f0', 8, 6);
      if (f.isLocal) { fx.shake = Math.min(1.6, fx.shake + 0.12); buzz(8); }
    };
    // 🐼💥 PANDA CANNON: throw one of your own gang at the nearest rival in front of you
    const cannonballs = [];
    const fireCannon = f => {
      const lost = f.minions.pop();
      if (!lost) return false;
      if (f.isLocal) setMyGangSize(f.minions.length + 1);
      const p = f.mesh.position;
      let [ax, az] = forwardOf(f);
      let best = null, bd = 30;
      fighters.forEach(o => {
        if (o.id === f.id || o.respawnLock > 0) return;
        const dx = o.mesh.position.x - p.x, dz = o.mesh.position.z - p.z, d = Math.hypot(dx, dz);
        if (d < bd && d > 1 && (dx * ax + dz * az) / d > 0.4) { bd = d; best = o; }
      });
      if (best) {
        const dx = best.mesh.position.x - p.x, dz = best.mesh.position.z - p.z, d = Math.hypot(dx, dz) || 1;
        ax = dx / d;
        az = dz / d;
      }
      f.mesh.rotation.y = Math.atan2(ax, az);
      f.punchAnim = 0.3;
      const m = lost.mesh;
      m.position.set(p.x + ax * 1.6, Math.max(0, p.y) + 1.8, p.z + az * 1.6);
      const flight = best ? Math.min(1.1, Math.max(0.35, bd / 34)) : 0.9;
      cannonballs.push({ mesh: m, owner: f, vx: ax * 34, vz: az * 34, vy: 7 * flight, life: 1.15 });
      sfx.play('cannon', f.isLocal ? 1 : volAt(p) * 0.6);
      burst(m.position.x, m.position.y, m.position.z, '#ffffff', 6, 6);
      if (f.isLocal) { fx.shake = Math.min(1.6, fx.shake + 0.2); buzz(10); }
      return true;
    };
    // 🌪️ PANDA TORNADO (ultimate): the whole gang spins around you as a launching wall
    const startTornado = f => {
      f.tornadoT = 5;
      f.tornadoHit = {};
      while (f.minions.length < 5) addMinionToFighter(f);
      triggerShockwave(f.mesh.position.x, f.mesh.position.z, 0x38bdf8, 11);
      spawnMemeSprite(f.mesh.position.x, 2.4, f.mesh.position.z, '🌪️ PANDA TORNADO!', '#38bdf8');
      sfx.play('tornado', f.isLocal ? 1 : volAt(f.mesh.position) * 0.7);
      if (f.isLocal) {
        announceNow('🌪️ PANDA TORNADO!', '#38bdf8');
        fx.shake = Math.min(1.6, fx.shake + 0.8);
        flash(0.22);
        buzz([20, 30, 20]);
      }
    };
    const tornadoGeo = { ring: new THREE.TorusGeometry(3.7, 0.18, 8, 56), funnel: (() => { const g = new THREE.CylinderGeometry(4.6, 1.2, 7, 28, 1, true); g.translate(0, 3.5, 0); return g; })() };
    const ensureTornadoFx = f => {
      if (f.tornadoFx) return f.tornadoFx;
      const g = new THREE.Group();
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false });
      const ring = new THREE.Mesh(tornadoGeo.ring, ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.5;
      const funMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
      const funnel = new THREE.Mesh(tornadoGeo.funnel, funMat);
      g.add(ring, funnel);
      g.userData = { ring, funnel, ringMat, funMat };
      scene.add(g);
      f.tornadoFx = g;
      return g;
    };

    const doJump = (f, dirX, dirZ) => {
      if (f.jumps <= 0 || f.stun > 0 || f.pounding) return false;
      const first = f.jumps === 2 && f.mesh.position.y <= 0.05;
      f.vy = first ? 16 : 15;
      if (!first) {
        // double jump: also a horizontal burst so you can recover from the edge
        f.vx = f.vx * 0.4 + dirX * 14;
        f.vz = f.vz * 0.4 + dirZ * 14;
        burst(f.mesh.position.x, f.mesh.position.y + 0.3, f.mesh.position.z, '#e2e8f0', 8, 5);
      }
      f.jumps -= 1;
      f.squash = 0.4;
      sfx.play('pop', f.isLocal ? 0.9 : volAt(f.mesh.position) * 0.5, first ? 0.7 : 1.1);
      return true;
    };

    const onKeyDown = (e) => {
      const code = e.code;
      keysRef.current[code] = true;
      if (code === 'Space') {
        e.preventDefault();
        if (!e.repeat) actionTriggerRef.current.jump = true;
      } else if (code === 'KeyE') {
        actionTriggerRef.current.smash = true;
      } else if (code === 'ShiftLeft' || code === 'ShiftRight') {
        if (!e.repeat) actionTriggerRef.current.dash = true;
      } else if (code === 'KeyC') {
        actionTriggerRef.current.cannon = true;
      } else if (code === 'KeyT' || code === 'KeyX' || code === 'KeyQ') {
        actionTriggerRef.current.ult = true;
      } else if (code === 'KeyM') {
        const m = !sfx.isMuted();
        sfx.setMuted(m);
        setMuted(m);
      }
    };
    const onKeyUp = (e) => {
      keysRef.current[e.code] = false;
    };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    const clearKeys = () => { keysRef.current = {}; };
    window.addEventListener('blur', clearKeys);
    sfx.startMusic();
    sfx.onTrack(name => pushKillFeed(`🎵 Now playing: ${name}`, '#c084fc'));
    const blockGesture = ev => {
      if (ev.target && ev.target.closest && ev.target.closest('[data-scroll]')) return;
      ev.preventDefault();
    };
    document.addEventListener('gesturestart', blockGesture);
    document.addEventListener('touchmove', blockGesture, { passive: false });

    const animate = (now) => {
      animationFrameId = requestAnimationFrame(animate);
      const rawDt = Math.max(0, Math.min((now - prevTime) / 1000, 0.1));
      prevTime = now;
      let dt = rawDt;
      if (fx.hitStop > 0) {
        fx.hitStop -= rawDt;
      }
      if (fx.slowmo > 0) {
        fx.slowmo -= rawDt;
      }
      if (fx.liqTimer > 0) fx.liqTimer -= dt;
      if (fx.comboTimer > 0) fx.comboTimer -= rawDt;

      cdState.dash = Math.max(0, cdState.dash - dt);
      cdState.cannon = Math.max(0, cdState.cannon - dt);
      perf.acc += rawDt; perf.n += 1; perf.t += rawDt;
      if (perf.t > 2) {
        const avg = perf.acc / Math.max(1, perf.n);
        if (perf.warm > 0) perf.warm -= perf.t;
        else if (avg > 1 / 42 && perf.pr > 0.7) setPR(perf.pr - 0.15);
        else if (avg < 1 / 57 && perf.pr < perf.max) setPR(Math.min(perf.max, perf.pr + 0.1));
        perf.acc = 0; perf.n = 0; perf.t = 0;
      }
      cdState.smash = Math.max(0, cdState.smash - dt);

      // ---------- match clock ----------
      const frozen = match.countdown > 0 || match.over;
      if (match.countdown > 0) match.countdown -= rawDt;
      else if (!match.over) {
        match.left -= dt;
        if (!matchRef.finalRush && match.left <= 30) {
          matchRef.finalRush = true;
          announceNow('FINAL 30s! KNOCKBACK x1.5', '#f97316');
          sfx.setRush(true);
          setArenaEventText('🔥 FINAL RUSH: EVERY HIT KNOCKS 1.5x FURTHER!');
          sfx.play('streak');
        }
        if (match.left <= 0) {
          match.over = true;
          const board = [...fighters]
            .map(f => ({ id: f.id, name: f.name, isLocal: f.isLocal, color: f.gangColor, kos: f.kos, deaths: f.deaths || 0, gang: f.minions.length + 1 }))
            .sort((a, b) => b.kos - a.kos || a.deaths - b.deaths || b.gang - a.gang);
          const myRank = board.findIndex(b => b.isLocal) + 1;
          announceNow(myRank === 1 ? 'VICTORY! 🏆' : 'TIME!', myRank === 1 ? '#facc15' : '#ffffff');
          sfx.play(myRank === 1 ? 'streak' : 'ko');
          const xpRes = awardXp({ kills: localFighter.kos, deaths: localFighter.deaths || 0, won: myRank === 1, bestStreak: localFighter.maxStreak || 0 });
          const storyRes = storyEval(storyRunRef.current, { game: 'beatdown', kills: localFighter.kos, ringouts: localFighter.ringouts || 0, bestStreak: localFighter.maxStreak || 0, won: myRank === 1, rank: myRank, whale: localFighter.whaleKOs || 0 });
          const party = !storyMode && livePeers().length > 0;
          setTimeout(() => setResults({ board, myRank, kos: localFighter.kos, ...stats, xp: xpRes, story: storyRes, party }), 1600);
        }
      }
      if (frozen) {
        actionTriggerRef.current.smash = false;
        actionTriggerRef.current.jump = false;
        actionTriggerRef.current.dash = false;
        actionTriggerRef.current.cannon = false;
        actionTriggerRef.current.ult = false;
      }

      // ---------- rug pull ----------
      if (rug) {
        rug.t -= dt;
        if (rug.phase === 'warn') {
          const k = 1 - rug.t / 3; // cracks spread and brighten as the collapse nears
          rug.mat.opacity = (0.25 + k * 0.6) * (0.7 + Math.sin(now * (0.012 + k * 0.03)) * 0.3);
          if (Math.random() < 0.3 + k * 0.6) {
            const [ex, ez] = sectorPoint();
            burst(ex, 0.15, ez, Math.random() < 0.5 ? '#ff7a2a' : '#ffb347', 1, 1.2);
          }
          const lp = localFighter.mesh.position;
          if (Math.hypot(lp.x, lp.z) > RUG_INNER - 4) fx.shake = Math.max(fx.shake, 0.1 + k * 0.25);
          if (rug.t <= 0) {
            openRug();
            rug.phase = 'open';
            rug.t = 6;
            fx.shake = Math.min(1.6, fx.shake + 0.9);
            sfx.play('ko', 0.7);
            setArenaEventText('🕳️ RUG PULLED! THE FLOOR IS GONE!');
          }
        } else if (rug.phase === 'open') {
          if (rug.slab) {
            rug.slabVy -= 30 * dt;
            rug.slab.position.y += rug.slabVy * dt;
            rug.slab.rotation.z += rug.spin * dt;
            rug.slab.rotation.x = -Math.PI / 2 + Math.min(0.5, -rug.slab.position.y * 0.012);
            if (rug.slab.position.y < -45) {
              scene.remove(rug.slab);
              rug.slab = null;
            }
          }
          rug.vortex.material.rotation += 0.6 * dt;
          rug.edgeMat.opacity = 0.6 + Math.sin(now * 0.02) * 0.4;
          if (Math.random() < 0.35) {
            const [ex, ez] = sectorPoint();
            burst(ex, -1.5, ez, '#ff6a2a', 1, 1.5);
          }
          if (rug.t <= 0) {
            if (rug.slab) scene.remove(rug.slab);
            rug.slab = makeSlab();
            rug.slab.position.y = -16;
            rug.phase = 'close';
            rug.t = 1.4;
            setArenaEventText('🪨 THE FLOOR IS RISING BACK...');
          }
        } else {
          rug.slab.position.y += (-2.98 - rug.slab.position.y) * Math.min(1, 5 * dt);
          if (rug.t <= 0) {
            scene.remove(rug.slab);
            rug.extras.forEach(o => scene.remove(o));
            rug = null;
            fx.shake = Math.min(1.6, fx.shake + 0.3);
            setArenaEventText('✅ FLOOR RESTORED • KEEP SWINGING!');
          }
        }
      }

      if (net.isHost && !frozen) {
        const whaleAlive = fighters.some(f => f.isWhale);
        if (!whaleAlive) whaleTimer -= dt;
        if (whaleTimer <= 0 && !whaleAlive) {
          whaleTimer = whaleHunt ? 35 : 75;
          {
            const w = createFighterEntity(`${myIdRef.current}_whale`, '🐋 THE WHALE', PANDA_CLASSES[2], false, true, Math.random() * 6.28, 3);
            w.mesh.position.set(0, 22, 0);
            makeWhale(w);
            fighters.push(w);
          }
        }
      }

      powerTimer += dt;
      if (powerTimer > 8) {
        powerTimer = 0;
        spawnPowerup();
      }
      for (let i = powerups.length - 1; i >= 0; i--) {
        const pu = powerups[i];
        pu.icon.position.y = 1.9 + Math.sin(now * 0.004 + pu.ph) * 0.35;
        pu.grp.rotation.y += dt;
        const taker = fighters.find(f => (f.isLocal || f.isBot) && f.mesh.position.distanceTo(pu.grp.position) < 2.6);
        if (taker) {
          applyPowerup(taker, pu.type);
          scene.remove(pu.grp);
          disposeObj(pu.grp);
          powerups.splice(i, 1);
        }
      }

      const beat = Math.pow(1 - ((now / 1000) * (124 / 60)) % 1, 3);
      pillarMats.forEach((m, i) => (m.emissiveIntensity = 1.8 + Math.sin(now * 0.017 + i * 1.7) * 0.5 + Math.sin(now * 0.041 + i) * 0.3 + beat * 0.8));
      shafts.forEach(sh => (sh.sm.opacity = sh.base * (0.75 + Math.sin(now * 0.0007 + sh.ph) * 0.25)));
      mists.forEach(m => {
        m.a += m.sp * dt;
        m.mist.position.x = Math.cos(m.a) * 30;
        m.mist.position.z = Math.sin(m.a) * 30;
      });
      dust.rotation.y += 0.01 * dt;
      dust.position.y = Math.sin(now * 0.0003) * 0.6;
      candles.forEach(c => (c.grp.position.y = c.base + Math.sin(now * 0.0006 + c.ph) * 1.5));
      asteroids.forEach(a => {
        a.rock.rotation.x += a.spin * dt;
        a.rock.rotation.y += a.spin * 0.7 * dt;
        a.rock.position.y += Math.sin(now * 0.0005 + a.ph) * 0.01;
      });
      bumpers.forEach(b => {
        b.pulse = Math.max(0, b.pulse - dt * 4);
        const sc = 1 + b.pulse * 0.25;
        b.grp.scale.set(sc, 1 + b.pulse * 0.1, sc);
        b.mat.emissiveIntensity = 0.35 + b.pulse * 3;
      });

      hazardTimer += dt;
      if (hazardTimer > 16) {
        hazardTimer = 0;
        spawnWildPanda();
        spawnWildPanda();
        const roll = Math.random();
        if (roll < 0.4 && !rug) {
          startRug();
        } else if (roll < 0.7) {
          fx.liqTimer = 10;
          setArenaEventText('⚡ LIQUIDATION CANDLE: KNOCKBACK +35% FOR 10s!');
        } else {
          setArenaEventText('🌕 FULL MOON AIRDROP: +2 WILD PANDAS SPAWNED!');
        }
      }

      let moveX = 0;
      let moveZ = 0;
      if (keysRef.current['KeyW'] || keysRef.current['ArrowUp']) moveZ -= 1;
      if (keysRef.current['KeyS'] || keysRef.current['ArrowDown']) moveZ += 1;
      if (keysRef.current['KeyA'] || keysRef.current['ArrowLeft']) moveX -= 1;
      if (keysRef.current['KeyD'] || keysRef.current['ArrowRight']) moveX += 1;

      if (joystickRef.current.active) {
        const jx = joystickRef.current.dx, jy = joystickRef.current.dy, jl = Math.hypot(jx, jy);
        if (jl > 0.14) {
          // small dead zone + smooth ramp so tiny thumb wobbles don't jitter the panda
          const k = Math.min(1, (jl - 0.14) / 0.86) / jl;
          moveX += jx * k;
          moveZ += jy * k;
        }
      }
      if (frozen) {
        moveX = 0;
        moveZ = 0;
      }

      const moveLen = Math.hypot(moveX, moveZ);
      const localAirborne = localFighter.mesh.position.y > 0.05;
      if (actionTriggerRef.current.jump) {
        const jl = moveLen > 0.01 ? moveLen : 1;
        let jx = moveX / jl, jz = moveZ / jl;
        if (moveLen <= 0.01) {
          // no input: double jump drifts back toward the centre
          const r = Math.hypot(localFighter.mesh.position.x, localFighter.mesh.position.z) || 1;
          jx = r > ARENA_RADIUS - 3 ? -localFighter.mesh.position.x / r : 0;
          jz = r > ARENA_RADIUS - 3 ? -localFighter.mesh.position.z / r : 0;
        }
        doJump(localFighter, jx, jz);
      }
      actionTriggerRef.current.jump = false;

      if (localFighter.dashT > 0) {
        // mid-dash: keep the burst
      } else if (localFighter.stun > 0 || localAirborne) {
        // knocked: little control. jumping: decent air control for recovery
        const airCtl = localFighter.stun > 0 ? 9 : 26;
        if (moveLen > 0.01) {
          localFighter.vx += (moveX / moveLen) * airCtl * dt;
          localFighter.vz += (moveZ / moveLen) * airCtl * dt;
          const cap = 16;
          const hs = Math.hypot(localFighter.vx, localFighter.vz);
          if (localFighter.stun <= 0 && hs > cap) {
            localFighter.vx *= cap / hs;
            localFighter.vz *= cap / hs;
          }
        }
      } else if (moveLen > 0.01) {
        const speedBoost = (localFighter.swarmTimer > 0 ? 1.48 : 1.0) * (localFighter.tornadoT > 0 ? 1.3 : 1);
        const speed = 13.5 * localFighter.pandaClass.speed * speedBoost * (localFighter.buffs.speed > 0 ? 1.45 : 1);
        localFighter.vx += ((moveX / moveLen) * speed - localFighter.vx) * 10 * dt;
        localFighter.vz += ((moveZ / moveLen) * speed - localFighter.vz) * 10 * dt;
      } else {
        localFighter.vx *= Math.pow(0.08, dt);
        localFighter.vz *= Math.pow(0.08, dt);
      }

      // ---------- input buffer ----------
      // A tap stays "live" for a short window, so a press made during the last bit of a
      // cooldown, a hit-stun or a dropped frame still fires as soon as it can.
      const netEvents = [];
      const at = actionTriggerRef.current;
      ['smash', 'dash', 'cannon'].forEach(k => {
        if (at[k]) { pressBuf[k] = now; at[k] = false; }
      });
      const live = k => now - pressBuf[k] < INPUT_BUFFER_MS[k];
      const used = k => { pressBuf[k] = -1e9; };
      const tumbling = localFighter.stun > 0 && localAirborne;

      if (live('smash') && !frozen) {
        if (localFighter.weapon) {
          useWeapon(localFighter);
          used('smash');
        } else if (cdState.smash <= 0 && !tumbling) {
          used('smash');
          cdState.smash = CD_MAX.smash;
          netEvents.push('smash');
          if (localAirborne) {
            // GROUND POUND: slam straight down, bigger blast on landing
            localFighter.pounding = true;
            localFighter.vy = -48;
            localFighter.vx *= 0.15;
            localFighter.vz *= 0.15;
            sfx.play('fall', 0.6);
          } else {
            doSmash(localFighter, 12, 1, '💥 GMI SMASH!');
          }
        }
      }

      if (live('dash') && !frozen && cdState.dash <= 0 && !tumbling) {
        used('dash');
        cdState.dash = CD_MAX.dash;
        // dashing out of a ground stun is allowed: it is your escape button
        if (localFighter.stun > 0) localFighter.stun = Math.min(localFighter.stun, 0.05);
        let ddx = moveX, ddz = moveZ;
        const dl = Math.hypot(ddx, ddz);
        if (dl > 0.01) { ddx /= dl; ddz /= dl; } else [ddx, ddz] = forwardOf(localFighter);
        doDash(localFighter, ddx, ddz);
        netEvents.push('dash');
      }

      if (live('cannon') && !frozen && cdState.cannon <= 0) {
        used('cannon');
        if (localFighter.minions.length > 0) {
          // aim with the stick when it is held, otherwise the way you face
          if (moveLen > 0.2) localFighter.mesh.rotation.y = Math.atan2(moveX, moveZ);
        }
        if (fireCannon(localFighter)) {
          cdState.cannon = CD_MAX.cannon;
          netEvents.push('cannon');
        } else {
          cdState.cannon = 0.6;
          spawnMemeSprite(localFighter.mesh.position.x, 2.2, localFighter.mesh.position.z, 'NO GANG TO THROW 😅 · walk into grey pandas', '#94a3b8');
        }
      }

      // a press that ran out of time without firing: tell the player why, once
      ['smash', 'dash', 'cannon'].forEach(k => {
        if (pressBuf[k] > 0 && !live(k)) {
          used(k);
          if (frozen || now - lastDeniedAt < 700) return;
          lastDeniedAt = now;
          const why = tumbling ? 'STUNNED 💫' : `${k === 'cannon' ? 'THROW' : k.toUpperCase()} ${Math.max(0.1, cdState[k]).toFixed(1)}s ⏳`;
          spawnMemeSprite(localFighter.mesh.position.x, 2.4, localFighter.mesh.position.z, why, '#cbd5e1');
        }
      });
      if (actionTriggerRef.current.ult && !frozen) {
        if (ult.v >= 100) {
          ult.v = 0;
          startTornado(localFighter);
          netEvents.push('tornado');
        } else spawnMemeSprite(localFighter.mesh.position.x, 2.2, localFighter.mesh.position.z, `🌪️ ${Math.floor(ult.v)}% · keep brawling`, '#7dd3fc');
      }
      actionTriggerRef.current.ult = false;

      let currentBeatdownBanner = null;

      fighters.forEach((f, idx) => {
        if (f.swarmTimer > 0) f.swarmTimer -= dt;
        if (f.dashT > 0) {
          f.dashT -= dt;
          const fp = f.mesh.position;
          burst(fp.x, fp.y + 0.9, fp.z, f.gangColor, 2, 2.5);
          if (f.isLocal || f.isBot) {
            fighters.forEach(o => {
              if (o.id === f.id || f.dashHit[o.id]) return;
              const dx = o.mesh.position.x - fp.x, dz = o.mesh.position.z - fp.z, d = Math.hypot(dx, dz);
              if (d < 2.9 && d > 0.01 && Math.abs(o.mesh.position.y - fp.y) < 2.5) {
                f.dashHit[o.id] = 1;
                launch(o, f, f.dashDir[0] * 0.65 + (dx / d) * 0.35, f.dashDir[1] * 0.65 + (dz / d) * 0.35, 12, 7, 11);
                if (f.isLocal) spawnMemeSprite(o.mesh.position.x, 2.2, o.mesh.position.z, '🐂 BULLDOZED!', '#fde68a');
              }
            });
          }
          if (f.dashT <= 0) { f.vx *= 0.35; f.vz *= 0.35; }
        }
        if (f.tornadoT > 0) {
          f.tornadoT -= dt;
          const tfx = ensureTornadoFx(f);
          const fp = f.mesh.position;
          tfx.visible = f.tornadoT > 0;
          tfx.position.set(fp.x, Math.max(0, fp.y), fp.z);
          tfx.rotation.y += 9 * dt;
          const fade = Math.min(1, f.tornadoT / 0.6, (5 - f.tornadoT) / 0.3);
          tfx.userData.ringMat.opacity = 0.55 * fade;
          tfx.userData.funMat.opacity = (0.1 + Math.sin(now * 0.02) * 0.03) * fade;
          tfx.scale.setScalar(0.85 + Math.sin(now * 0.012) * 0.08);
          if (Math.random() < 0.6) burst(fp.x + (Math.random() - 0.5) * 7, 0.3, fp.z + (Math.random() - 0.5) * 7, '#bae6fd', 1, 3);
          if (f.isLocal || f.isBot) {
            fighters.forEach(o => {
              if (o.id === f.id) return;
              const dx = o.mesh.position.x - fp.x, dz = o.mesh.position.z - fp.z, d = Math.hypot(dx, dz);
              if (d < 4.8 && d > 0.01 && (!f.tornadoHit[o.id] || now - f.tornadoHit[o.id] > 420)) {
                f.tornadoHit[o.id] = now;
                const tx = -dz / d, tz = dx / d;
                launch(o, f, (dx / d) * 0.75 + tx * 0.45, (dz / d) * 0.75 + tz * 0.45, 13, 12, 9);
              }
            });
            for (let wi = wildMinions.length - 1; wi >= 0 && f.minions.length < 16; wi--) {
              const wm = wildMinions[wi];
              if (wm.mesh.position.distanceTo(fp) < 5.5) {
                releasePanda(wm.mesh);
                wildMinions.splice(wi, 1);
                addMinionToFighter(f);
              }
            }
          }
        } else if (f.tornadoFx && f.tornadoFx.visible) f.tornadoFx.visible = false;
        if (f.isBot && !frozen && f.stun <= 0 && f.minions.length >= 3 && Math.random() < 0.1 * dt) fireCannon(f);
        if (f.punchAnim > 0) f.punchAnim -= dt;
        if (f.stun > 0) f.stun -= dt;
        if (f.punchCd > 0) f.punchCd -= dt;
        if (f.squash > 0) f.squash = Math.max(0, f.squash - dt * 4);
        if (f.respawnLock > 0) f.respawnLock -= dt;
        if (f.weapon) {
          if (f.weapon.cd > 0) f.weapon.cd -= dt;
          if (f.weapon.swing > 0) {
            f.weapon.swing -= dt;
            f.mesh.userData.rightArmGroup.rotation.x = -Math.sin((f.weapon.swing / 0.3) * Math.PI) * 1.6;
          } else {
            f.mesh.userData.rightArmGroup.rotation.x = 0;
          }
          if (f.isBot && !frozen && f.stun <= 0) {
            let near = null, nd = 999;
            fighters.forEach(o => {
              if (o.id === f.id) return;
              const d = o.mesh.position.distanceTo(f.mesh.position);
              if (d < nd) { nd = d; near = o; }
            });
            if (near && ((f.weapon.kind === 'hammer' && nd < 5) || (f.weapon.kind === 'launcher' && nd < 26 && nd > 5))) {
              f.mesh.rotation.y = Math.atan2(near.mesh.position.x - f.mesh.position.x, near.mesh.position.z - f.mesh.position.z);
              if (Math.random() < 4.8 * dt) useWeapon(f);
            }
          }
        }
        if (f.buffs.speed > 0) f.buffs.speed -= dt;
        if (f.buffs.armor > 0) f.buffs.armor -= dt;
        if (f.buffs.pump > 0) f.buffs.pump -= dt;
        f.bubble.visible = f.buffs.armor > 0;
        if (f.bubble.visible) f.bubble.material.opacity = 0.2 + Math.sin(now * 0.01) * 0.08;

        if (f.isBot && frozen) {
          f.vx *= Math.exp(-6 * dt);
          f.vz *= Math.exp(-6 * dt);
        } else if (f.isBot) {
          // recovery: double jump back toward the arena when falling off
          const bp = f.mesh.position;
          const br = Math.hypot(bp.x, bp.z);
          if ((br > ARENA_RADIUS || inRug(bp)) && f.vy < 0 && bp.y < 1.5 && f.jumps > 0 && f.stun <= 0) {
            doJump(f, -bp.x / (br || 1), -bp.z / (br || 1));
          }
          f.aiTimer -= dt;
          if (f.aiTimer <= 0) {
            if (Math.random() < 0.12) doJump(f, 0, 0);
            f.aiTimer = 0.6 + Math.random() * 0.6;
            const distFromCenter = Math.hypot(f.mesh.position.x, f.mesh.position.z);
            if (distFromCenter > ARENA_RADIUS - 7) {
              f.aiDirX = -f.mesh.position.x / distFromCenter;
              f.aiDirZ = -f.mesh.position.z / distFromCenter;
            } else {
              let bestTarget = localFighter;
              let minDist = 999;
              fighters.forEach(cand => {
                if (cand.id === f.id) return;
                const d = f.mesh.position.distanceTo(cand.mesh.position);
                if (d < minDist) {
                  minDist = d;
                  bestTarget = cand;
                }
              });
              const dx = bestTarget.mesh.position.x - f.mesh.position.x;
              const dz = bestTarget.mesh.position.z - f.mesh.position.z;
              const l = Math.hypot(dx, dz) || 1;
              f.aiDirX = dx / l;
              f.aiDirZ = dz / l;

              // bots use the new moves too (the Whale is too heavy to dash or spin)
              if (!f.isWhale && f.stun <= 0) {
                if (f.botUltAt === undefined) f.botUltAt = now + 25000 + Math.random() * 25000;
                if (!(f.dashT > 0) && now > (f.botDashAt || 0) && minDist > 3 && minDist < 11 && Math.random() < Math.min(0.5, BOT_AGGRO * 0.9)) {
                  f.botDashAt = now + 2600 + Math.random() * 2400;
                  doDash(f, f.aiDirX, f.aiDirZ);
                }
                if (!(f.tornadoT > 0) && now > f.botUltAt) {
                  const close = fighters.filter(o => o.id !== f.id && o.mesh.position.distanceTo(f.mesh.position) < 5.5).length;
                  if (close >= 2 || (close >= 1 && Math.random() < 0.25)) {
                    startTornado(f);
                    f.botUltAt = now + 40000 + Math.random() * 25000;
                  }
                }
              }

              if (minDist < 6.5 && Math.random() < BOT_AGGRO && f.stun <= 0) {
                f.punchAnim = 0.35;
                triggerShockwave(f.mesh.position.x, f.mesh.position.z, f.gangColor, 6.5);
                sfx.play('smash', volAt(f.mesh.position) * 0.45);
                fighters.forEach(victim => {
                  if (victim.id === f.id) return;
                  const vdx = victim.mesh.position.x - f.mesh.position.x;
                  const vdz = victim.mesh.position.z - f.mesh.position.z;
                  const vd = Math.hypot(vdx, vdz);
                  if (victim.mesh.position.y > 1.6) return;
                  if (vd < 6.5 && vd > 0.01) launch(victim, f, vdx / vd, vdz / vd, 5 + 5 * (1 - vd / 6.5), 6, 9);
                });
              }
            }
          }
          if (f.stun <= 0 && f.mesh.position.y <= 0.05) {
            const botSpeed = 9.8 * BOT_SPEED * f.pandaClass.speed * (f.buffs.speed > 0 ? 1.45 : 1);
            f.vx += ((f.aiDirX || 0) * botSpeed - f.vx) * 4 * dt;
            f.vz += ((f.aiDirZ || 0) * botSpeed - f.vz) * 4 * dt;
          }
        } else if (!f.isLocal && f.targetX !== undefined) {
          const ox = f.mesh.position.x, oz = f.mesh.position.z;
          f.mesh.position.x += (f.targetX - f.mesh.position.x) * 12 * dt;
          f.mesh.position.z += (f.targetZ - f.mesh.position.z) * 12 * dt;
          f.mesh.position.y += ((f.targetY || 0) - f.mesh.position.y) * 12 * dt;
          f.vx = (f.mesh.position.x - ox) / Math.max(dt, 0.001);
          f.vz = (f.mesh.position.z - oz) / Math.max(dt, 0.001);
        }

        if (f.isLocal || f.isBot) {
          const pos = f.mesh.position;
          pos.x += f.vx * dt;
          pos.z += f.vz * dt;
          pos.y += f.vy * dt;
          f.vy -= 38 * dt;
          const onArena = Math.hypot(pos.x, pos.z) <= ARENA_RADIUS + 0.4 && !inRug(pos) && pos.y > -2.5;
          const airborne = pos.y > 0.05;

          if (onArena && pos.y <= 0 && f.vy <= 0 && f.pounding) {
            f.pounding = false;
            pos.y = 0;
            f.vy = 0;
            f.jumps = 2;
            f.squash = 1;
            doSmash(f, 9.5, 1.3, '⬇️ GROUND POUND!');
          } else if (onArena && pos.y <= 0 && f.vy <= 0 && f.vy > -9) {
            pos.y = 0;
            f.vy = 0;
            f.jumps = 2;
          } else if (onArena && pos.y <= 0 && f.vy <= 0 && f.stun <= 0) {
            // normal landing from a jump: little squash, no bounce
            pos.y = 0;
            f.vy = 0;
            f.jumps = 2;
            f.squash = 0.35;
          } else if (onArena && pos.y <= 0 && f.vy <= 0) {
            if (f.vy < -9) {
              // BOUNCE
              const impact = -f.vy;
              f.vy = impact * 0.5;
              pos.y = 0;
              f.squash = Math.min(1, impact / 22);
              burst(pos.x, 0.3, pos.z, '#e2e8f0', 5, 6);
              if (f.isLocal) fx.shake = Math.min(1.6, fx.shake + impact / 60);
              if (impact > 12) sfx.play('bounce', f.isLocal ? 1 : volAt(pos) * 0.7, 0.8 + Math.random() * 0.4);
            } else {
              pos.y = 0;
              f.vy = 0;
            }
          }

          // friction: air keeps momentum, stunned bodies slide, everyone else is steered above
          if (airborne) {
            f.vx *= Math.exp(-1.0 * dt);
            f.vz *= Math.exp(-1.0 * dt);
          } else if (f.stun > 0) {
            f.vx *= Math.exp(-1.8 * dt);
            f.vz *= Math.exp(-1.8 * dt);
          }

          if (!onArena && !f.fallSnd) {
            f.fallSnd = true;
            sfx.play('fall', f.isLocal ? 1 : volAt(pos));
          }

          // speed trail when launched hard
          const spd = Math.hypot(f.vx, f.vz);
          if (f.stun > 0 && spd > 16 && Math.random() < 0.7) burst(pos.x, pos.y + 1.2, pos.z, f.gangColor, 1, 1.5);

          // pinball bumpers
          if (pos.y < 2) {
            bumpers.forEach(b => {
              const bx = pos.x - b.x, bz = pos.z - b.z;
              const bd = Math.hypot(bx, bz);
              if (bd < 2.9 && bd > 0.01) {
                const nx = bx / bd, nz = bz / bd;
                const out = Math.max(24, spd * 1.15);
                f.vx = nx * out;
                f.vz = nz * out;
                f.vy = Math.max(f.vy, 9);
                f.stun = Math.max(f.stun, 0.45);
                pos.x = b.x + nx * 2.95;
                pos.z = b.z + nz * 2.95;
                b.pulse = 1;
                burst(pos.x, 1.2, pos.z, '#ffb070', 10, 9);
                sfx.play('bumper', f.isLocal ? 1 : volAt(pos) * 0.8);
                if (f.isLocal) fx.shake = Math.min(1.6, fx.shake + 0.5);
              }
            });
          }

          // tumble while flying
          if (airborne && f.stun > 0) {
            f.mesh.rotation.z += 9 * dt;
          } else {
            f.mesh.rotation.z *= Math.exp(-14 * dt);
          }
          const sq = f.squash;
          f.mesh.scale.set(f.baseScale * (1 + sq * 0.35), f.baseScale * (1 - sq * 0.4), f.baseScale * (1 + sq * 0.35));
        }

        if (Math.hypot(f.vx, f.vz) > 0.5 && !(f.stun > 0 && f.mesh.position.y > 0.05)) {
          const targetRot = Math.atan2(f.vx, f.vz);
          f.mesh.rotation.y = targetRot;
        }

        // refresh the name tag when damage changes
        const shownDmg = Math.round(f.dmg);
        if (shownDmg !== f.tag.shown) {
          f.tag.shown = shownDmg;
          drawNameTag(f.tag.canvas, f.name, f.dmg, f.gangColor, f.isLocal);
          f.tag.tex.needsUpdate = true;
        }
        f.tag.sprite.position.set(f.mesh.position.x, f.mesh.position.y + 5.9, f.mesh.position.z);
        if (f.crown && f.crown.visible) f.crown.rotation.y += 1.5 * dt;
        if (f.mesh.userData.youArrow) {
          f.mesh.userData.youArrow.position.y = 4.95 + Math.sin(now * 0.006) * 0.25;
          f.mesh.userData.youArrow.rotation.y += 3 * dt;
        }

        const ud = f.mesh.userData;
        if (ud) {
          ud.headGroup.position.y = 2.08 + Math.sin(now * 0.008 + idx) * 0.05;
          ud.rightArmGroup.position.z = f.punchAnim > 0 ? 0.65 : 0.2;
          ud.ringSpark.rotation.y += 4 * dt;
        }

        for (let w = wildMinions.length - 1; w >= 0 && (f.isLocal || f.isBot) && f.minions.length < 16; w--) {
          if (wildMinions[w].mesh.position.distanceTo(f.mesh.position) < 2.6) {
            releasePanda(wildMinions[w].mesh);
            wildMinions.splice(w, 1);
            addMinionToFighter(f);
            if (f.isLocal) {
              spawnMemeSprite(f.mesh.position.x, 1.4, f.mesh.position.z, '+1 PANDA GANG! 🐼', '#4ade80');
              sfx.play('pop', 0.8, 0.9 + Math.random() * 0.3);
            }
          }
        }

        fighters.forEach(enemy => {
          if (enemy.id === f.id) return;
          if (!enemy.isLocal && !enemy.isBot) return;
          const dx = enemy.mesh.position.x - f.mesh.position.x;
          const dz = enemy.mesh.position.z - f.mesh.position.z;
          const dist = Math.hypot(dx, dz);

          if (dist < 5.6 && dist > 0.01) {
            const gangCount = f.minions.length + 1;
            const enemyCount = enemy.minions.length + 1;

            const swarmBonus = f.swarmTimer > 0 ? 1.85 : 1.0;
            const surroundFactor = Math.max(1.0, (gangCount / Math.max(1, enemyCount)) * 1.35) * swarmBonus;

            if (dist < 3.6) {
              // light body push so gangs don't overlap
              const pushForce = 6 * surroundFactor * dt;
              enemy.vx += (dx / dist) * pushForce;
              enemy.vz += (dz / dist) * pushForce;
              enemy.lastHitBy = f;

              // gang punches: bigger gang + swarm = harder, faster hits
              if (f.punchCd <= 0 && f.stun <= 0) {
                f.punchCd = f.swarmTimer > 0 || f.tornadoT > 0 ? 0.3 : 0.6;
                f.punchAnim = 0.2;
                launch(enemy, f, dx / dist, dz / dist, 2.5 + 1.4 * surroundFactor, 3, 2 + 1.6 * surroundFactor);
              }

              if (gangCount >= enemyCount + 2 && Math.random() < 2.1 * dt) {
                const callout = MEME_CALLOUTS[Math.floor(Math.random() * MEME_CALLOUTS.length)];
                spawnMemeSprite(enemy.mesh.position.x, 1.5, enemy.mesh.position.z, callout, '#facc15');
                triggerShockwave(enemy.mesh.position.x, enemy.mesh.position.z, f.pandaClass.accent, 4.5);
                if (enemy.minions.length > 0 && Math.random() < 0.45) {
                  flingMinion(enemy, dx / dist, dz / dist);
                }
              }

              if ((f.isLocal || enemy.isLocal) && gangCount >= 4) {
                currentBeatdownBanner = `${f.name} (${gangCount}x Pandas) is SWARMING ${enemy.name}!`;
              }
            }
          }
        });

        const totalMinions = f.minions.length;
        const spin = f.tornadoT > 0;
        const follow = 1 - Math.exp(-(spin ? 14 : 9) * dt);
        f.minions.forEach((m, mIdx) => {
          const orbitAngle = (now * (spin ? 0.011 : 0.0032 * (f.swarmTimer > 0 ? 2.2 : 1))) + (mIdx * Math.PI * 2) / Math.max(1, totalMinions);
          const orbitRadius = spin ? 3.6 : f.swarmTimer > 0 ? 3.2 : 2.15 + (mIdx % 2) * 0.75;
          const targetMX = f.mesh.position.x + Math.cos(orbitAngle) * orbitRadius;
          const targetMZ = f.mesh.position.z + Math.sin(orbitAngle) * orbitRadius;

          m.mesh.position.x += (targetMX - m.mesh.position.x) * follow;
          m.mesh.position.z += (targetMZ - m.mesh.position.z) * follow;
          m.mesh.position.y = spin
            ? Math.max(f.mesh.position.y * 0.6, 0) + 0.8 + Math.sin(now * 0.008 + mIdx * 1.3) * 1.1
            : Math.max(f.mesh.position.y * 0.6, 0) + Math.abs(Math.sin(now * 0.012 + mIdx)) * 0.28;
          m.mesh.rotation.y = spin ? m.mesh.rotation.y + 14 * dt : f.mesh.rotation.y;
        });

        if ((f.isLocal || f.isBot) && !Number.isFinite(f.mesh.position.x + f.mesh.position.y + f.mesh.position.z + f.vx + f.vy + f.vz)) {
          // safety net: a bad number must never make a fighter vanish forever
          f.mesh.position.set(0, 16, 0);
          f.vx = 0; f.vy = 0; f.vz = 0;
        }
        const fellOut = (f.isLocal || f.isBot) && f.mesh.position.y < -14;
        if (fellOut) {
          // credit only goes to whoever hit you in the last 5 seconds; otherwise it's a self-destruct
          const killer = f.lastHitBy && now - (f.lastHitAt || 0) < 5000 ? f.lastHitBy : null;
          f.deaths = (f.deaths || 0) + 1;
          if (f.isLocal) setMyDeaths(f.deaths);
          if (f.isWhale) f.removeMe = true;
          if (killer && killer.id !== f.id) {
            if (killer.isLocal || killer.isBot) {
              creditKO(killer, f.name, f.mesh.position.x, f.mesh.position.z, f.streak || 0, !!f.isWhale);
            } else {
