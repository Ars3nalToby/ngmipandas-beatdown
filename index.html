              send({ t: 'k', id: myIdRef.current, killer: killer.id, kn: killer.name, vn: f.name, vx: f.mesh.position.x, vz: f.mesh.position.z, vs: f.streak || 0, vw: f.isWhale ? 1 : 0 });
              pushKillFeed(`💥 ${killer.name}'s gang RINGED OUT ${f.name}!`, '#facc15');
            }
          } else {
            pushKillFeed(`🌌 ${f.name} fell into Deep Space!`, '#f87171');
          }

          spawnMemeSprite(f.mesh.position.x * 0.85, 2.2, f.mesh.position.z * 0.85, 'LIQUIDATED! 💀', '#ef4444');
          sfx.play('ko', (f.isLocal || (killer && killer.isLocal)) ? 1 : volAt(f.mesh.position) * 0.6);
          f.streak = 0;
          f.fallSnd = false;
          f.pounding = false;
          f.jumps = 2;
          dropWeapon(f);
          if (f.isLocal) stats.falls += 1;
          if (f.isLocal) announceNow('YOU GOT LIQUIDATED 💀', '#ef4444');

          burst(f.mesh.position.x, -2, f.mesh.position.z, f.gangColor, 30, 18);
          const respawnAngle = Math.random() * Math.PI * 2;
          f.mesh.position.set(Math.cos(respawnAngle) * 8, 16, Math.sin(respawnAngle) * 8);
          f.vx = 0;
          f.vy = 0;
          f.vz = 0;
          f.dmg = 0;
          f.stun = 0;
          f.respawnLock = 1.2;
          f.mesh.rotation.z = 0;
          f.lastHitBy = null;
          // losing a stock costs half your gang
          const lose = Math.floor(f.minions.length / 2);
          for (let k = 0; k < lose; k++) {
            const gone = f.minions.pop();
            releasePanda(gone.mesh);
          }
          if (f.isLocal) setMyGangSize(f.minions.length + 1);
        }
      });

      fighters.filter(f => f.removeMe).forEach(removeFighter);

      for (let i = cannonballs.length - 1; i >= 0; i--) {
        const cb = cannonballs[i];
        const cp = cb.mesh.position;
        cb.vy -= 16 * dt;
        cp.x += cb.vx * dt;
        cp.y += cb.vy * dt;
        cp.z += cb.vz * dt;
        cb.mesh.rotation.x += 16 * dt;
        cb.life -= dt;
        if (Math.random() < 0.8) burst(cp.x, cp.y, cp.z, cb.owner.gangColor, 1, 1.2);
        const owns = cb.owner.isLocal || cb.owner.isBot;
        const hit = owns ? fighters.find(o => o.id !== cb.owner.id && o.respawnLock <= 0 && Math.hypot(o.mesh.position.x - cp.x, o.mesh.position.z - cp.z) < 2.2 && Math.abs(o.mesh.position.y + 1.2 - cp.y) < 3) : null;
        if (hit || cb.life <= 0 || cp.y < 0.35) {
          triggerShockwave(cp.x, cp.z, 0xfacc15, 5);
          burst(cp.x, 1, cp.z, cb.owner.gangColor, 16, 12);
          burst(cp.x, 1, cp.z, '#ffffff', 8, 9);
          sfx.play('crit', cb.owner.isLocal || (hit && hit.isLocal) ? 0.9 : volAt(cp) * 0.6);
          if (owns) {
            fighters.forEach(o => {
              if (o.id === cb.owner.id) return;
              const dx = o.mesh.position.x - cp.x, dz = o.mesh.position.z - cp.z, d = Math.hypot(dx, dz);
              if (d < 3.8 && d > 0.01) launch(o, cb.owner, dx / d, dz / d, o === hit ? 21 : 12, 10, o === hit ? 20 : 9);
            });
            if (cb.owner.isLocal && hit) spawnMemeSprite(cp.x, 2.6, cp.z, '🐼💥 PANDA CANNON!', '#facc15');
          }
          debris.push({ mesh: cb.mesh, vx: -cb.vx * 0.2 + (Math.random() - 0.5) * 6, vy: 11, vz: -cb.vz * 0.2 + (Math.random() - 0.5) * 6, life: 1.4 });
          cannonballs.splice(i, 1);
        }
      }

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        pr.mesh.position.x += pr.vx * dt;
        pr.mesh.position.z += pr.vz * dt;
        pr.life -= dt;
        if (Math.random() < 0.8) burst(pr.mesh.position.x, pr.mesh.position.y, pr.mesh.position.z, '#ffb070', 1, 0.8);
        const hit = fighters.find(o => o.id !== pr.owner.id && Math.hypot(o.mesh.position.x - pr.mesh.position.x, o.mesh.position.z - pr.mesh.position.z) < 1.9);
        if (hit || pr.life <= 0) {
          explode(pr.mesh.position.x, pr.mesh.position.z, pr.owner);
          scene.remove(pr.mesh);
          disposeObj(pr.mesh);
          projectiles.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.vy -= 30 * dt;
        pt.m.position.x += pt.vx * dt;
        pt.m.position.y += pt.vy * dt;
        pt.m.position.z += pt.vz * dt;
        pt.m.rotation.x += 8 * dt;
        pt.life -= dt;
        pt.mat.opacity = Math.max(0, pt.life * 1.6);
        if (pt.life <= 0) {
          scene.remove(pt.m);
          partPool.push(pt.m);
          particles.splice(i, 1);
        }
      }

      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.vy -= 34 * dt;
        d.mesh.position.x += d.vx * dt;
        d.mesh.position.y += d.vy * dt;
        d.mesh.position.z += d.vz * dt;
        d.mesh.rotation.x += 11 * dt;
        d.mesh.rotation.z += 7 * dt;
        d.life -= dt;
        if (d.life <= 0 || d.mesh.position.y < -20) {
          releasePanda(d.mesh);
          debris.splice(i, 1);
        }
      }

      const lpw = localFighter.mesh.position;
      wildMinions.forEach(wm => {
        wm.mesh.position.y = Math.abs(Math.sin(now * 0.005 + wm.bobOffset)) * 0.25;
        // grey pandas near you waddle over to join (no button needed)
        const wdx = lpw.x - wm.mesh.position.x, wdz = lpw.z - wm.mesh.position.z, wd = Math.hypot(wdx, wdz);
        if (wd < 9 && wd > 0.1 && lpw.y < 2) {
          wm.mesh.position.x += (wdx / wd) * 5 * dt;
          wm.mesh.position.z += (wdz / wd) * 5 * dt;
          wm.mesh.rotation.y = Math.atan2(wdx, wdz);
        } else wm.mesh.rotation.y += 1.2 * dt;
      });

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.scale += 26 * dt;
        sw.mesh.scale.set(sw.scale, sw.scale, 1);
        sw.mat.opacity -= 1.9 * dt;
        if (sw.mat.opacity <= 0) {
          scene.remove(sw.mesh);
          sw.mat.dispose();
          shockwaves.splice(i, 1);
        }
      }

      for (let i = floatingMemes.length - 1; i >= 0; i--) {
        const fm = floatingMemes[i];
        fm.sprite.position.y += 3.2 * dt;
        fm.life -= 0.85 * dt;
        fm.mat.opacity = Math.max(0, fm.life);
        if (fm.life <= 0) {
          scene.remove(fm.sprite);
          if (fm.mat.map) fm.mat.map.dispose();
          fm.mat.dispose();
          floatingMemes.splice(i, 1);
        }
      }

      const clp = localFighter.mesh.position;
      const gangZoom = 1 + Math.min(0.16, localFighter.minions.length * 0.01) + (localFighter.tornadoT > 0 ? 0.08 : 0);
      const leadX = Math.max(-3, Math.min(3, localFighter.vx * 0.08));
      const leadZ = Math.max(-3, Math.min(3, localFighter.vz * 0.08));
      const camTargetX = (clp.x + leadX) * camCfg.follow;
      const camTargetZ = (clp.z + leadZ) * camCfg.follow + 29 * camCfg.zoom * gangZoom;
      const camTargetY = (localFighter.swarmTimer > 0 ? 22 : 27) * camCfg.zoom * gangZoom;
      const kPos = 1 - Math.exp(-5 * rawDt), kY = 1 - Math.exp(-3.5 * rawDt), kLook = 1 - Math.exp(-7 * rawDt);
      camera.position.x += (camTargetX - camera.position.x) * kPos;
      camera.position.z += (camTargetZ - camera.position.z) * kPos;
      camera.position.y += (camTargetY - camera.position.y) * kY;
      camLook.x += ((clp.x + leadX) * camCfg.look - camLook.x) * kLook;
      camLook.z += ((clp.z + leadZ) * camCfg.look - 3 - camLook.z) * kLook;
      camera.lookAt(camLook.x, 1.0, camLook.z);

      // ---- stage lights ----
      heroLight.position.set(clp.x, Math.max(0, clp.y) + 7, clp.z + 2);
      heroLight.intensity = 1.35 + (localFighter.tornadoT > 0 ? 0.8 : 0);
      impactLight.intensity = Math.max(0, impactLight.intensity - rawDt * 22);
      const rushK = match.finalRush ? 1 : 0;
      stageSpots.forEach((sp, si) => {
        const a = now * (0.00028 + rushK * 0.0005) * (si ? -1 : 1) + si * Math.PI;
        const rr = 9 + Math.sin(now * 0.0004 + si * 2) * 6;
        sp.target.position.set(Math.cos(a) * rr, 0, Math.sin(a) * rr);
        sp.light.color.setHex(rushK ? 0xff3b3b : sp.base);
        sp.beamMat.color.setHex(rushK ? 0xff3b3b : sp.base);
        const dir = sp.target.position.clone().sub(sp.light.position);
        const len = dir.length();
        sp.beam.scale.set(1, len, 1);
        sp.beam.quaternion.setFromUnitVectors(BEAM_DOWN, dir.normalize());
      });

      if (now - lastNetBroadcast > 66 || netEvents.length) {
        lastNetBroadcast = now;
        const r2 = v => Math.round(v * 100) / 100;
        const lp = localFighter.mesh.position;
        const pkt = { t: 's', id: myIdRef.current, name: playerName, c: selectedClass.id, cos: prof.cosmetic, x: r2(lp.x), y: r2(lp.y), z: r2(lp.z), d: Math.round(localFighter.dmg), m: localFighter.minions.length, k: localFighter.kos, dt: localFighter.deaths, st: localFighter.streak || 0, ev: netEvents.length ? netEvents.join(',') : null };
        if (net.isHost) {
          pkt.left = Math.round(match.left * 10) / 10;
          pkt.ov = match.over ? 1 : 0;
          pkt.b = fighters.filter(f => f.isBot).map(b => ({ i: b.id, n: b.name, c: b.pandaClass.id, x: r2(b.mesh.position.x), y: r2(b.mesh.position.y), z: r2(b.mesh.position.z), d: Math.round(b.dmg), m: b.minions.length, k: b.kos, dt: b.deaths, st: b.streak || 0 }));
        }
        send(pkt);
      }

      if (now - lastHudSync > 200) {
        lastHudSync = now;
        // only re-render the HUD when a value actually changed
        const cdNext = {
          smash: Number(cdState.smash.toFixed(1)),
          dash: Number(cdState.dash.toFixed(1)),
          cannon: Number(cdState.cannon.toFixed(1)),
          ult: Math.floor(ult.v)
        };
        setCooldowns(prevCd => (prevCd.smash === cdNext.smash && prevCd.dash === cdNext.dash && prevCd.cannon === cdNext.cannon && prevCd.ult === cdNext.ult ? prevCd : cdNext));
        setActiveBeatdownAlert(currentBeatdownBanner);
        setMyDmg(Math.round(localFighter.dmg));
        let holder = null;
        fighters.forEach(f => {
          if ((f.streak || 0) >= 3 && (!holder || f.streak > holder.streak)) holder = f;
        });
        fighters.forEach(f => {
          if (f === holder && !f.crown) {
            f.crown = makeCrown();
            f.crown.position.y = 3.05;
            f.mesh.add(f.crown);
            if (f.isLocal) announceNow('👑 YOU HAVE A BOUNTY ON YOUR HEAD', '#facc15');
          }
          if (f.crown) f.crown.visible = f === holder;
        });
        setMatchTime(Math.max(0, Math.ceil(match.left)));
        const b = localFighter.buffs;
        const hud = [];
        if (b.speed > 0) hud.push(`🍔 ${b.speed.toFixed(0)}s`);
        if (b.armor > 0) hud.push(`💎 ${b.armor.toFixed(0)}s`);
        if (b.pump > 0) hud.push(`🚀 ${b.pump.toFixed(0)}s`);
        if (localFighter.weapon) hud.push(`${localFighter.weapon.kind === 'hammer' ? '🔨' : '🧨'} x${localFighter.weapon.uses} · E`);
        setBuffHud(prevHud => (prevHud.length === hud.length && prevHud.every((x, i) => x === hud[i]) ? prevHud : hud));
        let nearest = 999;
        fighters.forEach(o => {
          if (o.id !== localFighter.id) nearest = Math.min(nearest, o.mesh.position.distanceTo(localFighter.mesh.position));
        });
        sfx.setIntensity(nearest < 8 || localFighter.swarmTimer > 0 ? 1 : nearest < 16 ? 0.5 : 0.1);

        Object.keys(remotePlayersRef.current).forEach(pid => {
          if (now - remotePlayersRef.current[pid].lastSeen > 5000) {
            delete remotePlayersRef.current[pid];
            pushKillFeed(`🔴 Player left the room`, '#94a3b8');
          }
        });
        [...fighters].forEach(f => {
          if (f.remote && now - (net.remoteSeen[f.id] || 0) > 5000) removeFighter(f);
        });
        // host = smallest id in the room; only the host runs the AI pandas
        const peers = storyMode ? [] : livePeers();
        const hostId = [myIdRef.current, ...peers].sort()[0];
        net.hostId = hostId;
        const amHost = hostId === myIdRef.current;
        if (amHost !== net.isHost) {
          net.isHost = amHost;
          if (!amHost) {
            fighters.filter(f => f.isBot).forEach(removeFighter);
            pushKillFeed('🔗 Synced with room host', '#38bdf8');
          }
        }
        if (net.isHost) {
          const myBots = fighters.filter(f => f.isBot && !f.isWhale);
          const want = botsWanted(1 + peers.length);
          if (myBots.length < want) spawnBots(want - myBots.length);
          else if (myBots.length > want) {
            // a friend joined: hand their slot over by retiring the bots furthest from the action
            myBots
              .sort((a, b) => Math.hypot(b.mesh.position.x, b.mesh.position.z) - Math.hypot(a.mesh.position.x, a.mesh.position.z))
              .slice(0, myBots.length - want)
              .forEach(removeFighter);
          }
        }
        setOnlinePeersCount(1 + Object.keys(remotePlayersRef.current).length);

        const sortedBoard = [...fighters]
          .map(f => ({
            id: f.id,
            name: f.name,
            isLocal: f.isLocal,
            isBot: f.isBot,
            kos: f.kos,
            deaths: f.deaths || 0,
            gangSize: f.minions.length + 1,
            score: f.kos * 100 - (f.deaths || 0) * 40 + (f.minions.length + 1) * 3
          }))
          .sort((a, b) => b.score - a.score);
        setLeaderboard(sortedBoard);
      }

      let shakeX = 0, shakeY = 0;
      if (fx.shake > 0.01) {
        shakeX = (Math.random() - 0.5) * fx.shake * 1.4;
        shakeY = (Math.random() - 0.5) * fx.shake * 1.4;
        fx.shake *= Math.exp(-7 * rawDt);
      }
      camera.position.x += shakeX;
      camera.position.y += shakeY;
      if (post) {
        post.comp.uniforms.flash.value = fx.postFlash;
        fx.postFlash = Math.max(0, fx.postFlash - rawDt * 3);
        post.render(now * 0.001);
      } else {
        renderer.render(scene, camera);
      }
      if (bdClipRef.current) bdClipRef.current.frame();
      camera.position.x -= shakeX;
      camera.position.y -= shakeY;
    };

    animationFrameId = requestAnimationFrame(animate);

    const post = GFX_CINEMATIC ? createPost(renderer, scene, camera) : null;
    const handleResize = () => {
      if (!mountRef.current) return;
      const w = mountRef.current.clientWidth || window.innerWidth;
      const h = mountRef.current.clientHeight || window.innerHeight;
      fitCamera(w, h);
      renderer.setSize(w, h);
      if (post) post.setSize();
    };
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);

    return () => {
      netCancelled = true;
      cancelAnimationFrame(animationFrameId);
      if (bdClipRef.current) { bdClipRef.current.destroy(); bdClipRef.current = null; }
      sfx.stopMusic();
      window.removeEventListener('blur', clearKeys);
      document.removeEventListener('gesturestart', blockGesture);
      document.removeEventListener('touchmove', blockGesture);
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('resize', handleResize);
      window.removeEventListener('orientationchange', handleResize);
      // keep the connection for the next round; just stop this round listening to it
      if (mqttClientRef.current && onNetMessage) mqttClientRef.current.removeListener('message', onNetMessage);
      if (post) post.dispose();
      envRT.dispose();
      pmrem.dispose();
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
    };
  }, [screen, roomCode, selectedClass, playerName, fillWithBots, matchId, gfx]);

                        </div>

                  {mode === 'beatdown' && (

                      <div className="flex items-center justify-between gap-2">

                ⏱ {Math.floor(matchTime / 60)}:{String(matchTime % 60).padStart(2, '0')}
              </div>
              <div className="flex flex-wrap items-center gap-x-2.5 gap-y-1.5 md:gap-4 max-w-[104px] md:max-w-none">
                <div className="leading-none">
                  <span className="text-slate-400 block text-[9px] md:text-[10px] font-bold">GANG</span>
                  <span className="text-base md:text-lg font-black text-emerald-400">{myGangSize}🐼</span>
                </div>
                <div className="leading-none">
                  <span className="text-slate-400 block text-[9px] md:text-[10px] font-bold">K / D</span>
                  <span className="text-base md:text-lg font-black text-amber-400">{myKos}<span className="text-slate-400">/</span><span className="text-rose-400">{myDeaths}</span></span>
                </div>
                <button
                  onClick={() => {
                    const m = !muted;
                    sfx.setMuted(m);
                    setMuted(m);
                  }}
                  className="touch-btn w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-[15px] cursor-pointer"
                  title="Mute (M)"
                >
                  {muted ? '🔇' : '🔊'}
                </button>
                {CLIP_OK && profile.clips !== false && (
                  <button
                    onClick={() => { if (bdClipRef.current) { bdClipRef.current.highlight('MY CLIP', 1200); setBdClipToast('🎬 Saving the last 30–60 s…'); } }}
                    className="touch-btn relative w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-[15px] cursor-pointer"
                    title="Save a clip of the last 30-60 s"
                  >
                    🎬
                    {bdClips.length > 0 && <span className="absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-rose-500 text-white text-[9px] font-black leading-4">{bdClips.length}</span>}
                  </button>
                )}
                <button
                  onClick={() => {
                    setResults(null);
                    setScreen('lobby');
                  }}
                  className="touch-btn h-9 px-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-[11px] font-black text-slate-300 cursor-pointer"
                >
                  ✕<span className="hidden md:inline"> LOBBY</span>
                </button>
              </div>
            </div>
          </div>

          {/* ---------- top-centre: timer + event ---------- */}
          <div className="bd-event absolute left-1/2 -translate-x-1/2 top-0 safe-top flex flex-col items-center gap-1.5 w-[38vw] max-w-[170px] md:max-w-none md:w-auto pointer-events-none">
            <div className={`hidden md:block font-game text-xl md:text-3xl px-3 md:px-4 py-0.5 rounded-xl glass border ${matchTime <= 30 ? 'border-orange-400 text-orange-300 animate-pulse' : 'border-slate-700 text-white'}`}>
              {Math.floor(matchTime / 60)}:{String(matchTime % 60).padStart(2, '0')}
            </div>
            <div className="max-w-full px-2.5 md:px-4 py-1 rounded-full glass border border-cyan-500/40 text-cyan-300 text-[9px] md:text-xs font-extrabold tracking-wide text-center leading-tight">
              {arenaEventText}
            </div>
            {storyRun !== null && CHAPTERS[storyRun] && (
              <div className="px-2.5 py-0.5 rounded-full border text-[9px] md:text-[11px] font-black text-center" style={{ background: 'rgba(2,6,23,0.8)', borderColor: CHAPTERS[storyRun].color, color: CHAPTERS[storyRun].color }}>📖 CH.{CHAPTERS[storyRun].n} · {CHAPTERS[storyRun].goal}</div>
            )}
            {activeBeatdownAlert && !IS_TOUCH && (
              <div className="hidden md:block px-5 py-2 rounded-xl bg-rose-600/90 border-2 border-amber-300 text-white text-sm font-black uppercase tracking-wider animate-bounce shadow-[0_0_25px_rgba(225,29,72,0.8)]">
                🔥 {activeBeatdownAlert}
              </div>
            )}
          </div>

          {/* ---------- top-right: leaderboard ---------- */}
          <div className="absolute right-0 top-0 safe-top safe-x flex flex-col items-end gap-2">
            <div className="glass border border-slate-800 rounded-2xl p-2 md:p-3 shadow-xl w-[132px] md:w-[240px]">
              <div className="text-[9px] md:text-[11px] font-black uppercase tracking-wider text-slate-400 mb-1 flex justify-between">
                <span>🏆 TOP</span>
                <span className="hidden md:inline">GANG · K/D</span>
              </div>
              <div className="space-y-0.5 md:space-y-1">
                {leaderboard.slice(0, IS_SMALL() ? 3 : 6).map((item, idx) => (
                  <div
                    key={item.id}
                    className={`flex items-center justify-between gap-1 text-[10px] md:text-xs px-1.5 md:px-2 py-0.5 md:py-1 rounded-lg ${item.isLocal ? 'bg-emerald-500/25 border border-emerald-400/50 font-black text-white' : 'text-slate-300'}`}
                  >
                    <span className="truncate">{idx + 1}. {item.name}</span>
                    <span className="font-mono font-bold shrink-0">
                      <span className="hidden md:inline text-emerald-300">{item.gangSize}🐼 / </span>
                      <span className="text-amber-400">{item.kos}<span className="text-slate-500">/</span><span className="text-rose-400">{item.deaths}</span></span>
                    </span>
                  </div>
                ))}
              </div>
            </div>
            <div className={`${IS_TOUCH ? "hidden" : "hidden md:block"} space-y-1 w-[240px]`}>
              {killFeed.map(kf => (
                <div key={kf.id} className="glass border border-slate-800 px-3 py-1 rounded-lg text-[11px] font-bold shadow" style={{ color: kf.color }}>
                  {kf.msg}
                </div>
              ))}
            </div>
          </div>

          {/* ---------- damage % + buffs ---------- */}
          <div className={`absolute left-1/2 -translate-x-1/2 flex flex-col items-center ${IS_TOUCH ? 'top-[82px] md:top-[92px]' : 'bottom-6'} safe-top`}>
            <div className="flex gap-1 mb-1">
              {buffHud.map(t => (
                <span key={t} className="px-2 py-0.5 rounded-full glass border border-cyan-400/50 text-[10px] md:text-[11px] font-black text-cyan-200">{t}</span>
              ))}
            </div>
            <div
              className={`font-game leading-none ${IS_TOUCH ? 'text-3xl md:text-5xl' : 'text-5xl md:text-6xl'}`}
              style={{
                color: `rgb(255,${Math.round(255 - Math.min(1, myDmg / 150) * 215)},${Math.round(255 - Math.min(1, myDmg / 75) * 255)})`,
                textShadow: '0 4px 0 #000, 0 0 18px rgba(0,0,0,0.8)'
              }}
            >
              {myDmg}%
            </div>
            <div className="text-[9px] md:text-[10px] font-black tracking-widest text-slate-300">YOUR DAMAGE</div>
          </div>

          {IS_TOUCH ? (
            <>
              {/* ---------- floating joystick: touch anywhere on the left side ---------- */}
              <div
                className="absolute left-0 bottom-0 w-[55%] h-[62%] pointer-events-auto"
                onLostPointerCapture={e => { if (joyPtrRef.current === e.pointerId) releaseJoy(); }}
                onPointerDown={e => {
                  if (joyPtrRef.current !== null) return;
                  setJoyHint(false);
                  joyPtrRef.current = e.pointerId;
                  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
                  const rect = e.currentTarget.getBoundingClientRect();
                  const ox = e.clientX - rect.left;
                  const oy = e.clientY - rect.top;
                  joystickRef.current = { active: true, dx: 0, dy: 0, ox: e.clientX, oy: e.clientY };
                  const base = joyBaseRef.current;
                  if (base) {
                    base.style.left = `${ox}px`;
                    base.style.top = `${oy}px`;
                    base.style.opacity = '1';
                  }
                  if (joyKnobRef.current) joyKnobRef.current.style.transform = 'translate(-50%, -50%)';
                }}
                onPointerMove={e => {
                  if (joyPtrRef.current !== e.pointerId) return;
                  const j = joystickRef.current;
                  const R = 52;
                  let dx = e.clientX - j.ox;
                  let dy = e.clientY - j.oy;
                  const len = Math.hypot(dx, dy);
                  if (len > R) {
                    dx = (dx / len) * R;
                    dy = (dy / len) * R;
                  }
                  j.dx = dx / R;
                  j.dy = dy / R;
                  if (joyKnobRef.current) joyKnobRef.current.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                }}
                onPointerUp={e => { if (joyPtrRef.current === e.pointerId) releaseJoy(); }}
                onPointerCancel={() => releaseJoy()}
              >
                <div
                  ref={joyBaseRef}
                  className={`absolute w-[120px] h-[120px] -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white/25 bg-slate-900/40 transition-opacity duration-150 ${joyHint ? 'opacity-50' : 'opacity-0'}`}
                  style={{ left: '90px', top: 'calc(100% - 100px)' }}
                >
                  <div
                    ref={joyKnobRef}
                    className="absolute left-1/2 top-1/2 w-14 h-14 rounded-full bg-emerald-400/85 border-2 border-white/60 shadow-lg"
                    style={{ transform: 'translate(-50%, -50%)' }}
                  />
                </div>
                {joyHint && <div className="absolute left-[30px] bottom-[176px] text-[11px] font-black text-white/80 pointer-events-none whitespace-nowrap" style={{ textShadow: '0 1px 3px #000' }}>👆 touch &amp; drag anywhere here to move</div>}
              </div>

              {/* ---------- action cluster (right thumb) ---------- */}
              <div className="absolute right-0 bottom-0 safe-bottom safe-x pointer-events-auto">
                <div className="relative w-[200px] h-[250px]">
                  {cooldowns.ult < 100 && (
                    <div className="absolute right-[96px] bottom-[176px] pointer-events-none flex items-center gap-1 px-2 py-0.5 rounded-full bg-slate-950/70 border border-sky-300/40">
                      <span className="text-[11px]">🌪️</span>
                      <span className="w-12 h-1.5 rounded-full bg-slate-700 overflow-hidden"><span className="block h-full bg-sky-400" style={{ width: `${cooldowns.ult}%` }} /></span>
                    </div>
                  )}
                  {[
                    { key: 'jump', icon: '🦘', label: 'JUMP', cls: 'w-[88px] h-[88px] right-0 bottom-0 bg-sky-500 border-sky-200', cd: 0, max: 1 },
                    { key: 'smash', icon: '💥', label: 'SMASH', cls: 'w-[66px] h-[66px] right-[100px] bottom-[6px] bg-amber-400 border-yellow-100', cd: cooldowns.smash, max: CD_MAX.smash },
                    { key: 'dash', icon: '🐂', label: 'DASH', cls: 'w-[66px] h-[66px] right-[84px] bottom-[86px] bg-orange-400 border-orange-100', cd: cooldowns.dash, max: CD_MAX.dash },
                    { key: 'cannon', icon: '🐼', label: 'THROW', cls: `w-[66px] h-[66px] right-[6px] bottom-[104px] bg-yellow-300 border-yellow-50 ${myGangSize <= 1 ? 'opacity-50' : ''}`, cd: cooldowns.cannon, max: CD_MAX.cannon, badge: Math.max(0, myGangSize - 1) },
                    ...(cooldowns.ult >= 100 ? [{ key: 'ult', icon: '🌪️', label: 'TORNADO', cls: 'w-[80px] h-[80px] right-[96px] bottom-[164px] bg-sky-400 border-white animate-pulse ring-4 ring-sky-300/70', cd: 0, max: 1 }] : [])
                  ].map(b => (
                    <button
                      key={b.key}
                      onPointerDown={e => {
                        e.preventDefault();
                        e.stopPropagation();
                        actionTriggerRef.current[b.key] = true;
                        const el = e.currentTarget;
                        el.classList.add('pressed');
                        setTimeout(() => el.classList.remove('pressed'), 110);
                        buzz(6);
                      }}
                      onContextMenu={e => e.preventDefault()}
                      className={`touch-btn act-btn absolute rounded-full border-2 shadow-xl flex flex-col items-center justify-center ${b.cls} ${b.cd > 0 ? 'grayscale brightness-50' : ''}`}
                    >
                      <span className="relative text-2xl leading-none">{b.icon}</span>
                      <span className="relative text-[9px] font-black text-slate-950 mt-0.5">{b.label}</span>
                      {b.badge !== undefined && <span className="absolute top-0.5 right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-slate-950 text-white text-[10px] font-black leading-[18px]">{b.badge}</span>}
                      {b.cd > 0 && (
                        <span className="absolute inset-0 rounded-full flex items-center justify-center font-game text-xl text-white bg-black/40">{Math.ceil(b.cd)}</span>
                      )}
                    </button>
                  ))}
                </div>
              </div>
            </>
          ) : (
            <div className="absolute right-0 bottom-0 safe-bottom safe-x pointer-events-auto flex flex-wrap justify-end items-end gap-1.5 md:gap-2 max-w-[calc(100vw-12px)] lg:max-w-none">
              {[
                { key: 'jump', keyLabel: 'SPACE', title: '🦘 JUMP', desc: 'Double jump · dodge smashes · save yourself at the edge', bg: 'bg-sky-500', border: 'border-sky-300', text: 'text-slate-950', cd: 0, max: 1 },
                { key: 'smash', keyLabel: 'E', title: '💥 SMASH', desc: 'Blast everyone near you away · in the air = ground pound', bg: 'bg-amber-400', border: 'border-yellow-200', text: 'text-slate-950', cd: cooldowns.smash, max: CD_MAX.smash },
                { key: 'dash', keyLabel: 'SHIFT', title: '🐂 DASH', desc: 'Burst forward and bulldoze anyone in the way', bg: 'bg-orange-400', border: 'border-orange-200', text: 'text-slate-950', cd: cooldowns.dash, max: CD_MAX.dash },
                { key: 'cannon', keyLabel: 'C', title: '🐼 THROW', desc: 'Throw a gang member at the nearest rival · walk into grey pandas to recruit', bg: 'bg-yellow-300', border: 'border-yellow-100', text: 'text-slate-950', cd: cooldowns.cannon, max: CD_MAX.cannon },
                { key: 'ult', keyLabel: 'T', title: '🌪️ TORNADO', desc: cooldowns.ult >= 100 ? 'READY! Gang spins around you & punches 2x faster' : `Charging ${cooldowns.ult}% · land hits & K.O.s`, bg: cooldowns.ult >= 100 ? 'bg-sky-400 animate-pulse' : 'bg-slate-800', border: 'border-sky-300', text: cooldowns.ult >= 100 ? 'text-slate-950' : 'text-sky-200', cd: 0, max: 1 }
              ].map(b => (
                <button
                  key={b.key}
                  onClick={() => (actionTriggerRef.current[b.key] = true)}
                  className={`relative overflow-hidden w-[118px] lg:w-[142px] text-left px-3 py-2.5 rounded-2xl border-2 transition cursor-pointer ${
                    b.cd > 0 ? 'bg-slate-900/85 border-slate-700 text-slate-400' : `${b.bg} ${b.border} ${b.text} shadow-lg hover:brightness-110`
                  }`}
                >
                  <div className="flex items-center justify-between">
                    <span className="font-game text-[12px] lg:text-[13px] leading-none">{b.title}</span>
                    <span className="text-[9px] font-black px-1.5 py-0.5 rounded bg-black/25">{b.keyLabel}</span>
                  </div>
                  <div className="text-[9.5px] lg:text-[10.5px] font-semibold leading-tight mt-1 opacity-90">
                    {b.cd > 0 ? `Ready in ${b.cd}s` : b.desc}
                  </div>
                  {b.cd > 0 && <div className="absolute left-0 bottom-0 h-1 bg-white/60" style={{ width: `${(1 - b.cd / b.max) * 100}%` }} />}
                </button>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
