      }
      setTimeout(() => setResults({ board, rank, winner, myTeam: me.team }), 1400);
    };

    // ---------- MQTT ----------
    const upsertRemote = (id, nm, c, tm) => {
      let f = fighters.find(x => x.id === id);
      if (!f) {
        const klass = PANDA_CLASSES.find(k => k.id === c) || PANDA_CLASSES[0];
        f = createFighter(id, nm, klass, { remote: true, team: siege ? tm || 'atk' : null });
        f.tx = f.pos.x;
        f.tz = f.pos.z;
      }
      net.seen[id] = performance.now();
      return f;
    };
    const applyRemote = (f, d) => {
      f.tx = d.x; f.ty = d.y; f.tz = d.z; f.tface = d.f;
      f.hp = d.hp; f.dead = !!d.dd; f.kills = d.k || 0; f.deaths = d.dt || 0;
      f.dancing = !!d.dn;
      f.remoteProt = !!d.sp;
      if (d.w && f.mesh && SHOOT_WEAPONS[d.w]) swapGun(f, f.mesh, d.w);
    };
    const onMsg = (tp, payload) => {
      let d;
      try { d = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!d || d.id === myId) return;
      if (d.t === 's') {
        const isNew = !net.peers[d.id];
        net.peers[d.id] = performance.now();
        const f = upsertRemote(d.id, d.n, d.c, d.tm);
        applyRemote(f, d);
        if (isNew) pushFeed(`🟢 ${d.n} joined`, '#38bdf8');
        if (d.id === net.hostId) {
          (d.b || []).forEach(bs => applyRemote(upsertRemote(bs.i, bs.n, bs.c, bs.tm), bs));
          if (siege && Array.isArray(d.obj)) {
            const [st, pg, ct, cp] = d.obj;
            if (st > obj.stage) {
              if (obj.stage === 0) objectiveTaken(0);
              if (st >= 2) {
                objectiveTaken(1);
                endMatch('atk');
              }
            }
            obj.stage = st;
            obj.prog = pg;
            obj.contested = !!ct;
            obj.capturing = !!cp;
          }
          if (typeof d.left === 'number' && Math.abs(match.left - d.left) > 1.5) match.left = d.left;
        }
        (d.ex || []).forEach(e => explodeAt(new THREE.Vector3(e[0], e[1], e[2]), null, true));
        (d.tr || []).forEach(t => {
          const a = new THREE.Vector3(t[0], t[1], t[2]), b = new THREE.Vector3(t[3], t[4], t[5]);
          spawnTracer(a, b);
          if (me.pos.distanceTo(b) < 45) spawnFx({ pos: b, size: 0.5, grow: 0.4, life: 0.07, color: 0xfff3c4, add: true });
          const vol = Math.max(0, 1 - me.pos.distanceTo(a) / 70);
          if (vol > 0.05) sfx.play('shot_rifle', vol * 0.45);
        });
      } else if (d.t === 'h') {
        const target = fighters.find(x => x.id === d.to && (x.isMe || x.isBot));
        applyDamage(target, d.from, d.fn, d.d, d.hs);
      } else if (d.t === 'p') {
          if (typeof d.i === 'number' && pickups[d.i]) {
            pickups[d.i].t = 15;
            pickups[d.i].grp.visible = false;
          }
          if (typeof d.drop === 'number') {
            const k = drops.findIndex(x => x.id === d.drop);
            if (k >= 0) {
              scene.remove(drops[k].grp);
              scene.remove(drops[k].beam);
              drops.splice(k, 1);
              pushFeed(`👑 ${d.n} grabbed the Golden AK`, '#facc15');
            }
          }
      } else if (d.t === 'x') {
        handleDeath(d);
      }
    };
    const startNet = () => {
      if (!window.mqtt) return;
      try {
        const client = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: `ngmis_${myId}`, clean: true, connectTimeout: 5000 });
        net.client = client;
        client.on('connect', () => { net.status = 'LIVE'; client.subscribe(topic); });
        client.on('error', () => { net.status = 'OFFLINE'; });
        client.on('message', onMsg);
      } catch (e) { net.status = 'OFFLINE'; }
    };
    let mqttTag = null;
    if (window.mqtt) startNet();
    else {
      mqttTag = document.createElement('script');
      mqttTag.src = 'https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js';
      mqttTag.async = true;
      mqttTag.onload = startNet;
      mqttTag.onerror = () => { net.status = 'OFFLINE'; };
      document.body.appendChild(mqttTag);
    }
    if (fillBots) spawnBots(7);

    // ---------- post ----------
    const post = cinematic ? createPost(renderer, scene, camera) : null;
    if (post) {
      post.comp.uniforms.exposure.value = 1.05;
      post.comp.uniforms.bloomStrength.value = 0.25;
    }
    const onResize = () => {
      camera.aspect = W() / H();
      camera.updateProjectionMatrix();
      renderer.setSize(W(), H());
      if (post) post.setSize();
    };
    window.addEventListener('resize', onResize);

    sfx.startMusic();
    sfx.onTrack(n => pushFeed(`🎵 ${n}`, '#c084fc'));

    // ---------- main loop ----------
    let raf, prev = performance.now(), lastNet = 0, lastHud = 0, bob = 0;
    const loop = now => {
      raf = requestAnimationFrame(loop);
      if (locked()) everLocked = true;
      const paused = !IS_TOUCH && !locked() && Object.keys(net.peers).length === 0 && !match.over;
      const dt = paused ? 0 : Math.max(0, Math.min(0.05, (now - prev) / 1000));
      prev = now;
      if (match.countdown > 0) {
        match.countdown -= dt;
        const n = Math.ceil(match.countdown);
        if (n < match.shown && n >= 1) {
          match.shown = n;
          announceNow(String(n), '#ffffff');
          sfx.play('pop', 1, 0.8);
        }
        if (match.countdown <= 0) {
          announceNow(siege ? (me.team === 'atk' ? '⚔️ ATTACK!' : '🛡️ DEFEND!') : 'SHOOT!', siege ? SIEGE_TEAMS[me.team].color : '#4ade80');
          sfx.play('streak');
        }
      } else if (!match.over) {
        match.left -= dt;
        if (match.evIdx < EVENTS.length && match.left <= EVENTS[match.evIdx][0]) {
          startEvent(EVENTS[match.evIdx][1]);
          match.evIdx += 1;
        }
        if (siege) {
          if (match.left <= 0) endMatch('def');
        } else if (match.left <= 0 || fighters.some(f => f.kills >= KILL_TARGET)) endMatch();
        if (siege && net.isHost && obj.stage < 2 && !match.over) {
          const o = map.objectives[obj.stage];
          let na = 0, nd = 0;
          fighters.forEach(f => {
            if (f.dead || f.pos.y > 4 || Math.hypot(f.pos.x - o.x, f.pos.z - o.z) > o.r) return;
            if (f.team === 'atk') na++;
            else nd++;
          });
          obj.contested = na > 0 && nd > 0;
          obj.capturing = na > 0 && nd === 0;
          if (obj.capturing) obj.prog += dt * (4 + 2 * Math.min(3, na));
          else if (na === 0) obj.prog = Math.max(Math.floor(obj.prog / 33.4) * 33.4, obj.prog - dt * 2);
          if (obj.prog >= 100) {
            if (obj.stage === 0) {
              obj.stage = 1;
              obj.prog = 0;
              match.left += 75;
              objectiveTaken(0);
            } else {
              obj.stage = 2;
              objectiveTaken(1);
              endMatch('atk');
            }
          }
        }
        if (siege && obj.capturing && me.team === 'def' && now - obj.warnAt > 9000) {
          obj.warnAt = now;
          announceNow(`⚠️ RAIDERS ON ${map.objectives[Math.min(obj.stage, 1)].key}!`, '#f87171');
        }
      }
      if (world.moonT > 0) world.moonT -= dt;
      if (world.bullT > 0) world.bullT -= dt;
      const grav = world.moonT > 0 ? 9 : 26;

      // airdrops fall, land, get grabbed
      for (let i = drops.length - 1; i >= 0; i--) {
        const dp = drops[i];
        if (!dp.landed) {
          dp.grp.position.y -= 7 * dt;
          dp.grp.rotation.y += 0.4 * dt;
          dp.grp.rotation.z = Math.sin(now * 0.002) * 0.08;
          if (dp.grp.position.y <= 0) {
            dp.grp.position.y = 0;
            dp.grp.rotation.z = 0;
            dp.landed = true;
            dp.chute.visible = false;
            dp.strings.visible = false;
            puff(new THREE.Vector3(dp.x, 0.5, dp.z), '#e7d3a8', 14, 6);
            sfx.play('bounce', Math.max(0.2, 1 - me.pos.distanceTo(dp.grp.position) / 60));
          }
        } else {
          dp.beam.material.opacity = 0.16 + Math.sin(now * 0.006) * 0.06;
          let taker = null;
          if (!me.dead && Math.hypot(me.pos.x - dp.x, me.pos.z - dp.z) < 2.3 && me.pos.y < 2) taker = me;
          else if (net.isHost) taker = fighters.find(f => f.isBot && !f.dead && Math.hypot(f.pos.x - dp.x, f.pos.z - dp.z) < 2.3);
          if (taker) {
            scene.remove(dp.grp);
            scene.remove(dp.beam);
            drops.splice(i, 1);
            send({ t: 'p', id: myId, drop: dp.id, n: taker.name });
            if (taker.isMe) {
              addWeapon('golden');
              announceNow('👑 YOU GOT THE GOLDEN AK', '#facc15');
              sfx.play('streak');
            } else {
              taker.golden = true;
              taker.mesh.userData.rightArmGroup.remove(taker.gun);
              taker.gun = makeGunModel('golden', false);
              taker.gun.rotation.y = Math.PI;
              taker.gun.position.set(-0.05, 0.1, 0.55);
              taker.mesh.userData.rightArmGroup.add(taker.gun);
              announceNow(`⚠️ ${taker.name} HAS THE GOLDEN AK`, '#fb923c');
            }
            pushFeed(`👑 ${taker.name} grabbed the Golden AK`, '#facc15');
          }
        }
      }

      // jump pads
      map.pads.forEach(pd => {
        pd.padMat.emissiveIntensity = 0.7 + Math.sin(now * 0.008) * 0.4;
        pd.arrows.forEach((a, k) => {
          a.position.y = 0.6 + ((now * 0.0015 + k / 3) % 1) * 2.8;
          a.material.opacity = 1 - ((now * 0.0015 + k / 3) % 1);
        });
        fighters.forEach(f => {
          if (!(f.isMe || (f.isBot && net.isHost)) || f.dead) return;
          if (f.pos.y < 0.4 && f.vel.y <= 0.1 && Math.hypot(f.pos.x - pd.x, f.pos.z - pd.z) < 1.6) {
            f.vel.y = 24;
            f.vel.x += pd.dx * 4;
            f.vel.z += pd.dz * 4;
            if (f.isMe) {
              sfx.play('bumper');
              announceNow('🚀 TO THE ROOF', '#67e8f9');
            }
          }
        });
      });
      const frozen = match.countdown > 0 || match.over;
      const c = ctl.current;

      // ----- me -----
      if (c.lookDX || c.lookDY) {
        const sens = 0.0055 / (1 + (SHOOT_WEAPONS[me.weapons[me.slot].key].zoom - 1) * me.adsT);
        me.yaw -= c.lookDX * sens;
        me.pitch = Math.max(-1.45, Math.min(1.45, me.pitch - c.lookDY * sens));
        c.lookDX = 0;
        c.lookDY = 0;
      }
      if (me.dead) {
        me.respawnT -= dt;
        if (me.respawnT <= 0 && !match.over) spawnMe();
      } else {
        let fwdIn = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - c.mz;
        let strIn = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + c.mx;
        if (frozen) { fwdIn = 0; strIn = 0; }
        if (c.dance) {
          c.dance = false;
          me.dancing = !me.dancing && !frozen;
          if (me.dancing) announceNow('💃 DANCE BREAK · +15 HP/s', '#f472b6');
        }
        if (me.dancing && (Math.abs(fwdIn) + Math.abs(strIn) > 0.2 || c.firing || c.jump)) me.dancing = false;
        if (me.dancing) {
          fwdIn = 0;
          strIn = 0;
          me.hp = Math.min(100, me.hp + 15 * dt);
          me.danceBeat = (me.danceBeat || 0) - dt;
          if (me.danceBeat <= 0) {
            me.danceBeat = 0.28;
            me.danceNote = ((me.danceNote || 0) + 1) % 4;
            sfx.play('dance', 0.6, [1, 1.26, 1.5, 1.26][me.danceNote]);
            puff(new THREE.Vector3(me.pos.x, me.pos.y + 3, me.pos.z), me.hp >= 100 ? '#facc15' : '#f472b6', 3, 2.5);
          }
        }
        const sy = Math.sin(me.yaw), cy = Math.cos(me.yaw);
        let wx = -sy * fwdIn + cy * strIn, wz = -cy * fwdIn - sy * strIn;
        const wl = Math.hypot(wx, wz);
        if (wl > 1) { wx /= wl; wz /= wl; }
        const sprint = (keys.ShiftLeft || keys.ShiftRight || (IS_TOUCH && wl > 0.95)) && fwdIn > 0 && me.adsT < 0.3;
        me.sprinting = sprint && me.onGround;
        const speed = (me.adsT > 0.5 ? 5 : sprint ? 12 : 8.5) * (world.bullT > 0 ? 1.4 : 1) * (SHOOT_WEAPONS[me.weapons[me.slot].key].spinUp && me.spin > 0.2 ? 0.7 : 1);
        const accel = me.onGround ? 12 : 3;
        me.vel.x += (wx * speed - me.vel.x) * Math.min(1, dt * accel);
        me.vel.z += (wz * speed - me.vel.z) * Math.min(1, dt * accel);
        if (c.jump && me.onGround && !frozen) me.vel.y = 10.5;
        me.vel.y -= grav * dt;
        const preVy = me.vel.y;
        const wasGround = me.onGround;
        me.onGround = moveBody(me.pos, me.vel, 0.6, dt);
        if (!wasGround && me.onGround && preVy < -11) {
          me.landDip = Math.min(0.45, -preVy * 0.018);
          sfx.play('land', Math.min(1, -preVy / 25));
          for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            spawnFx({ pos: new THREE.Vector3(me.pos.x + Math.cos(a) * 0.6, me.pos.y + 0.15, me.pos.z + Math.sin(a) * 0.6), size: 0.4, grow: 1.4, life: 0.6, color: variant === 'siege' ? 0xd9a77a : 0xe9dcc4, smoke: true, opacity: 0.6, vx: Math.cos(a) * 3, vy: 0.4, vz: Math.sin(a) * 3, drag: 3 });
          }
        }
        me.landDip = (me.landDip || 0) * Math.exp(-dt * 9);
        if (me.sprinting && Math.hypot(me.vel.x, me.vel.z) > 9) {
          me.stepT = (me.stepT || 0) - dt;
          if (me.stepT <= 0) {
            me.stepT = 0.28;
            spawnFx({ pos: new THREE.Vector3(me.pos.x, me.pos.y + 0.1, me.pos.z), size: 0.3, grow: 0.9, life: 0.5, color: variant === 'siege' ? 0xd9a77a : 0xe9dcc4, smoke: true, opacity: 0.45, vy: 0.5, drag: 2 });
          }
        }
        bob += Math.hypot(me.vel.x, me.vel.z) * dt * (me.onGround ? 1 : 0);

        // weapon state
        if (c.slot !== undefined) {
          selectSlot(c.slot);
          c.slot = undefined;
        }
        if (c.swap) selectSlot(me.lastSlot !== undefined && me.weapons[me.lastSlot] ? me.lastSlot : (me.slot + 1) % me.weapons.length);
        if (c.cycle) {
          const nW = me.weapons.length;
          selectSlot((((me.slot + c.cycle) % nW) + nW) % nW);
          c.cycle = 0;
        }
        if (c.reload) startReload();
        const w = me.weapons[me.slot];
        const def = SHOOT_WEAPONS[w.key];
        if (me.shotCd > 0) me.shotCd -= dt;
        if (def.spinUp && c.firing && !frozen && me.reloadT <= 0 && !me.dancing) me.spin = Math.min(1, me.spin + dt * 1.7);
        else me.spin = Math.max(0, me.spin - dt * 1.2);
        if (gunModel && gunModel.userData.barrels) gunModel.userData.barrels.rotation.z += dt * (1 + me.spin * 32);
        if (gunModel && gunModel.userData.warhead) gunModel.userData.warhead.visible = w.mag > 0 && me.reloadT <= 0;
        if (me.reloadT > 0) {
          me.reloadT -= dt;
          if (me.reloadT <= 0) {
            w.mag = def.mag;
          }
        }
        if (c.firing && !frozen) {
          if (def.auto || IS_TOUCH) fireMe();
          else if (!me.semiHeld) { fireMe(); me.semiHeld = true; }
        }
        me.adsT += ((c.ads && me.reloadT <= 0 ? 1 : 0) - me.adsT) * Math.min(1, dt * 10);

        // pickups
        pickups.forEach((p, pi) => {
          if (p.t > 0) {
            p.t -= dt;
            if (p.t <= 0) p.grp.visible = true;
            return;
          }
          p.icon.position.y = 1.4 + Math.sin(now * 0.004 + p.ph) * 0.18;
          p.grp.rotation.y += dt;
          if (Math.hypot(me.pos.x - p.x, me.pos.z - p.z) < 2.2 && Math.abs(me.pos.y - p.y) < 2) {
            const pd = SHOOT_PICKUPS[p.kind];
            if (p.kind === 'burger') {
              if (me.hp >= 100) return;
              me.hp = Math.min(100, me.hp + 50);
            } else {
              addWeapon(p.kind);
            }
            p.t = 15;
            p.grp.visible = false;
            send({ t: 'p', id: myId, i: pi });
            announceNow(`${pd.icon} ${pd.label}`, pd.color);
            sfx.play('powerup');
          }
        });
      }
      c.jump = false;
      c.reload = false;
      c.swap = false;

      // ----- bots (host) / remotes -----
      fighters.forEach(f => {
        if (f.isBot && net.isHost && !paused) updateBot(f, dt, frozen);
        else if (f.remote && f.tx !== undefined) {
          f.pos.x += (f.tx - f.pos.x) * Math.min(1, dt * 12);
          f.pos.y += ((f.ty || 0) - f.pos.y) * Math.min(1, dt * 12);
          f.pos.z += (f.tz - f.pos.z) * Math.min(1, dt * 12);
          if (f.tface !== undefined) f.face = f.tface;
          f.mesh.rotation.x += ((f.dead ? -Math.PI / 2 : 0) - f.mesh.rotation.x) * Math.min(1, dt * 6);
        }
        if (f.mesh) {
          const moving = Math.hypot(f.vel.x, f.vel.z) > 1 && !f.dead;
          f.mesh.position.set(f.pos.x, f.pos.y + (moving ? Math.abs(Math.sin(now * 0.012 + f.pos.x)) * 0.12 : 0), f.pos.z);
          f.mesh.rotation.y = f.face;
          poseMesh(f.mesh, !!f.dancing && !f.dead, now, f.face);
          f.tag.sprite.visible = !f.dead;
          const hpR = Math.max(0, Math.round(f.hp));
          if (hpR !== f.tag.hp) {
            f.tag.hp = hpR;
            drawShooterTag(f.tag.canvas, f.name, hpR, f.color);
            f.tag.tex.needsUpdate = true;
          }
        }
      });

      // ----- fx -----
      tracers.forEach(t => {
        if (t.life > 0) {
          t.life -= dt;
          t.mat.opacity = Math.max(0, t.life / 0.07) * 0.85;
          if (t.life <= 0) t.m.visible = false;
        }
      });
      for (let i = rockets.length - 1; i >= 0; i--) {
        const rk = rockets[i];
        const step = rk.speed * dt;
        const from = rk.g.position.clone();
        const next = from.clone().addScaledVector(rk.dir, step);
        rk.life -= dt;
        let hitPoint = null;
        const wh = step > 0 ? wallHit(from, rk.dir, step) : null;
        if (wh) hitPoint = wh.point.clone().addScaledVector(rk.dir, -0.2);
        if (!hitPoint) {
          const hf = fighters.find(f => f !== rk.owner && !f.dead && !(siege && rk.owner && f.team === rk.owner.team) && Math.hypot(f.pos.x - next.x, f.pos.y + 1.2 - next.y, f.pos.z - next.z) < 1.3);
          if (hf) hitPoint = next;
        }
        if (!hitPoint && (next.y <= 0.05 || rk.life <= 0)) hitPoint = next;
        if (hitPoint) {
          scene.remove(rk.g);
          rk.g.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
          rockets.splice(i, 1);
          explodeAt(hitPoint, rk.owner, false, rk.start);
          continue;
        }
        rk.g.position.copy(next);
        if (Math.random() < 0.7) puff(from, '#9ca3af', 1, 0.6);
      }
      for (let i = booms.length - 1; i >= 0; i--) {
        const bm = booms[i];
        bm.t += dt;
        const k = bm.t / 0.45;
        bm.ring.scale.setScalar(1 + k * 8);
        bm.ring.material.opacity = Math.max(0, 1 - k);
        bm.glow.scale.setScalar(4 + k * 10);
        bm.glow.material.opacity = Math.max(0, 1 - k * 1.3);
        if (k >= 1) {
          scene.remove(bm.ring, bm.glow);
          bm.ring.geometry.dispose();
          bm.ring.material.dispose();
          bm.glow.material.dispose();
          booms.splice(i, 1);
        }
      }
      for (let i = fxs.length - 1; i >= 0; i--) {
        const f = fxs[i];
        f.life -= dt;
        const k = 1 - f.life / f.max;
        f.vy -= f.g * dt;
        const dr = Math.exp(-f.drag * dt);
        f.vx *= dr;
        f.vy *= dr;
        f.vz *= dr;
        f.sp.position.x += f.vx * dt;
        f.sp.position.y += f.vy * dt;
        f.sp.position.z += f.vz * dt;
        f.sp.scale.setScalar(f.size + f.grow * Math.sqrt(k));
        f.mat.opacity = f.op * Math.pow(1 - Math.min(1, k), 1.3);
        f.mat.rotation += f.spin * dt;
        if (f.life <= 0) {
          scene.remove(f.sp);
          f.mat.dispose();
          fxs.splice(i, 1);
        }
      }
      dmgPool.forEach(d => {
        if (d.life <= 0) return;
        d.life -= dt;
        d.sp.position.y += dt * 1.6;
        d.sp.material.opacity = Math.min(1, d.life * 2.5);
        if (d.life <= 0) d.sp.visible = false;
      });
      if (boomLight.intensity > 0.05) boomLight.intensity *= Math.exp(-dt * 7);
      else boomLight.intensity = 0;
      if (map.anim) {
        map.anim.searchlights.forEach(sl => { sl.pivot.rotation.y = Math.sin(now * 0.00035 + sl.ph) * 1.4 + (sl.ph ? Math.PI : 0); });
        map.anim.barrels.forEach(b => { const fl = 1 + Math.sin(now * 0.02 + b.ph) * 0.12 + Math.sin(now * 0.047 + b.ph) * 0.08; b.fire.scale.set(1.6 * fl, 2 * fl, 1); });
        map.anim.ledMat.emissiveIntensity = 1 + Math.sin(now * 0.01) * 0.3;
        map.anim.wheel.rotation.z = now * 0.0003;
        map.anim.flags.forEach((fg, i) => { fg.rotation.y = Math.sin(now * 0.002 + i) * 0.25; });
      }
      objVis.forEach((v, i) => {
        const active = i === obj.stage;
        const done = i < obj.stage;
        const col = done ? 0x4ade80 : !active ? 0x94a3b8 : obj.contested ? 0xfacc15 : obj.capturing ? 0xef4444 : 0xffffff;
        v.ring.material.color.setHex(col);
        v.disc.material.color.setHex(col);
        v.beacon.material.color.setHex(col);
        v.beacon.visible = !done;
        v.beacon.material.opacity = active ? 0.16 + Math.sin(now * 0.005) * 0.06 : 0.06;
        v.disc.material.opacity = active ? 0.08 + (obj.prog / 100) * 0.22 : 0.05;
        v.label.visible = !done;
      });
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.vy -= 18 * dt;
        p.m.position.x += p.vx * dt;
        p.m.position.y += p.vy * dt;
        p.m.position.z += p.vz * dt;
        p.life -= dt;
        p.mat.opacity = Math.max(0, p.life * 2);
        if (p.life <= 0 || p.m.position.y < 0) {
          scene.remove(p.m);
          p.mat.dispose();
          parts.splice(i, 1);
        }
      }
      map.clouds.forEach((cl, i) => { cl.position.x += dt * (0.6 + (i % 3) * 0.3); if (cl.position.x > 170) cl.position.x = -170; });
      shells.forEach(sh => {
        if (sh.life <= 0) return;
        sh.life -= dt;
        sh.v.y -= 22 * dt;
        sh.m.position.addScaledVector(sh.v, dt);
        sh.m.rotation.x += 14 * dt;
        sh.m.rotation.z += 9 * dt;
        if (sh.m.position.y < 0.04 && sh.v.y < 0) {
          sh.m.position.y = 0.04;
          sh.v.y *= -0.35;
          sh.v.x *= 0.5;
          sh.v.z *= 0.5;
          sh.bounced++;
        }
        if (sh.life <= 0) sh.m.visible = false;
      });
      muzzleLight.intensity *= Math.exp(-dt * 30);
      if (gunModel && gunModel.userData.heatMat) {
        const firingGat = c.firing && me.spin > 0.3;
        me.heat = Math.max(0, Math.min(1, (me.heat || 0) + (firingGat ? dt * 0.35 : -dt * 0.25)));
        gunModel.userData.heatMat.emissive.setRGB(me.heat * 1.2, me.heat * 0.35, 0);
        if (!firingGat && me.heat > 0.35 && Math.random() < me.heat * 0.5) {
          spawnFx({ pos: gunModel.userData.muzzle.getWorldPosition(new THREE.Vector3()), size: 0.15, grow: 0.8, life: 0.9, color: 0xe5e7eb, smoke: true, opacity: 0.35, vy: 1.2, drag: 1 });
        }
      }
      if (me.protT > 0) me.protT -= dt;
      fighters.forEach(f => {
        if (f.isBot && f.protT > 0) f.protT -= dt;
        if (f.bubble) {
          const on = (f.protT > 0 || f.remoteProt) && !f.dead;
          f.bubble.visible = on;
          if (on) f.bubble.material.opacity = 0.16 + Math.sin(now * 0.012) * 0.08;
        }
      });
      if (!me.dead && me.hp < 30) {
        me.beatT = (me.beatT || 0) - dt;
        if (me.beatT <= 0) {
          me.beatT = 0.85;
          sfx.play('heart', 0.8);
        }
      }
      {
        const pa = dustGeo.attributes.position.array;
        const tt = now * 0.001;
        const cx = camera.position.x, cz = camera.position.z;
        for (let i = 0; i < DUST_N; i++) {
          const bx = dustBase[i * 3] + tt * (variant === 'siege' ? 2.2 : 0.4), bz = dustBase[i * 3 + 2] + tt * 0.3;
          pa[i * 3] = cx + ((((bx - cx) % 60) + 90) % 60) - 30;
          pa[i * 3 + 1] = dustBase[i * 3 + 1] + Math.sin(tt * 0.7 + i) * 0.4;
          pa[i * 3 + 2] = cz + ((((bz - cz) % 60) + 90) % 60) - 30;
        }
        dustGeo.attributes.position.needsUpdate = true;
      }
      if (me.flashT > 0) { me.flashT -= dt; if (me.flashT <= 0) flash.visible = false; }

      // ----- camera + viewmodel -----
      me.recoil *= Math.exp(-dt * 9);
      me.kick = (me.kick || 0) * Math.exp(-dt * 18);
      if (me.dead) {
        const k = me.deathBy && fighters.find(f => f.id === me.deathBy.id);
        camera.position.set(me.pos.x, me.pos.y + 4.5, me.pos.z + 3);
        camera.lookAt(k ? k.pos.x : me.pos.x, k ? k.pos.y + 1.5 : 0, k ? k.pos.z : me.pos.z);
        vm.visible = false;
      } else if (me.dancing) {
        const a = me.yaw + now * 0.0006;
        camera.position.set(me.pos.x + Math.sin(a) * 6.5, me.pos.y + 3.6, me.pos.z + Math.cos(a) * 6.5);
        camera.lookAt(me.pos.x, me.pos.y + 1.6, me.pos.z);
        if (camera.fov !== BASE_FOV) { camera.fov = BASE_FOV; camera.updateProjectionMatrix(); }
        vm.visible = false;
      } else {
        const by = me.onGround ? Math.sin(bob * 1.6) * 0.06 : 0;
        camera.position.set(me.pos.x, me.pos.y + 2.25 + by, me.pos.z);
        camera.rotation.order = 'YXZ';
        camera.rotation.set(me.pitch + me.recoil, me.yaw, 0);
        const def = SHOOT_WEAPONS[me.weapons[me.slot].key];
        const zoom = 1 + (def.zoom - 1) * me.adsT;
        const fov = BASE_FOV / zoom + (me.sprinting ? 7 : 0);
        if (Math.abs(camera.fov - fov) > 0.01) {
          camera.fov += (fov - camera.fov) * Math.min(1, dt * 12);
          camera.updateProjectionMatrix();
        }
        camera.position.y -= me.landDip || 0;
        const scoped = me.weapons[me.slot].key === 'sniper' && me.adsT > 0.8;
        vm.visible = !scoped;
        const sightY = gunModel ? gunModel.userData.sightY * gunModel.userData.vmScale : 0.12;
        const [hipX, hipY, hipZ] = def.hip || [0.27, -0.25, -0.5];
        const adsX = 0, adsY = -sightY, adsZ = -0.36;
        const reloadDip = me.reloadT > 0 ? Math.sin(Math.min(1, me.reloadT / def.reload) * Math.PI) * 0.25 : 0;
        vm.position.set(
          hipX + (adsX - hipX) * me.adsT + Math.sin(bob * 0.8) * 0.012 * (1 - me.adsT),
          hipY + (adsY - hipY) * me.adsT - reloadDip + Math.abs(Math.cos(bob * 0.8)) * 0.012 * (1 - me.adsT),
          hipZ + (adsZ - hipZ) * me.adsT + me.kick * 0.07
        );
        me.swayX = (me.swayX || 0) * Math.exp(-dt * 8);
        me.swayY = (me.swayY || 0) * Math.exp(-dt * 8);
        vm.rotation.set(me.kick * 0.12 + reloadDip * 1.2 - me.swayY, -me.swayX, me.swayX * 0.6);
        vm.position.y -= me.landDip || 0;
      }

      myMesh.visible = me.dancing && !me.dead;
      if (myMesh.visible) {
        myMesh.position.copy(me.pos);
        poseMesh(myMesh, true, now, me.yaw + Math.PI);
      }
      if (me.shake > 0.01) {
        camera.position.x += (Math.random() - 0.5) * me.shake * 0.8;
        camera.position.y += (Math.random() - 0.5) * me.shake * 0.8;
        me.shake *= Math.exp(-dt * 7);
      }
      if (post) post.render(now * 0.001);
      else renderer.render(scene, camera);

      // ----- network -----
      if (now - lastNet > 66) {
        lastNet = now;
        const r2 = v => Math.round(v * 100) / 100;
        const pkt = { t: 's', id: myId, n: name, c: cls.id, x: r2(me.pos.x), y: r2(me.pos.y), z: r2(me.pos.z), f: r2(me.yaw + Math.PI), hp: Math.round(me.hp), dd: me.dead ? 1 : 0, k: me.kills, dt: me.deaths, tr: net.pendingTr, w: me.weapons[me.slot].key, dn: me.dancing ? 1 : 0, ex: net.pendingEx, tm: me.team, sp: me.protT > 0 ? 1 : 0 };
        if (net.isHost) {
          pkt.left = Math.round(match.left * 10) / 10;
          pkt.b = fighters.filter(f => f.isBot).map(b => ({ i: b.id, n: b.name, c: b.cls.id, x: r2(b.pos.x), y: r2(b.pos.y), z: r2(b.pos.z), f: r2(b.face), hp: Math.round(b.hp), dd: b.dead ? 1 : 0, k: b.kills, dt: b.deaths, dn: b.danceT > 0 ? 1 : 0, w: b.golden ? 'golden' : b.wkey || 'ak', sp: b.protT > 0 ? 1 : 0, tm: b.team }));
          if (siege) pkt.obj = [obj.stage, Math.round(obj.prog), obj.contested ? 1 : 0, obj.capturing ? 1 : 0];
        }
        send(pkt);
        net.pendingTr = [];
        net.pendingEx = [];
      }

      // ----- HUD + housekeeping (10 Hz) -----
      if (now - lastHud > 100) {
        lastHud = now;
        Object.keys(net.peers).forEach(id => {
          if (now - net.peers[id] > 5000) { delete net.peers[id]; pushFeed('🔴 a player left', '#94a3b8'); }
        });
        [...fighters].forEach(f => { if (f.remote && now - (net.seen[f.id] || 0) > 5000) removeFighter(f); });
        const hostId = [myId, ...Object.keys(net.peers)].sort()[0];
        net.hostId = hostId;
        const amHost = hostId === myId;
        if (amHost !== net.isHost) {
          net.isHost = amHost;
          if (!amHost) fighters.filter(f => f.isBot).forEach(removeFighter);
        }
        if (net.isHost && fillBots && !fighters.some(f => f.isBot)) spawnBots(Math.max(0, 7 - Object.keys(net.peers).length));

        camera.getWorldDirection(fwd);
        const aimRes = me.dead ? null : traceShot(camera.getWorldPosition(new THREE.Vector3()), fwd, me);
        const w = me.weapons[me.slot];
        const def = SHOOT_WEAPONS[w.key];
        const board = [...fighters].map(f => ({ id: f.id, name: f.name, color: f.color, isMe: f.isMe, kills: f.kills, deaths: f.deaths, bot: f.isBot })).sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);
        setHud({
          hp: Math.max(0, Math.round(me.hp)),
          mag: w.mag,
          reserve: Infinity,
          wname: def.name,
          wkey: w.key,
          reloading: me.reloadT > 0 ? 1 - me.reloadT / def.reload : 0,
          kills: me.kills,
          deaths: me.deaths,
          left: Math.max(0, Math.ceil(match.left)),
          feed: feed.slice(),
          dead: me.dead ? { by: me.deathBy ? me.deathBy.name : '', hs: me.deathBy && me.deathBy.hs, t: Math.max(0, Math.ceil(me.respawnT)) } : null,
          board,
          aim: aimRes && aimRes.fighter ? { name: aimRes.fighter.name, hp: Math.max(0, Math.round(aimRes.fighter.hp)), color: aimRes.fighter.color } : null,
          siege,
          team: me.team,
          obj: siege ? { stage: obj.stage, prog: Math.min(100, Math.round(obj.prog)), contested: obj.contested, capturing: obj.capturing, name: obj.stage < 2 ? `${map.objectives[obj.stage].key} · ${map.objectives[obj.stage].name}` : 'ALL CAPTURED' } : null,
          marker: (() => {
            if (!siege || obj.stage > 1 || me.dead) return null;
            const o = map.objectives[obj.stage];
            const v = new THREE.Vector3(o.x, 4, o.z).project(camera);
            let x = (v.x * 0.5 + 0.5) * 100, y = (-v.y * 0.5 + 0.5) * 100;
            if (v.z > 1) { x = 100 - x; y = 92; }
            return { k: o.key, x: Math.max(4, Math.min(96, x)), y: Math.max(10, Math.min(90, y)), d: Math.round(Math.hypot(o.x - me.pos.x, o.z - me.pos.z)) };
          })(),
          scope: w.key === 'sniper' && me.adsT > 0.8 && !me.dead,
          weapons: me.weapons.map((wp, i) => ({ key: wp.key, short: SHOOT_WEAPONS[wp.key].short, icon: SHOOT_WEAPONS[wp.key].icon, active: i === me.slot })),
          moon: Math.max(0, Math.ceil(world.moonT)),
          bull: Math.max(0, Math.ceil(world.bullT)),
          prot: me.protT > 0 && !me.dead,
          hurt: me.hurtAt && now - me.hurtAt < 1200 && me.hurtFrom !== undefined && !me.dead ? { ang: (-(me.hurtFrom - me.yaw - Math.PI) * 180) / Math.PI, age: now - me.hurtAt } : null,
          started: everLocked,
          dancing: me.dancing,
          spin: me.spin,
          locked: IS_TOUCH || locked(),
          peers: 1 + Object.keys(net.peers).length,
          net: net.status
        });
      }
    };
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf);
      sfx.stopMusic();
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('resize', onResize);
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mousedown', onMouseDown);
      document.removeEventListener('mouseup', onMouseUp);
      document.removeEventListener('touchmove', blockTouch);
      document.removeEventListener('wheel', onWheel);
      document.removeEventListener('pointerlockchange', onLockChange);
      window.removeEventListener('blur', releaseInputs);
      if (document.pointerLockElement) document.exitPointerLock();
      try { if (net.client) net.client.end(true); } catch (e) {}
      if (post) post.dispose();
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
      el.innerHTML = '';
      el.style.filter = '';
    };
  }, []);

  const c = ctl.current;
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const leader = hud.board[0];
  const resetJoy = () => {
    c.joyPtr = null;
    c.mx = 0;
    c.mz = 0;
    if (joyKnobRef.current) joyKnobRef.current.style.transform = 'translate(-50%, -50%)';
    if (joyBaseRef.current) { joyBaseRef.current.style.left = ''; joyBaseRef.current.style.top = ''; }
  };

  return (
    <div className="game-layer absolute inset-0 z-30 bg-[#9ed0f2] text-white select-none overflow-hidden">
      <div ref={mountRef} className="absolute inset-0" />

      {/* crosshair + hit marker */}
      {!hud.scope && !hud.dead && (
        <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none">
          <div className="relative w-6 h-6">
            <span className="absolute left-1/2 top-0 w-[2px] h-[7px] -translate-x-1/2 bg-white shadow-[0_0_0_1px_rgba(0,0,0,0.75)]" />
            <span className="absolute left-1/2 bottom-0 w-[2px] h-[7px] -translate-x-1/2 bg-white shadow-[0_0_0_1px_rgba(0,0,0,0.75)]" />
            <span className="absolute top-1/2 left-0 h-[2px] w-[7px] -translate-y-1/2 bg-white shadow-[0_0_0_1px_rgba(0,0,0,0.75)]" />
            <span className="absolute top-1/2 right-0 h-[2px] w-[7px] -translate-y-1/2 bg-white shadow-[0_0_0_1px_rgba(0,0,0,0.75)]" />
          </div>
        </div>
      )}
      <div ref={hitRef} className="absolute left-1/2 top-1/2 pointer-events-none font-black text-3xl leading-none" style={{ opacity: 0, transform: 'translate(-50%,-50%)', textShadow: '0 0 3px #000' }}>✕</div>
      {hud.scope && (
        <div className="absolute inset-0 pointer-events-none" style={{ background: 'radial-gradient(circle at center, transparent 0, transparent 32vmin, rgba(0,0,0,0.96) 32.4vmin)' }}>
          <div className="absolute left-1/2 top-0 bottom-0 w-px bg-black/80" />
          <div className="absolute top-1/2 left-0 right-0 h-px bg-black/80" />
          <div className="absolute left-1/2 top-1/2 w-2 h-2 -translate-x-1/2 -translate-y-1/2 rounded-full bg-red-500" />
        </div>
      )}
      <div ref={hurtRef} className="absolute inset-0 pointer-events-none" style={{ opacity: 0, background: 'radial-gradient(circle at center, transparent 45%, rgba(220,20,20,0.75) 100%)' }} />

      {hud.aim && !hud.dead && (
        <div className="absolute left-1/2 top-[56%] -translate-x-1/2 pointer-events-none text-center">
          <div className="text-[12px] font-black" style={{ color: hud.aim.color, textShadow: '0 1px 2px #000' }}>{hud.aim.name}</div>
          <div className="w-24 h-1.5 bg-black/50 rounded mt-0.5 overflow-hidden"><div className="h-full bg-rose-500" style={{ width: `${hud.aim.hp}%` }} /></div>
        </div>
      )}

      {/* top centre: timer */}
      <div className="absolute left-1/2 -translate-x-1/2 top-0 safe-top flex flex-col items-center gap-1 pointer-events-none">
        <div className={`font-game text-lg md:text-2xl px-3 py-0.5 rounded-lg bg-white/90 text-slate-900 shadow ${hud.left <= 30 ? 'text-rose-600 animate-pulse' : ''}`}>{fmt(hud.left)}</div>
        {hud.siege && hud.obj ? (
          <div className="w-[230px] md:w-[340px] bg-slate-950/80 rounded-xl px-2.5 py-1.5 text-center">
            <div className="flex items-center justify-between gap-2 text-[9px] md:text-[11px] font-black">
              <span style={{ color: SIEGE_TEAMS[hud.team].color }}>{SIEGE_TEAMS[hud.team].icon} {hud.team === 'atk' ? 'ATTACK' : 'DEFEND'}</span>
              <span className="truncate">{hud.obj.name}</span>
            </div>
            <div className="h-2 mt-1 bg-slate-700 rounded overflow-hidden">
              <div className={`h-full ${hud.obj.contested ? 'bg-amber-400 animate-pulse' : 'bg-rose-500'}`} style={{ width: `${hud.obj.prog}%` }} />
            </div>
            <div className="text-[9px] font-bold mt-0.5 text-slate-300">
              {hud.obj.contested ? '⚔️ CONTESTED' : hud.obj.capturing ? `CAPTURING · ${hud.obj.prog}%` : hud.team === 'atk' ? 'Stand in the zone to capture' : 'Keep the Raiders out of the zone'}
            </div>
          </div>
        ) : (
          <div className="text-[9px] md:text-[10px] font-black px-2 py-0.5 rounded bg-slate-900/70">FIRST TO {KILL_TARGET} · {leader ? `${leader.name} ${leader.kills}` : ''}</div>
        )}
        {(hud.moon > 0 || hud.bull > 0) && (
          <div className="text-[10px] md:text-xs font-black px-2.5 py-0.5 rounded-full bg-indigo-600/90 animate-pulse">
            {hud.moon > 0 ? `🌕 LOW GRAVITY ${hud.moon}s ` : ''}{hud.bull > 0 ? `🐂 BULL RUN ${hud.bull}s` : ''}
          </div>
        )}
      </div>

      {/* top left */}
      <div className="absolute left-0 top-0 safe-top safe-x pointer-events-auto">
        <div className="flex items-center gap-2 bg-slate-950/75 rounded-xl px-2.5 py-1.5">
          <div className="leading-none"><span className="text-[9px] text-slate-400 font-bold block">K / D</span><span className="font-game text-base text-emerald-300">{hud.kills}<span className="text-slate-500">/</span><span className="text-rose-300">{hud.deaths}</span></span></div>
          <span className="hidden md:inline text-[10px] font-bold text-cyan-300">● {hud.net} ({hud.peers})</span>
          <button onClick={() => { const m = !muted; sfx.setMuted(m); setMutedS(m); }} className="touch-btn w-8 h-8 rounded-lg bg-slate-800 text-sm cursor-pointer">{muted ? '🔇' : '🔊'}</button>
          <button onClick={onExit} className="touch-btn h-8 px-2 rounded-lg bg-slate-800 text-[11px] font-black cursor-pointer">✕<span className="hidden md:inline"> LOBBY</span></button>
        </div>
      </div>

      {/* top right: mini scoreboard + feed */}
      <div className="absolute right-0 top-0 safe-top safe-x pointer-events-none flex flex-col items-end gap-1.5">
        <div className="bg-white/90 text-slate-900 rounded-lg p-1.5 w-[130px] md:w-[200px] shadow">
          {hud.board.slice(0, IS_SMALL() ? 3 : 5).map((r, i) => (
            <div key={r.id} className={`flex items-center justify-between text-[10px] md:text-[11px] px-1 rounded ${r.isMe ? 'bg-emerald-200 font-black' : 'font-semibold'}`}>
              <span className="truncate"><span className="inline-block w-2 h-2 rounded-full mr-1" style={{ background: r.color }} />{i + 1}. {r.name}</span>
              <span className="font-mono shrink-0">{r.kills}/{r.deaths}</span>
            </div>
          ))}
        </div>
        <div className={`${IS_TOUCH ? 'hidden md:flex' : 'flex'} flex-col items-end gap-1`}>
          {hud.feed.map(f => (
            <div key={f.id} className="text-[11px] font-bold px-2 py-0.5 rounded bg-slate-950/70" style={{ color: f.color }}>{f.msg}</div>
          ))}
        </div>
      </div>

      {/* bottom left: HP */}
      <div className={`absolute left-0 safe-x pointer-events-none ${IS_TOUCH ? 'top-[64px]' : 'bottom-0 safe-bottom'}`}>
        <div className="flex items-center gap-2 bg-white/90 rounded-lg px-2 py-1 shadow">
          <span className="font-game text-slate-900 text-lg md:text-xl w-10 text-right">{hud.hp}</span>
          <div className="w-24 md:w-40 h-3 bg-slate-300 rounded overflow-hidden"><div className={`h-full ${hud.hp > 50 ? 'bg-emerald-500' : hud.hp > 25 ? 'bg-amber-400' : 'bg-rose-500'}`} style={{ width: `${hud.hp}%` }} /></div>
        </div>
      </div>

      {/* bottom right: ammo */}
      <div className={`absolute right-0 safe-x pointer-events-none text-right ${IS_TOUCH ? 'top-[92px] md:top-[150px]' : 'bottom-0 safe-bottom'}`}>
        <div className="flex flex-wrap justify-end gap-1 mb-1 max-w-[260px] ml-auto">
          {hud.weapons.map((wp, i) => (
            <div key={i} className={`px-1.5 py-0.5 rounded-md text-[9px] md:text-[10px] font-black shadow ${wp.active ? (wp.key === 'golden' ? 'bg-yellow-300 text-slate-900' : 'bg-white text-slate-900') : 'bg-slate-900/70 text-slate-300'}`}>
              <span className="opacity-50 mr-0.5">{i + 1}</span>{wp.icon} {wp.short}
            </div>
          ))}
        </div>

            onPointerDown={e => {
              if (c.joyPtr !== null) return;
              c.joyPtr = e.pointerId;
              try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
              c.jox = e.clientX;
              c.joy = e.clientY;
              const r = e.currentTarget.getBoundingClientRect();
              if (joyBaseRef.current) { joyBaseRef.current.style.left = `${e.clientX - r.left}px`; joyBaseRef.current.style.top = `${e.clientY - r.top}px`; }
            }}
            onPointerMove={e => {
              if (c.joyPtr !== e.pointerId) return;
              let dx = e.clientX - c.jox, dy = e.clientY - c.joy;
              const len = Math.hypot(dx, dy), R = 50;
              if (len > R) { dx = (dx / len) * R; dy = (dy / len) * R; }
              c.mx = dx / R;
              c.mz = dy / R;
              if (joyKnobRef.current) joyKnobRef.current.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            }}
            onPointerUp={e => { if (c.joyPtr === e.pointerId) resetJoy(); }}
            onPointerCancel={resetJoy}
          >
            <div ref={joyBaseRef} className="absolute w-[110px] h-[110px] -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white/40 bg-slate-900/30" style={{ left: '84px', top: 'calc(100% - 96px)' }}>

            </div>
          </div>
          <div
            className="absolute right-0 top-0 w-[55%] h-full pointer-events-auto"
            onPointerDown={e => {
              if (c.lookPtr !== null) return;
              c.lookPtr = e.pointerId;
              try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
              c.lx = e.clientX;
              c.ly = e.clientY;
            }}
            onPointerMove={e => {
              if (c.lookPtr !== e.pointerId) return;
              c.lookDX += e.clientX - c.lx;
              c.lookDY += e.clientY - c.ly;
              c.lx = e.clientX;
              c.ly = e.clientY;
            }}
            onPointerUp={e => { if (c.lookPtr === e.pointerId) c.lookPtr = null; }}
            onPointerCancel={() => { c.lookPtr = null; }}
          />
          <div className="absolute right-0 bottom-0 safe-bottom safe-x pointer-events-none">
            <div className="relative w-[210px] h-[200px]">
              <button
                className="touch-btn pointer-events-auto absolute right-2 bottom-2 w-[92px] h-[92px] rounded-full bg-rose-500/90 border-4 border-white/80 font-game text-sm text-white shadow-xl"
                onPointerDown={e => { e.stopPropagation(); c.firing = true; c.firePtr = e.pointerId; c.fx = e.clientX; c.fy = e.clientY; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} }}
                onPointerMove={e => { if (c.firePtr !== e.pointerId) return; c.lookDX += e.clientX - c.fx; c.lookDY += e.clientY - c.fy; c.fx = e.clientX; c.fy = e.clientY; }}
                onPointerUp={() => { c.firing = false; c.firePtr = null; }}
                onPointerCancel={() => { c.firing = false; c.firePtr = null; }}
              >FIRE</button>
              {[
                ['ADS', 'right-[108px] bottom-[6px]', () => { c.ads = !c.ads; }],
                ['JUMP', 'right-[100px] bottom-[78px]', () => { c.jump = true; }],
                ['R', 'right-[28px] bottom-[112px]', () => { c.reload = true; }],
                ['⇄', 'right-[150px] bottom-[130px]', () => { c.cycle = 1; }],
                ['💃', 'right-[168px] bottom-[64px]', () => { c.dance = true; }]
              ].map(([label, pos, fn]) => (
                <button key={label} className={`touch-btn pointer-events-auto absolute ${pos} w-[58px] h-[58px] rounded-full bg-slate-900/70 border-2 border-white/60 font-black text-xs text-white`} onPointerDown={e => { e.stopPropagation(); fn(); }}>{label}</button>
              ))}
            </div>
          </div>
        </>
      )}

      {results && (
        <div className="absolute inset-0 z-40 flex items-center justify-center bg-slate-950/75 p-4">
          <div data-scroll="1" className="w-full max-w-md max-h-[92%] overflow-y-auto glass border border-slate-700 rounded-3xl p-5 text-center">
            {results.winner ? (
              <>
                <div className="font-game text-4xl" style={{ color: results.winner === results.myTeam ? '#facc15' : '#f87171' }}>{results.winner === results.myTeam ? '🏆 VICTORY' : 'DEFEAT'}</div>
                <div className="text-sm font-black" style={{ color: SIEGE_TEAMS[results.winner].color }}>{SIEGE_TEAMS[results.winner].icon} {SIEGE_TEAMS[results.winner].name} WIN</div>
              </>
            ) : (
              <>
                <div className="font-game text-4xl" style={{ color: results.rank === 1 ? '#facc15' : '#ffffff' }}>{results.rank === 1 ? '🏆 VICTORY' : `#${results.rank} PLACE`}</div>
                <div className="text-slate-400 text-sm">Ranked by eliminations</div>
              </>
            )}
            <div className="mt-3 space-y-1 text-left">
              {results.board.slice(0, 8).map((r, i) => (
                <div key={r.id} className={`flex items-center gap-2 px-3 py-1.5 rounded-xl ${r.isMe ? 'bg-emerald-500/20 border border-emerald-400/60' : 'bg-slate-900/70'}`}>
                  <span className="font-game w-5 text-slate-400">{i + 1}</span>
                  <span className="w-3 h-3 rounded-full" style={{ background: r.color }} />
                  <span className="flex-1 font-bold truncate">{r.name}{r.isMe ? ' (you)' : ''}</span>
                  <span className="font-black text-amber-300">{r.kills}K</span>
                  <span className="font-black text-rose-300 w-10 text-right">{r.deaths}D</span>
                </div>
              ))}
            </div>
            <div className="flex gap-3 mt-4">
              <button onClick={onAgain} className="play-btn flex-1 py-3 rounded-2xl font-game text-lg text-slate-950 cursor-pointer">PLAY AGAIN</button>
              <button onClick={onExit} className="px-5 py-3 rounded-2xl bg-slate-800 font-bold cursor-pointer">LOBBY</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

    // floating asteroids: rough basalt

    const bumpers = [];

    const rimTorus = new THREE.Mesh(new THREE.TorusGeometry(ARENA_RADIUS - 0.15, 0.32, 12, 120), bronze);

    const fighters = [];

    let gangColorIdx = 0;
    const createFighterEntity = (id, name, pandaClass, isLocal, isBot, startAngle, index) => {
      const dist = isLocal ? 0 : 16 + (index % 2) * 6;
      const x = Math.cos(startAngle) * dist;
      const z = Math.sin(startAngle) * dist;
      let hash = 0;
      for (let k = 0; k < id.length; k++) hash = (hash * 31 + id.charCodeAt(k)) >>> 0;
      const gangColor = isLocal ? LOCAL_GANG_COLOR : isBot ? GANG_COLORS[gangColorIdx++ % GANG_COLORS.length] : GANG_COLORS[hash % GANG_COLORS.length];

      const mesh = buildNgmiPandaMesh(pandaClass, false, gangColor);

        isBot,

    const knockbackMult = () => (fx.liqTimer > 0 ? 1.35 : 1.0) * (matchRef.finalRush ? 1.5 : 1.0);

    // Smash-Bros style knockback: more damage % => flies further and higher
    const launch = (target, attacker, dirX, dirZ, base, upward, dmgAdd) => {
      if (target.respawnLock > 0) return 0;
      if (target.isLocal || target.isBot) target.dmg = Math.min(999, target.dmg + dmgAdd);
      const ratio = attacker.pandaClass.power / target.pandaClass.mass;
      const armor = target.buffs.armor > 0 ? 0.4 : 1;
      const pump = attacker.buffs.pump > 0 ? 1.7 : 1;
      const kb = Math.min(110, base * ratio * (1 + target.dmg / 45) * knockbackMult() * armor * pump);
      target.lastHitBy = attacker;
      target.lastHitAt = performance.now();
      const p = target.mesh.position;
      const isCrit = kb > 32;
      burst(p.x, p.y + 1.5, p.z, attacker.gangColor, 6 + Math.round(kb / 6), 6 + kb * 0.25);
      const vol = (target.isLocal || attacker.isLocal) ? 1 : volAt(p) * 0.7;
      if (attacker.isLocal && kb > stats.biggestHit) stats.biggestHit = kb;
      if (isCrit) {
        sfx.play('crit', vol);
        burst(p.x, p.y + 1.5, p.z, '#ffffff', 14, 16);
        spawnMemeSprite(p.x, 2.2, p.z, 'CRIT!! 💥', '#ffffff');
        if (target.isLocal || attacker.isLocal) flash(target.isLocal ? 0.5 : 0.3);
      } else {
        sfx.play('hit', vol, 0.85 + Math.random() * 0.4);

      if (!target.isLocal && !target.isBot) {
        // remote fighter: its owner applies the knockback with its own %
        send({ t: 'h', id: myIdRef.current, to: target.id, from: attacker.id, dx: dirX, dz: dirZ, b: base, u: upward, dm: dmgAdd, pw: attacker.pandaClass.power * (attacker.buffs.pump > 0 ? 1.7 : 1), fl: base > 8 ? 1 : 0 });
        return kb;
      }
      target.vx += dirX * kb;
      target.vz += dirZ * kb;
      target.vy = Math.max(target.vy, upward + kb * 0.16);
      target.stun = Math.max(target.stun, Math.min(1.4, 0.2 + kb / 55));
      if (target.isLocal || attacker.isLocal) {
        fx.shake = Math.min(1.6, fx.shake + kb / 45);
        if (kb > 22) fx.shake = Math.min(1.6, fx.shake + (isCrit ? 0.35 : 0.15));
      }
      if (attacker.isLocal) {
        fx.combo = fx.comboTimer > 0 ? fx.combo + 1 : 1;
        stats.bestCombo = Math.max(stats.bestCombo, fx.combo);
        fx.comboTimer = 1.4;

        }
      }
      return kb;
    };

    // ---------- match flow ----------
    const match = { left: MATCH_SECONDS, countdown: 3.3, over: false, finalRush: false };
    const stats = { bestCombo: 0, biggestHit: 0, falls: 0 };
    ['3', '2', '1'].forEach((n, i) => setTimeout(() => { announceNow(n, '#ffffff'); sfx.play('pop', 1, 0.8); }, 150 + i * 1000));
    setTimeout(() => { announceNow('FIGHT!', '#00ffa3'); sfx.play('streak'); }, 3150);
    setMatchTime(MATCH_SECONDS);

    // ---------- RUG PULL: a slice of the floor collapses ----------
    let rug = null;
    const RUG_INNER = 13;
    const angleOf = (x, z) => {
      let a = Math.atan2(-z, x);
      if (a < 0) a += Math.PI * 2;
      return a;
    };
    const inRug = pos => {
      if (!rug || rug.phase !== 'open') return false;
      const r = Math.hypot(pos.x, pos.z);
      if (r < RUG_INNER) return false;
      let d = angleOf(pos.x, pos.z) - rug.a0;
      if (d < 0) d += Math.PI * 2;
      return d <= rug.len;
    };
    const crackTex = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = 'rgba(60,10,0,0.5)';
      g.fillRect(0, 0, 512, 512);
      g.strokeStyle = '#ff7a2a';
      g.shadowColor = '#ff3d00';
      g.shadowBlur = 16;
      g.lineCap = 'round';
      for (let k = 0; k < 30; k++) {
        let x = Math.random() * 512, y = Math.random() * 512;
        g.lineWidth = 1 + Math.random() * 3.5;
        g.beginPath();
        g.moveTo(x, y);
        for (let j = 0; j < 7; j++) {
          x += (Math.random() - 0.5) * 90;
          y += (Math.random() - 0.5) * 90;
          g.lineTo(x, y);
        }
        g.stroke();
      }
      const t = srgbTex(new THREE.CanvasTexture(c));
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(0.07, 0.07);
      return t;
    })();
    const sectorShape = (a0, len, r0, r1) => {
      const sh = new THREE.Shape();
      sh.absarc(0, 0, r1, a0, a0 + len, false);
      sh.absarc(0, 0, r0, a0 + len, a0, true);
      return sh;
    };
    const slabTex = arenaTex.map.clone();
    slabTex.repeat.set(1 / (2 * ARENA_RADIUS), 1 / (2 * ARENA_RADIUS));
    slabTex.offset.set(0.5, 0.5);
    slabTex.needsUpdate = true;
    const slabTop = new THREE.MeshStandardMaterial({ map: slabTex, bumpMap: arenaTex.bump, bumpScale: 0.3, roughness: 0.9 });
    const makeSlab = () => {
      const geo = new THREE.ExtrudeGeometry(sectorShape(rug.a0, rug.len, RUG_INNER, ARENA_RADIUS), { depth: 3, bevelEnabled: false, curveSegments: 24 });
      const m = new THREE.Mesh(geo, [slabTop, floorSide]);
      m.rotation.x = -Math.PI / 2;
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    };
    const sectorPoint = () => {
      const a = rug.a0 + Math.random() * rug.len;
      const r = RUG_INNER + Math.random() * (ARENA_RADIUS - RUG_INNER);
      return [Math.cos(a) * r, -Math.sin(a) * r];
    };
    const startRug = () => {
      const a0 = Math.random() * Math.PI * 2;
      const len = Math.PI / 3;
      const mat = new THREE.MeshBasicMaterial({ map: crackTex, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
      const mesh = new THREE.Mesh(new THREE.ShapeGeometry(sectorShape(a0, len, RUG_INNER, ARENA_RADIUS + 0.4), 24), mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = 0.09;
      scene.add(mesh);
      rug = { a0, len, phase: 'warn', t: 3, mesh, mat, slab: null, slabVy: 0, extras: [] };
      announceNow('⚠️ RUG PULL INCOMING!', '#ff6a2a');
      setArenaEventText('⚠️ RUG PULL: GET OFF THE CRACKING FLOOR!');
      sfx.play('fall', 0.7);
    };
    const openRug = () => {
      scene.remove(rug.mesh);
      rug.slab = makeSlab();
      rug.slab.position.y = -2.98;
      rug.slabVy = 2;
      rug.spin = (Math.random() - 0.5) * 0.9;
      const abyss = new THREE.Mesh(
        new THREE.ShapeGeometry(sectorShape(rug.a0, rug.len, RUG_INNER, ARENA_RADIUS + 0.6), 24),
        new THREE.MeshBasicMaterial({ color: 0x020104, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 })
      );
      abyss.rotation.x = -Math.PI / 2;
      abyss.position.y = 0.03;
      scene.add(abyss);
      const pts = sectorShape(rug.a0, rug.len, RUG_INNER, ARENA_RADIUS).getPoints(48).map(v => new THREE.Vector3(v.x, 0.12, -v.y));
      const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xff7a2a, transparent: true }));
      scene.add(edge);
      const mid = rug.a0 + rug.len / 2;
      const rr = (RUG_INNER + ARENA_RADIUS) / 2;
      const vortex = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlowTexture('rgba(255,90,20,0.9)', 'rgba(120,20,160,0)'), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
      vortex.position.set(Math.cos(mid) * rr, -7, -Math.sin(mid) * rr);
      vortex.scale.set(26, 26, 1);
      scene.add(vortex);
      rug.extras = [abyss, edge, vortex];
      rug.edgeMat = edge.material;
      rug.vortex = vortex;
    };

    // ---------- WEAPONS ----------
    const projectiles = [];
    const makeWeaponMesh = kind => {
      const g = new THREE.Group();
      if (kind === 'hammer') {
        const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 1.5, 8), new THREE.MeshStandardMaterial({ color: 0x4a2c17, roughness: 0.7 }));
        handle.position.y = 0.55;
        const headM = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.42, 0.42), new THREE.MeshStandardMaterial({ color: 0x8c6a3c, metalness: 1, roughness: 0.35 }));
        headM.position.y = 1.3;
        const plate = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.32, 0.32), new THREE.MeshStandardMaterial({ color: 0xd4a640, emissive: 0xff8a20, emissiveIntensity: 0.8 }));
        plate.position.set(0.4, 1.3, 0);
        g.add(handle, headM, plate);
        g.rotation.x = 0.9;
        g.position.set(0.1, -0.1, 0.55);
      } else {
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 1.5, 14), new THREE.MeshStandardMaterial({ color: 0x2f3a2a, roughness: 0.55, metalness: 0.4 }));
        tube.rotation.x = Math.PI / 2;
        const mouthM = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.05, 8, 16), new THREE.MeshStandardMaterial({ color: 0xb91c1c, emissive: 0xff3b1a, emissiveIntensity: 0.9 }));
        mouthM.position.z = 0.75;
        g.add(tube, mouthM);
        g.position.set(0.05, 0.35, 0.3);
      }
      return g;
    };
    const giveWeapon = (f, kind) => {
      if (f.weapon) f.mesh.userData.rightArmGroup.remove(f.weapon.mesh);
      const mesh = makeWeaponMesh(kind);
      f.mesh.userData.rightArmGroup.add(mesh);
      f.weapon = { kind, uses: kind === 'hammer' ? 5 : 3, cd: 0, mesh, swing: 0 };
    };
    const dropWeapon = f => {
      if (!f.weapon) return;
      f.mesh.userData.rightArmGroup.remove(f.weapon.mesh);
      f.weapon = null;
      f.mesh.userData.rightArmGroup.rotation.x = 0;
    };
    const forwardOf = f => {
      const r = f.mesh.rotation.y;
      return [Math.sin(r), Math.cos(r)];
    };
    const useWeapon = f => {
      const w = f.weapon;
      if (!w || w.cd > 0) return false;
      const [fx0, fz0] = forwardOf(f);
      const p = f.mesh.position;
      if (w.kind === 'hammer') {
        w.cd = 0.45;
        w.swing = 0.3;
        sfx.play('smash', f.isLocal ? 0.9 : volAt(p) * 0.5);
        burst(p.x + fx0 * 3, 0.8, p.z + fz0 * 3, '#ffb347', 10, 8);
        fighters.forEach(o => {
          if (o.id === f.id) return;
          const dx = o.mesh.position.x - p.x, dz = o.mesh.position.z - p.z;
          const d = Math.hypot(dx, dz);
          if (d < 5.8 && d > 0.01 && (dx * fx0 + dz * fz0) / d > 0.35) {
            launch(o, f, dx / d, dz / d, 15, 11, 18);
          }
        });
      } else {
        w.cd = 0.7;
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffb070 }));
        mesh.position.set(p.x + fx0 * 2.2, p.y + 1.6, p.z + fz0 * 2.2);
        scene.add(mesh);
        projectiles.push({ mesh, owner: f, vx: fx0 * 38, vz: fz0 * 38, life: 1.3 });
        sfx.play('swarm', f.isLocal ? 0.7 : volAt(p) * 0.4);
        if (f.isLocal) fx.shake = Math.min(1.6, fx.shake + 0.25);
      }
      w.uses -= 1;
      if (w.uses <= 0) setTimeout(() => dropWeapon(f), 350);
      return true;
    };
    const explode = (x, z, owner) => {
      triggerShockwave(x, z, 0xff6a2a, 7);
      burst(x, 1, z, '#ff6a2a', 26, 16);
      burst(x, 1, z, '#ffd27a', 12, 10);
      sfx.play('crit', owner.isLocal ? 1 : volAt(new THREE.Vector3(x, 0, z)) * 0.7);
      fighters.forEach(o => {
        if (o.id === owner.id) return;
        const dx = o.mesh.position.x - x, dz = o.mesh.position.z - z;
        const d = Math.hypot(dx, dz);
        if (d < 6.5) {
          const nx = d > 0.01 ? dx / d : 1, nz = d > 0.01 ? dz / d : 0;
          launch(o, owner, nx, nz, 9 + 9 * (1 - d / 6.5), 10, 16);
        }
      });
      const lp = localFighter.mesh.position;
      if (Math.hypot(lp.x - x, lp.z - z) < 14) fx.shake = Math.min(1.6, fx.shake + 0.6);
    };

    const powerups = [];
    const spawnPowerup = () => {
      if (powerups.length >= 3) return;
      const type = POWERUPS[Math.floor(Math.random() * POWERUPS.length)];
      const a = Math.random() * Math.PI * 2;
      const r = 4 + Math.random() * (ARENA_RADIUS - 10);
      const grp = new THREE.Group();
      const icon = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeEmojiTexture(type.icon), transparent: true }));
      icon.scale.set(2.4, 2.4, 1);
      icon.position.y = 1.9;
      grp.add(icon);
      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.9, 0.9, 9, 20, 1, true),
        new THREE.MeshBasicMaterial({ color: type.color, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false })
      );
      beam.position.y = 4.5;
      grp.add(beam);
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(1.0, 1.35, 32),
        new THREE.MeshBasicMaterial({ color: type.color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.06;
      grp.add(ring);
      grp.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      scene.add(grp);
      powerups.push({ grp, icon, type, ph: Math.random() * 6 });
    };

    const applyPowerup = (f, type) => {
      if (type.id === 'burger') f.buffs.speed = 7;
      if (type.id === 'diamond') f.buffs.armor = 8;
      if (type.id === 'rocket') f.buffs.pump = 6;
      if (type.id === 'hammer' || type.id === 'launcher') giveWeapon(f, type.id);
      if (type.id === 'gift') {
        addMinionToFighter(f);
        addMinionToFighter(f);
        addMinionToFighter(f);
      }
      const pos = f.mesh.position;
      burst(pos.x, 1.5, pos.z, type.color, 16, 10);
      if (f.isLocal) {
        spawnMemeSprite(pos.x, 2.4, pos.z, type.label, type.color);
        if (type.id === 'rocket') cdState.smash = 0;
      }
      sfx.play('powerup', f.isLocal ? 1 : volAt(pos) * 0.6);
    };

    let mqttScript = null;
    const topic = `ngmipandas/beatdown3d/v3/${roomCode.trim().toUpperCase()}`;
    const send = obj => {
      const c = mqttClientRef.current;
      if (c && c.connected) {
        try { c.publish(topic, JSON.stringify(obj)); } catch (e) {}
      }
    };
    const upsertRemote = (id, name, classId) => {
      let f = fighters.find(x => x.id === id);
      if (!f) {
        const pClass = PANDA_CLASSES.find(c => c.id === classId) || PANDA_CLASSES[0];
        f = createFighterEntity(id, name, pClass, false, false, 0, fighters.length);
        f.remote = true;
        if (id.endsWith('_whale')) makeWhale(f);
        fighters.push(f);
      }
      net.remoteSeen[id] = performance.now();
      return f;
    };
    const applyRemoteState = (f, d) => {
      f.targetX = d.x;
      f.targetY = d.y || 0;
      f.targetZ = d.z;
      f.dmg = d.d || 0;
      f.kos = d.k || 0;
      f.deaths = d.dt || 0;
      f.streak = d.st || 0;
      const want = Math.min(16, d.m || 0);
      while (f.minions.length < want) addMinionToFighter(f);
      while (f.minions.length > want) scene.remove(f.minions.pop().mesh);
    };

    const initMultiplayer = () => {
      if (!window.mqtt) return;
      setNetStatus('CONNECTING...');
      const client = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: `ngmi_${myIdRef.current}`,
        clean: true,
        connectTimeout: 4000
      });

      mqttClientRef.current = client;

      client.on('connect', () => {
        setNetStatus('LIVE ONLINE');
        client.subscribe(topic);
      });

      client.on('message', (t, payload) => {
        let data;
        try {
          data = JSON.parse(payload.toString());
        } catch (err) {
          return;
        }
        if (!data || data.id === myIdRef.current) return;

        if (data.t === 's') {
          // full state from another human (and their bots if they are the host)
          const isNew = !remotePlayersRef.current[data.id];
          remotePlayersRef.current[data.id] = { name: data.name, lastSeen: performance.now() };
          const f = upsertRemote(data.id, data.name, data.c);
          applyRemoteState(f, data);
          if (isNew) pushKillFeed(`🟢 ${data.name} joined Room ${roomCode}!`, '#38bdf8');
          if (data.ev === 'smash') {
            triggerShockwave(data.x, data.z, f.gangColor, 9);
            sfx.play('smash', volAt(f.mesh.position) * 0.6);
          }
          if (Array.isArray(data.b) && data.id === net.hostId) {
            data.b.forEach(b => applyRemoteState(upsertRemote(b.i, b.n, b.c), b));
          }
          if (data.id === net.hostId && typeof data.left === 'number' && Math.abs(match.left - data.left) > 1.5) {
            match.left = data.left;
          }
        } else if (data.t === 'h') {
          // someone hit one of MY fighters: I own their physics, so I apply it
          const target = fighters.find(x => x.id === data.to && (x.isLocal || x.isBot));
          if (!target) return;
          const src = fighters.find(x => x.id === data.from);
          const attacker = {
            id: data.from,
            name: src ? src.name : 'Someone',
            gangColor: src ? src.gangColor : '#ffffff',
            pandaClass: { power: data.pw || 1 },
            buffs: { pump: 0 },
            isLocal: false
          };
          launch(target, attacker, data.dx, data.dz, data.b, data.u, data.dm);
          if (src) target.lastHitBy = src;
          target.lastHitAt = performance.now();
          if (data.fl && Math.random() < 0.5) flingMinion(target, data.dx, data.dz);
        } else if (data.t === 'k') {
          // a fighter owned by someone else got ringed out by one of MINE
          const killer = fighters.find(x => x.id === data.killer && (x.isLocal || x.isBot));
          if (killer) creditKO(killer, data.vn, data.vx || 0, data.vz || 0, data.vs || 0, !!data.vw);
          else pushKillFeed(`💥 ${data.kn}'s gang RINGED OUT ${data.vn}!`, '#facc15');
        }
      });
    };

    if (window.mqtt) {
      initMultiplayer();
    } else {
      mqttScript = document.createElement('script');
      mqttScript.src = 'https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js';
      mqttScript.async = true;
      mqttScript.onload = initMultiplayer;
      document.body.appendChild(mqttScript);
    }

    const cdState = { call: 0, smash: 0, swarm: 0 };
    let lastNetBroadcast = 0;
    let lastHudSync = 0;
    let hazardTimer = 0;
    let powerTimer = 5;
    let animationFrameId;
    let prevTime = performance.now();

    const creditKO = (killer, victimName, vx, vz, victimStreak = 0, victimWhale = false) => {
      killer.kos += 1;
      addMinionToFighter(killer);
      if (victimStreak >= 3) {
        killer.kos += 1;
        if (killer.isLocal) announceNow('👑 BOUNTY CLAIMED! +1 K.O.', '#facc15');
        pushKillFeed(`👑 ${killer.name} claimed the bounty on ${victimName}!`, '#facc15');
      }
      if (victimWhale) {
        killer.kos += 2;
        for (let w = 0; w < 4; w++) addMinionToFighter(killer);
        announceNow(`🐋 ${killer.isLocal ? 'YOU' : killer.name} HUNTED THE WHALE!`, '#38bdf8');
      }
      killer.streak = (killer.streak || 0) + 1;
      if (killer.isLocal) {
        setMyKos(killer.kos);
        fx.shake = 1.6;
        spawnMemeSprite(vx * 0.7, 3, vz * 0.7, 'K.O.!! 💥', '#facc15');
        flash(0.35);
        fx.postFlash = 0.25;
        sfx.play('ko');
        const STREAKS = { 2: ['DOUBLE K.O.!', '#38bdf8'], 3: ['TRIPLE K.O.!!', '#a855f7'], 4: ['RAMPAGE!!!', '#f97316'], 5: ['UNSTOPPABLE GMI!!!', '#facc15'] };
        const st = STREAKS[Math.min(killer.streak, 5)];
        if (st) {
          announceNow(st[0], st[1]);
          sfx.play('streak');
        }
      }
      pushKillFeed(`💥 ${killer.name}'s gang RINGED OUT ${victimName}!`, '#facc15');
    };

    // Ring smash shockwave. Airborne targets dodge it (jump to dodge!)
    const doSmash = (attacker, radius, powerMul, label) => {
      const px = attacker.mesh.position.x;
      const pz = attacker.mesh.position.z;
      attacker.punchAnim = 0.45;
      triggerShockwave(px, pz, 0xfacc15, radius);
      spawnMemeSprite(px, 1.8, pz, label, '#facc15');
      sfx.play('smash', attacker.isLocal ? 1 : volAt(attacker.mesh.position) * 0.6);
      if (attacker.isLocal) fx.shake = Math.min(1.6, fx.shake + 0.5 * powerMul);
      burst(px, 0.6, pz, '#facc15', 18, 14);
      fighters.forEach(other => {
        if (other.id === attacker.id) return;
        if (other.mesh.position.y > 1.6) {
          if (other.isLocal) spawnMemeSprite(other.mesh.position.x, 2, other.mesh.position.z, 'DODGED! 😎', '#38bdf8');
          return;
        }
        const dx = other.mesh.position.x - px;
        const dz = other.mesh.position.z - pz;
        const dist = Math.hypot(dx, dz);
        if (dist < radius && dist > 0.01) {
          const closeness = (radius - dist) / radius;
          launch(other, attacker, dx / dist, dz / dist, (7 + 9 * closeness) * powerMul, 8, (14 + 10 * closeness) * powerMul);
          if (Math.random() < 0.5) flingMinion(other, dx / dist, dz / dist);
        }
      });
    };

    const doJump = (f, dirX, dirZ) => {
      if (f.jumps <= 0 || f.stun > 0 || f.pounding) return false;
      const first = f.jumps === 2 && f.mesh.position.y <= 0.05;
      f.vy = first ? 16 : 15;
      if (!first) {
        // double jump: also a horizontal burst so you can recover from the edge
        f.vx = f.vx * 0.4 + dirX * 14;
        f.vz = f.vz * 0.4 + dirZ * 14;
        burst(f.mesh.position.x, f.mesh.position.y + 0.3, f.mesh.position.z, '#e2e8f0', 8, 5);
      }
      f.jumps -= 1;
      f.squash = 0.4;
      sfx.play('pop', f.isLocal ? 0.9 : volAt(f.mesh.position) * 0.5, first ? 0.7 : 1.1);
      return true;
    };

    const onKeyDown = (e) => {
      const code = e.code;
      keysRef.current[code] = true;
      if (code === 'Space') {
        e.preventDefault();
        if (!e.repeat) actionTriggerRef.current.jump = true;
      } else if (code === 'KeyR' || code === 'KeyF') {
        actionTriggerRef.current.call = true;
      } else if (code === 'KeyE') {
        actionTriggerRef.current.smash = true;
      } else if (code === 'KeyQ') {
        actionTriggerRef.current.swarm = true;
      } else if (code === 'KeyM') {
        const m = !sfx.isMuted();
        sfx.setMuted(m);
        setMuted(m);
      }
    };
    const onKeyUp = (e) => {
      keysRef.current[e.code] = false;
    };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    const clearKeys = () => { keysRef.current = {}; };
    window.addEventListener('blur', clearKeys);
    sfx.startMusic();
    sfx.onTrack(name => pushKillFeed(`🎵 Now playing: ${name}`, '#c084fc'));
    const blockGesture = ev => {
      if (ev.target && ev.target.closest && ev.target.closest('[data-scroll]')) return;
      ev.preventDefault();
    };
    document.addEventListener('gesturestart', blockGesture);
    document.addEventListener('touchmove', blockGesture, { passive: false });

    const animate = (now) => {
      animationFrameId = requestAnimationFrame(animate);
      const rawDt = Math.max(0, Math.min((now - prevTime) / 1000, 0.1));
      prevTime = now;
      let dt = rawDt;
      if (fx.hitStop > 0) {
        fx.hitStop -= rawDt;
      }
      if (fx.slowmo > 0) {
        fx.slowmo -= rawDt;
      }
      if (fx.liqTimer > 0) fx.liqTimer -= dt;
      if (fx.comboTimer > 0) fx.comboTimer -= rawDt;

      cdState.call = Math.max(0, cdState.call - dt);
      cdState.smash = Math.max(0, cdState.smash - dt);
      cdState.swarm = Math.max(0, cdState.swarm - dt);

      // ---------- match clock ----------
      const frozen = match.countdown > 0 || match.over;
      if (match.countdown > 0) match.countdown -= rawDt;
      else if (!match.over) {
        match.left -= dt;
        if (!matchRef.finalRush && match.left <= 30) {
          matchRef.finalRush = true;
          announceNow('FINAL 30s! KNOCKBACK x1.5', '#f97316');
          sfx.setRush(true);
          setArenaEventText('🔥 FINAL RUSH: EVERY HIT KNOCKS 1.5x FURTHER!');
          sfx.play('streak');
        }
        if (match.left <= 0) {
          match.over = true;
          const board = [...fighters]
            .map(f => ({ id: f.id, name: f.name, isLocal: f.isLocal, color: f.gangColor, kos: f.kos, deaths: f.deaths || 0, gang: f.minions.length + 1 }))
            .sort((a, b) => b.kos - a.kos || a.deaths - b.deaths || b.gang - a.gang);
          const myRank = board.findIndex(b => b.isLocal) + 1;
          announceNow(myRank === 1 ? 'VICTORY! 🏆' : 'TIME!', myRank === 1 ? '#facc15' : '#ffffff');
          sfx.play(myRank === 1 ? 'streak' : 'ko');
          setTimeout(() => setResults({ board, myRank, kos: localFighter.kos, ...stats }), 1600);
        }
      }
      if (frozen) {
        actionTriggerRef.current.call = false;
        actionTriggerRef.current.smash = false;
        actionTriggerRef.current.swarm = false;
        actionTriggerRef.current.jump = false;
      }

      // ---------- rug pull ----------
      if (rug) {
        rug.t -= dt;
        if (rug.phase === 'warn') {
          const k = 1 - rug.t / 3; // cracks spread and brighten as the collapse nears
          rug.mat.opacity = (0.25 + k * 0.6) * (0.7 + Math.sin(now * (0.012 + k * 0.03)) * 0.3);
          if (Math.random() < 0.3 + k * 0.6) {
            const [ex, ez] = sectorPoint();
            burst(ex, 0.15, ez, Math.random() < 0.5 ? '#ff7a2a' : '#ffb347', 1, 1.2);
          }
          const lp = localFighter.mesh.position;
          if (Math.hypot(lp.x, lp.z) > RUG_INNER - 4) fx.shake = Math.max(fx.shake, 0.1 + k * 0.25);
          if (rug.t <= 0) {
            openRug();
            rug.phase = 'open';
            rug.t = 6;
            fx.shake = Math.min(1.6, fx.shake + 0.9);
            sfx.play('ko', 0.7);
            setArenaEventText('🕳️ RUG PULLED! THE FLOOR IS GONE!');
          }
        } else if (rug.phase === 'open') {
          if (rug.slab) {
            rug.slabVy -= 30 * dt;
            rug.slab.position.y += rug.slabVy * dt;
            rug.slab.rotation.z += rug.spin * dt;
            rug.slab.rotation.x = -Math.PI / 2 + Math.min(0.5, -rug.slab.position.y * 0.012);
            if (rug.slab.position.y < -45) {
              scene.remove(rug.slab);
              rug.slab = null;
            }
          }
          rug.vortex.material.rotation += 0.6 * dt;
          rug.edgeMat.opacity = 0.6 + Math.sin(now * 0.02) * 0.4;
          if (Math.random() < 0.35) {
            const [ex, ez] = sectorPoint();
            burst(ex, -1.5, ez, '#ff6a2a', 1, 1.5);
          }
          if (rug.t <= 0) {
            if (rug.slab) scene.remove(rug.slab);
            rug.slab = makeSlab();
            rug.slab.position.y = -16;
            rug.phase = 'close';
            rug.t = 1.4;
            setArenaEventText('🪨 THE FLOOR IS RISING BACK...');
          }
        } else {
          rug.slab.position.y += (-2.98 - rug.slab.position.y) * Math.min(1, 5 * dt);
          if (rug.t <= 0) {
            scene.remove(rug.slab);
            rug.extras.forEach(o => scene.remove(o));
            rug = null;
            fx.shake = Math.min(1.6, fx.shake + 0.3);
            setArenaEventText('✅ FLOOR RESTORED • KEEP SWINGING!');
          }
        }
      }

      if (net.isHost && !frozen) {
        whaleTimer -= dt;
        if (whaleTimer <= 0) {
          whaleTimer = 75;
          if (!fighters.some(f => f.isWhale)) {
            const w = createFighterEntity(`${myIdRef.current}_whale`, '🐋 THE WHALE', PANDA_CLASSES[2], false, true, Math.random() * 6.28, 3);
            w.mesh.position.set(0, 22, 0);
            makeWhale(w);
            fighters.push(w);
          }
        }
      }

      powerTimer += dt;
      if (powerTimer > 8) {
        powerTimer = 0;
        spawnPowerup();
      }
      for (let i = powerups.length - 1; i >= 0; i--) {
        const pu = powerups[i];
        pu.icon.position.y = 1.9 + Math.sin(now * 0.004 + pu.ph) * 0.35;
        pu.grp.rotation.y += dt;
        const taker = fighters.find(f => (f.isLocal || f.isBot) && f.mesh.position.distanceTo(pu.grp.position) < 2.6);
        if (taker) {
          applyPowerup(taker, pu.type);
          scene.remove(pu.grp);
          powerups.splice(i, 1);
        }
      }

      const beat = Math.pow(1 - ((now / 1000) * (124 / 60)) % 1, 3);
      pillarMats.forEach((m, i) => (m.emissiveIntensity = 1.8 + Math.sin(now * 0.017 + i * 1.7) * 0.5 + Math.sin(now * 0.041 + i) * 0.3 + beat * 0.8));
      shafts.forEach(sh => (sh.sm.opacity = sh.base * (0.75 + Math.sin(now * 0.0007 + sh.ph) * 0.25)));
      mists.forEach(m => {
        m.a += m.sp * dt;
        m.mist.position.x = Math.cos(m.a) * 30;
        m.mist.position.z = Math.sin(m.a) * 30;
      });
      dust.rotation.y += 0.01 * dt;
      dust.position.y = Math.sin(now * 0.0003) * 0.6;
      candles.forEach(c => (c.grp.position.y = c.base + Math.sin(now * 0.0006 + c.ph) * 1.5));
      asteroids.forEach(a => {
        a.rock.rotation.x += a.spin * dt;
        a.rock.rotation.y += a.spin * 0.7 * dt;
        a.rock.position.y += Math.sin(now * 0.0005 + a.ph) * 0.01;
      });
      bumpers.forEach(b => {
        b.pulse = Math.max(0, b.pulse - dt * 4);
        const sc = 1 + b.pulse * 0.25;
        b.grp.scale.set(sc, 1 + b.pulse * 0.1, sc);
        b.mat.emissiveIntensity = 0.35 + b.pulse * 3;
      });

      hazardTimer += dt;
      if (hazardTimer > 16) {
        hazardTimer = 0;
        spawnWildPanda();
        spawnWildPanda();
        const roll = Math.random();
        if (roll < 0.4 && !rug) {
          startRug();
        } else if (roll < 0.7) {
          fx.liqTimer = 10;
          setArenaEventText('⚡ LIQUIDATION CANDLE: KNOCKBACK +35% FOR 10s!');
        } else {
          setArenaEventText('🌕 FULL MOON AIRDROP: +2 WILD PANDAS SPAWNED!');
        }
      }

      let moveX = 0;
      let moveZ = 0;
      if (keysRef.current['KeyW'] || keysRef.current['ArrowUp']) moveZ -= 1;
      if (keysRef.current['KeyS'] || keysRef.current['ArrowDown']) moveZ += 1;
      if (keysRef.current['KeyA'] || keysRef.current['ArrowLeft']) moveX -= 1;
      if (keysRef.current['KeyD'] || keysRef.current['ArrowRight']) moveX += 1;

      if (joystickRef.current.active) {
        moveX += joystickRef.current.dx;
        moveZ += joystickRef.current.dy;
      }
      if (frozen) {
        moveX = 0;
        moveZ = 0;
      }

      const moveLen = Math.hypot(moveX, moveZ);
      const localAirborne = localFighter.mesh.position.y > 0.05;
      if (actionTriggerRef.current.jump) {
        const jl = moveLen > 0.01 ? moveLen : 1;
        let jx = moveX / jl, jz = moveZ / jl;
        if (moveLen <= 0.01) {
          // no input: double jump drifts back toward the centre
          const r = Math.hypot(localFighter.mesh.position.x, localFighter.mesh.position.z) || 1;
          jx = r > ARENA_RADIUS - 3 ? -localFighter.mesh.position.x / r : 0;
          jz = r > ARENA_RADIUS - 3 ? -localFighter.mesh.position.z / r : 0;
        }
        doJump(localFighter, jx, jz);
      }
      actionTriggerRef.current.jump = false;

      if (localFighter.stun > 0 || localAirborne) {
        // knocked: little control. jumping: decent air control for recovery
        const airCtl = localFighter.stun > 0 ? 9 : 26;
        if (moveLen > 0.01) {
          localFighter.vx += (moveX / moveLen) * airCtl * dt;
          localFighter.vz += (moveZ / moveLen) * airCtl * dt;
          const cap = 16;
          const hs = Math.hypot(localFighter.vx, localFighter.vz);
          if (localFighter.stun <= 0 && hs > cap) {
            localFighter.vx *= cap / hs;
            localFighter.vz *= cap / hs;
          }
        }
      } else if (moveLen > 0.01) {
        const speedBoost = localFighter.swarmTimer > 0 ? 1.48 : 1.0;
        const speed = 13.5 * localFighter.pandaClass.speed * speedBoost * (localFighter.buffs.speed > 0 ? 1.45 : 1);
        localFighter.vx += ((moveX / moveLen) * speed - localFighter.vx) * 10 * dt;
        localFighter.vz += ((moveZ / moveLen) * speed - localFighter.vz) * 10 * dt;
      } else {
        localFighter.vx *= Math.pow(0.08, dt);
        localFighter.vz *= Math.pow(0.08, dt);
      }

      let netEvent = null;
      if (actionTriggerRef.current.call && cdState.call <= 0) {
        cdState.call = 5.5;
        const recruitRadius = localFighter.pandaClass.id === 'street_gm' ? 14 : 10;
        triggerShockwave(localFighter.mesh.position.x, localFighter.mesh.position.z, 0x22c55e, recruitRadius);
        spawnMemeSprite(localFighter.mesh.position.x, 1.5, localFighter.mesh.position.z, '📱 CALLING THE GANG!', '#4ade80');
        sfx.play('call');
        addMinionToFighter(localFighter);
