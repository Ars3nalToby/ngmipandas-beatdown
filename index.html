    };
    const giveWeapon = (f, kind) => {
      if (f.weapon) f.mesh.userData.rightArmGroup.remove(f.weapon.mesh);
      const mesh = makeWeaponMesh(kind);
      f.mesh.userData.rightArmGroup.add(mesh);
      f.weapon = { kind, uses: kind === 'hammer' ? 5 : 3, cd: 0, mesh, swing: 0 };
    };
    const dropWeapon = f => {
      if (!f.weapon) return;
      f.mesh.userData.rightArmGroup.remove(f.weapon.mesh);
      f.weapon = null;
      f.mesh.userData.rightArmGroup.rotation.x = 0;
    };
    const forwardOf = f => {
      const r = f.mesh.rotation.y;
      return [Math.sin(r), Math.cos(r)];
    };
    const useWeapon = f => {
      const w = f.weapon;
      if (!w || w.cd > 0) return false;
      const [fx0, fz0] = forwardOf(f);
      const p = f.mesh.position;
      if (w.kind === 'hammer') {
        w.cd = 0.45;
        w.swing = 0.3;
        sfx.play('smash', f.isLocal ? 0.9 : volAt(p) * 0.5);
        burst(p.x + fx0 * 3, 0.8, p.z + fz0 * 3, '#ffb347', 10, 8);
        fighters.forEach(o => {
          if (o.id === f.id) return;
          const dx = o.mesh.position.x - p.x, dz = o.mesh.position.z - p.z;
          const d = Math.hypot(dx, dz);
          if (d < 5.8 && d > 0.01 && (dx * fx0 + dz * fz0) / d > 0.35) {
            launch(o, f, dx / d, dz / d, 15, 11, 18);
          }
        });
      } else {
        w.cd = 0.7;
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffb070 }));
        mesh.position.set(p.x + fx0 * 2.2, p.y + 1.6, p.z + fz0 * 2.2);
        scene.add(mesh);
        projectiles.push({ mesh, owner: f, vx: fx0 * 38, vz: fz0 * 38, life: 1.3 });
        sfx.play('swarm', f.isLocal ? 0.7 : volAt(p) * 0.4);
        if (f.isLocal) fx.shake = Math.min(1.6, fx.shake + 0.25);
      }
      w.uses -= 1;
      if (w.uses <= 0) setTimeout(() => dropWeapon(f), 350);
      return true;
    };
    const explode = (x, z, owner) => {
      triggerShockwave(x, z, 0xff6a2a, 7);
      burst(x, 1, z, '#ff6a2a', 26, 16);
      burst(x, 1, z, '#ffd27a', 12, 10);
      sfx.play('crit', owner.isLocal ? 1 : volAt(new THREE.Vector3(x, 0, z)) * 0.7);
      fighters.forEach(o => {
        if (o.id === owner.id) return;
        const dx = o.mesh.position.x - x, dz = o.mesh.position.z - z;
        const d = Math.hypot(dx, dz);
        if (d < 6.5) {
          const nx = d > 0.01 ? dx / d : 1, nz = d > 0.01 ? dz / d : 0;
          launch(o, owner, nx, nz, 9 + 9 * (1 - d / 6.5), 10, 16);
        }
      });
      const lp = localFighter.mesh.position;
      if (Math.hypot(lp.x - x, lp.z - z) < 14) fx.shake = Math.min(1.6, fx.shake + 0.6);
    };

    const powerups = [];
    const spawnPowerup = () => {
      if (powerups.length >= 3) return;
      const type = POWERUPS[Math.floor(Math.random() * POWERUPS.length)];
      const a = Math.random() * Math.PI * 2;
      const r = 4 + Math.random() * (ARENA_RADIUS - 10);
      const grp = new THREE.Group();
      const icon = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeEmojiTexture(type.icon), transparent: true }));
      icon.scale.set(2.4, 2.4, 1);
      icon.position.y = 1.9;
      grp.add(icon);
      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.9, 0.9, 9, 20, 1, true),
        new THREE.MeshBasicMaterial({ color: type.color, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false })
      );
      beam.position.y = 4.5;
      grp.add(beam);
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(1.0, 1.35, 32),
        new THREE.MeshBasicMaterial({ color: type.color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.06;
      grp.add(ring);
      grp.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      scene.add(grp);
      powerups.push({ grp, icon, type, ph: Math.random() * 6 });
    };

    const applyPowerup = (f, type) => {
      if (type.id === 'burger') f.buffs.speed = 7;
      if (type.id === 'diamond') f.buffs.armor = 8;
      if (type.id === 'rocket') f.buffs.pump = 6;
      if (type.id === 'hammer' || type.id === 'launcher') giveWeapon(f, type.id);
      if (type.id === 'gift') {
        addMinionToFighter(f);
        addMinionToFighter(f);
        addMinionToFighter(f);
      }
      const pos = f.mesh.position;
      burst(pos.x, 1.5, pos.z, type.color, 16, 10);
      if (f.isLocal) {
        spawnMemeSprite(pos.x, 2.4, pos.z, type.label, type.color);
        if (type.id === 'rocket') cdState.smash = 0;
      }
      sfx.play('powerup', f.isLocal ? 1 : volAt(pos) * 0.6);
    };

    let mqttScript = null;
    const topic = `ngmipandas/beatdown3d/v3/${roomCode.trim().toUpperCase()}`;
    const send = obj => {
      const c = mqttClientRef.current;
      if (c && c.connected) {
        try { c.publish(topic, JSON.stringify(obj)); } catch (e) {}
      }
    };
    const upsertRemote = (id, name, classId) => {
      let f = fighters.find(x => x.id === id);
      if (!f) {
        const pClass = PANDA_CLASSES.find(c => c.id === classId) || PANDA_CLASSES[0];
        f = createFighterEntity(id, name, pClass, false, false, 0, fighters.length);
        f.remote = true;
        if (id.endsWith('_whale')) makeWhale(f);
        fighters.push(f);
      }
      net.remoteSeen[id] = performance.now();
      return f;
    };
    const applyRemoteState = (f, d) => {
      if (d.cos !== undefined && f.cosApplied !== d.cos) {
        applyCosmetic(f.mesh, d.cos);
        f.cosApplied = d.cos;
      }
      f.targetX = d.x;
      f.targetY = d.y || 0;
      f.targetZ = d.z;
      f.dmg = d.d || 0;
      f.kos = d.k || 0;
      f.deaths = d.dt || 0;
      f.streak = d.st || 0;
      const want = Math.min(16, d.m || 0);
      while (f.minions.length < want) addMinionToFighter(f);
      while (f.minions.length > want) scene.remove(f.minions.pop().mesh);
    };

    const initMultiplayer = () => {
      if (!window.mqtt) return;
      setNetStatus('CONNECTING...');
      const client = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: `ngmi_${myIdRef.current}`,
        clean: true,
        connectTimeout: 4000
      });

      mqttClientRef.current = client;

      client.on('connect', () => {
        setNetStatus('LIVE ONLINE');
        client.subscribe(topic);
      });

      client.on('message', (t, payload) => {
        let data;
        try {
          data = JSON.parse(payload.toString());
        } catch (err) {
          return;
        }
        if (!data || data.id === myIdRef.current) return;

        if (data.t === 's') {
          // full state from another human (and their bots if they are the host)
          const isNew = !remotePlayersRef.current[data.id];
          remotePlayersRef.current[data.id] = { name: data.name, lastSeen: performance.now() };
          const f = upsertRemote(data.id, data.name, data.c);
          applyRemoteState(f, data);
          if (isNew) pushKillFeed(`🟢 ${data.name} joined Room ${roomCode}!`, '#38bdf8');
          if (data.ev === 'dash') doDash(f, Math.sin(f.mesh.rotation.y), Math.cos(f.mesh.rotation.y));
          if (data.ev === 'cannon') fireCannon(f);
          if (data.ev === 'tornado') startTornado(f);
          if (data.ev === 'smash') {
            triggerShockwave(data.x, data.z, f.gangColor, 9);
            sfx.play('smash', volAt(f.mesh.position) * 0.6);
          }
          if (Array.isArray(data.b) && data.id === net.hostId) {
            data.b.forEach(b => applyRemoteState(upsertRemote(b.i, b.n, b.c), b));
          }
          if (data.id === net.hostId && typeof data.left === 'number' && Math.abs(match.left - data.left) > 1.5) {
            match.left = data.left;
          }
        } else if (data.t === 'h') {
          // someone hit one of MY fighters: I own their physics, so I apply it
          const target = fighters.find(x => x.id === data.to && (x.isLocal || x.isBot));
          if (!target) return;
          const src = fighters.find(x => x.id === data.from);
          const attacker = {
            id: data.from,
            name: src ? src.name : 'Someone',
            gangColor: src ? src.gangColor : '#ffffff',
            pandaClass: { power: data.pw || 1 },
            buffs: { pump: 0 },
            isLocal: false
          };
          launch(target, attacker, data.dx, data.dz, data.b, data.u, data.dm);
          if (src) target.lastHitBy = src;
          target.lastHitAt = performance.now();
          if (data.fl && Math.random() < 0.5) flingMinion(target, data.dx, data.dz);
        } else if (data.t === 'k') {
          // a fighter owned by someone else got ringed out by one of MINE
          const killer = fighters.find(x => x.id === data.killer && (x.isLocal || x.isBot));
          if (killer) creditKO(killer, data.vn, data.vx || 0, data.vz || 0, data.vs || 0, !!data.vw);
          else pushKillFeed(`💥 ${data.kn}'s gang RINGED OUT ${data.vn}!`, '#facc15');
        }
      });
    };

    if (window.mqtt) {
      initMultiplayer();
    } else {
      mqttScript = document.createElement('script');
      mqttScript.src = 'https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js';
      mqttScript.async = true;
      mqttScript.onload = initMultiplayer;
      document.body.appendChild(mqttScript);
    }

    const cdState = { call: 0, smash: 0, swarm: 0, dash: 0, cannon: 0 };
    const ult = { v: 0 }; // 🌪️ tornado meter: fills as your gang lands hits and K.O.s
    const camLook = new THREE.Vector3(0, 1, -3);
    // adaptive resolution: drop pixel ratio when the phone can't hold ~45fps, raise it back when it can
    const perf = { acc: 0, n: 0, t: 0, warm: 3, pr: renderer.getPixelRatio(), max: renderer.getPixelRatio() };
    const setPR = v => {
      perf.pr = Math.round(v * 100) / 100;
      renderer.setPixelRatio(perf.pr);
      if (post) post.setSize();
    };
    let lastNetBroadcast = 0;
    let lastHudSync = 0;
    let hazardTimer = 0;
    let powerTimer = 5;
    let animationFrameId;
    let prevTime = performance.now();

    const creditKO = (killer, victimName, vx, vz, victimStreak = 0, victimWhale = false) => {
      killer.kos += 1;
      addMinionToFighter(killer);
      if (victimStreak >= 3) {
        killer.kos += 1;
        if (killer.isLocal) announceNow('👑 BOUNTY CLAIMED! +1 K.O.', '#facc15');
        pushKillFeed(`👑 ${killer.name} claimed the bounty on ${victimName}!`, '#facc15');
      }
      if (victimWhale) {
        killer.kos += 2;
        for (let w = 0; w < 4; w++) addMinionToFighter(killer);
        announceNow(`🐋 ${killer.isLocal ? 'YOU' : killer.name} HUNTED THE WHALE!`, '#38bdf8');
      }
      killer.streak = (killer.streak || 0) + 1;
      killer.maxStreak = Math.max(killer.maxStreak || 0, killer.streak);
      if (killer.isLocal) {
        ult.v = Math.min(100, ult.v + 22);
        buzz([20, 30, 50]);
        setMyKos(killer.kos);
        fx.shake = 1.6;
        spawnMemeSprite(vx * 0.7, 3, vz * 0.7, 'K.O.!! 💥', '#facc15');
        flash(0.35);
        fx.postFlash = 0.25;
        sfx.play('ko');
        if (/paperhands/i.test(victimName || '')) setTimeout(() => announceNow('🧻 YOU RUGGED THE RUGGER!', '#fb7185'), 900);
        const STREAKS = { 2: ['DOUBLE K.O.!', '#38bdf8'], 3: ['TRIPLE K.O.!!', '#a855f7'], 4: ['RAMPAGE!!!', '#f97316'], 5: ['UNSTOPPABLE GMI!!!', '#facc15'] };
        const st = STREAKS[Math.min(killer.streak, 5)];
        if (killer.streak >= 2 && bdClipRef.current) bdClipRef.current.highlight(st ? st[0].replace(/!+$/, '') : 'MULTI K.O.');
        if (st) {
          announceNow(st[0], st[1]);
          sayLine(st[0].replace(/[^A-Za-z .]/g, '').toLowerCase());
          sfx.play('streak');
        }
      }
      pushKillFeed(`💥 ${killer.name}'s gang RINGED OUT ${victimName}!`, '#facc15');
    };

    // Ring smash shockwave. Airborne targets dodge it (jump to dodge!)
    const doSmash = (attacker, radius, powerMul, label) => {
      const px = attacker.mesh.position.x;
      const pz = attacker.mesh.position.z;
      attacker.punchAnim = 0.45;
      triggerShockwave(px, pz, 0xfacc15, radius);
      spawnMemeSprite(px, 1.8, pz, label, '#facc15');
      sfx.play('smash', attacker.isLocal ? 1 : volAt(attacker.mesh.position) * 0.6);
      if (attacker.isLocal) fx.shake = Math.min(1.6, fx.shake + 0.5 * powerMul);
      burst(px, 0.6, pz, '#facc15', 18, 14);
      fighters.forEach(other => {
        if (other.id === attacker.id) return;
        if (other.mesh.position.y > 1.6) {
          if (other.isLocal) spawnMemeSprite(other.mesh.position.x, 2, other.mesh.position.z, 'DODGED! 😎', '#38bdf8');
          return;
        }
        const dx = other.mesh.position.x - px;
        const dz = other.mesh.position.z - pz;
        const dist = Math.hypot(dx, dz);
        if (dist < radius && dist > 0.01) {
          const closeness = (radius - dist) / radius;
          launch(other, attacker, dx / dist, dz / dist, (7 + 9 * closeness) * powerMul, 8, (14 + 10 * closeness) * powerMul);
          if (Math.random() < 0.5) flingMinion(other, dx / dist, dz / dist);
        }
      });
    };

    // ---------- NEW MOVES ----------
    // 🐂 DASH: short burst that bowls over anyone in the way
    const doDash = (f, dx, dz) => {
      f.dashT = 0.2;
      f.dashDir = [dx, dz];
      f.dashHit = {};
      f.vx = dx * 46;
      f.vz = dz * 46;
      if (f.mesh.position.y <= 0.05) f.vy = Math.max(f.vy, 2.5);
      f.mesh.rotation.y = Math.atan2(dx, dz);
      f.squash = 0.35;
      sfx.play('dash', f.isLocal ? 1 : volAt(f.mesh.position) * 0.5);
      burst(f.mesh.position.x, 0.4, f.mesh.position.z, '#e2e8f0', 8, 6);
      if (f.isLocal) { fx.shake = Math.min(1.6, fx.shake + 0.12); buzz(8); }
    };
    // 🐼💥 PANDA CANNON: throw one of your own gang at the nearest rival in front of you
    const cannonballs = [];
    const fireCannon = f => {
      const lost = f.minions.pop();
      if (!lost) return false;
      if (f.isLocal) setMyGangSize(f.minions.length + 1);
      const p = f.mesh.position;
      let [ax, az] = forwardOf(f);
      let best = null, bd = 30;
      fighters.forEach(o => {
        if (o.id === f.id || o.respawnLock > 0) return;
        const dx = o.mesh.position.x - p.x, dz = o.mesh.position.z - p.z, d = Math.hypot(dx, dz);
        if (d < bd && d > 1 && (dx * ax + dz * az) / d > 0.4) { bd = d; best = o; }
      });
      if (best) {
        const dx = best.mesh.position.x - p.x, dz = best.mesh.position.z - p.z, d = Math.hypot(dx, dz) || 1;
        ax = dx / d;
        az = dz / d;
      }
      f.mesh.rotation.y = Math.atan2(ax, az);
      f.punchAnim = 0.3;
      const m = lost.mesh;
      m.position.set(p.x + ax * 1.6, Math.max(0, p.y) + 1.8, p.z + az * 1.6);
      const flight = best ? Math.min(1.1, Math.max(0.35, bd / 34)) : 0.9;
      cannonballs.push({ mesh: m, owner: f, vx: ax * 34, vz: az * 34, vy: 7 * flight, life: 1.15 });
      sfx.play('cannon', f.isLocal ? 1 : volAt(p) * 0.6);
      burst(m.position.x, m.position.y, m.position.z, '#ffffff', 6, 6);
      if (f.isLocal) { fx.shake = Math.min(1.6, fx.shake + 0.2); buzz(10); }
      return true;
    };
    // 🌪️ PANDA TORNADO (ultimate): the whole gang spins around you as a launching wall
    const startTornado = f => {
      f.tornadoT = 5;
      f.tornadoHit = {};
      while (f.minions.length < 8) addMinionToFighter(f);
      triggerShockwave(f.mesh.position.x, f.mesh.position.z, 0x38bdf8, 11);
      spawnMemeSprite(f.mesh.position.x, 2.4, f.mesh.position.z, '🌪️ PANDA TORNADO!', '#38bdf8');
      sfx.play('tornado', f.isLocal ? 1 : volAt(f.mesh.position) * 0.7);
      if (f.isLocal) {
        announceNow('🌪️ PANDA TORNADO!', '#38bdf8');
        fx.shake = Math.min(1.6, fx.shake + 0.8);
        flash(0.22);
        buzz([20, 30, 20]);
      }
    };
    const tornadoGeo = { ring: new THREE.TorusGeometry(3.7, 0.18, 8, 56), funnel: (() => { const g = new THREE.CylinderGeometry(4.6, 1.2, 7, 28, 1, true); g.translate(0, 3.5, 0); return g; })() };
    const ensureTornadoFx = f => {
      if (f.tornadoFx) return f.tornadoFx;
      const g = new THREE.Group();
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false });
      const ring = new THREE.Mesh(tornadoGeo.ring, ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.5;
      const funMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
      const funnel = new THREE.Mesh(tornadoGeo.funnel, funMat);
      g.add(ring, funnel);
      g.userData = { ring, funnel, ringMat, funMat };
      scene.add(g);
      f.tornadoFx = g;
      return g;
    };

    const doJump = (f, dirX, dirZ) => {
      if (f.jumps <= 0 || f.stun > 0 || f.pounding) return false;
      const first = f.jumps === 2 && f.mesh.position.y <= 0.05;
      f.vy = first ? 16 : 15;
      if (!first) {
        // double jump: also a horizontal burst so you can recover from the edge
        f.vx = f.vx * 0.4 + dirX * 14;
        f.vz = f.vz * 0.4 + dirZ * 14;
        burst(f.mesh.position.x, f.mesh.position.y + 0.3, f.mesh.position.z, '#e2e8f0', 8, 5);
      }
      f.jumps -= 1;
      f.squash = 0.4;
      sfx.play('pop', f.isLocal ? 0.9 : volAt(f.mesh.position) * 0.5, first ? 0.7 : 1.1);
      return true;
    };

    const onKeyDown = (e) => {
      const code = e.code;
      keysRef.current[code] = true;
      if (code === 'Space') {
        e.preventDefault();
        if (!e.repeat) actionTriggerRef.current.jump = true;
      } else if (code === 'KeyR' || code === 'KeyF') {
        actionTriggerRef.current.call = true;
      } else if (code === 'KeyE') {
        actionTriggerRef.current.smash = true;
      } else if (code === 'KeyQ') {
        actionTriggerRef.current.swarm = true;
      } else if (code === 'ShiftLeft' || code === 'ShiftRight') {
        if (!e.repeat) actionTriggerRef.current.dash = true;
      } else if (code === 'KeyC') {
        actionTriggerRef.current.cannon = true;
      } else if (code === 'KeyT' || code === 'KeyX') {
        actionTriggerRef.current.ult = true;
      } else if (code === 'KeyM') {
        const m = !sfx.isMuted();
        sfx.setMuted(m);
        setMuted(m);
      }
    };
    const onKeyUp = (e) => {
      keysRef.current[e.code] = false;
    };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    const clearKeys = () => { keysRef.current = {}; };
    window.addEventListener('blur', clearKeys);
    sfx.startMusic();
    sfx.onTrack(name => pushKillFeed(`🎵 Now playing: ${name}`, '#c084fc'));
    const blockGesture = ev => {
      if (ev.target && ev.target.closest && ev.target.closest('[data-scroll]')) return;
      ev.preventDefault();
    };
    document.addEventListener('gesturestart', blockGesture);
    document.addEventListener('touchmove', blockGesture, { passive: false });

    const animate = (now) => {
      animationFrameId = requestAnimationFrame(animate);
      const rawDt = Math.max(0, Math.min((now - prevTime) / 1000, 0.1));
      prevTime = now;
      let dt = rawDt;
      if (fx.hitStop > 0) {
        fx.hitStop -= rawDt;
      }
      if (fx.slowmo > 0) {
        fx.slowmo -= rawDt;
      }
      if (fx.liqTimer > 0) fx.liqTimer -= dt;
      if (fx.comboTimer > 0) fx.comboTimer -= rawDt;

      cdState.call = Math.max(0, cdState.call - dt);
      cdState.dash = Math.max(0, cdState.dash - dt);
      cdState.cannon = Math.max(0, cdState.cannon - dt);
      perf.acc += rawDt; perf.n += 1; perf.t += rawDt;
      if (perf.t > 2) {
        const avg = perf.acc / Math.max(1, perf.n);
        if (perf.warm > 0) perf.warm -= perf.t;
        else if (avg > 1 / 42 && perf.pr > 0.7) setPR(perf.pr - 0.15);
        else if (avg < 1 / 57 && perf.pr < perf.max) setPR(Math.min(perf.max, perf.pr + 0.1));
        perf.acc = 0; perf.n = 0; perf.t = 0;
      }
      cdState.smash = Math.max(0, cdState.smash - dt);
      cdState.swarm = Math.max(0, cdState.swarm - dt);

      // ---------- match clock ----------
      const frozen = match.countdown > 0 || match.over;
      if (match.countdown > 0) match.countdown -= rawDt;
      else if (!match.over) {
        match.left -= dt;
        if (!matchRef.finalRush && match.left <= 30) {
          matchRef.finalRush = true;
          announceNow('FINAL 30s! KNOCKBACK x1.5', '#f97316');
          sayLine('Final thirty seconds');
          sfx.setRush(true);
          setArenaEventText('🔥 FINAL RUSH: EVERY HIT KNOCKS 1.5x FURTHER!');
          sfx.play('streak');
        }
        if (match.left <= 0) {
          match.over = true;
          const board = [...fighters]
            .map(f => ({ id: f.id, name: f.name, isLocal: f.isLocal, color: f.gangColor, kos: f.kos, deaths: f.deaths || 0, gang: f.minions.length + 1 }))
            .sort((a, b) => b.kos - a.kos || a.deaths - b.deaths || b.gang - a.gang);
          const myRank = board.findIndex(b => b.isLocal) + 1;
          announceNow(myRank === 1 ? 'VICTORY! 🏆' : 'TIME!', myRank === 1 ? '#facc15' : '#ffffff');
          sfx.play(myRank === 1 ? 'streak' : 'ko');
          const xpRes = awardXp({ kills: localFighter.kos, deaths: localFighter.deaths || 0, won: myRank === 1, bestStreak: localFighter.maxStreak || 0 });
          sayLine(myRank === 1 ? 'Victory' : 'Time');
          const storyRes = storyEval(storyRunRef.current, { game: 'beatdown', kills: localFighter.kos, bestStreak: localFighter.maxStreak || 0, won: myRank === 1, rank: myRank });
          setTimeout(() => setResults({ board, myRank, kos: localFighter.kos, ...stats, xp: xpRes, story: storyRes }), 1600);
        }
      }
      if (frozen) {
        actionTriggerRef.current.call = false;
        actionTriggerRef.current.smash = false;
        actionTriggerRef.current.swarm = false;
        actionTriggerRef.current.jump = false;
        actionTriggerRef.current.dash = false;
        actionTriggerRef.current.cannon = false;
        actionTriggerRef.current.ult = false;
      }

      // ---------- rug pull ----------
      if (rug) {
        rug.t -= dt;
        if (rug.phase === 'warn') {
          const k = 1 - rug.t / 3; // cracks spread and brighten as the collapse nears
          rug.mat.opacity = (0.25 + k * 0.6) * (0.7 + Math.sin(now * (0.012 + k * 0.03)) * 0.3);
          if (Math.random() < 0.3 + k * 0.6) {
            const [ex, ez] = sectorPoint();
            burst(ex, 0.15, ez, Math.random() < 0.5 ? '#ff7a2a' : '#ffb347', 1, 1.2);
          }
          const lp = localFighter.mesh.position;
          if (Math.hypot(lp.x, lp.z) > RUG_INNER - 4) fx.shake = Math.max(fx.shake, 0.1 + k * 0.25);
          if (rug.t <= 0) {
            openRug();
            rug.phase = 'open';
            rug.t = 6;
            fx.shake = Math.min(1.6, fx.shake + 0.9);
            sfx.play('ko', 0.7);
            setArenaEventText('🕳️ RUG PULLED! THE FLOOR IS GONE!');
          }
        } else if (rug.phase === 'open') {
          if (rug.slab) {
            rug.slabVy -= 30 * dt;
            rug.slab.position.y += rug.slabVy * dt;
            rug.slab.rotation.z += rug.spin * dt;
            rug.slab.rotation.x = -Math.PI / 2 + Math.min(0.5, -rug.slab.position.y * 0.012);
            if (rug.slab.position.y < -45) {
              scene.remove(rug.slab);
              rug.slab = null;
            }
          }
          rug.vortex.material.rotation += 0.6 * dt;
          rug.edgeMat.opacity = 0.6 + Math.sin(now * 0.02) * 0.4;
          if (Math.random() < 0.35) {
            const [ex, ez] = sectorPoint();
            burst(ex, -1.5, ez, '#ff6a2a', 1, 1.5);
          }
          if (rug.t <= 0) {
            if (rug.slab) scene.remove(rug.slab);
            rug.slab = makeSlab();
            rug.slab.position.y = -16;
            rug.phase = 'close';
            rug.t = 1.4;
            setArenaEventText('🪨 THE FLOOR IS RISING BACK...');
          }
        } else {
          rug.slab.position.y += (-2.98 - rug.slab.position.y) * Math.min(1, 5 * dt);
          if (rug.t <= 0) {
            scene.remove(rug.slab);
            rug.extras.forEach(o => scene.remove(o));
            rug = null;
            fx.shake = Math.min(1.6, fx.shake + 0.3);
            setArenaEventText('✅ FLOOR RESTORED • KEEP SWINGING!');
          }
        }
      }

      if (net.isHost && !frozen) {
        whaleTimer -= dt;
        if (whaleTimer <= 0) {
          whaleTimer = 75;
          if (!fighters.some(f => f.isWhale)) {
            const w = createFighterEntity(`${myIdRef.current}_whale`, '🐋 THE WHALE', PANDA_CLASSES[2], false, true, Math.random() * 6.28, 3);
            w.mesh.position.set(0, 22, 0);
            makeWhale(w);
            fighters.push(w);
          }
        }
      }

      powerTimer += dt;
      if (powerTimer > 8) {
        powerTimer = 0;
        spawnPowerup();
      }
      for (let i = powerups.length - 1; i >= 0; i--) {
        const pu = powerups[i];
        pu.icon.position.y = 1.9 + Math.sin(now * 0.004 + pu.ph) * 0.35;
        pu.grp.rotation.y += dt;
        const taker = fighters.find(f => (f.isLocal || f.isBot) && f.mesh.position.distanceTo(pu.grp.position) < 2.6);
        if (taker) {
          applyPowerup(taker, pu.type);
          scene.remove(pu.grp);
          powerups.splice(i, 1);
        }
      }

      const beat = Math.pow(1 - ((now / 1000) * (124 / 60)) % 1, 3);
      pillarMats.forEach((m, i) => (m.emissiveIntensity = 1.8 + Math.sin(now * 0.017 + i * 1.7) * 0.5 + Math.sin(now * 0.041 + i) * 0.3 + beat * 0.8));
      shafts.forEach(sh => (sh.sm.opacity = sh.base * (0.75 + Math.sin(now * 0.0007 + sh.ph) * 0.25)));
      mists.forEach(m => {
        m.a += m.sp * dt;
        m.mist.position.x = Math.cos(m.a) * 30;
        m.mist.position.z = Math.sin(m.a) * 30;
      });
      dust.rotation.y += 0.01 * dt;
      dust.position.y = Math.sin(now * 0.0003) * 0.6;
      candles.forEach(c => (c.grp.position.y = c.base + Math.sin(now * 0.0006 + c.ph) * 1.5));
      asteroids.forEach(a => {
        a.rock.rotation.x += a.spin * dt;
        a.rock.rotation.y += a.spin * 0.7 * dt;
        a.rock.position.y += Math.sin(now * 0.0005 + a.ph) * 0.01;
      });
      bumpers.forEach(b => {
        b.pulse = Math.max(0, b.pulse - dt * 4);
        const sc = 1 + b.pulse * 0.25;
        b.grp.scale.set(sc, 1 + b.pulse * 0.1, sc);
        b.mat.emissiveIntensity = 0.35 + b.pulse * 3;
      });

      hazardTimer += dt;
      if (hazardTimer > 16) {
        hazardTimer = 0;
        spawnWildPanda();
        spawnWildPanda();
        const roll = Math.random();
        if (roll < 0.4 && !rug) {
          startRug();
        } else if (roll < 0.7) {
          fx.liqTimer = 10;
          setArenaEventText('⚡ LIQUIDATION CANDLE: KNOCKBACK +35% FOR 10s!');
        } else {
          setArenaEventText('🌕 FULL MOON AIRDROP: +2 WILD PANDAS SPAWNED!');
        }
      }

      let moveX = 0;
      let moveZ = 0;
      if (keysRef.current['KeyW'] || keysRef.current['ArrowUp']) moveZ -= 1;
      if (keysRef.current['KeyS'] || keysRef.current['ArrowDown']) moveZ += 1;
      if (keysRef.current['KeyA'] || keysRef.current['ArrowLeft']) moveX -= 1;
      if (keysRef.current['KeyD'] || keysRef.current['ArrowRight']) moveX += 1;

      if (joystickRef.current.active) {
        const jx = joystickRef.current.dx, jy = joystickRef.current.dy, jl = Math.hypot(jx, jy);
        if (jl > 0.14) {
          // small dead zone + smooth ramp so tiny thumb wobbles don't jitter the panda
          const k = Math.min(1, (jl - 0.14) / 0.86) / jl;
          moveX += jx * k;
          moveZ += jy * k;
        }
      }
      if (frozen) {
        moveX = 0;
        moveZ = 0;
      }

      const moveLen = Math.hypot(moveX, moveZ);
      const localAirborne = localFighter.mesh.position.y > 0.05;
      if (actionTriggerRef.current.jump) {
        const jl = moveLen > 0.01 ? moveLen : 1;
        let jx = moveX / jl, jz = moveZ / jl;
        if (moveLen <= 0.01) {
          // no input: double jump drifts back toward the centre
          const r = Math.hypot(localFighter.mesh.position.x, localFighter.mesh.position.z) || 1;
          jx = r > ARENA_RADIUS - 3 ? -localFighter.mesh.position.x / r : 0;
          jz = r > ARENA_RADIUS - 3 ? -localFighter.mesh.position.z / r : 0;
        }
        doJump(localFighter, jx, jz);
      }
      actionTriggerRef.current.jump = false;

      if (localFighter.dashT > 0) {
        // mid-dash: keep the burst
      } else if (localFighter.stun > 0 || localAirborne) {
        // knocked: little control. jumping: decent air control for recovery
        const airCtl = localFighter.stun > 0 ? 9 : 26;
        if (moveLen > 0.01) {
          localFighter.vx += (moveX / moveLen) * airCtl * dt;
          localFighter.vz += (moveZ / moveLen) * airCtl * dt;
          const cap = 16;
          const hs = Math.hypot(localFighter.vx, localFighter.vz);
          if (localFighter.stun <= 0 && hs > cap) {
            localFighter.vx *= cap / hs;
            localFighter.vz *= cap / hs;
          }
        }
      } else if (moveLen > 0.01) {
        const speedBoost = (localFighter.swarmTimer > 0 ? 1.48 : 1.0) * (localFighter.tornadoT > 0 ? 1.3 : 1);
        const speed = 13.5 * localFighter.pandaClass.speed * speedBoost * (localFighter.buffs.speed > 0 ? 1.45 : 1);
        localFighter.vx += ((moveX / moveLen) * speed - localFighter.vx) * 10 * dt;
        localFighter.vz += ((moveZ / moveLen) * speed - localFighter.vz) * 10 * dt;
      } else {
        localFighter.vx *= Math.pow(0.08, dt);
        localFighter.vz *= Math.pow(0.08, dt);
      }

      let netEvent = null;
      if (actionTriggerRef.current.call && cdState.call <= 0) {
        cdState.call = 5.5;
        const recruitRadius = localFighter.pandaClass.id === 'street_gm' ? 14 : 10;
        triggerShockwave(localFighter.mesh.position.x, localFighter.mesh.position.z, 0x22c55e, recruitRadius);
        spawnMemeSprite(localFighter.mesh.position.x, 1.5, localFighter.mesh.position.z, '📱 CALLING THE GANG!', '#4ade80');
        sfx.play('call');
        addMinionToFighter(localFighter);

        for (let i = wildMinions.length - 1; i >= 0; i--) {
          const wm = wildMinions[i];
          if (wm.mesh.position.distanceTo(localFighter.mesh.position) <= recruitRadius) {
            scene.remove(wm.mesh);
            wildMinions.splice(i, 1);
            addMinionToFighter(localFighter);
          }
        }
      }
      actionTriggerRef.current.call = false;

      if (actionTriggerRef.current.smash && localFighter.weapon && !frozen) {
        useWeapon(localFighter);
        actionTriggerRef.current.smash = false;
      }
      if (actionTriggerRef.current.smash && cdState.smash <= 0) {
        cdState.smash = 4.0;
        netEvent = 'smash';
        if (localAirborne && localFighter.stun <= 0) {
          // GROUND POUND: slam straight down, bigger blast on landing
          localFighter.pounding = true;
          localFighter.vy = -48;
          localFighter.vx *= 0.15;
          localFighter.vz *= 0.15;
          sfx.play('fall', 0.6);
        } else {
          doSmash(localFighter, 12, 1, '💍 GMI RING SMASH!');
        }
      }
      actionTriggerRef.current.smash = false;

      if (actionTriggerRef.current.swarm && cdState.swarm <= 0) {
        cdState.swarm = 7.0;
        localFighter.swarmTimer = 3.6;
        triggerShockwave(localFighter.mesh.position.x, localFighter.mesh.position.z, 0xef4444, 9);
        spawnMemeSprite(localFighter.mesh.position.x, 1.8, localFighter.mesh.position.z, '🔥 360° GANG SWARM!', '#f87171');
        sfx.play('swarm');
        fighters.forEach(other => {
          if (other.id === localFighter.id) return;
          const dx = other.mesh.position.x - localFighter.mesh.position.x;
          const dz = other.mesh.position.z - localFighter.mesh.position.z;
          const dist = Math.hypot(dx, dz);
          if (dist < 7 && dist > 0.01) launch(other, localFighter, dx / dist, dz / dist, 7, 6, 8);
        });
      }
      actionTriggerRef.current.swarm = false;

      if (actionTriggerRef.current.dash && cdState.dash <= 0 && localFighter.stun <= 0 && !frozen) {
        cdState.dash = CD_MAX.dash;
        let ddx = moveX, ddz = moveZ;
        const dl = Math.hypot(ddx, ddz);
        if (dl > 0.01) { ddx /= dl; ddz /= dl; } else [ddx, ddz] = forwardOf(localFighter);
        doDash(localFighter, ddx, ddz);
        if (!netEvent) netEvent = 'dash';
      }
      actionTriggerRef.current.dash = false;
      if (actionTriggerRef.current.cannon && cdState.cannon <= 0 && !frozen) {
        if (fireCannon(localFighter)) {
          cdState.cannon = CD_MAX.cannon;
          if (!netEvent) netEvent = 'cannon';
        } else {
          cdState.cannon = 0.6;
          spawnMemeSprite(localFighter.mesh.position.x, 2.2, localFighter.mesh.position.z, 'NO GANG TO THROW 😅 · press GANG', '#94a3b8');
        }
      }
      actionTriggerRef.current.cannon = false;
      if (actionTriggerRef.current.ult && !frozen) {
        if (ult.v >= 100) {
          ult.v = 0;
          startTornado(localFighter);
          netEvent = 'tornado';
        } else spawnMemeSprite(localFighter.mesh.position.x, 2.2, localFighter.mesh.position.z, `🌪️ ${Math.floor(ult.v)}% · keep brawling`, '#7dd3fc');
      }
      actionTriggerRef.current.ult = false;

      let currentBeatdownBanner = null;

      fighters.forEach((f, idx) => {
        if (f.swarmTimer > 0) f.swarmTimer -= dt;
        if (f.dashT > 0) {
          f.dashT -= dt;
          const fp = f.mesh.position;
          burst(fp.x, fp.y + 0.9, fp.z, f.gangColor, 2, 2.5);
          if (f.isLocal || f.isBot) {
            fighters.forEach(o => {
              if (o.id === f.id || f.dashHit[o.id]) return;
              const dx = o.mesh.position.x - fp.x, dz = o.mesh.position.z - fp.z, d = Math.hypot(dx, dz);
              if (d < 2.9 && d > 0.01 && Math.abs(o.mesh.position.y - fp.y) < 2.5) {
                f.dashHit[o.id] = 1;
                launch(o, f, f.dashDir[0] * 0.65 + (dx / d) * 0.35, f.dashDir[1] * 0.65 + (dz / d) * 0.35, 12, 7, 11);
                if (f.isLocal) spawnMemeSprite(o.mesh.position.x, 2.2, o.mesh.position.z, '🐂 BULLDOZED!', '#fde68a');
              }
            });
          }
          if (f.dashT <= 0) { f.vx *= 0.35; f.vz *= 0.35; }
        }
        if (f.tornadoT > 0) {
          f.tornadoT -= dt;
          const tfx = ensureTornadoFx(f);
          const fp = f.mesh.position;
          tfx.visible = f.tornadoT > 0;
          tfx.position.set(fp.x, Math.max(0, fp.y), fp.z);
          tfx.rotation.y += 9 * dt;
          const fade = Math.min(1, f.tornadoT / 0.6, (5 - f.tornadoT) / 0.3);
          tfx.userData.ringMat.opacity = 0.55 * fade;
          tfx.userData.funMat.opacity = (0.1 + Math.sin(now * 0.02) * 0.03) * fade;
          tfx.scale.setScalar(0.85 + Math.sin(now * 0.012) * 0.08);
          if (Math.random() < 0.6) burst(fp.x + (Math.random() - 0.5) * 7, 0.3, fp.z + (Math.random() - 0.5) * 7, '#bae6fd', 1, 3);
          if (f.isLocal || f.isBot) {
            fighters.forEach(o => {
              if (o.id === f.id) return;
              const dx = o.mesh.position.x - fp.x, dz = o.mesh.position.z - fp.z, d = Math.hypot(dx, dz);
              if (d < 4.8 && d > 0.01 && (!f.tornadoHit[o.id] || now - f.tornadoHit[o.id] > 420)) {
                f.tornadoHit[o.id] = now;
                const tx = -dz / d, tz = dx / d;
                launch(o, f, (dx / d) * 0.75 + tx * 0.45, (dz / d) * 0.75 + tz * 0.45, 13, 12, 9);
              }
            });
            for (let wi = wildMinions.length - 1; wi >= 0; wi--) {
              const wm = wildMinions[wi];
              if (wm.mesh.position.distanceTo(fp) < 5.5) {
                scene.remove(wm.mesh);
                wildMinions.splice(wi, 1);
                addMinionToFighter(f);
              }
            }
          }
        } else if (f.tornadoFx && f.tornadoFx.visible) f.tornadoFx.visible = false;
        if (f.isBot && !frozen && f.stun <= 0 && f.minions.length >= 3 && Math.random() < 0.0016) fireCannon(f);
        if (f.punchAnim > 0) f.punchAnim -= dt;
        if (f.stun > 0) f.stun -= dt;
        if (f.punchCd > 0) f.punchCd -= dt;
        if (f.squash > 0) f.squash = Math.max(0, f.squash - dt * 4);
        if (f.respawnLock > 0) f.respawnLock -= dt;
        if (f.weapon) {
          if (f.weapon.cd > 0) f.weapon.cd -= dt;
          if (f.weapon.swing > 0) {
            f.weapon.swing -= dt;
            f.mesh.userData.rightArmGroup.rotation.x = -Math.sin((f.weapon.swing / 0.3) * Math.PI) * 1.6;
          } else {
            f.mesh.userData.rightArmGroup.rotation.x = 0;
          }
          if (f.isBot && !frozen && f.stun <= 0) {
            let near = null, nd = 999;
            fighters.forEach(o => {
              if (o.id === f.id) return;
              const d = o.mesh.position.distanceTo(f.mesh.position);
              if (d < nd) { nd = d; near = o; }
            });
            if (near && ((f.weapon.kind === 'hammer' && nd < 5) || (f.weapon.kind === 'launcher' && nd < 26 && nd > 5))) {
              f.mesh.rotation.y = Math.atan2(near.mesh.position.x - f.mesh.position.x, near.mesh.position.z - f.mesh.position.z);
              if (Math.random() < 0.08) useWeapon(f);
            }
          }
        }
        if (f.buffs.speed > 0) f.buffs.speed -= dt;
        if (f.buffs.armor > 0) f.buffs.armor -= dt;
        if (f.buffs.pump > 0) f.buffs.pump -= dt;
        f.bubble.visible = f.buffs.armor > 0;
        if (f.bubble.visible) f.bubble.material.opacity = 0.2 + Math.sin(now * 0.01) * 0.08;

        if (f.isBot && frozen) {
          f.vx *= Math.exp(-6 * dt);
          f.vz *= Math.exp(-6 * dt);
        } else if (f.isBot) {
          // recovery: double jump back toward the arena when falling off
          const bp = f.mesh.position;
          const br = Math.hypot(bp.x, bp.z);
          if ((br > ARENA_RADIUS || inRug(bp)) && f.vy < 0 && bp.y < 1.5 && f.jumps > 0 && f.stun <= 0) {
            doJump(f, -bp.x / (br || 1), -bp.z / (br || 1));
          }
          f.aiTimer -= dt;
          if (f.aiTimer <= 0) {
            if (Math.random() < 0.12) doJump(f, 0, 0);
            f.aiTimer = 0.6 + Math.random() * 0.6;
            const distFromCenter = Math.hypot(f.mesh.position.x, f.mesh.position.z);
            if (distFromCenter > ARENA_RADIUS - 7) {
              f.aiDirX = -f.mesh.position.x / distFromCenter;
              f.aiDirZ = -f.mesh.position.z / distFromCenter;
            } else {
              let bestTarget = localFighter;
              let minDist = 999;
              fighters.forEach(cand => {
                if (cand.id === f.id) return;
                const d = f.mesh.position.distanceTo(cand.mesh.position);
                if (d < minDist) {
                  minDist = d;
                  bestTarget = cand;
                }
              });
              const dx = bestTarget.mesh.position.x - f.mesh.position.x;
              const dz = bestTarget.mesh.position.z - f.mesh.position.z;
              const l = Math.hypot(dx, dz) || 1;
              f.aiDirX = dx / l;
              f.aiDirZ = dz / l;

              if (minDist < 6.5 && Math.random() < BOT_AGGRO && f.stun <= 0) {
                f.punchAnim = 0.35;
                triggerShockwave(f.mesh.position.x, f.mesh.position.z, f.gangColor, 6.5);
                sfx.play('smash', volAt(f.mesh.position) * 0.45);
                fighters.forEach(victim => {
                  if (victim.id === f.id) return;
                  const vdx = victim.mesh.position.x - f.mesh.position.x;
                  const vdz = victim.mesh.position.z - f.mesh.position.z;
                  const vd = Math.hypot(vdx, vdz);
                  if (victim.mesh.position.y > 1.6) return;
                  if (vd < 6.5 && vd > 0.01) launch(victim, f, vdx / vd, vdz / vd, 5 + 5 * (1 - vd / 6.5), 6, 9);
                });
              }
            }
          }
          if (f.stun <= 0 && f.mesh.position.y <= 0.05) {
            const botSpeed = 9.8 * BOT_SPEED * f.pandaClass.speed * (f.buffs.speed > 0 ? 1.45 : 1);
            f.vx += ((f.aiDirX || 0) * botSpeed - f.vx) * 4 * dt;
            f.vz += ((f.aiDirZ || 0) * botSpeed - f.vz) * 4 * dt;
          }
        } else if (!f.isLocal && f.targetX !== undefined) {
          const ox = f.mesh.position.x, oz = f.mesh.position.z;
          f.mesh.position.x += (f.targetX - f.mesh.position.x) * 12 * dt;
          f.mesh.position.z += (f.targetZ - f.mesh.position.z) * 12 * dt;
          f.mesh.position.y += ((f.targetY || 0) - f.mesh.position.y) * 12 * dt;
          f.vx = (f.mesh.position.x - ox) / Math.max(dt, 0.001);
          f.vz = (f.mesh.position.z - oz) / Math.max(dt, 0.001);
        }

        if (f.isLocal || f.isBot) {
          const pos = f.mesh.position;
          pos.x += f.vx * dt;
          pos.z += f.vz * dt;
          pos.y += f.vy * dt;
          f.vy -= 38 * dt;
          const onArena = Math.hypot(pos.x, pos.z) <= ARENA_RADIUS + 0.4 && !inRug(pos) && pos.y > -2.5;
          const airborne = pos.y > 0.05;

          if (onArena && pos.y <= 0 && f.vy <= 0 && f.pounding) {
            f.pounding = false;
            pos.y = 0;
            f.vy = 0;
            f.jumps = 2;
            f.squash = 1;
            doSmash(f, 9.5, 1.3, '⬇️ GROUND POUND!');
          } else if (onArena && pos.y <= 0 && f.vy <= 0 && f.vy > -9) {
            pos.y = 0;
            f.vy = 0;
            f.jumps = 2;
          } else if (onArena && pos.y <= 0 && f.vy <= 0 && f.stun <= 0) {
            // normal landing from a jump: little squash, no bounce
            pos.y = 0;
            f.vy = 0;
            f.jumps = 2;
            f.squash = 0.35;
          } else if (onArena && pos.y <= 0 && f.vy <= 0) {
            if (f.vy < -9) {
              // BOUNCE
              const impact = -f.vy;
              f.vy = impact * 0.5;
              pos.y = 0;
              f.squash = Math.min(1, impact / 22);
              burst(pos.x, 0.3, pos.z, '#e2e8f0', 5, 6);
              if (f.isLocal) fx.shake = Math.min(1.6, fx.shake + impact / 60);
              if (impact > 12) sfx.play('bounce', f.isLocal ? 1 : volAt(pos) * 0.7, 0.8 + Math.random() * 0.4);
            } else {
              pos.y = 0;
              f.vy = 0;
            }
          }

          // friction: air keeps momentum, stunned bodies slide, everyone else is steered above
          if (airborne) {
            f.vx *= Math.exp(-1.0 * dt);
            f.vz *= Math.exp(-1.0 * dt);
          } else if (f.stun > 0) {
            f.vx *= Math.exp(-1.8 * dt);
            f.vz *= Math.exp(-1.8 * dt);
          }

          if (!onArena && !f.fallSnd) {
            f.fallSnd = true;
            sfx.play('fall', f.isLocal ? 1 : volAt(pos));
          }

          // speed trail when launched hard
          const spd = Math.hypot(f.vx, f.vz);
          if (f.stun > 0 && spd > 16 && Math.random() < 0.7) burst(pos.x, pos.y + 1.2, pos.z, f.gangColor, 1, 1.5);

          // pinball bumpers
          if (pos.y < 2) {
            bumpers.forEach(b => {
              const bx = pos.x - b.x, bz = pos.z - b.z;
              const bd = Math.hypot(bx, bz);
              if (bd < 2.9 && bd > 0.01) {
                const nx = bx / bd, nz = bz / bd;
                const out = Math.max(24, spd * 1.15);
                f.vx = nx * out;
                f.vz = nz * out;
                f.vy = Math.max(f.vy, 9);
                f.stun = Math.max(f.stun, 0.45);
                pos.x = b.x + nx * 2.95;
                pos.z = b.z + nz * 2.95;
                b.pulse = 1;
                burst(pos.x, 1.2, pos.z, '#ffb070', 10, 9);
                sfx.play('bumper', f.isLocal ? 1 : volAt(pos) * 0.8);
                if (f.isLocal) fx.shake = Math.min(1.6, fx.shake + 0.5);
              }
            });
          }

          // tumble while flying
          if (airborne && f.stun > 0) {
            f.mesh.rotation.z += 9 * dt;
          } else {
            f.mesh.rotation.z *= Math.exp(-14 * dt);
          }
          const sq = f.squash;
          f.mesh.scale.set(f.baseScale * (1 + sq * 0.35), f.baseScale * (1 - sq * 0.4), f.baseScale * (1 + sq * 0.35));
        }

        if (Math.hypot(f.vx, f.vz) > 0.5 && !(f.stun > 0 && f.mesh.position.y > 0.05)) {
          const targetRot = Math.atan2(f.vx, f.vz);
          f.mesh.rotation.y = targetRot;
        }

        // refresh the name tag when damage changes
        const shownDmg = Math.round(f.dmg);
        if (shownDmg !== f.tag.shown) {
          f.tag.shown = shownDmg;
          drawNameTag(f.tag.canvas, f.name, f.dmg, f.gangColor, f.isLocal);
          f.tag.tex.needsUpdate = true;
        }
        f.tag.sprite.position.set(f.mesh.position.x, f.mesh.position.y + 5.9, f.mesh.position.z);
        if (f.crown && f.crown.visible) f.crown.rotation.y += 1.5 * dt;
        if (f.mesh.userData.youArrow) {
          f.mesh.userData.youArrow.position.y = 4.95 + Math.sin(now * 0.006) * 0.25;
          f.mesh.userData.youArrow.rotation.y += 3 * dt;
        }

        const ud = f.mesh.userData;
        if (ud) {
          ud.headGroup.position.y = 2.08 + Math.sin(now * 0.008 + idx) * 0.05;
          ud.rightArmGroup.position.z = f.punchAnim > 0 ? 0.65 : 0.2;
          ud.ringSpark.rotation.y += 4 * dt;
        }

        for (let w = wildMinions.length - 1; w >= 0; w--) {
          if (wildMinions[w].mesh.position.distanceTo(f.mesh.position) < 2.6) {
            scene.remove(wildMinions[w].mesh);
            wildMinions.splice(w, 1);
            addMinionToFighter(f);
            if (f.isLocal) {
              spawnMemeSprite(f.mesh.position.x, 1.4, f.mesh.position.z, '+1 PANDA GANG! 🐼', '#4ade80');
              sfx.play('pop', 0.8, 0.9 + Math.random() * 0.3);
            }
          }
        }

        fighters.forEach(enemy => {
          if (enemy.id === f.id) return;
          if (!enemy.isLocal && !enemy.isBot) return;
          const dx = enemy.mesh.position.x - f.mesh.position.x;
          const dz = enemy.mesh.position.z - f.mesh.position.z;
          const dist = Math.hypot(dx, dz);

          if (dist < 5.6 && dist > 0.01) {
            const gangCount = f.minions.length + 1;
            const enemyCount = enemy.minions.length + 1;

            const swarmBonus = f.swarmTimer > 0 ? 1.85 : 1.0;
            const surroundFactor = Math.max(1.0, (gangCount / Math.max(1, enemyCount)) * 1.35) * swarmBonus;

            if (dist < 3.6) {
              // light body push so gangs don't overlap
              const pushForce = 6 * surroundFactor * dt;
              enemy.vx += (dx / dist) * pushForce;
              enemy.vz += (dz / dist) * pushForce;
              enemy.lastHitBy = f;

              // gang punches: bigger gang + swarm = harder, faster hits
              if (f.punchCd <= 0 && f.stun <= 0) {
                f.punchCd = f.swarmTimer > 0 ? 0.3 : 0.6;
                f.punchAnim = 0.2;
                launch(enemy, f, dx / dist, dz / dist, 2.5 + 1.4 * surroundFactor, 3, 2 + 1.6 * surroundFactor);
              }

              if (gangCount >= enemyCount + 2 && Math.random() < 0.035) {
                const callout = MEME_CALLOUTS[Math.floor(Math.random() * MEME_CALLOUTS.length)];
                spawnMemeSprite(enemy.mesh.position.x, 1.5, enemy.mesh.position.z, callout, '#facc15');
                triggerShockwave(enemy.mesh.position.x, enemy.mesh.position.z, f.pandaClass.accent, 4.5);
                if (enemy.minions.length > 0 && Math.random() < 0.45) {
                  flingMinion(enemy, dx / dist, dz / dist);
                }
              }

              if ((f.isLocal || enemy.isLocal) && gangCount >= 4) {
                currentBeatdownBanner = `${f.name} (${gangCount}x Pandas) is SWARMING ${enemy.name}!`;
              }
            }
          }
        });

        const totalMinions = f.minions.length;
        const spin = f.tornadoT > 0;
        const follow = 1 - Math.exp(-(spin ? 14 : 9) * dt);
        f.minions.forEach((m, mIdx) => {
          const orbitAngle = (now * (spin ? 0.011 : 0.0032 * (f.swarmTimer > 0 ? 2.2 : 1))) + (mIdx * Math.PI * 2) / Math.max(1, totalMinions);
          const orbitRadius = spin ? 3.6 : f.swarmTimer > 0 ? 3.2 : 2.15 + (mIdx % 2) * 0.75;
          const targetMX = f.mesh.position.x + Math.cos(orbitAngle) * orbitRadius;
          const targetMZ = f.mesh.position.z + Math.sin(orbitAngle) * orbitRadius;

          m.mesh.position.x += (targetMX - m.mesh.position.x) * follow;
          m.mesh.position.z += (targetMZ - m.mesh.position.z) * follow;
          m.mesh.position.y = spin
            ? Math.max(f.mesh.position.y * 0.6, 0) + 0.8 + Math.sin(now * 0.008 + mIdx * 1.3) * 1.1
            : Math.max(f.mesh.position.y * 0.6, 0) + Math.abs(Math.sin(now * 0.012 + mIdx)) * 0.28;
          m.mesh.rotation.y = spin ? m.mesh.rotation.y + 14 * dt : f.mesh.rotation.y;
        });

        const fellOut = (f.isLocal || f.isBot) && f.mesh.position.y < -14;
        if (fellOut) {
          // credit only goes to whoever hit you in the last 5 seconds; otherwise it's a self-destruct
          const killer = f.lastHitBy && now - (f.lastHitAt || 0) < 5000 ? f.lastHitBy : null;
          f.deaths = (f.deaths || 0) + 1;
          if (f.isLocal) setMyDeaths(f.deaths);
          if (f.isWhale) f.removeMe = true;
          if (killer && killer.id !== f.id) {
            if (killer.isLocal || killer.isBot) {
              creditKO(killer, f.name, f.mesh.position.x, f.mesh.position.z, f.streak || 0, !!f.isWhale);
            } else {
              send({ t: 'k', id: myIdRef.current, killer: killer.id, kn: killer.name, vn: f.name, vx: f.mesh.position.x, vz: f.mesh.position.z, vs: f.streak || 0, vw: f.isWhale ? 1 : 0 });
              pushKillFeed(`💥 ${killer.name}'s gang RINGED OUT ${f.name}!`, '#facc15');
            }
          } else {
            pushKillFeed(`🌌 ${f.name} fell into Deep Space!`, '#f87171');
          }

          spawnMemeSprite(f.mesh.position.x * 0.85, 2.2, f.mesh.position.z * 0.85, 'LIQUIDATED! 💀', '#ef4444');
          sfx.play('ko', (f.isLocal || (killer && killer.isLocal)) ? 1 : volAt(f.mesh.position) * 0.6);
          f.streak = 0;
          f.fallSnd = false;
          f.pounding = false;
          f.jumps = 2;
          dropWeapon(f);
          if (f.isLocal) stats.falls += 1;
          if (f.isLocal) announceNow('YOU GOT LIQUIDATED 💀', '#ef4444');

          burst(f.mesh.position.x, -2, f.mesh.position.z, f.gangColor, 30, 18);
          const respawnAngle = Math.random() * Math.PI * 2;
          f.mesh.position.set(Math.cos(respawnAngle) * 8, 16, Math.sin(respawnAngle) * 8);
          f.vx = 0;
          f.vy = 0;
          f.vz = 0;
          f.dmg = 0;
          f.stun = 0;
          f.respawnLock = 1.2;
          f.mesh.rotation.z = 0;
          f.lastHitBy = null;
          // losing a stock costs half your gang
          const lose = Math.floor(f.minions.length / 2);
          for (let k = 0; k < lose; k++) {
            const gone = f.minions.pop();
            scene.remove(gone.mesh);
          }
          if (f.isLocal) setMyGangSize(f.minions.length + 1);
        }
      });

      fighters.filter(f => f.removeMe).forEach(removeFighter);

      for (let i = cannonballs.length - 1; i >= 0; i--) {
        const cb = cannonballs[i];
        const cp = cb.mesh.position;
        cb.vy -= 16 * dt;
        cp.x += cb.vx * dt;
        cp.y += cb.vy * dt;
        cp.z += cb.vz * dt;
        cb.mesh.rotation.x += 16 * dt;
        cb.life -= dt;
        if (Math.random() < 0.8) burst(cp.x, cp.y, cp.z, cb.owner.gangColor, 1, 1.2);
        const owns = cb.owner.isLocal || cb.owner.isBot;
        const hit = owns ? fighters.find(o => o.id !== cb.owner.id && o.respawnLock <= 0 && Math.hypot(o.mesh.position.x - cp.x, o.mesh.position.z - cp.z) < 2.2 && Math.abs(o.mesh.position.y + 1.2 - cp.y) < 3) : null;
        if (hit || cb.life <= 0 || cp.y < 0.35) {
          triggerShockwave(cp.x, cp.z, 0xfacc15, 5);
          burst(cp.x, 1, cp.z, cb.owner.gangColor, 16, 12);
          burst(cp.x, 1, cp.z, '#ffffff', 8, 9);
          sfx.play('crit', cb.owner.isLocal || (hit && hit.isLocal) ? 0.9 : volAt(cp) * 0.6);
          if (owns) {
            fighters.forEach(o => {
              if (o.id === cb.owner.id) return;
              const dx = o.mesh.position.x - cp.x, dz = o.mesh.position.z - cp.z, d = Math.hypot(dx, dz);
              if (d < 3.8 && d > 0.01) launch(o, cb.owner, dx / d, dz / d, o === hit ? 21 : 12, 10, o === hit ? 20 : 9);
            });
            if (cb.owner.isLocal && hit) spawnMemeSprite(cp.x, 2.6, cp.z, '🐼💥 PANDA CANNON!', '#facc15');
          }
          debris.push({ mesh: cb.mesh, vx: -cb.vx * 0.2 + (Math.random() - 0.5) * 6, vy: 11, vz: -cb.vz * 0.2 + (Math.random() - 0.5) * 6, life: 1.4 });
          cannonballs.splice(i, 1);
        }
      }

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        pr.mesh.position.x += pr.vx * dt;
        pr.mesh.position.z += pr.vz * dt;
        pr.life -= dt;
        if (Math.random() < 0.8) burst(pr.mesh.position.x, pr.mesh.position.y, pr.mesh.position.z, '#ffb070', 1, 0.8);
        const hit = fighters.find(o => o.id !== pr.owner.id && Math.hypot(o.mesh.position.x - pr.mesh.position.x, o.mesh.position.z - pr.mesh.position.z) < 1.9);
        if (hit || pr.life <= 0) {
          explode(pr.mesh.position.x, pr.mesh.position.z, pr.owner);
          scene.remove(pr.mesh);
          projectiles.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.vy -= 30 * dt;
        pt.m.position.x += pt.vx * dt;
        pt.m.position.y += pt.vy * dt;
        pt.m.position.z += pt.vz * dt;
        pt.m.rotation.x += 8 * dt;
        pt.life -= dt;
        pt.mat.opacity = Math.max(0, pt.life * 1.6);
        if (pt.life <= 0) {
          scene.remove(pt.m);
          partPool.push(pt.m);
          particles.splice(i, 1);
        }
      }

      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.vy -= 34 * dt;
        d.mesh.position.x += d.vx * dt;
        d.mesh.position.y += d.vy * dt;
        d.mesh.position.z += d.vz * dt;
        d.mesh.rotation.x += 11 * dt;
        d.mesh.rotation.z += 7 * dt;
        d.life -= dt;
        if (d.life <= 0 || d.mesh.position.y < -20) {
          scene.remove(d.mesh);
          debris.splice(i, 1);
        }
      }

      wildMinions.forEach(wm => {
        wm.mesh.position.y = Math.abs(Math.sin(now * 0.005 + wm.bobOffset)) * 0.25;
        wm.mesh.rotation.y += 1.2 * dt;
      });

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.scale += 26 * dt;
        sw.mesh.scale.set(sw.scale, sw.scale, 1);
        sw.mat.opacity -= 1.9 * dt;
        if (sw.mat.opacity <= 0) {
          scene.remove(sw.mesh);
          shockwaves.splice(i, 1);
        }
      }

      for (let i = floatingMemes.length - 1; i >= 0; i--) {
        const fm = floatingMemes[i];
        fm.sprite.position.y += 3.2 * dt;
        fm.life -= 0.85 * dt;
        fm.mat.opacity = Math.max(0, fm.life);
        if (fm.life <= 0) {
          scene.remove(fm.sprite);
          floatingMemes.splice(i, 1);
        }
      }

      const clp = localFighter.mesh.position;
      const gangZoom = 1 + Math.min(0.16, localFighter.minions.length * 0.01) + (localFighter.tornadoT > 0 ? 0.08 : 0);
      const leadX = Math.max(-3, Math.min(3, localFighter.vx * 0.08));
      const leadZ = Math.max(-3, Math.min(3, localFighter.vz * 0.08));
      const camTargetX = (clp.x + leadX) * camCfg.follow;
      const camTargetZ = (clp.z + leadZ) * camCfg.follow + 29 * camCfg.zoom * gangZoom;
      const camTargetY = (localFighter.swarmTimer > 0 ? 22 : 27) * camCfg.zoom * gangZoom;
      const kPos = 1 - Math.exp(-5 * rawDt), kY = 1 - Math.exp(-3.5 * rawDt), kLook = 1 - Math.exp(-7 * rawDt);
      camera.position.x += (camTargetX - camera.position.x) * kPos;
      camera.position.z += (camTargetZ - camera.position.z) * kPos;
      camera.position.y += (camTargetY - camera.position.y) * kY;
      camLook.x += ((clp.x + leadX) * camCfg.look - camLook.x) * kLook;
      camLook.z += ((clp.z + leadZ) * camCfg.look - 3 - camLook.z) * kLook;
      camera.lookAt(camLook.x, 1.0, camLook.z);

      // ---- stage lights ----
      heroLight.position.set(clp.x, Math.max(0, clp.y) + 7, clp.z + 2);
      heroLight.intensity = 1.35 + (localFighter.tornadoT > 0 ? 0.8 : 0);
      impactLight.intensity = Math.max(0, impactLight.intensity - rawDt * 22);
      const rushK = match.finalRush ? 1 : 0;
      stageSpots.forEach((sp, si) => {
        const a = now * (0.00028 + rushK * 0.0005) * (si ? -1 : 1) + si * Math.PI;
        const rr = 9 + Math.sin(now * 0.0004 + si * 2) * 6;
        sp.target.position.set(Math.cos(a) * rr, 0, Math.sin(a) * rr);
        sp.light.color.setHex(rushK ? 0xff3b3b : sp.base);
        sp.beamMat.color.setHex(rushK ? 0xff3b3b : sp.base);
        const dir = sp.target.position.clone().sub(sp.light.position);
        const len = dir.length();
        sp.beam.scale.set(1, len, 1);
        sp.beam.quaternion.setFromUnitVectors(BEAM_DOWN, dir.normalize());
      });

      if (now - lastNetBroadcast > 66 || netEvent) {
        lastNetBroadcast = now;
        const r2 = v => Math.round(v * 100) / 100;
        const lp = localFighter.mesh.position;
        const pkt = { t: 's', id: myIdRef.current, name: playerName, c: selectedClass.id, cos: prof.cosmetic, x: r2(lp.x), y: r2(lp.y), z: r2(lp.z), d: Math.round(localFighter.dmg), m: localFighter.minions.length, k: localFighter.kos, dt: localFighter.deaths, st: localFighter.streak || 0, ev: netEvent };
        if (net.isHost) {
          pkt.left = Math.round(match.left * 10) / 10;
          pkt.b = fighters.filter(f => f.isBot).map(b => ({ i: b.id, n: b.name, c: b.pandaClass.id, x: r2(b.mesh.position.x), y: r2(b.mesh.position.y), z: r2(b.mesh.position.z), d: Math.round(b.dmg), m: b.minions.length, k: b.kos, dt: b.deaths, st: b.streak || 0 }));
        }
        send(pkt);
      }

      if (now - lastHudSync > 200) {
        lastHudSync = now;
        setCooldowns({
          call: Number(cdState.call.toFixed(1)),
          smash: Number(cdState.smash.toFixed(1)),
          swarm: Number(cdState.swarm.toFixed(1)),
          dash: Number(cdState.dash.toFixed(1)),
          cannon: Number(cdState.cannon.toFixed(1)),
          ult: Math.floor(ult.v)
        });
        setActiveBeatdownAlert(currentBeatdownBanner);
        setMyDmg(Math.round(localFighter.dmg));
        let holder = null;
        fighters.forEach(f => {
          if ((f.streak || 0) >= 3 && (!holder || f.streak > holder.streak)) holder = f;
        });
        fighters.forEach(f => {
          if (f === holder && !f.crown) {
            f.crown = makeCrown();
            f.crown.position.y = 3.05;
            f.mesh.add(f.crown);
            if (f.isLocal) announceNow('👑 YOU HAVE A BOUNTY ON YOUR HEAD', '#facc15');
          }
          if (f.crown) f.crown.visible = f === holder;
        });
        setMatchTime(Math.max(0, Math.ceil(match.left)));
        const b = localFighter.buffs;
        const hud = [];
        if (b.speed > 0) hud.push(`🍔 ${b.speed.toFixed(0)}s`);
        if (b.armor > 0) hud.push(`💎 ${b.armor.toFixed(0)}s`);
        if (b.pump > 0) hud.push(`🚀 ${b.pump.toFixed(0)}s`);
        if (localFighter.weapon) hud.push(`${localFighter.weapon.kind === 'hammer' ? '🔨' : '🧨'} x${localFighter.weapon.uses} · E`);
        setBuffHud(hud);
        let nearest = 999;
        fighters.forEach(o => {
          if (o.id !== localFighter.id) nearest = Math.min(nearest, o.mesh.position.distanceTo(localFighter.mesh.position));
        });
        sfx.setIntensity(nearest < 8 || localFighter.swarmTimer > 0 ? 1 : nearest < 16 ? 0.5 : 0.1);

        Object.keys(remotePlayersRef.current).forEach(pid => {
          if (now - remotePlayersRef.current[pid].lastSeen > 5000) {
            delete remotePlayersRef.current[pid];
            pushKillFeed(`🔴 Player left the room`, '#94a3b8');
          }
        });
        [...fighters].forEach(f => {
          if (f.remote && now - (net.remoteSeen[f.id] || 0) > 5000) removeFighter(f);
        });
        // host = smallest id in the room; only the host runs the AI pandas
        const peers = Object.keys(remotePlayersRef.current);
        const hostId = [myIdRef.current, ...peers].sort()[0];
        net.hostId = hostId;
        const amHost = hostId === myIdRef.current;
        if (amHost !== net.isHost) {
          net.isHost = amHost;
          if (!amHost) {
            fighters.filter(f => f.isBot).forEach(removeFighter);
            pushKillFeed('🔗 Synced with room host', '#38bdf8');
          }
        }
        if (net.isHost && fillWithBots && !fighters.some(f => f.isBot)) {
          spawnBots(Math.max(0, 7 - peers.length));
        }
        setOnlinePeersCount(1 + Object.keys(remotePlayersRef.current).length);

        const sortedBoard = [...fighters]
          .map(f => ({
            id: f.id,
            name: f.name,
            isLocal: f.isLocal,
            isBot: f.isBot,
            kos: f.kos,
            deaths: f.deaths || 0,
            gangSize: f.minions.length + 1,
            score: f.kos * 100 - (f.deaths || 0) * 40 + (f.minions.length + 1) * 3
          }))
          .sort((a, b) => b.score - a.score);
        setLeaderboard(sortedBoard);
      }

      let shakeX = 0, shakeY = 0;
      if (fx.shake > 0.01) {
        shakeX = (Math.random() - 0.5) * fx.shake * 1.4;
        shakeY = (Math.random() - 0.5) * fx.shake * 1.4;
        fx.shake *= Math.exp(-7 * rawDt);
      }
      camera.position.x += shakeX;
      camera.position.y += shakeY;
      if (post) {
        post.comp.uniforms.flash.value = fx.postFlash;
        fx.postFlash = Math.max(0, fx.postFlash - rawDt * 3);
        post.render(now * 0.001);
      } else {
        renderer.render(scene, camera);
      }
      if (bdClipRef.current) bdClipRef.current.frame();
      camera.position.x -= shakeX;
      camera.position.y -= shakeY;
    };

    animationFrameId = requestAnimationFrame(animate);

    const post = GFX_CINEMATIC ? createPost(renderer, scene, camera) : null;
    const handleResize = () => {
      if (!mountRef.current) return;
      const w = mountRef.current.clientWidth || window.innerWidth;
      const h = mountRef.current.clientHeight || window.innerHeight;
      fitCamera(w, h);
      renderer.setSize(w, h);
      if (post) post.setSize();
    };
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);

    return () => {
      cancelAnimationFrame(animationFrameId);
      if (bdClipRef.current) { bdClipRef.current.destroy(); bdClipRef.current = null; }
      sfx.stopMusic();
      window.removeEventListener('blur', clearKeys);
      document.removeEventListener('gesturestart', blockGesture);
      document.removeEventListener('touchmove', blockGesture);
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('resize', handleResize);
      window.removeEventListener('orientationchange', handleResize);
      if (mqttClientRef.current) {
        try {
          mqttClientRef.current.end();
        } catch (e) {}
      }
      if (post) post.dispose();
      envRT.dispose();
      pmrem.dispose();
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
    };
  }, [screen, roomCode, selectedClass, playerName, fillWithBots, matchId, gfx]);

  return (
    <div className="relative w-full h-full bg-[#04060e] text-white overflow-hidden select-none">
      <div ref={mountRef} className="absolute inset-0 w-full h-full" />

      {screen === 'lobby' && (
        <div className="absolute inset-0 z-20 overflow-hidden">
          <LobbyBackdrop mode={mode} />
          <div className="absolute inset-0 bg-gradient-to-b from-[#050816]/60 via-transparent to-[#050816]/90 pointer-events-none" />
          <div key={mode} className="warp-flash absolute inset-0 pointer-events-none" style={{ background: `radial-gradient(circle at 50% 35%, ${mode === 'shootout' ? '#fb7185' : '#34d399'}66, transparent 65%)` }} />

          <div className="relative h-full overflow-y-auto safe-top safe-bottom">
            <div className="relative overflow-hidden border-y border-white/10 bg-black/45 backdrop-blur-sm select-none">
              <div className="ticker-track py-1.5 text-[11px] font-black tracking-wider">
                {[0, 1].map(dup => (
                  <div key={dup} className="flex gap-8 pr-8 shrink-0">
                    <span className="whitespace-nowrap text-white">⭐ YOU · LV {profile.level} · {profile.wins} WINS</span>
                    {TICKER.map(([txt, col], i) => <span key={i} className="whitespace-nowrap" style={{ color: col }}>{txt}</span>)}
                  </div>
                ))}
              </div>
            </div>
            <div className={`min-h-full flex flex-col items-center px-4 pt-6 ${IS_TOUCH ? 'pb-32' : 'pb-32 md:py-10'}`}>
              <header key={intro ? 'intro' : 'live'} className="text-center select-none">
                <div className={`kicker text-[11px] md:text-xs font-black ${mode === 'shootout' ? 'text-rose-300' : 'text-emerald-300'}`}>NGMI PANDAS · SEASON 1</div>
                <h1 className={`game-title ${mode === 'shootout' ? 'alt' : ''} text-[15vw] sm:text-7xl md:text-8xl mt-2`}>{mode === 'shootout' ? 'SHOOTOUT' : 'BEATDOWN'}</h1>
                <p className="tagline text-slate-200 text-sm md:text-lg mt-4 font-semibold">
                  {mode === 'shootout' ? (
                    soVariant === 'siege' ? (
                      <>Raid Fort HODL. Crack the <span className="text-amber-300 font-black">Moon Vault</span>. Or hold the line.</>
                    ) : (
                      <>Grab an AK. Splat your rivals. Chase the <span className="text-amber-300 font-black">Golden AK</span>.</>
                    )
                  ) : (
                    <>Gang up. Pump their <span className="text-amber-300 font-black">%</span>. Ring them out.</>
                  )}
                </p>
                <div className="tagline flex flex-wrap justify-center gap-1.5 mt-4 max-w-xl mx-auto">
                  {(mode === 'shootout'
                    ? ['🔫 8 weapons', '🏰 Siege mode', '☄️ Moon Strike', '👑 Golden AK', '📱 Plays on phone']
                    : ['🌕 Moon arena', '👥 Up to 12 players', '💥 %-knockback', '🤖 AI fills empty slots', '📱 Plays on phone']
                  ).map(c => <span key={c} className="chip">{c}</span>)}
                  {CLIP_OK && (
                    <button onClick={() => setShowClipsApp(true)} className="chip cursor-pointer" style={{ background: 'rgba(244,63,94,0.25)', borderColor: 'rgba(251,113,133,0.7)', color: '#fff' }}>🎬 My clips · {allClipsApp.length}</button>
                  )}
                </div>
              </header>

              <div className="w-full max-w-6xl mt-8 grid gap-5 lg:grid-cols-[1fr_330px] items-start">
                <section className="space-y-4">
                  {(() => {
                    const done = Math.min(profile.story || 0, CHAPTERS.length);
                    const ci = chSel !== null ? chSel : Math.min(done, CHAPTERS.length - 1);
                    const ch = CHAPTERS[ci];
                    const launch = () => {
                      sfx.unlock();
                      setStoryRun(ci);
                      storyRunRef.current = ci;
                      if (ch.mode === 'shootout') {
                        setMode('shootout');
                        setSoVariant(ch.variant);
                        setSoTeam(ch.team || 'auto');
                      } else setMode('beatdown');
                      setResults(null);
                      enterMobileFullscreen(ch.mode === 'shootout');
                      setScreen(ch.mode === 'shootout' ? 'shootout' : 'playing');
                    };
                    const brief = () => {
                      sfx.unlock();
                      setComic({ panels: done === 0 && ci === 0 ? [...STORY_PROLOGUE, ...ch.intro] : ch.intro, doneLabel: '▶ START MISSION', onDone: () => { setComic(null); launch(); } });
                    };
                    const readAll = () => setComic({ panels: [...STORY_PROLOGUE, ...CHAPTERS.slice(0, done).flatMap(c => [...c.intro, ...c.outro]), ...(done >= CHAPTERS.length ? STORY_EPILOGUE : [])], doneLabel: 'CLOSE', onDone: () => setComic(null) });
                    return (
                      <div className="story-banner relative overflow-hidden rounded-2xl border-2 p-3 md:p-4" style={{ borderColor: `${ch.color}aa`, background: `linear-gradient(135deg, ${ch.color}2a, rgba(11,16,32,0.92) 62%)`, boxShadow: `0 18px 40px -20px ${ch.color}` }}>
                        <div className="flex items-start justify-between gap-3">
                          <div className="min-w-0">
                            <div className="text-[10px] font-black tracking-[0.22em]" style={{ color: ch.color }}>📖 STORY MODE · {done >= CHAPTERS.length && chSel === null ? 'SEASON 1 COMPLETE 🏆' : `CHAPTER ${ch.n} OF ${CHAPTERS.length}`}</div>
                            <div className="font-game text-xl md:text-2xl text-white leading-tight mt-1">{ch.title}</div>
                            <div className="text-[11px] md:text-[12px] text-slate-300 mt-1 leading-snug">{ch.where} · 🎯 {ch.goal}</div>
                          </div>
                          <div className="text-4xl md:text-5xl shrink-0">{ch.emoji}</div>
                        </div>
                        <div className="flex gap-1.5 mt-2.5">
                          {CHAPTERS.map((c, k) => (
                            <button key={c.n} disabled={k > done} onClick={() => setChSel(k)} title={k > done ? 'Locked' : c.title} className={`flex-1 py-2 ${k > done ? 'cursor-not-allowed' : 'cursor-pointer'}`}>
                              <span className={`block h-1.5 rounded-full ${k < done ? 'bg-emerald-400' : k === done ? 'bg-white/70' : 'bg-white/15'} ${k === ci ? 'ring-2 ring-white ring-offset-2 ring-offset-transparent' : ''}`} />
                            </button>
                          ))}
                        </div>
                        <div className="grid grid-cols-[1fr_auto] gap-2 mt-1.5">
                          <button onClick={brief} className="play-btn py-2.5 rounded-xl font-game text-base text-slate-950 cursor-pointer">▶ {k_label(done, ci)}</button>
                          <button onClick={readAll} className="px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-black cursor-pointer">📖 STORY</button>
                        </div>
                      </div>
                    );
                  })()}

                  <div className="flex items-center gap-3">
                    <span className="font-game text-sm text-white">CHOOSE YOUR GAME</span>
                    <span className="flex-1 h-px bg-gradient-to-r from-slate-500/60 to-transparent" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    {[
                      { id: 'beatdown', icon: '🥊', title: 'BEATDOWN', kicker: 'MOON ARENA · 3RD PERSON', sub: 'Gang brawl · pump their % · ring them out', bg: 'radial-gradient(circle at 78% 70%, #7c3aed77, transparent 60%), linear-gradient(135deg, #0a1f2e, #140b30)', ring: '#34d399' },
                      { id: 'shootout', icon: '🔫', title: 'SHOOTOUT', kicker: 'FPS · FFA + SIEGE', sub: 'AKs, RPGs & a wooden gatling', bg: 'radial-gradient(circle at 78% 70%, #fb718577, transparent 60%), linear-gradient(135deg, #2a0d1a, #2b1607)', ring: '#fb7185', tag: 'NEW · SIEGE' }
                    ].map(g => (
                      <button
                        key={g.id}
                        onClick={() => {
                          sfx.unlock();
                          if (mode !== g.id) sfx.play('powerup', 0.35);
                          setMode(g.id);
                        }}
                        className={`card poster holo relative text-left rounded-2xl border-2 overflow-hidden h-32 md:h-40 cursor-pointer ${mode === g.id ? 'selected' : 'border-slate-800 hover:border-slate-600'}`}
                        style={{ background: g.bg, ...(mode === g.id ? { borderColor: g.ring, boxShadow: `0 0 0 1px ${g.ring}, 0 18px 40px -14px ${g.ring}` } : {}) }}
