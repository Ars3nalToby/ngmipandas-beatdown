    const { useState, useEffect, useRef } = React;


// ============================================================================

const PANDA_CLASSES = [
  {

// ============================================================================
// AUDIO: every sound is synthesised live with WebAudio (no files to load)
// ============================================================================
const sfx = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;
  let muted = false, lastHit = 0, musicTimer = null, nextStepTime = 0, step = 0, intensity = 0;

  const ensure = () => {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.ratio.value = 5;
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(comp);
      comp.connect(ctx.destination);
      sfxBus = ctx.createGain();
      sfxBus.gain.value = 0.85;
      sfxBus.connect(master);
      musicBus = ctx.createGain();
      musicBus.gain.value = 0.3;
      musicBus.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };

  const env = (g, t, peak, dur) => {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  };

  const tone = (type, f0, f1, dur, vol, bus, at, filterHz) => {
    const t = at || ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    env(g, t, vol, dur);
    if (filterHz) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(filterHz, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(80, filterHz * 0.25), t + dur);
      o.connect(f);
      f.connect(g);
    } else {
      o.connect(g);
    }
    g.connect(bus || sfxBus);
    o.start(t);
    o.stop(t + dur + 0.05);
  };

  const hiss = (dur, vol, type, f0, f1, bus, at) => {
    const t = at || ctx.currentTime;
    const n = ctx.createBufferSource();
    n.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    env(g, t, vol, dur);
    n.connect(f);
    f.connect(g);
    g.connect(bus || sfxBus);
    n.start(t, Math.random() * 0.5);
    n.stop(t + dur + 0.05);
  };

  const play = (name, vol = 1, p = 1) => {
    if (!ctx || muted || vol <= 0.02) return;
    const now = ctx.currentTime;
    switch (name) {
      case 'hit':
        if (now - lastHit < 0.045) return;
        lastHit = now;
        tone('sine', 170 * p, 55, 0.14, 0.55 * vol);
        hiss(0.07, 0.4 * vol, 'bandpass', 2400 * p, 700);
        break;
      case 'crit':
        tone('sine', 140, 32, 0.45, 1.0 * vol);
        tone('square', 1000, 260, 0.09, 0.2 * vol);
        hiss(0.22, 0.75 * vol, 'highpass', 3500, 900);
        tone('triangle', 1975, 1900, 0.35, 0.16 * vol, null, now + 0.03);
        break;
      case 'smash':
        hiss(0.38, 0.55 * vol, 'bandpass', 250, 3800);
        tone('sawtooth', 90, 38, 0.32, 0.35 * vol, null, null, 900);
        break;
      case 'bounce':
        tone('sine', 260 * p, 120, 0.16, 0.38 * vol);
        break;
      case 'bumper':
        tone('square', 620, 1240, 0.1, 0.22 * vol);
        tone('sine', 1480, 1400, 0.25, 0.2 * vol, null, now + 0.04);
        break;
      case 'ko':
        tone('sine', 95, 28, 0.7, 1.0 * vol);
        hiss(0.6, 0.7 * vol, 'lowpass', 3500, 160);
        [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, 0, 0.16, 0.22 * vol, null, now + 0.12 + i * 0.07));
        break;
      case 'fall':
        tone('sine', 1100, 180, 1.1, 0.16 * vol);
        break;
      case 'call':
        for (let i = 0; i < 4; i++) tone('square', i % 2 ? 1320 : 880, 0, 0.06, 0.1 * vol, null, now + i * 0.07);
        break;
      case 'pop':
        tone('sine', 520 * p, 1250 * p, 0.09, 0.25 * vol);
        break;
      case 'swarm':
        tone('sawtooth', 110, 470, 0.55, 0.22 * vol, null, null, 2600);
        hiss(0.55, 0.32 * vol, 'bandpass', 400, 4200);
        break;
      case 'combo':
        tone('triangle', 660 * p, 0, 0.14, 0.22 * vol);
        tone('triangle', 990 * p, 0, 0.14, 0.14 * vol, null, now + 0.06);
        break;
      case 'powerup':
        [659, 880, 1175, 1568].forEach((f, i) => tone('square', f, 0, 0.08, 0.12 * vol, null, now + i * 0.06));
        break;
      case 'streak':
        [392, 494, 587, 784].forEach(f => tone('sawtooth', f, 0, 0.6, 0.09 * vol, null, now, 3000));
        tone('sine', 98, 49, 0.6, 0.6 * vol);
        break;
      default:
        break;
    }
  };

  // ---------- music: rotating playlist, each song builds in sections ----------
  const TRACKS = [
    { name: 'MOON SYNTHWAVE', bpm: 124, roots: [55, 43.65, 65.41, 49], chords: [[0, 3, 7, 10], [0, 4, 7, 11], [0, 4, 7, 9], [0, 4, 7, 10]], kick: [0, 4, 8, 12], snare: [4, 12], bass: [0, 3, 6, 8, 11, 14], bassWave: 'sawtooth', arpWave: 'square', arpEvery: 2, scale: [0, 3, 5, 7, 10] },
    { name: 'DEGEN BREAKBEAT', bpm: 140, roots: [49, 49, 58.27, 43.65], chords: [[0, 3, 7], [0, 3, 7], [0, 4, 7], [0, 4, 7]], kick: [0, 6, 10], snare: [4, 12, 15], bass: [0, 2, 6, 7, 10, 14], bassWave: 'square', arpWave: 'sawtooth', arpEvery: 1, scale: [0, 2, 3, 5, 7, 8, 10] },
    { name: 'LO-FI HODL', bpm: 92, roots: [65.41, 55, 43.65, 49], chords: [[0, 4, 7, 11], [0, 3, 7, 10], [0, 4, 7, 11], [0, 4, 7, 10]], kick: [0, 7, 10], snare: [4, 12], bass: [0, 7, 10], bassWave: 'triangle', arpWave: 'triangle', arpEvery: 4, scale: [0, 2, 4, 7, 9], swing: 0.14 },
    { name: 'BULL RUN DISCO', bpm: 118, roots: [41.2, 46.25, 55, 49], chords: [[0, 4, 7, 10], [0, 3, 7, 10], [0, 3, 7], [0, 4, 7]], kick: [0, 4, 8, 12], snare: [4, 12], openHat: true, bass: [0, 2, 4, 6, 8, 10, 12, 14], octaveJump: true, bassWave: 'sawtooth', arpWave: 'square', arpEvery: 2, scale: [0, 2, 4, 7, 9] }
  ];
  const RUSH = { name: 'FINAL RUSH', bpm: 160, roots: [55, 55, 43.65, 49], chords: [[0, 3, 7], [0, 3, 7], [0, 4, 7], [0, 4, 7]], kick: [0, 4, 8, 12], snare: [4, 12], openHat: true, bass: [0, 2, 4, 6, 8, 10, 12, 14], bassWave: 'sawtooth', arpWave: 'sawtooth', arpEvery: 1, scale: [0, 2, 3, 5, 7, 8, 10] };
  const BARS_PER_SONG = 32;
  let trackIdx = 0, rush = false, songBar = 0, melody = [], onTrackChange = null;
  const cur = () => (rush ? RUSH : TRACKS[trackIdx]);
  const semis = (f, n) => f * Math.pow(2, n / 12);
  const newMelody = tr => {
    // 8-step phrase from the song's scale; repeats so it becomes a hook
    melody = Array.from({ length: 8 }, () => (Math.random() < 0.22 ? null : tr.scale[Math.floor(Math.random() * tr.scale.length)] + (Math.random() < 0.3 ? 12 : 0)));
  };
  newMelody(TRACKS[0]);

  const scheduleStep = (st, t) => {
    const tr = cur();
    const STEP = 60 / tr.bpm / 4;
    const s16 = st % 16;
    if (s16 === 0) {
      songBar++;
      if (!rush && songBar >= BARS_PER_SONG) {
        songBar = 0;
        trackIdx = (trackIdx + 1) % TRACKS.length;
        newMelody(TRACKS[trackIdx]);
        if (onTrackChange) onTrackChange(TRACKS[trackIdx].name);
      } else if (songBar % 8 === 0) {
        newMelody(tr);
      }
    }
    const bar = Math.floor(st / 16) % 4;
    const root = tr.roots[bar];
    const section = songBar < 4 ? 0 : songBar < 12 ? 1 : 2; // intro, build, full
    const tt = t + (tr.swing && s16 % 2 === 1 ? tr.swing * STEP : 0);
    const fill = songBar % 8 === 7 && s16 >= 12;

    if (tr.kick.includes(s16) || (rush && s16 % 2 === 0 && songBar % 4 === 3)) tone('sine', 150, 42, 0.26, 0.9, musicBus, tt);
    if (section > 0 && (tr.snare.includes(s16) || fill)) hiss(fill ? 0.08 : 0.16, fill ? 0.25 : 0.35, 'bandpass', 1700, 900, musicBus, tt);
    if (s16 % 4 === 2) hiss(tr.openHat ? 0.12 : 0.04, 0.12 + intensity * 0.12, 'highpass', tr.openHat ? 6500 : 8000, null, musicBus, tt);
    if ((intensity > 0.4 || rush) && s16 % 2 === 1) hiss(0.025, 0.06 + intensity * 0.04, 'highpass', 9000, null, musicBus, tt);
    if (tr.bass.includes(s16)) {
      const oct = tr.octaveJump ? (s16 % 4 === 2 ? 2 : 1) : s16 === 6 || s16 === 14 ? 2 : 1;
      tone(tr.bassWave, root * oct, 0, STEP * 1.6, 0.3, musicBus, tt, 700 + intensity * 900);
    }
    if (section > 0 && s16 % tr.arpEvery === 0) {
      const ch = tr.chords[bar];
      const note = semis(root * 8, ch[(s16 / tr.arpEvery) % ch.length]);
      tone(tr.arpWave, note, 0, STEP * 1.2, 0.03 + intensity * 0.03, musicBus, tt, 2600);
    }
    if (section === 2 && s16 % 2 === 0) {
      const m = melody[(s16 / 2) % 8];
      if (m !== null) tone('triangle', semis(root * 8, m), 0, STEP * 2.2, 0.07, musicBus, tt, 4200);
    }
  };

  const tick = () => {
    if (!ctx) return;
    while (nextStepTime < ctx.currentTime + 0.15) {
      scheduleStep(step, nextStepTime);
      nextStepTime += 60 / cur().bpm / 4;
      step++;
    }
  };

  return {
    unlock() { ensure(); },
    play,
    setMuted(m) {
      muted = m;
      if (master) master.gain.setTargetAtTime(m ? 0 : 0.9, ctx.currentTime, 0.05);
    },
    isMuted() { return muted; },
    setIntensity(x) { intensity = Math.max(0, Math.min(1, x)); },
    setRush(on) {
      if (rush === on) return;
      rush = on;
      songBar = 4;
      newMelody(cur());
      if (onTrackChange) onTrackChange(cur().name);
    },
    onTrack(fn) { onTrackChange = fn; },
    trackName() { return cur().name; },
    startMusic() {
      if (!ensure() || musicTimer) return;
      nextStepTime = ctx.currentTime + 0.1;
      step = 0;
      rush = false;
      songBar = 0;
      trackIdx = Math.floor(Math.random() * TRACKS.length);
      newMelody(TRACKS[trackIdx]);
      musicTimer = setInterval(tick, 25);
    },
    stopMusic() {
      if (musicTimer) clearInterval(musicTimer);
      musicTimer = null;
    }
  };
})();

const MATCH_SECONDS = 180;
const IS_TOUCH = typeof window !== 'undefined' && ((window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window);
const IS_SMALL = () => window.innerWidth < 768 || window.innerHeight < 500;
const CD_MAX = { call: 5.5, smash: 4, swarm: 7 };

const POWERUPS = [
  { id: 'burger', icon: '🍔', label: 'FAST FOOD! +45% SPEED', color: '#f97316' },
  { id: 'diamond', icon: '💎', label: 'DIAMOND HANDS! -60% KNOCKBACK', color: '#22d3ee' },
  { id: 'rocket', icon: '🚀', label: 'PUMP IT! HITS x1.7', color: '#a3e635' },
  { id: 'gift', icon: '🎁', label: 'AIRDROP! +3 PANDAS', color: '#facc15' }
];

function makeEmojiTexture(emoji) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.font = '96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, 64, 70);
  return new THREE.CanvasTexture(c);
}

function makeGlowTexture(inner, outer) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, inner);
  g.addColorStop(1, outer);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

function makeArenaTexture() {
  const S = 1024, C = S / 2;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const bg = ctx.createRadialGradient(C, C, 0, C, C, C);
  bg.addColorStop(0, '#3b1d7a');
  bg.addColorStop(0.45, '#1e1b4b');
  bg.addColorStop(0.8, '#0c1236');
  bg.addColorStop(0.86, '#3b0a1e');
  bg.addColorStop(1, '#7f1d1d');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, S, S);
  // hex tiles
  ctx.strokeStyle = 'rgba(56,189,248,0.18)';
  ctx.lineWidth = 2;
  const r = 34, hh = Math.sqrt(3) * r;
  for (let y = -hh; y < S + hh; y += hh) {
    for (let x = -r * 3, col = 0; x < S + r * 3; x += r * 1.5, col++) {
      const cy = y + (col % 2 ? hh / 2 : 0);
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = (Math.PI / 3) * k;
        const px = x + Math.cos(a) * r, py = cy + Math.sin(a) * r;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
  }
  // concentric neon rings
  [0.25, 0.5, 0.75].forEach((f, i) => {
    ctx.strokeStyle = i === 2 ? 'rgba(168,85,247,0.55)' : 'rgba(34,211,238,0.35)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(C, C, C * f, 0, Math.PI * 2);
    ctx.stroke();
  });
  // danger band hazard stripes
  ctx.save();
  ctx.beginPath();
  ctx.arc(C, C, C, 0, Math.PI * 2);
  ctx.arc(C, C, C * 0.88, 0, Math.PI * 2, true);
  ctx.clip();
  ctx.strokeStyle = 'rgba(250,204,21,0.35)';
  ctx.lineWidth = 14;
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 36) {
    ctx.beginPath();
    ctx.moveTo(C + Math.cos(a) * C * 0.86, C + Math.sin(a) * C * 0.86);
    ctx.lineTo(C + Math.cos(a + 0.06) * C, C + Math.sin(a + 0.06) * C);
    ctx.stroke();
  }
  ctx.restore();
  // centre logo
  ctx.font = '900 150px "Arial Black", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(167,139,250,0.22)';
  ctx.fillText('NGMI', C, C - 40);
  ctx.font = '900 64px "Arial Black", sans-serif';
  ctx.fillStyle = 'rgba(34,211,238,0.22)';
  ctx.fillText('GMI MOON ARENA', C, C + 70);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8;
  return tex;
}

// Live 3D arena spinning behind the lobby menu
function LobbyBackdrop() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return undefined;
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true });
    } catch (e) {
      return undefined;
    }
    const size = () => [el.clientWidth || window.innerWidth, el.clientHeight || window.innerHeight];
    let [w, h] = size();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_TOUCH ? 1 : 1.5));
    renderer.setSize(w, h);
    el.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050816);
    scene.fog = new THREE.FogExp2(0x050816, 0.008);
    const cam = new THREE.PerspectiveCamera(45, w / h, 0.1, 500);
    cam.position.set(0, 26, 46);
    cam.lookAt(0, 0, 0);
    scene.add(new THREE.AmbientLight(0xcbd5e1, 0.8));
    scene.add(new THREE.HemisphereLight(0x8b5cf6, 0x0f172a, 0.6));
    const dl = new THREE.DirectionalLight(0x93c5fd, 1.6);
    dl.position.set(-20, 40, 20);
    scene.add(dl);

    const arena = new THREE.Group();
    scene.add(arena);
    const sideMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b, emissive: 0x7c3aed, emissiveIntensity: 0.4, metalness: 0.8, roughness: 0.3 });
    const floor = new THREE.Mesh(
      new THREE.CylinderGeometry(24, 19, 3, 64),
      [sideMat, new THREE.MeshStandardMaterial({ map: makeArenaTexture(), emissive: 0x1e1b4b, emissiveIntensity: 0.4 }), sideMat]
    );
    floor.position.y = -1.5;
    arena.add(floor);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlowTexture('rgba(168,85,247,0.8)', 'rgba(168,85,247,0)'), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    glow.scale.set(90, 90, 1);
    glow.position.y = -8;
    arena.add(glow);

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(20, 40, 40),
      new THREE.MeshStandardMaterial({ color: 0x1d4ed8, emissive: 0x1e3a8a, emissiveIntensity: 0.7, roughness: 0.8 })
    );
    moon.position.set(-38, 22, -90);
    scene.add(moon);

    const starGeo = new THREE.BufferGeometry();
    const sp = new Float32Array(1200 * 3);
    for (let i = 0; i < sp.length; i += 3) {
      sp[i] = (Math.random() - 0.5) * 300;
      sp[i + 1] = Math.random() * 140 - 30;
      sp[i + 2] = (Math.random() - 0.5) * 300 - 50;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xe2e8f0, size: 0.6, transparent: true, opacity: 0.85 }));
    scene.add(stars);

    // pandas wandering + hopping on the arena
    const walkers = [];
    for (let i = 0; i < (IS_TOUCH ? 5 : 7); i++) {
      const cls = PANDA_CLASSES[i % PANDA_CLASSES.length];
      const color = i === 0 ? LOCAL_GANG_COLOR : GANG_COLORS[i % GANG_COLORS.length];
      const m = buildNgmiPandaMesh(cls, i > 3, color);
      arena.add(m);
      walkers.push({ m, a: (i / 7) * Math.PI * 2, r: 6 + (i % 3) * 5, sp: 0.25 + Math.random() * 0.35, hop: Math.random() * 6, dir: i % 2 ? 1 : -1 });
    }

    let id;
    const loop = t => {
      id = requestAnimationFrame(loop);
      const s = t * 0.001;
      arena.rotation.y = s * 0.08;
      walkers.forEach(wk => {
        wk.a += wk.sp * 0.016 * wk.dir;
        wk.m.position.set(Math.cos(wk.a) * wk.r, Math.max(0, Math.sin(s * 3 + wk.hop)) * 1.6, Math.sin(wk.a) * wk.r);
        wk.m.rotation.y = -wk.a + (wk.dir > 0 ? Math.PI : 0);
        const ud = wk.m.userData;
        if (ud && ud.rightArmGroup) ud.rightArmGroup.position.z = Math.sin(s * 4 + wk.hop) > 0.7 ? 0.65 : 0.2;
      });
      stars.rotation.y = s * 0.01;
      cam.position.x = Math.sin(s * 0.15) * 6;
      cam.lookAt(0, 0, 0);
      renderer.render(scene, cam);
    };
    id = requestAnimationFrame(loop);
    const onResize = () => {
      [w, h] = size();
      cam.aspect = w / h;
      cam.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    window.addEventListener('resize', onResize);
    return () => {
      cancelAnimationFrame(id);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
      el.innerHTML = '';
    };
  }, []);
  return <div ref={ref} className="absolute inset-0" />;
}

let previewSnapshots = null;
function getPreviewSnapshots() {
  if (previewSnapshots) return previewSnapshots;
  previewSnapshots = {};
  let r = null;
  try {
    r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    r.setPixelRatio(1);
    r.setSize(480, 340, false);
    PANDA_CLASSES.forEach(c => {
      const { scene, cam } = makePreviewScene(c, 480, 340);
      r.clear();
      r.render(scene, cam);
      previewSnapshots[c.id] = r.domElement.toDataURL('image/png');
    });
  } catch (e) {}
  if (r) {
    r.dispose();
    if (r.forceContextLoss) r.forceContextLoss();
  }
  return previewSnapshots;
}

// Rotating 3D preview on desktop; a static snapshot on phones (keeps iOS happy)
function PandaPreview({ config }) {
  const ref = useRef(null);
  const [img] = useState(() => (IS_TOUCH ? getPreviewSnapshots()[config.id] : null));
  useEffect(() => {
    if (IS_TOUCH) return undefined;
    const el = ref.current;
    if (!el) return undefined;
    const w = el.clientWidth || 240;
    const h = el.clientHeight || 170;
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    } catch (e) {
      return undefined;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h);
    el.appendChild(renderer.domElement);
    const { scene, cam, hero, minion } = makePreviewScene(config, w, h);
    let id;
    const loop = t => {
      id = requestAnimationFrame(loop);
      hero.rotation.y = Math.sin(t * 0.0007) * 1.1;
      minion.rotation.y = -t * 0.0012;
      minion.position.y = Math.abs(Math.sin(t * 0.007)) * 0.3;
      const ud = hero.userData;
      if (ud && ud.rightArmGroup) ud.rightArmGroup.position.z = t % 1600 < 220 ? 0.65 : 0.2;
      if (ud && ud.ringSpark) ud.ringSpark.rotation.y = t * 0.004;
      renderer.render(scene, cam);
    };
    id = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(id);
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
      el.innerHTML = '';
    };
  }, [config]);
  return (
    <div
      ref={ref}
      className="w-full h-36 sm:h-44 rounded-xl overflow-hidden mb-3 flex items-center justify-center"
      style={{ background: `radial-gradient(circle at 50% 75%, ${config.accent}55, rgba(2,6,23,0.6) 70%)` }}
    >
      {IS_TOUCH && img && <img src={img} alt={config.name} className="preview-bob h-full w-auto object-contain pointer-events-none" draggable={false} />}
      {IS_TOUCH && !img && <span className="text-6xl">🐼</span>}
    </div>
  );
}

const LOCAL_GANG_COLOR = '#00ffa3';

function drawNameTag(canvas, name, dmg, color, isLocal) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  // name pill
  ctx.font = '900 40px "Arial Black", sans-serif';
  const label = isLocal ? `★ YOU · ${name}` : name;
  const tw = Math.min(w - 8, ctx.measureText(label).width + 36);
  ctx.fillStyle = 'rgba(2,6,23,0.82)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect((w - tw) / 2, 6, tw, 56, 28); else ctx.rect((w - tw) / 2, 6, tw, 56);
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.fillText(label, w / 2, 35, w - 30);
  // damage %, colour shifts white -> yellow -> red as it climbs
  const pct = Math.round(dmg);
  const heat = Math.min(1, pct / 150);
  const r = 255, g = Math.round(255 - heat * 215), b = Math.round(255 - Math.min(1, heat * 2) * 255);
  ctx.font = `900 ${64 + Math.round(heat * 22)}px "Arial Black", sans-serif`;
  ctx.lineWidth = 12;
  ctx.strokeStyle = '#000000';
  ctx.strokeText(`${pct}%`, w / 2, 122);
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillText(`${pct}%`, w / 2, 122);
}

function createLabelTexture(text, bgColor, textColor, width = 256, height = 128, fontSize = 44, glowColor = null) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  if (bgColor !== 'transparent') {
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, width, height);
  }

  ctx.font = `900 ${fontSize}px "Inter", "Arial Black", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (glowColor) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 16;
  }

  ctx.fillStyle = textColor;
  const lines = text.split('\n');
  lines.forEach((line, idx) => {
    const yOffset = (idx - (lines.length - 1) / 2) * (fontSize * 1.05);
    ctx.fillText(line, width / 2, height / 2 + yOffset);
  });

  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}

  const [roomCode, setRoomCode] = useState('NGMI-888');
  const [selectedClass, setSelectedClass] = useState(PANDA_CLASSES[0]);
  const [fillWithBots, setFillWithBots] = useState(true);
  const [netStatus, setNetStatus] = useState('READY');
  const [copiedNotice, setCopiedNotice] = useState(false);

  const [leaderboard, setLeaderboard] = useState([]);
  const [myGangSize, setMyGangSize] = useState(4);
  const [myKos, setMyKos] = useState(0);
  const [killFeed, setKillFeed] = useState([]);
  const [activeBeatdownAlert, setActiveBeatdownAlert] = useState(null);
  const [cooldowns, setCooldowns] = useState({ call: 0, smash: 0, swarm: 0 });
  const [arenaEventText, setArenaEventText] = useState('HIT RIVALS TO RAISE THEIR % • HIGH % = THEY FLY! 🚀');
  const [onlinePeersCount, setOnlinePeersCount] = useState(1);

  const [myDmg, setMyDmg] = useState(0);
  const [muted, setMuted] = useState(false);
  const [announce, setAnnounce] = useState(null);
  const [buffHud, setBuffHud] = useState([]);
  const flashRef = useRef(null);
  const joyBaseRef = useRef(null);
  const joyKnobRef = useRef(null);
  const joyPtrRef = useRef(null);
  const mountRef = useRef(null);
  const mqttClientRef = useRef(null);
  const remotePlayersRef = useRef({});
  const myIdRef = useRef(`peer_${Math.random().toString(36).slice(2, 9)}`);
  const keysRef = useRef({});
  const joystickRef = useRef({ active: false, dx: 0, dy: 0 });
  const actionTriggerRef = useRef({ call: false, smash: false, swarm: false, jump: false });
  const [matchId, setMatchId] = useState(0);
  const [matchTime, setMatchTime] = useState(MATCH_SECONDS);
  const [results, setResults] = useState(null);

  useEffect(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      if (roomParam) setRoomCode(roomParam.toUpperCase());
    } catch (e) {}
  }, []);

  const pushKillFeed = (msg, color = '#22c55e') => {
    const id = Date.now() + Math.random();
    setKillFeed(prev => [{ id, msg, color }, ...prev.slice(0, 4)]);
  };

  const handleCopyInvite = () => {
    const baseUrl = window.location.origin + window.location.pathname;
    const shareText = `🐼 Join our NGMI PANDAS 3D Gang Beatdown!\nRoom Code: ${roomCode}\nPlay Live: ${baseUrl}?room=${roomCode}`;
    navigator.clipboard?.writeText(shareText);
    setCopiedNotice(true);
    setTimeout(() => setCopiedNotice(false), 2500);
  };

  useEffect(() => {
    if (screen !== 'playing' || !mountRef.current) return;

    const container = mountRef.current;
    const width = container.clientWidth || window.innerWidth;
    const height = container.clientHeight || window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04060e);
    scene.fog = new THREE.FogExp2(0x04060e, 0.0085);

    const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 400);
    const camCfg = { zoom: 1, follow: 0.65, look: 0.45 };
    const fitCamera = (w, h) => {
      const portrait = w / h < 1;
      camera.fov = portrait ? 62 : w < 900 ? 56 : 50;
      camCfg.zoom = portrait ? 1.3 : 1;
      camCfg.follow = portrait ? 1 : 0.65;
      camCfg.look = portrait ? 1 : 0.45;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    };
    fitCamera(width, height);
    camera.position.set(0, 28, 34);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_TOUCH ? 1.5 : 2));
    renderer.shadowMap.enabled = !IS_TOUCH;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.innerHTML = '';
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xcbd5e1, 0.85);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0x60a5fa, 1.9);
    moonLight.position.set(-25, 45, -35);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.width = 2048;
    moonLight.shadow.mapSize.height = 2048;
    scene.add(moonLight);

    const neonRimLight = new THREE.PointLight(0xa855f7, 2.5, 90);
    neonRimLight.position.set(25, 18, 20);
    scene.add(neonRimLight);

    const moonGroup = new THREE.Group();
    const moonGeo = new THREE.SphereGeometry(26, 48, 48);
    const moonMat = new THREE.MeshStandardMaterial({
      color: 0x1d4ed8,
      emissive: 0x1e3a8a,
      emissiveIntensity: 0.55,
      roughness: 0.8
    });
    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
    moonMesh.position.set(0, 18, -78);
    moonGroup.add(moonMesh);

    const haloGeo = new THREE.RingGeometry(26.5, 31, 64);
    const haloMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.28
    });
    const haloMesh = new THREE.Mesh(haloGeo, haloMat);
    haloMesh.position.copy(moonMesh.position);
    moonGroup.add(haloMesh);
    scene.add(moonGroup);

    const starsGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(900 * 3);
    for (let i = 0; i < 900 * 3; i += 3) {
      starPositions[i] = (Math.random() - 0.5) * 260;
      starPositions[i + 1] = Math.random() * 120 - 20;
      starPositions[i + 2] = (Math.random() - 0.5) * 260 - 40;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(
      starsGeo,
      new THREE.PointsMaterial({ color: 0xe2e8f0, size: 0.55, transparent: true, opacity: 0.8 })
    );
    scene.add(stars);

    const ARENA_RADIUS = 34;
    const arenaGroup = new THREE.Group();
    scene.add(arenaGroup);

    scene.add(new THREE.HemisphereLight(0x8b5cf6, 0x0f172a, 0.55));

    const floorGeo = new THREE.CylinderGeometry(ARENA_RADIUS, ARENA_RADIUS * 0.82, 3.2, 72);
    const floorTop = new THREE.MeshStandardMaterial({ map: makeArenaTexture(), roughness: 0.55, metalness: 0.2, emissive: 0x1e1b4b, emissiveIntensity: 0.35 });
    const floorSide = new THREE.MeshStandardMaterial({ color: 0x1e1b4b, emissive: 0x7c3aed, emissiveIntensity: 0.35, metalness: 0.8, roughness: 0.3 });
    const floorMesh = new THREE.Mesh(floorGeo, [floorSide, floorTop, floorSide]);
    floorMesh.position.y = -1.6;
    floorMesh.receiveShadow = true;
    arenaGroup.add(floorMesh);

    // glowing underside so the arena floats in space
    const underGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeGlowTexture('rgba(168,85,247,0.75)', 'rgba(168,85,247,0)'),
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    underGlow.scale.set(110, 110, 1);
    underGlow.position.y = -9;
    arenaGroup.add(underGlow);

    // neon fence posts around the rim (pulse with the music)
    const pillarMats = [];
    for (let i = 0; i < 36; i++) {
      const a = (i / 36) * Math.PI * 2;
      const mat = new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        emissive: i % 2 ? 0x22d3ee : 0xa855f7,
        emissiveIntensity: 1.2
      });
      pillarMats.push(mat);
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 1.4, 8), mat);
      post.position.set(Math.cos(a) * (ARENA_RADIUS + 0.35), 0.5, Math.sin(a) * (ARENA_RADIUS + 0.35));
      arenaGroup.add(post);
    }

    // background: nebula clouds
    [['rgba(168,85,247,0.45)', -70, 30, -120, 140], ['rgba(34,211,238,0.35)', 80, 10, -110, 120], ['rgba(236,72,153,0.3)', 10, -30, -150, 170]].forEach(([col, x, y, z, sc]) => {
      const neb = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlowTexture(col, 'rgba(0,0,0,0)'), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
      neb.position.set(x, y, z);
      neb.scale.set(sc, sc, 1);
      scene.add(neb);
    });

    // background: giant crypto candle chart skyline
    const candles = [];
    for (let i = 0; i < 26; i++) {
      const up = Math.random() > 0.38;
      const hgt = 4 + Math.random() * 18;
      const candle = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, hgt, 2.4),
        new THREE.MeshBasicMaterial({ color: up ? 0x22c55e : 0xef4444, transparent: true, opacity: 0.55 })
      );
      const wick = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, hgt + 6, 0.35),
        new THREE.MeshBasicMaterial({ color: up ? 0x4ade80 : 0xf87171, transparent: true, opacity: 0.5 })
      );
      const grp = new THREE.Group();
      grp.add(candle);
      grp.add(wick);
      grp.position.set(-75 + i * 6, -6 + i * 1.1 + (up ? 0 : -3), -95);
      scene.add(grp);
      candles.push({ grp, base: grp.position.y, ph: Math.random() * 6 });
    }

    // floating asteroids
    const asteroids = [];
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const rr = 55 + Math.random() * 35;
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1 + Math.random() * 2.8, 0),
        new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9, emissive: 0x1e1b4b, emissiveIntensity: 0.3 })
      );
      rock.position.set(Math.cos(a) * rr, -12 + Math.random() * 26, Math.sin(a) * rr - 20);
      scene.add(rock);
      asteroids.push({ rock, spin: (Math.random() - 0.5) * 0.8, ph: Math.random() * 6 });
    }

    // pinball bumpers: slam into one and you get launched
    const bumpers = [];
    [Math.PI / 2, Math.PI * 7 / 6, Math.PI * 11 / 6].forEach(a => {
      const grp = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(1.6, 1.8, 1.4, 32),
        new THREE.MeshStandardMaterial({ color: 0x831843, emissive: 0xec4899, emissiveIntensity: 0.7, metalness: 0.5, roughness: 0.3 })
      );
      body.position.y = 0.7;
      const cap = new THREE.Mesh(
        new THREE.TorusGeometry(1.45, 0.22, 12, 36),
        new THREE.MeshStandardMaterial({ color: 0xfdf2f8, emissive: 0xf9a8d4, emissiveIntensity: 1.2 })
      );
      cap.rotation.x = Math.PI / 2;
      cap.position.y = 1.45;
      grp.add(body);
      grp.add(cap);
      grp.position.set(Math.cos(a) * 15, 0, Math.sin(a) * 15);
      scene.add(grp);
      bumpers.push({ grp, mat: body.material, x: grp.position.x, z: grp.position.z, pulse: 0 });
    });

    const edgeRingGeo = new THREE.RingGeometry(ARENA_RADIUS - 0.9, ARENA_RADIUS, 64);
    const edgeRingMat = new THREE.MeshBasicMaterial({
      color: 0xfacc15,
      side: THREE.DoubleSide
    });
    const edgeRing = new THREE.Mesh(edgeRingGeo, edgeRingMat);
    edgeRing.rotation.x = -Math.PI / 2;
    edgeRing.position.y = 0.04;
    arenaGroup.add(edgeRing);

    const fighters = [];
    const wildMinions = [];
    const shockwaves = [];
    const floatingMemes = [];

    let gangColorIdx = 0;
    const createFighterEntity = (id, name, pandaClass, isLocal, isBot, startAngle, index) => {
      const dist = isLocal ? 0 : 16 + (index % 2) * 6;
      const x = Math.cos(startAngle) * dist;
      const z = Math.sin(startAngle) * dist;
      let hash = 0;
      for (let k = 0; k < id.length; k++) hash = (hash * 31 + id.charCodeAt(k)) >>> 0;
      const gangColor = isLocal ? LOCAL_GANG_COLOR : isBot ? GANG_COLORS[gangColorIdx++ % GANG_COLORS.length] : GANG_COLORS[hash % GANG_COLORS.length];

      const mesh = buildNgmiPandaMesh(pandaClass, false, gangColor);
      mesh.position.set(x, 0, z);
      scene.add(mesh);

      // Floating name tag + damage %
      const tagCanvas = document.createElement('canvas');
      tagCanvas.width = 512;
      tagCanvas.height = 176;
      drawNameTag(tagCanvas, name, 0, gangColor, isLocal);
      const tagTex = new THREE.CanvasTexture(tagCanvas);
      const tagSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tagTex, transparent: true, depthTest: false }));
      tagSprite.scale.set(6.2, 2.13, 1);
      tagSprite.position.set(x, 5.9, z);
      tagSprite.renderOrder = 10;
      scene.add(tagSprite);

      if (isLocal) {
        const arrow = new THREE.Mesh(
          new THREE.ConeGeometry(0.42, 0.8, 4),
          new THREE.MeshBasicMaterial({ color: LOCAL_GANG_COLOR })
        );
        arrow.rotation.x = Math.PI;
        arrow.position.y = 4.95;
        mesh.add(arrow);
        mesh.userData.youArrow = arrow;
      }

      const minions = [];
      const initialCount = isLocal ? 4 : 3 + (index % 3);
      for (let m = 0; m < initialCount; m++) {
        const mMesh = buildNgmiPandaMesh(pandaClass, true, gangColor);
        mMesh.position.set(x + (Math.random() - 0.5) * 3, 0, z + (Math.random() - 0.5) * 3);
        scene.add(mMesh);
        minions.push({ mesh: mMesh, angleOffset: (m * Math.PI * 2) / 6, punchTimer: 0 });
      }

      return {
        id,
        name,
        pandaClass,
        isLocal,
        isBot,
        mesh,
        minions,
        gangColor,
        tag: { canvas: tagCanvas, tex: tagTex, sprite: tagSprite, shown: 0 },
        baseScale: mesh.scale.x,
        vx: 0,
        vy: 0,
        vz: 0,
        dmg: 0,
        stun: 0,
        squash: 0,
        punchCd: 0,
        jumps: 2,
        pounding: false,
        streak: 0,
        buffs: { speed: 0, armor: 0, pump: 0 },
        bubble: (() => {
          const b = new THREE.Mesh(
            new THREE.SphereGeometry(1.75, 24, 18),
            new THREE.MeshBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.28, depthWrite: false })
          );
          b.position.y = 1.3;
          b.visible = false;
          mesh.add(b);
          return b;
        })(),
        kos: 0,
        swarmTimer: 0,
        punchAnim: 0,
        aiTargetId: null,
        aiTimer: 0,
        lastHitBy: null
      };
    };

    const localFighter = createFighterEntity(
      myIdRef.current,
      playerName || 'NGMI_Leader',
      selectedClass,
      true,
      false,
      0,
      0
    );
    fighters.push(localFighter);

    const removeFighter = f => {
      scene.remove(f.mesh);
      scene.remove(f.tag.sprite);
      f.minions.forEach(m => scene.remove(m.mesh));
      const i = fighters.indexOf(f);
      if (i !== -1) fighters.splice(i, 1);
    };
    const spawnBots = count => {
      for (let i = 0; i < count; i++) {
        const angle = ((i + 1) / count) * Math.PI * 2;
        const botClass = PANDA_CLASSES[(i + 1) % PANDA_CLASSES.length];
        fighters.push(createFighterEntity(`${myIdRef.current}_b${i}`, RIVAL_NAMES[i % RIVAL_NAMES.length], botClass, false, true, angle, i + 1));
      }
    };
    const net = { isHost: true, remoteSeen: {}, hostId: myIdRef.current };
    if (fillWithBots) spawnBots(7);

    const spawnWildPanda = () => {
      if (wildMinions.length >= 18) return;
      const angle = Math.random() * Math.PI * 2;
      const r = 5 + Math.random() * (ARENA_RADIUS - 9);
      const randomClass = PANDA_CLASSES[Math.floor(Math.random() * 2)];
      const mesh = buildNgmiPandaMesh(randomClass, true, WILD_COLOR);
      mesh.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
      scene.add(mesh);
      wildMinions.push({ mesh, bobOffset: Math.random() * Math.PI * 2 });
    };

    for (let i = 0; i < 14; i++) spawnWildPanda();

    const triggerShockwave = (x, z, colorHex, maxRadius = 8) => {
      const geo = new THREE.RingGeometry(0.6, 1.25, 36);
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.95
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(x, 0.18, z);
      scene.add(mesh);
      shockwaves.push({ mesh, mat, scale: 1, maxScale: maxRadius });
    };

    const spawnMemeSprite = (x, y, z, text, color = '#22c55e') => {
      const tex = createLabelTexture(text, 'transparent', color, 512, 128, 52, '#000000');
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.position.set(x + (Math.random() - 0.5) * 1.5, y + 2.8, z);
      sprite.scale.set(5.5, 1.4, 1);
      scene.add(sprite);
      floatingMemes.push({ sprite, mat, life: 1.0 });
    };

    const addMinionToFighter = (fighter) => {
      if (fighter.minions.length >= 16) return;
      const mMesh = buildNgmiPandaMesh(fighter.pandaClass, true, fighter.gangColor);
      mMesh.position.copy(fighter.mesh.position);
      mMesh.position.y = Math.max(0, mMesh.position.y);
      scene.add(mMesh);
      fighter.minions.push({
        mesh: mMesh,
        angleOffset: Math.random() * Math.PI * 2,
        punchTimer: 0
      });
      if (fighter.isLocal) setMyGangSize(fighter.minions.length + 1);
    };

    // ---------- GAME FEEL: particles, flying minions, shake, hit-stop ----------
    const particles = [];
    const debris = [];
    const particleGeo = new THREE.BoxGeometry(0.28, 0.28, 0.28);
    const fx = { shake: 0, hitStop: 0, liqTimer: 0, combo: 0, comboTimer: 0 };

    const burst = (x, y, z, color, count = 12, speed = 12) => {
      for (let i = 0; i < count && particles.length < 320; i++) {
        const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
        const m = new THREE.Mesh(particleGeo, mat);
        m.position.set(x, y, z);
        scene.add(m);
        const a = Math.random() * Math.PI * 2;
        const sp = speed * (0.4 + Math.random() * 0.8);
        particles.push({ m, mat, vx: Math.cos(a) * sp, vy: 4 + Math.random() * speed, vz: Math.sin(a) * sp, life: 0.55 + Math.random() * 0.35 });
      }
    };

    // Knock a minion off a gang so it visibly flies away instead of vanishing
    const flingMinion = (fighter, dirX, dirZ) => {
      const lost = fighter.minions.pop();
      if (!lost) return;
      debris.push({ mesh: lost.mesh, vx: dirX * 18 + (Math.random() - 0.5) * 8, vy: 14 + Math.random() * 6, vz: dirZ * 18 + (Math.random() - 0.5) * 8, life: 2.2 });
      if (fighter.isLocal) setMyGangSize(fighter.minions.length + 1);
    };

    const knockbackMult = () => (fx.liqTimer > 0 ? 1.35 : 1.0) * (matchRef.finalRush ? 1.5 : 1.0);
    const matchRef = { finalRush: false };
    const volAt = pos => Math.max(0, 1 - pos.distanceTo(localFighter.mesh.position) / 48);
    const flash = (strength = 0.45) => {
      const el = flashRef.current;
      if (!el) return;
      el.style.transition = 'none';
      el.style.opacity = String(strength);
      requestAnimationFrame(() => {
        el.style.transition = 'opacity 0.35s ease-out';
        el.style.opacity = '0';
      });
    };
    const announceNow = (text, color) => {
      setAnnounce({ text, color, id: Date.now() });
      setTimeout(() => setAnnounce(a => (a && a.text === text ? null : a)), 1900);
    };

    // Smash-Bros style knockback: more damage % => flies further and higher
    const launch = (target, attacker, dirX, dirZ, base, upward, dmgAdd) => {
      if (target.respawnLock > 0) return 0;
      if (target.isLocal || target.isBot) target.dmg = Math.min(999, target.dmg + dmgAdd);
      const ratio = attacker.pandaClass.power / target.pandaClass.mass;
      const armor = target.buffs.armor > 0 ? 0.4 : 1;
      const pump = attacker.buffs.pump > 0 ? 1.7 : 1;
      const kb = Math.min(110, base * ratio * (1 + target.dmg / 45) * knockbackMult() * armor * pump);
      target.lastHitBy = attacker;
      const p = target.mesh.position;
      const isCrit = kb > 32;
      burst(p.x, p.y + 1.5, p.z, attacker.gangColor, 6 + Math.round(kb / 6), 6 + kb * 0.25);
      const vol = (target.isLocal || attacker.isLocal) ? 1 : volAt(p) * 0.7;
      if (attacker.isLocal && kb > stats.biggestHit) stats.biggestHit = kb;
      if (isCrit) {
        sfx.play('crit', vol);
        burst(p.x, p.y + 1.5, p.z, '#ffffff', 14, 16);
        spawnMemeSprite(p.x, 2.2, p.z, 'CRIT!! 💥', '#ffffff');
        if (target.isLocal || attacker.isLocal) flash(target.isLocal ? 0.5 : 0.3);
      } else {
        sfx.play('hit', vol, 0.85 + Math.random() * 0.4);
      }
      if (!target.isLocal && !target.isBot) {
        // remote fighter: its owner applies the knockback with its own %
        send({ t: 'h', id: myIdRef.current, to: target.id, from: attacker.id, dx: dirX, dz: dirZ, b: base, u: upward, dm: dmgAdd, pw: attacker.pandaClass.power * (attacker.buffs.pump > 0 ? 1.7 : 1), fl: base > 8 ? 1 : 0 });
        return kb;
      }
      target.vx += dirX * kb;
      target.vz += dirZ * kb;
      target.vy = Math.max(target.vy, upward + kb * 0.16);
      target.stun = Math.max(target.stun, Math.min(1.4, 0.2 + kb / 55));
      if (target.isLocal || attacker.isLocal) {
        fx.shake = Math.min(1.6, fx.shake + kb / 45);
        if (kb > 22) fx.hitStop = Math.max(fx.hitStop, Math.min(isCrit ? 0.16 : 0.1, kb / 500));
      }
      if (attacker.isLocal) {
        fx.combo = fx.comboTimer > 0 ? fx.combo + 1 : 1;
        stats.bestCombo = Math.max(stats.bestCombo, fx.combo);
        fx.comboTimer = 1.4;
        if (fx.combo >= 3) {
          spawnMemeSprite(p.x, 2.6, p.z, `x${fx.combo} COMBO! 🔥`, '#fb923c');
          sfx.play('combo', 0.9, Math.pow(2, Math.min(fx.combo - 3, 12) / 12));
        }
      }
      return kb;
    };

    // ---------- match flow ----------
    const match = { left: MATCH_SECONDS, countdown: 3.3, over: false, finalRush: false };
    const stats = { bestCombo: 0, biggestHit: 0, falls: 0 };
    ['3', '2', '1'].forEach((n, i) => setTimeout(() => { announceNow(n, '#ffffff'); sfx.play('pop', 1, 0.8); }, 150 + i * 1000));
    setTimeout(() => { announceNow('FIGHT!', '#00ffa3'); sfx.play('streak'); }, 3150);
    setMatchTime(MATCH_SECONDS);

    // ---------- RUG PULL: a slice of the floor collapses ----------
    let rug = null;
    const RUG_INNER = 13;
    const angleOf = (x, z) => {
      let a = Math.atan2(-z, x);
      if (a < 0) a += Math.PI * 2;
      return a;
    };
    const inRug = pos => {
      if (!rug || rug.phase !== 'open') return false;
      const r = Math.hypot(pos.x, pos.z);
      if (r < RUG_INNER) return false;
      let d = angleOf(pos.x, pos.z) - rug.a0;
      if (d < 0) d += Math.PI * 2;
      return d <= rug.len;
    };
    const startRug = () => {
      const a0 = Math.random() * Math.PI * 2;
      const len = Math.PI / 3;
      const mat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false });
      const mesh = new THREE.Mesh(new THREE.RingGeometry(RUG_INNER, ARENA_RADIUS + 0.5, 40, 1, a0, len), mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = 0.08;
      scene.add(mesh);
      rug = { a0, len, phase: 'warn', t: 3, mesh, mat };
      announceNow('⚠️ RUG PULL INCOMING!', '#ef4444');
      setArenaEventText('⚠️ RUG PULL: GET OFF THE RED ZONE!');
      sfx.play('bumper', 0.8);
    };

    const powerups = [];
    const spawnPowerup = () => {
      if (powerups.length >= 3) return;
      const type = POWERUPS[Math.floor(Math.random() * POWERUPS.length)];
      const a = Math.random() * Math.PI * 2;
      const r = 4 + Math.random() * (ARENA_RADIUS - 10);
      const grp = new THREE.Group();
      const icon = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeEmojiTexture(type.icon), transparent: true }));
      icon.scale.set(2.4, 2.4, 1);
      icon.position.y = 1.9;
      grp.add(icon);
      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.9, 0.9, 9, 20, 1, true),
        new THREE.MeshBasicMaterial({ color: type.color, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false })
      );
      beam.position.y = 4.5;
      grp.add(beam);
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(1.0, 1.35, 32),
        new THREE.MeshBasicMaterial({ color: type.color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.06;
      grp.add(ring);
      grp.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      scene.add(grp);
      powerups.push({ grp, icon, type, ph: Math.random() * 6 });
    };

    const applyPowerup = (f, type) => {
      if (type.id === 'burger') f.buffs.speed = 7;
      if (type.id === 'diamond') f.buffs.armor = 8;
      if (type.id === 'rocket') f.buffs.pump = 6;
      if (type.id === 'gift') {
        addMinionToFighter(f);
        addMinionToFighter(f);
        addMinionToFighter(f);
      }
      const pos = f.mesh.position;
      burst(pos.x, 1.5, pos.z, type.color, 16, 10);
      if (f.isLocal) {
        spawnMemeSprite(pos.x, 2.4, pos.z, type.label, type.color);
        if (type.id === 'rocket') cdState.smash = 0;
      }
      sfx.play('powerup', f.isLocal ? 1 : volAt(pos) * 0.6);
    };

    let mqttScript = null;
    const topic = `ngmipandas/beatdown3d/v3/${roomCode.trim().toUpperCase()}`;
    const send = obj => {
      const c = mqttClientRef.current;
      if (c && c.connected) {
        try { c.publish(topic, JSON.stringify(obj)); } catch (e) {}
      }
    };
    const upsertRemote = (id, name, classId) => {
      let f = fighters.find(x => x.id === id);
      if (!f) {
        const pClass = PANDA_CLASSES.find(c => c.id === classId) || PANDA_CLASSES[0];
        f = createFighterEntity(id, name, pClass, false, false, 0, fighters.length);
        f.remote = true;
        fighters.push(f);
      }
      net.remoteSeen[id] = performance.now();
      return f;
    };
    const applyRemoteState = (f, d) => {
      f.targetX = d.x;
      f.targetY = d.y || 0;
      f.targetZ = d.z;
      f.dmg = d.d || 0;
      f.kos = d.k || 0;
      const want = Math.min(16, d.m || 0);
      while (f.minions.length < want) addMinionToFighter(f);
      while (f.minions.length > want) scene.remove(f.minions.pop().mesh);
    };

    const initMultiplayer = () => {
      if (!window.mqtt) return;
      setNetStatus('CONNECTING...');
      const client = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: `ngmi_${myIdRef.current}`,
        clean: true,
        connectTimeout: 4000
      });

      mqttClientRef.current = client;

      client.on('connect', () => {
        setNetStatus('LIVE ONLINE');
        client.subscribe(topic);
      });

      client.on('message', (t, payload) => {
        let data;
        try {
          data = JSON.parse(payload.toString());
        } catch (err) {
          return;
        }
        if (!data || data.id === myIdRef.current) return;

        if (data.t === 's') {
          // full state from another human (and their bots if they are the host)
          const isNew = !remotePlayersRef.current[data.id];
          remotePlayersRef.current[data.id] = { name: data.name, lastSeen: performance.now() };
          const f = upsertRemote(data.id, data.name, data.c);
          applyRemoteState(f, data);
          if (isNew) pushKillFeed(`🟢 ${data.name} joined Room ${roomCode}!`, '#38bdf8');
          if (data.ev === 'smash') {
            triggerShockwave(data.x, data.z, f.gangColor, 9);
            sfx.play('smash', volAt(f.mesh.position) * 0.6);
          }
          if (Array.isArray(data.b) && data.id === net.hostId) {
            data.b.forEach(b => applyRemoteState(upsertRemote(b.i, b.n, b.c), b));
          }
          if (data.id === net.hostId && typeof data.left === 'number' && Math.abs(match.left - data.left) > 1.5) {
            match.left = data.left;
          }
        } else if (data.t === 'h') {
          // someone hit one of MY fighters: I own their physics, so I apply it
          const target = fighters.find(x => x.id === data.to && (x.isLocal || x.isBot));
          if (!target) return;
          const src = fighters.find(x => x.id === data.from);
          const attacker = {
            id: data.from,
            name: src ? src.name : 'Someone',
            gangColor: src ? src.gangColor : '#ffffff',
            pandaClass: { power: data.pw || 1 },
            buffs: { pump: 0 },
            isLocal: false
          };
          launch(target, attacker, data.dx, data.dz, data.b, data.u, data.dm);
          if (src) target.lastHitBy = src;
          if (data.fl && Math.random() < 0.5) flingMinion(target, data.dx, data.dz);
        } else if (data.t === 'k') {
          // a fighter owned by someone else got ringed out by one of MINE
          const killer = fighters.find(x => x.id === data.killer && (x.isLocal || x.isBot));
          if (killer) creditKO(killer, data.vn, data.vx || 0, data.vz || 0);
          else pushKillFeed(`💥 ${data.kn}'s gang RINGED OUT ${data.vn}!`, '#facc15');
        }
      });
    };

    if (window.mqtt) {
      initMultiplayer();
    } else {
      mqttScript = document.createElement('script');
      mqttScript.src = 'https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js';
      mqttScript.async = true;
      mqttScript.onload = initMultiplayer;
      document.body.appendChild(mqttScript);
    }

    const cdState = { call: 0, smash: 0, swarm: 0 };
    let lastNetBroadcast = 0;
    let lastHudSync = 0;
    let hazardTimer = 0;
    let powerTimer = 5;
    let animationFrameId;
    let prevTime = performance.now();

    const creditKO = (killer, victimName, vx, vz) => {
      killer.kos += 1;
      addMinionToFighter(killer);
      killer.streak = (killer.streak || 0) + 1;
      if (killer.isLocal) {
        setMyKos(killer.kos);
        fx.shake = 1.6;
        spawnMemeSprite(vx * 0.7, 3, vz * 0.7, 'K.O.!! 💥', '#facc15');
        flash(0.35);
        sfx.play('ko');
        const STREAKS = { 2: ['DOUBLE K.O.!', '#38bdf8'], 3: ['TRIPLE K.O.!!', '#a855f7'], 4: ['RAMPAGE!!!', '#f97316'], 5: ['UNSTOPPABLE GMI!!!', '#facc15'] };
        const st = STREAKS[Math.min(killer.streak, 5)];
        if (st) {
          announceNow(st[0], st[1]);
          sfx.play('streak');
        }
      }
      pushKillFeed(`💥 ${killer.name}'s gang RINGED OUT ${victimName}!`, '#facc15');
    };

    // Ring smash shockwave. Airborne targets dodge it (jump to dodge!)
    const doSmash = (attacker, radius, powerMul, label) => {
      const px = attacker.mesh.position.x;
      const pz = attacker.mesh.position.z;
      attacker.punchAnim = 0.45;
      triggerShockwave(px, pz, 0xfacc15, radius);
      spawnMemeSprite(px, 1.8, pz, label, '#facc15');
      sfx.play('smash', attacker.isLocal ? 1 : volAt(attacker.mesh.position) * 0.6);
      if (attacker.isLocal) fx.shake = Math.min(1.6, fx.shake + 0.5 * powerMul);
      burst(px, 0.6, pz, '#facc15', 18, 14);
      fighters.forEach(other => {
        if (other.id === attacker.id) return;
        if (other.mesh.position.y > 1.6) {
          if (other.isLocal) spawnMemeSprite(other.mesh.position.x, 2, other.mesh.position.z, 'DODGED! 😎', '#38bdf8');
          return;
        }
        const dx = other.mesh.position.x - px;
        const dz = other.mesh.position.z - pz;
        const dist = Math.hypot(dx, dz);
        if (dist < radius && dist > 0.01) {
          const closeness = (radius - dist) / radius;
          launch(other, attacker, dx / dist, dz / dist, (7 + 9 * closeness) * powerMul, 8, (14 + 10 * closeness) * powerMul);
          if (Math.random() < 0.5) flingMinion(other, dx / dist, dz / dist);
        }
      });
    };

    const doJump = (f, dirX, dirZ) => {
      if (f.jumps <= 0 || f.stun > 0 || f.pounding) return false;
      const first = f.jumps === 2 && f.mesh.position.y <= 0.05;
      f.vy = first ? 16 : 15;
      if (!first) {
        // double jump: also a horizontal burst so you can recover from the edge
        f.vx = f.vx * 0.4 + dirX * 14;
        f.vz = f.vz * 0.4 + dirZ * 14;
        burst(f.mesh.position.x, f.mesh.position.y + 0.3, f.mesh.position.z, '#e2e8f0', 8, 5);
      }
      f.jumps -= 1;
      f.squash = 0.4;
      sfx.play('pop', f.isLocal ? 0.9 : volAt(f.mesh.position) * 0.5, first ? 0.7 : 1.1);
      return true;
    };

    const onKeyDown = (e) => {
      const code = e.code;
      keysRef.current[code] = true;
      if (code === 'Space') {
        e.preventDefault();
        if (!e.repeat) actionTriggerRef.current.jump = true;
      } else if (code === 'KeyR' || code === 'KeyF') {
        actionTriggerRef.current.call = true;
      } else if (code === 'KeyE') {
        actionTriggerRef.current.smash = true;
      } else if (code === 'KeyQ') {
        actionTriggerRef.current.swarm = true;
      } else if (code === 'KeyM') {
        const m = !sfx.isMuted();
        sfx.setMuted(m);
        setMuted(m);
      }
    };
    const onKeyUp = (e) => {
      keysRef.current[e.code] = false;
    };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    sfx.startMusic();
    sfx.onTrack(name => pushKillFeed(`🎵 Now playing: ${name}`, '#c084fc'));
    const blockGesture = ev => {
      if (ev.target && ev.target.closest && ev.target.closest('[data-scroll]')) return;
      ev.preventDefault();
    };
    document.addEventListener('gesturestart', blockGesture);
    document.addEventListener('touchmove', blockGesture, { passive: false });

    const animate = (now) => {
      animationFrameId = requestAnimationFrame(animate);
      const rawDt = Math.min((now - prevTime) / 1000, 0.1);
      prevTime = now;
      let dt = rawDt;
      if (fx.hitStop > 0) {
        fx.hitStop -= rawDt;
        dt = rawDt * 0.06; // freeze-frame on big hits
      }
      if (fx.liqTimer > 0) fx.liqTimer -= dt;
      if (fx.comboTimer > 0) fx.comboTimer -= rawDt;

      cdState.call = Math.max(0, cdState.call - dt);
      cdState.smash = Math.max(0, cdState.smash - dt);
      cdState.swarm = Math.max(0, cdState.swarm - dt);

      // ---------- match clock ----------
      const frozen = match.countdown > 0 || match.over;
      if (match.countdown > 0) match.countdown -= rawDt;
      else if (!match.over) {
        match.left -= dt;
        if (!matchRef.finalRush && match.left <= 30) {
          matchRef.finalRush = true;
          announceNow('FINAL 30s! KNOCKBACK x1.5', '#f97316');
          sfx.setRush(true);
          setArenaEventText('🔥 FINAL RUSH: EVERY HIT KNOCKS 1.5x FURTHER!');
          sfx.play('streak');
        }
        if (match.left <= 0) {
          match.over = true;
          const board = [...fighters]
            .map(f => ({ id: f.id, name: f.name, isLocal: f.isLocal, color: f.gangColor, kos: f.kos, gang: f.minions.length + 1 }))
            .sort((a, b) => b.kos - a.kos || b.gang - a.gang);
          const myRank = board.findIndex(b => b.isLocal) + 1;
          announceNow(myRank === 1 ? 'VICTORY! 🏆' : 'TIME!', myRank === 1 ? '#facc15' : '#ffffff');
          sfx.play(myRank === 1 ? 'streak' : 'ko');
          setTimeout(() => setResults({ board, myRank, kos: localFighter.kos, ...stats }), 1600);
        }
      }
      if (frozen) {
        actionTriggerRef.current.call = false;
        actionTriggerRef.current.smash = false;
        actionTriggerRef.current.swarm = false;
        actionTriggerRef.current.jump = false;
      }

      // ---------- rug pull ----------
      if (rug) {
        rug.t -= dt;
        if (rug.phase === 'warn') {
          rug.mat.opacity = 0.25 + (Math.sin(now * 0.025) > 0 ? 0.45 : 0);
          if (rug.t <= 0) {
            rug.phase = 'open';
            rug.t = 6;
            rug.mat.color.set(0x020617);
            rug.mat.opacity = 0.97;
            fx.shake = Math.min(1.6, fx.shake + 0.8);
            sfx.play('ko', 0.6);
            setArenaEventText('🕳️ RUG PULLED! DON\'T FALL IN!');
          }
        } else if (rug.t <= 0) {
          scene.remove(rug.mesh);
          rug = null;
          setArenaEventText('✅ FLOOR RESTORED • KEEP SWINGING!');
        }
      }

      powerTimer += dt;
      if (powerTimer > 8) {
        powerTimer = 0;
        spawnPowerup();
      }
      for (let i = powerups.length - 1; i >= 0; i--) {
        const pu = powerups[i];
        pu.icon.position.y = 1.9 + Math.sin(now * 0.004 + pu.ph) * 0.35;
        pu.grp.rotation.y += dt;
        const taker = fighters.find(f => (f.isLocal || f.isBot) && f.mesh.position.distanceTo(pu.grp.position) < 2.6);
        if (taker) {
          applyPowerup(taker, pu.type);
          scene.remove(pu.grp);
          powerups.splice(i, 1);
        }
      }

      const beat = Math.pow(1 - ((now / 1000) * (124 / 60)) % 1, 3);
      pillarMats.forEach((m, i) => (m.emissiveIntensity = 0.7 + beat * 1.6 + (i % 2) * 0.2));
      candles.forEach(c => (c.grp.position.y = c.base + Math.sin(now * 0.0006 + c.ph) * 1.5));
      asteroids.forEach(a => {
        a.rock.rotation.x += a.spin * dt;
        a.rock.rotation.y += a.spin * 0.7 * dt;
        a.rock.position.y += Math.sin(now * 0.0005 + a.ph) * 0.01;
      });
      bumpers.forEach(b => {
        b.pulse = Math.max(0, b.pulse - dt * 4);
        const sc = 1 + b.pulse * 0.25;
        b.grp.scale.set(sc, 1 + b.pulse * 0.1, sc);
        b.mat.emissiveIntensity = 0.7 + b.pulse * 2.5;
      });

      hazardTimer += dt;
      if (hazardTimer > 16) {
        hazardTimer = 0;
        spawnWildPanda();
        spawnWildPanda();
        const roll = Math.random();
        if (roll < 0.4 && !rug) {
          startRug();
        } else if (roll < 0.7) {
          fx.liqTimer = 10;
          setArenaEventText('⚡ LIQUIDATION CANDLE: KNOCKBACK +35% FOR 10s!');
        } else {
          setArenaEventText('🌕 FULL MOON AIRDROP: +2 WILD PANDAS SPAWNED!');
        }
      }

      let moveX = 0;
      let moveZ = 0;
      if (keysRef.current['KeyW'] || keysRef.current['ArrowUp']) moveZ -= 1;
      if (keysRef.current['KeyS'] || keysRef.current['ArrowDown']) moveZ += 1;
      if (keysRef.current['KeyA'] || keysRef.current['ArrowLeft']) moveX -= 1;
      if (keysRef.current['KeyD'] || keysRef.current['ArrowRight']) moveX += 1;

      if (joystickRef.current.active) {
        moveX += joystickRef.current.dx;
        moveZ += joystickRef.current.dy;
      }
      if (frozen) {
        moveX = 0;
        moveZ = 0;
      }

      const moveLen = Math.hypot(moveX, moveZ);
      const localAirborne = localFighter.mesh.position.y > 0.05;
      if (actionTriggerRef.current.jump) {
        const jl = moveLen > 0.01 ? moveLen : 1;
        let jx = moveX / jl, jz = moveZ / jl;
        if (moveLen <= 0.01) {
          // no input: double jump drifts back toward the centre
          const r = Math.hypot(localFighter.mesh.position.x, localFighter.mesh.position.z) || 1;
          jx = r > ARENA_RADIUS - 3 ? -localFighter.mesh.position.x / r : 0;
          jz = r > ARENA_RADIUS - 3 ? -localFighter.mesh.position.z / r : 0;
        }
        doJump(localFighter, jx, jz);
      }
      actionTriggerRef.current.jump = false;

      if (localFighter.stun > 0 || localAirborne) {
        // knocked: little control. jumping: decent air control for recovery
        const airCtl = localFighter.stun > 0 ? 9 : 26;
        if (moveLen > 0.01) {
          localFighter.vx += (moveX / moveLen) * airCtl * dt;
          localFighter.vz += (moveZ / moveLen) * airCtl * dt;
          const cap = 16;
          const hs = Math.hypot(localFighter.vx, localFighter.vz);
          if (localFighter.stun <= 0 && hs > cap) {
            localFighter.vx *= cap / hs;
            localFighter.vz *= cap / hs;
          }
        }
      } else if (moveLen > 0.01) {
        const speedBoost = localFighter.swarmTimer > 0 ? 1.48 : 1.0;
        const speed = 13.5 * localFighter.pandaClass.speed * speedBoost * (localFighter.buffs.speed > 0 ? 1.45 : 1);
        localFighter.vx += ((moveX / moveLen) * speed - localFighter.vx) * 10 * dt;
        localFighter.vz += ((moveZ / moveLen) * speed - localFighter.vz) * 10 * dt;
      } else {
        localFighter.vx *= Math.pow(0.08, dt);
        localFighter.vz *= Math.pow(0.08, dt);
      }

      let netEvent = null;
      if (actionTriggerRef.current.call && cdState.call <= 0) {
        cdState.call = 5.5;
        const recruitRadius = localFighter.pandaClass.id === 'street_gm' ? 14 : 10;
        triggerShockwave(localFighter.mesh.position.x, localFighter.mesh.position.z, 0x22c55e, recruitRadius);
        spawnMemeSprite(localFighter.mesh.position.x, 1.5, localFighter.mesh.position.z, '📱 CALLING THE GANG!', '#4ade80');
        sfx.play('call');
        addMinionToFighter(localFighter);

        for (let i = wildMinions.length - 1; i >= 0; i--) {
          const wm = wildMinions[i];
          if (wm.mesh.position.distanceTo(localFighter.mesh.position) <= recruitRadius) {
            scene.remove(wm.mesh);
            wildMinions.splice(i, 1);
            addMinionToFighter(localFighter);
          }
        }
      }
      actionTriggerRef.current.call = false;

      if (actionTriggerRef.current.smash && cdState.smash <= 0) {
        cdState.smash = 4.0;
        netEvent = 'smash';
        if (localAirborne && localFighter.stun <= 0) {
          // GROUND POUND: slam straight down, bigger blast on landing
          localFighter.pounding = true;
          localFighter.vy = -48;
          localFighter.vx *= 0.15;
          localFighter.vz *= 0.15;
          sfx.play('fall', 0.6);
        } else {
          doSmash(localFighter, 12, 1, '💍 GMI RING SMASH!');
        }
      }
      actionTriggerRef.current.smash = false;

      if (actionTriggerRef.current.swarm && cdState.swarm <= 0) {
        cdState.swarm = 7.0;
        localFighter.swarmTimer = 3.6;
        triggerShockwave(localFighter.mesh.position.x, localFighter.mesh.position.z, 0xef4444, 9);
        spawnMemeSprite(localFighter.mesh.position.x, 1.8, localFighter.mesh.position.z, '🔥 360° GANG SWARM!', '#f87171');
        sfx.play('swarm');
        fighters.forEach(other => {
          if (other.id === localFighter.id) return;
          const dx = other.mesh.position.x - localFighter.mesh.position.x;
          const dz = other.mesh.position.z - localFighter.mesh.position.z;
          const dist = Math.hypot(dx, dz);
          if (dist < 7 && dist > 0.01) launch(other, localFighter, dx / dist, dz / dist, 7, 6, 8);
        });
      }
      actionTriggerRef.current.swarm = false;

      let currentBeatdownBanner = null;

      fighters.forEach((f, idx) => {
        if (f.swarmTimer > 0) f.swarmTimer -= dt;
        if (f.punchAnim > 0) f.punchAnim -= dt;
        if (f.stun > 0) f.stun -= dt;
        if (f.punchCd > 0) f.punchCd -= dt;
        if (f.squash > 0) f.squash = Math.max(0, f.squash - dt * 4);
        if (f.respawnLock > 0) f.respawnLock -= dt;
        if (f.buffs.speed > 0) f.buffs.speed -= dt;
        if (f.buffs.armor > 0) f.buffs.armor -= dt;
        if (f.buffs.pump > 0) f.buffs.pump -= dt;
        f.bubble.visible = f.buffs.armor > 0;
        if (f.bubble.visible) f.bubble.material.opacity = 0.2 + Math.sin(now * 0.01) * 0.08;

        if (f.isBot && frozen) {
          f.vx *= Math.exp(-6 * dt);
          f.vz *= Math.exp(-6 * dt);
        } else if (f.isBot) {
          // recovery: double jump back toward the arena when falling off
          const bp = f.mesh.position;
          const br = Math.hypot(bp.x, bp.z);
          if ((br > ARENA_RADIUS || inRug(bp)) && f.vy < 0 && bp.y < 1.5 && f.jumps > 0 && f.stun <= 0) {
            doJump(f, -bp.x / (br || 1), -bp.z / (br || 1));
          }
          f.aiTimer -= dt;
          if (f.aiTimer <= 0) {
            if (Math.random() < 0.12) doJump(f, 0, 0);
            f.aiTimer = 0.6 + Math.random() * 0.6;
            const distFromCenter = Math.hypot(f.mesh.position.x, f.mesh.position.z);
            if (distFromCenter > ARENA_RADIUS - 7) {
              f.aiDirX = -f.mesh.position.x / distFromCenter;
              f.aiDirZ = -f.mesh.position.z / distFromCenter;
            } else {
              let bestTarget = localFighter;
              let minDist = 999;
              fighters.forEach(cand => {
                if (cand.id === f.id) return;
                const d = f.mesh.position.distanceTo(cand.mesh.position);
                if (d < minDist) {
                  minDist = d;
                  bestTarget = cand;
                }
              });
              const dx = bestTarget.mesh.position.x - f.mesh.position.x;
              const dz = bestTarget.mesh.position.z - f.mesh.position.z;
              const l = Math.hypot(dx, dz) || 1;
              f.aiDirX = dx / l;
              f.aiDirZ = dz / l;

              if (minDist < 6.5 && Math.random() < 0.35 && f.stun <= 0) {
                f.punchAnim = 0.35;
                triggerShockwave(f.mesh.position.x, f.mesh.position.z, f.gangColor, 6.5);
                sfx.play('smash', volAt(f.mesh.position) * 0.45);
                fighters.forEach(victim => {
                  if (victim.id === f.id) return;
                  const vdx = victim.mesh.position.x - f.mesh.position.x;
                  const vdz = victim.mesh.position.z - f.mesh.position.z;
                  const vd = Math.hypot(vdx, vdz);
                  if (victim.mesh.position.y > 1.6) return;
                  if (vd < 6.5 && vd > 0.01) launch(victim, f, vdx / vd, vdz / vd, 5 + 5 * (1 - vd / 6.5), 6, 9);
                });
              }
            }
          }
          if (f.stun <= 0 && f.mesh.position.y <= 0.05) {
            const botSpeed = 9.8 * f.pandaClass.speed * (f.buffs.speed > 0 ? 1.45 : 1);
            f.vx += ((f.aiDirX || 0) * botSpeed - f.vx) * 4 * dt;
            f.vz += ((f.aiDirZ || 0) * botSpeed - f.vz) * 4 * dt;
          }
        } else if (!f.isLocal && f.targetX !== undefined) {
          const ox = f.mesh.position.x, oz = f.mesh.position.z;
          f.mesh.position.x += (f.targetX - f.mesh.position.x) * 12 * dt;
          f.mesh.position.z += (f.targetZ - f.mesh.position.z) * 12 * dt;
          f.mesh.position.y += ((f.targetY || 0) - f.mesh.position.y) * 12 * dt;
          f.vx = (f.mesh.position.x - ox) / Math.max(dt, 0.001);
          f.vz = (f.mesh.position.z - oz) / Math.max(dt, 0.001);
        }

        if (f.isLocal || f.isBot) {
          const pos = f.mesh.position;
          pos.x += f.vx * dt;
          pos.z += f.vz * dt;
          pos.y += f.vy * dt;
          f.vy -= 38 * dt;
          const onArena = Math.hypot(pos.x, pos.z) <= ARENA_RADIUS + 0.4 && !inRug(pos) && pos.y > -2.5;
          const airborne = pos.y > 0.05;

          if (onArena && pos.y <= 0 && f.vy <= 0 && f.pounding) {
            f.pounding = false;
            pos.y = 0;
            f.vy = 0;
            f.jumps = 2;
            f.squash = 1;
            doSmash(f, 9.5, 1.3, '⬇️ GROUND POUND!');
          } else if (onArena && pos.y <= 0 && f.vy <= 0 && f.vy > -9) {
            pos.y = 0;
            f.vy = 0;
            f.jumps = 2;
          } else if (onArena && pos.y <= 0 && f.vy <= 0 && f.stun <= 0) {
            // normal landing from a jump: little squash, no bounce
            pos.y = 0;
            f.vy = 0;
            f.jumps = 2;
            f.squash = 0.35;
          } else if (onArena && pos.y <= 0 && f.vy <= 0) {
            if (f.vy < -9) {
              // BOUNCE
              const impact = -f.vy;
              f.vy = impact * 0.5;
              pos.y = 0;
              f.squash = Math.min(1, impact / 22);
              burst(pos.x, 0.3, pos.z, '#e2e8f0', 5, 6);
              if (f.isLocal) fx.shake = Math.min(1.6, fx.shake + impact / 60);
              if (impact > 12) sfx.play('bounce', f.isLocal ? 1 : volAt(pos) * 0.7, 0.8 + Math.random() * 0.4);
            } else {
              pos.y = 0;
              f.vy = 0;
            }
          }

          // friction: air keeps momentum, stunned bodies slide, everyone else is steered above
          if (airborne) {
            f.vx *= Math.exp(-1.0 * dt);
            f.vz *= Math.exp(-1.0 * dt);
          } else if (f.stun > 0) {
            f.vx *= Math.exp(-1.8 * dt);
            f.vz *= Math.exp(-1.8 * dt);
          }

          if (!onArena && !f.fallSnd) {
            f.fallSnd = true;
            sfx.play('fall', f.isLocal ? 1 : volAt(pos));
          }

          // speed trail when launched hard
          const spd = Math.hypot(f.vx, f.vz);
          if (f.stun > 0 && spd > 16 && Math.random() < 0.7) burst(pos.x, pos.y + 1.2, pos.z, f.gangColor, 1, 1.5);

          // pinball bumpers
          if (pos.y < 2) {
            bumpers.forEach(b => {
              const bx = pos.x - b.x, bz = pos.z - b.z;
              const bd = Math.hypot(bx, bz);
              if (bd < 2.9 && bd > 0.01) {
                const nx = bx / bd, nz = bz / bd;
                const out = Math.max(24, spd * 1.15);
                f.vx = nx * out;
                f.vz = nz * out;
                f.vy = Math.max(f.vy, 9);
                f.stun = Math.max(f.stun, 0.45);
                pos.x = b.x + nx * 2.95;
                pos.z = b.z + nz * 2.95;
                b.pulse = 1;
                burst(pos.x, 1.2, pos.z, '#f9a8d4', 10, 9);
                sfx.play('bumper', f.isLocal ? 1 : volAt(pos) * 0.8);
                if (f.isLocal) fx.shake = Math.min(1.6, fx.shake + 0.5);
              }
            });
          }

          // tumble while flying
          if (airborne && f.stun > 0) {
            f.mesh.rotation.z += 9 * dt;
          } else {
            f.mesh.rotation.z *= Math.exp(-14 * dt);
          }
          const sq = f.squash;
          f.mesh.scale.set(f.baseScale * (1 + sq * 0.35), f.baseScale * (1 - sq * 0.4), f.baseScale * (1 + sq * 0.35));
        }

        if (Math.hypot(f.vx, f.vz) > 0.5 && !(f.stun > 0 && f.mesh.position.y > 0.05)) {
          const targetRot = Math.atan2(f.vx, f.vz);
          f.mesh.rotation.y = targetRot;
        }

        // refresh the name tag when damage changes
        const shownDmg = Math.round(f.dmg);
        if (shownDmg !== f.tag.shown) {
          f.tag.shown = shownDmg;
          drawNameTag(f.tag.canvas, f.name, f.dmg, f.gangColor, f.isLocal);
          f.tag.tex.needsUpdate = true;
        }
        f.tag.sprite.position.set(f.mesh.position.x, f.mesh.position.y + 5.9, f.mesh.position.z);
        if (f.mesh.userData.youArrow) {
          f.mesh.userData.youArrow.position.y = 4.95 + Math.sin(now * 0.006) * 0.25;
          f.mesh.userData.youArrow.rotation.y += 3 * dt;
        }

        const ud = f.mesh.userData;
        if (ud) {
          ud.headGroup.position.y = 2.08 + Math.sin(now * 0.008 + idx) * 0.05;
          ud.rightArmGroup.position.z = f.punchAnim > 0 ? 0.65 : 0.2;
          ud.ringSpark.rotation.y += 4 * dt;
        }

        for (let w = wildMinions.length - 1; w >= 0; w--) {
          if (wildMinions[w].mesh.position.distanceTo(f.mesh.position) < 2.6) {
            scene.remove(wildMinions[w].mesh);
            wildMinions.splice(w, 1);
            addMinionToFighter(f);
            if (f.isLocal) {
              spawnMemeSprite(f.mesh.position.x, 1.4, f.mesh.position.z, '+1 PANDA GANG! 🐼', '#4ade80');
              sfx.play('pop', 0.8, 0.9 + Math.random() * 0.3);
            }
          }
        }

        fighters.forEach(enemy => {
          if (enemy.id === f.id) return;
          if (!enemy.isLocal && !enemy.isBot) return;
          const dx = enemy.mesh.position.x - f.mesh.position.x;
          const dz = enemy.mesh.position.z - f.mesh.position.z;
          const dist = Math.hypot(dx, dz);

          if (dist < 5.6 && dist > 0.01) {
            const gangCount = f.minions.length + 1;
            const enemyCount = enemy.minions.length + 1;

            const swarmBonus = f.swarmTimer > 0 ? 1.85 : 1.0;
            const surroundFactor = Math.max(1.0, (gangCount / Math.max(1, enemyCount)) * 1.35) * swarmBonus;

            if (dist < 3.6) {
              // light body push so gangs don't overlap
              const pushForce = 6 * surroundFactor * dt;
              enemy.vx += (dx / dist) * pushForce;
              enemy.vz += (dz / dist) * pushForce;
              enemy.lastHitBy = f;

              // gang punches: bigger gang + swarm = harder, faster hits
              if (f.punchCd <= 0 && f.stun <= 0) {
                f.punchCd = f.swarmTimer > 0 ? 0.3 : 0.6;
                f.punchAnim = 0.2;
                launch(enemy, f, dx / dist, dz / dist, 2.5 + 1.4 * surroundFactor, 3, 2 + 1.6 * surroundFactor);
              }

              if (gangCount >= enemyCount + 2 && Math.random() < 0.035) {
                const callout = MEME_CALLOUTS[Math.floor(Math.random() * MEME_CALLOUTS.length)];
                spawnMemeSprite(enemy.mesh.position.x, 1.5, enemy.mesh.position.z, callout, '#facc15');
                triggerShockwave(enemy.mesh.position.x, enemy.mesh.position.z, f.pandaClass.accent, 4.5);
                if (enemy.minions.length > 0 && Math.random() < 0.45) {
                  flingMinion(enemy, dx / dist, dz / dist);
                }
              }

              if ((f.isLocal || enemy.isLocal) && gangCount >= 4) {
                currentBeatdownBanner = `${f.name} (${gangCount}x Pandas) is SWARMING ${enemy.name}!`;
              }
            }
          }
        });

        const totalMinions = f.minions.length;
        f.minions.forEach((m, mIdx) => {
          const orbitAngle = (now * 0.0032 * (f.swarmTimer > 0 ? 2.2 : 1)) + (mIdx * Math.PI * 2) / Math.max(1, totalMinions);
          const orbitRadius = f.swarmTimer > 0 ? 3.2 : 2.15 + (mIdx % 2) * 0.75;
          const targetMX = f.mesh.position.x + Math.cos(orbitAngle) * orbitRadius;
          const targetMZ = f.mesh.position.z + Math.sin(orbitAngle) * orbitRadius;

          m.mesh.position.x += (targetMX - m.mesh.position.x) * 9 * dt;
          m.mesh.position.z += (targetMZ - m.mesh.position.z) * 9 * dt;
          m.mesh.position.y = Math.max(f.mesh.position.y * 0.6, 0) + Math.abs(Math.sin(now * 0.012 + mIdx)) * 0.28;
          m.mesh.rotation.y = f.mesh.rotation.y;
        });

        const fellOut = (f.isLocal || f.isBot) && f.mesh.position.y < -14;
        if (fellOut) {
          const killer = f.lastHitBy;
          if (killer && killer.id !== f.id) {
            if (killer.isLocal || killer.isBot) {
              creditKO(killer, f.name, f.mesh.position.x, f.mesh.position.z);
            } else {
              send({ t: 'k', id: myIdRef.current, killer: killer.id, kn: killer.name, vn: f.name, vx: f.mesh.position.x, vz: f.mesh.position.z });
              pushKillFeed(`💥 ${killer.name}'s gang RINGED OUT ${f.name}!`, '#facc15');
            }
          } else {
            pushKillFeed(`🌌 ${f.name} fell into Deep Space!`, '#f87171');
          }

          spawnMemeSprite(f.mesh.position.x * 0.85, 2.2, f.mesh.position.z * 0.85, 'LIQUIDATED! 💀', '#ef4444');
          sfx.play('ko', (f.isLocal || (killer && killer.isLocal)) ? 1 : volAt(f.mesh.position) * 0.6);
          f.streak = 0;
          f.fallSnd = false;
          f.pounding = false;
          f.jumps = 2;
          if (f.isLocal) stats.falls += 1;
          if (f.isLocal) announceNow('YOU GOT LIQUIDATED 💀', '#ef4444');

          burst(f.mesh.position.x, -2, f.mesh.position.z, f.gangColor, 30, 18);
          const respawnAngle = Math.random() * Math.PI * 2;
          f.mesh.position.set(Math.cos(respawnAngle) * 8, 16, Math.sin(respawnAngle) * 8);
          f.vx = 0;
          f.vy = 0;
          f.vz = 0;
          f.dmg = 0;
          f.stun = 0;
          f.respawnLock = 1.2;
          f.mesh.rotation.z = 0;
          f.lastHitBy = null;
          // losing a stock costs half your gang
          const lose = Math.floor(f.minions.length / 2);
          for (let k = 0; k < lose; k++) {
            const gone = f.minions.pop();
            scene.remove(gone.mesh);
          }
          if (f.isLocal) setMyGangSize(f.minions.length + 1);
        }
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.vy -= 30 * dt;
        pt.m.position.x += pt.vx * dt;
        pt.m.position.y += pt.vy * dt;
        pt.m.position.z += pt.vz * dt;
        pt.m.rotation.x += 8 * dt;
        pt.life -= dt;
        pt.mat.opacity = Math.max(0, pt.life * 1.6);
        if (pt.life <= 0) {
          scene.remove(pt.m);
          pt.mat.dispose();
          particles.splice(i, 1);
        }
      }

      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.vy -= 34 * dt;
        d.mesh.position.x += d.vx * dt;
        d.mesh.position.y += d.vy * dt;
        d.mesh.position.z += d.vz * dt;
        d.mesh.rotation.x += 11 * dt;
        d.mesh.rotation.z += 7 * dt;
        d.life -= dt;
        if (d.life <= 0 || d.mesh.position.y < -20) {
          scene.remove(d.mesh);
          debris.splice(i, 1);
        }
      }

      wildMinions.forEach(wm => {
        wm.mesh.position.y = Math.abs(Math.sin(now * 0.005 + wm.bobOffset)) * 0.25;
        wm.mesh.rotation.y += 1.2 * dt;
      });

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.scale += 26 * dt;
        sw.mesh.scale.set(sw.scale, sw.scale, 1);
        sw.mat.opacity -= 1.9 * dt;
        if (sw.mat.opacity <= 0) {
          scene.remove(sw.mesh);
          shockwaves.splice(i, 1);
        }
      }

      for (let i = floatingMemes.length - 1; i >= 0; i--) {
        const fm = floatingMemes[i];
