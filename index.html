        for (let i = wildMinions.length - 1; i >= 0; i--) {
          const wm = wildMinions[i];
          if (wm.mesh.position.distanceTo(localFighter.mesh.position) <= recruitRadius) {
            scene.remove(wm.mesh);
            wildMinions.splice(i, 1);
            addMinionToFighter(localFighter);
          }
        }
      }
      actionTriggerRef.current.call = false;

      if (actionTriggerRef.current.smash && localFighter.weapon && !frozen) {
        useWeapon(localFighter);
        actionTriggerRef.current.smash = false;
      }
      if (actionTriggerRef.current.smash && cdState.smash <= 0) {
        cdState.smash = 4.0;
        netEvent = 'smash';
        if (localAirborne && localFighter.stun <= 0) {
          // GROUND POUND: slam straight down, bigger blast on landing
          localFighter.pounding = true;
          localFighter.vy = -48;
          localFighter.vx *= 0.15;
          localFighter.vz *= 0.15;
          sfx.play('fall', 0.6);
        } else {
          doSmash(localFighter, 12, 1, '💍 GMI RING SMASH!');
        }
      }
      actionTriggerRef.current.smash = false;

      if (actionTriggerRef.current.swarm && cdState.swarm <= 0) {
        cdState.swarm = 7.0;
        localFighter.swarmTimer = 3.6;
        triggerShockwave(localFighter.mesh.position.x, localFighter.mesh.position.z, 0xef4444, 9);
        spawnMemeSprite(localFighter.mesh.position.x, 1.8, localFighter.mesh.position.z, '🔥 360° GANG SWARM!', '#f87171');
        sfx.play('swarm');
        fighters.forEach(other => {
          if (other.id === localFighter.id) return;
          const dx = other.mesh.position.x - localFighter.mesh.position.x;
          const dz = other.mesh.position.z - localFighter.mesh.position.z;
          const dist = Math.hypot(dx, dz);
          if (dist < 7 && dist > 0.01) launch(other, localFighter, dx / dist, dz / dist, 7, 6, 8);
        });
      }
      actionTriggerRef.current.swarm = false;

      let currentBeatdownBanner = null;

      fighters.forEach((f, idx) => {
        if (f.swarmTimer > 0) f.swarmTimer -= dt;
        if (f.punchAnim > 0) f.punchAnim -= dt;
        if (f.stun > 0) f.stun -= dt;
        if (f.punchCd > 0) f.punchCd -= dt;
        if (f.squash > 0) f.squash = Math.max(0, f.squash - dt * 4);
        if (f.respawnLock > 0) f.respawnLock -= dt;
        if (f.weapon) {
          if (f.weapon.cd > 0) f.weapon.cd -= dt;
          if (f.weapon.swing > 0) {
            f.weapon.swing -= dt;
            f.mesh.userData.rightArmGroup.rotation.x = -Math.sin((f.weapon.swing / 0.3) * Math.PI) * 1.6;
          } else {
            f.mesh.userData.rightArmGroup.rotation.x = 0;
          }
          if (f.isBot && !frozen && f.stun <= 0) {
            let near = null, nd = 999;
            fighters.forEach(o => {
              if (o.id === f.id) return;
              const d = o.mesh.position.distanceTo(f.mesh.position);
              if (d < nd) { nd = d; near = o; }
            });
            if (near && ((f.weapon.kind === 'hammer' && nd < 5) || (f.weapon.kind === 'launcher' && nd < 26 && nd > 5))) {
              f.mesh.rotation.y = Math.atan2(near.mesh.position.x - f.mesh.position.x, near.mesh.position.z - f.mesh.position.z);
              if (Math.random() < 0.08) useWeapon(f);
            }
          }
        }
        if (f.buffs.speed > 0) f.buffs.speed -= dt;
        if (f.buffs.armor > 0) f.buffs.armor -= dt;
        if (f.buffs.pump > 0) f.buffs.pump -= dt;
        f.bubble.visible = f.buffs.armor > 0;
        if (f.bubble.visible) f.bubble.material.opacity = 0.2 + Math.sin(now * 0.01) * 0.08;

        if (f.isBot && frozen) {
          f.vx *= Math.exp(-6 * dt);
          f.vz *= Math.exp(-6 * dt);
        } else if (f.isBot) {
          // recovery: double jump back toward the arena when falling off
          const bp = f.mesh.position;
          const br = Math.hypot(bp.x, bp.z);
          if ((br > ARENA_RADIUS || inRug(bp)) && f.vy < 0 && bp.y < 1.5 && f.jumps > 0 && f.stun <= 0) {
            doJump(f, -bp.x / (br || 1), -bp.z / (br || 1));
          }
          f.aiTimer -= dt;
          if (f.aiTimer <= 0) {
            if (Math.random() < 0.12) doJump(f, 0, 0);
            f.aiTimer = 0.6 + Math.random() * 0.6;
            const distFromCenter = Math.hypot(f.mesh.position.x, f.mesh.position.z);
            if (distFromCenter > ARENA_RADIUS - 7) {
              f.aiDirX = -f.mesh.position.x / distFromCenter;
              f.aiDirZ = -f.mesh.position.z / distFromCenter;
            } else {
              let bestTarget = localFighter;
              let minDist = 999;
              fighters.forEach(cand => {
                if (cand.id === f.id) return;
                const d = f.mesh.position.distanceTo(cand.mesh.position);
                if (d < minDist) {
                  minDist = d;
                  bestTarget = cand;
                }
              });
              const dx = bestTarget.mesh.position.x - f.mesh.position.x;
              const dz = bestTarget.mesh.position.z - f.mesh.position.z;
              const l = Math.hypot(dx, dz) || 1;
              f.aiDirX = dx / l;
              f.aiDirZ = dz / l;

              if (minDist < 6.5 && Math.random() < 0.35 && f.stun <= 0) {
                f.punchAnim = 0.35;
                triggerShockwave(f.mesh.position.x, f.mesh.position.z, f.gangColor, 6.5);
                sfx.play('smash', volAt(f.mesh.position) * 0.45);
                fighters.forEach(victim => {
                  if (victim.id === f.id) return;
                  const vdx = victim.mesh.position.x - f.mesh.position.x;
                  const vdz = victim.mesh.position.z - f.mesh.position.z;
                  const vd = Math.hypot(vdx, vdz);
                  if (victim.mesh.position.y > 1.6) return;
                  if (vd < 6.5 && vd > 0.01) launch(victim, f, vdx / vd, vdz / vd, 5 + 5 * (1 - vd / 6.5), 6, 9);
                });
              }
            }
          }
          if (f.stun <= 0 && f.mesh.position.y <= 0.05) {
            const botSpeed = 9.8 * f.pandaClass.speed * (f.buffs.speed > 0 ? 1.45 : 1);
            f.vx += ((f.aiDirX || 0) * botSpeed - f.vx) * 4 * dt;
            f.vz += ((f.aiDirZ || 0) * botSpeed - f.vz) * 4 * dt;
          }
        } else if (!f.isLocal && f.targetX !== undefined) {
          const ox = f.mesh.position.x, oz = f.mesh.position.z;
          f.mesh.position.x += (f.targetX - f.mesh.position.x) * 12 * dt;
          f.mesh.position.z += (f.targetZ - f.mesh.position.z) * 12 * dt;
          f.mesh.position.y += ((f.targetY || 0) - f.mesh.position.y) * 12 * dt;
          f.vx = (f.mesh.position.x - ox) / Math.max(dt, 0.001);
          f.vz = (f.mesh.position.z - oz) / Math.max(dt, 0.001);
        }

        if (f.isLocal || f.isBot) {
          const pos = f.mesh.position;
          pos.x += f.vx * dt;
          pos.z += f.vz * dt;
          pos.y += f.vy * dt;
          f.vy -= 38 * dt;
          const onArena = Math.hypot(pos.x, pos.z) <= ARENA_RADIUS + 0.4 && !inRug(pos) && pos.y > -2.5;
          const airborne = pos.y > 0.05;

          if (onArena && pos.y <= 0 && f.vy <= 0 && f.pounding) {
            f.pounding = false;
            pos.y = 0;
            f.vy = 0;
            f.jumps = 2;
            f.squash = 1;
            doSmash(f, 9.5, 1.3, '⬇️ GROUND POUND!');
          } else if (onArena && pos.y <= 0 && f.vy <= 0 && f.vy > -9) {
            pos.y = 0;
            f.vy = 0;
            f.jumps = 2;
          } else if (onArena && pos.y <= 0 && f.vy <= 0 && f.stun <= 0) {
            // normal landing from a jump: little squash, no bounce
            pos.y = 0;
            f.vy = 0;
            f.jumps = 2;
            f.squash = 0.35;
          } else if (onArena && pos.y <= 0 && f.vy <= 0) {
            if (f.vy < -9) {
              // BOUNCE
              const impact = -f.vy;
              f.vy = impact * 0.5;
              pos.y = 0;
              f.squash = Math.min(1, impact / 22);
              burst(pos.x, 0.3, pos.z, '#e2e8f0', 5, 6);
              if (f.isLocal) fx.shake = Math.min(1.6, fx.shake + impact / 60);
              if (impact > 12) sfx.play('bounce', f.isLocal ? 1 : volAt(pos) * 0.7, 0.8 + Math.random() * 0.4);
            } else {
              pos.y = 0;
              f.vy = 0;
            }
          }

          // friction: air keeps momentum, stunned bodies slide, everyone else is steered above
          if (airborne) {
            f.vx *= Math.exp(-1.0 * dt);
            f.vz *= Math.exp(-1.0 * dt);
          } else if (f.stun > 0) {
            f.vx *= Math.exp(-1.8 * dt);
            f.vz *= Math.exp(-1.8 * dt);
          }

          if (!onArena && !f.fallSnd) {
            f.fallSnd = true;
            sfx.play('fall', f.isLocal ? 1 : volAt(pos));
          }

          // speed trail when launched hard
          const spd = Math.hypot(f.vx, f.vz);
          if (f.stun > 0 && spd > 16 && Math.random() < 0.7) burst(pos.x, pos.y + 1.2, pos.z, f.gangColor, 1, 1.5);

          // pinball bumpers
          if (pos.y < 2) {
            bumpers.forEach(b => {
              const bx = pos.x - b.x, bz = pos.z - b.z;
              const bd = Math.hypot(bx, bz);
              if (bd < 2.9 && bd > 0.01) {
                const nx = bx / bd, nz = bz / bd;
                const out = Math.max(24, spd * 1.15);
                f.vx = nx * out;
                f.vz = nz * out;
                f.vy = Math.max(f.vy, 9);
                f.stun = Math.max(f.stun, 0.45);
                pos.x = b.x + nx * 2.95;
                pos.z = b.z + nz * 2.95;
                b.pulse = 1;
                burst(pos.x, 1.2, pos.z, '#ffb070', 10, 9);
                sfx.play('bumper', f.isLocal ? 1 : volAt(pos) * 0.8);
                if (f.isLocal) fx.shake = Math.min(1.6, fx.shake + 0.5);
              }
            });
          }

          // tumble while flying
          if (airborne && f.stun > 0) {
            f.mesh.rotation.z += 9 * dt;
          } else {
            f.mesh.rotation.z *= Math.exp(-14 * dt);
          }
          const sq = f.squash;
          f.mesh.scale.set(f.baseScale * (1 + sq * 0.35), f.baseScale * (1 - sq * 0.4), f.baseScale * (1 + sq * 0.35));
        }

        if (Math.hypot(f.vx, f.vz) > 0.5 && !(f.stun > 0 && f.mesh.position.y > 0.05)) {
          const targetRot = Math.atan2(f.vx, f.vz);
          f.mesh.rotation.y = targetRot;
        }

        // refresh the name tag when damage changes
        const shownDmg = Math.round(f.dmg);
        if (shownDmg !== f.tag.shown) {
          f.tag.shown = shownDmg;
          drawNameTag(f.tag.canvas, f.name, f.dmg, f.gangColor, f.isLocal);
          f.tag.tex.needsUpdate = true;
        }
        f.tag.sprite.position.set(f.mesh.position.x, f.mesh.position.y + 5.9, f.mesh.position.z);
        if (f.crown && f.crown.visible) f.crown.rotation.y += 1.5 * dt;
        if (f.mesh.userData.youArrow) {
          f.mesh.userData.youArrow.position.y = 4.95 + Math.sin(now * 0.006) * 0.25;
          f.mesh.userData.youArrow.rotation.y += 3 * dt;
        }

        const ud = f.mesh.userData;
        if (ud) {
          ud.headGroup.position.y = 2.08 + Math.sin(now * 0.008 + idx) * 0.05;
          ud.rightArmGroup.position.z = f.punchAnim > 0 ? 0.65 : 0.2;
          ud.ringSpark.rotation.y += 4 * dt;
        }

        for (let w = wildMinions.length - 1; w >= 0; w--) {
          if (wildMinions[w].mesh.position.distanceTo(f.mesh.position) < 2.6) {
            scene.remove(wildMinions[w].mesh);
            wildMinions.splice(w, 1);
            addMinionToFighter(f);
            if (f.isLocal) {
              spawnMemeSprite(f.mesh.position.x, 1.4, f.mesh.position.z, '+1 PANDA GANG! 🐼', '#4ade80');
              sfx.play('pop', 0.8, 0.9 + Math.random() * 0.3);
            }
          }
        }

        fighters.forEach(enemy => {
          if (enemy.id === f.id) return;
          if (!enemy.isLocal && !enemy.isBot) return;
          const dx = enemy.mesh.position.x - f.mesh.position.x;
          const dz = enemy.mesh.position.z - f.mesh.position.z;
          const dist = Math.hypot(dx, dz);

          if (dist < 5.6 && dist > 0.01) {
            const gangCount = f.minions.length + 1;
            const enemyCount = enemy.minions.length + 1;

            const swarmBonus = f.swarmTimer > 0 ? 1.85 : 1.0;
            const surroundFactor = Math.max(1.0, (gangCount / Math.max(1, enemyCount)) * 1.35) * swarmBonus;

            if (dist < 3.6) {
              // light body push so gangs don't overlap
              const pushForce = 6 * surroundFactor * dt;
              enemy.vx += (dx / dist) * pushForce;
              enemy.vz += (dz / dist) * pushForce;
              enemy.lastHitBy = f;

              // gang punches: bigger gang + swarm = harder, faster hits
              if (f.punchCd <= 0 && f.stun <= 0) {
                f.punchCd = f.swarmTimer > 0 ? 0.3 : 0.6;
                f.punchAnim = 0.2;
                launch(enemy, f, dx / dist, dz / dist, 2.5 + 1.4 * surroundFactor, 3, 2 + 1.6 * surroundFactor);
              }

              if (gangCount >= enemyCount + 2 && Math.random() < 0.035) {
                const callout = MEME_CALLOUTS[Math.floor(Math.random() * MEME_CALLOUTS.length)];
                spawnMemeSprite(enemy.mesh.position.x, 1.5, enemy.mesh.position.z, callout, '#facc15');
                triggerShockwave(enemy.mesh.position.x, enemy.mesh.position.z, f.pandaClass.accent, 4.5);
                if (enemy.minions.length > 0 && Math.random() < 0.45) {
                  flingMinion(enemy, dx / dist, dz / dist);
                }
              }

              if ((f.isLocal || enemy.isLocal) && gangCount >= 4) {
                currentBeatdownBanner = `${f.name} (${gangCount}x Pandas) is SWARMING ${enemy.name}!`;
              }
            }
          }
        });

        const totalMinions = f.minions.length;
        f.minions.forEach((m, mIdx) => {
          const orbitAngle = (now * 0.0032 * (f.swarmTimer > 0 ? 2.2 : 1)) + (mIdx * Math.PI * 2) / Math.max(1, totalMinions);
          const orbitRadius = f.swarmTimer > 0 ? 3.2 : 2.15 + (mIdx % 2) * 0.75;
          const targetMX = f.mesh.position.x + Math.cos(orbitAngle) * orbitRadius;
          const targetMZ = f.mesh.position.z + Math.sin(orbitAngle) * orbitRadius;

          m.mesh.position.x += (targetMX - m.mesh.position.x) * 9 * dt;
          m.mesh.position.z += (targetMZ - m.mesh.position.z) * 9 * dt;
          m.mesh.position.y = Math.max(f.mesh.position.y * 0.6, 0) + Math.abs(Math.sin(now * 0.012 + mIdx)) * 0.28;
          m.mesh.rotation.y = f.mesh.rotation.y;
        });

        const fellOut = (f.isLocal || f.isBot) && f.mesh.position.y < -14;
        if (fellOut) {
          // credit only goes to whoever hit you in the last 5 seconds; otherwise it's a self-destruct
          const killer = f.lastHitBy && now - (f.lastHitAt || 0) < 5000 ? f.lastHitBy : null;
          f.deaths = (f.deaths || 0) + 1;
          if (f.isLocal) setMyDeaths(f.deaths);
          if (f.isWhale) f.removeMe = true;
          if (killer && killer.id !== f.id) {
            if (killer.isLocal || killer.isBot) {
              creditKO(killer, f.name, f.mesh.position.x, f.mesh.position.z, f.streak || 0, !!f.isWhale);
            } else {
              send({ t: 'k', id: myIdRef.current, killer: killer.id, kn: killer.name, vn: f.name, vx: f.mesh.position.x, vz: f.mesh.position.z, vs: f.streak || 0, vw: f.isWhale ? 1 : 0 });
              pushKillFeed(`💥 ${killer.name}'s gang RINGED OUT ${f.name}!`, '#facc15');
            }
          } else {
            pushKillFeed(`🌌 ${f.name} fell into Deep Space!`, '#f87171');
          }

          spawnMemeSprite(f.mesh.position.x * 0.85, 2.2, f.mesh.position.z * 0.85, 'LIQUIDATED! 💀', '#ef4444');
          sfx.play('ko', (f.isLocal || (killer && killer.isLocal)) ? 1 : volAt(f.mesh.position) * 0.6);
          f.streak = 0;
          f.fallSnd = false;
          f.pounding = false;
          f.jumps = 2;
          dropWeapon(f);
          if (f.isLocal) stats.falls += 1;
          if (f.isLocal) announceNow('YOU GOT LIQUIDATED 💀', '#ef4444');

          burst(f.mesh.position.x, -2, f.mesh.position.z, f.gangColor, 30, 18);
          const respawnAngle = Math.random() * Math.PI * 2;
          f.mesh.position.set(Math.cos(respawnAngle) * 8, 16, Math.sin(respawnAngle) * 8);
          f.vx = 0;
          f.vy = 0;
          f.vz = 0;
          f.dmg = 0;
          f.stun = 0;
          f.respawnLock = 1.2;
          f.mesh.rotation.z = 0;
          f.lastHitBy = null;
          // losing a stock costs half your gang
          const lose = Math.floor(f.minions.length / 2);
          for (let k = 0; k < lose; k++) {
            const gone = f.minions.pop();
            scene.remove(gone.mesh);
          }
          if (f.isLocal) setMyGangSize(f.minions.length + 1);
        }
      });

      fighters.filter(f => f.removeMe).forEach(removeFighter);

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        pr.mesh.position.x += pr.vx * dt;
        pr.mesh.position.z += pr.vz * dt;
        pr.life -= dt;
        if (Math.random() < 0.8) burst(pr.mesh.position.x, pr.mesh.position.y, pr.mesh.position.z, '#ffb070', 1, 0.8);
        const hit = fighters.find(o => o.id !== pr.owner.id && Math.hypot(o.mesh.position.x - pr.mesh.position.x, o.mesh.position.z - pr.mesh.position.z) < 1.9);
        if (hit || pr.life <= 0) {
          explode(pr.mesh.position.x, pr.mesh.position.z, pr.owner);
          scene.remove(pr.mesh);
          projectiles.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.vy -= 30 * dt;
        pt.m.position.x += pt.vx * dt;
        pt.m.position.y += pt.vy * dt;
        pt.m.position.z += pt.vz * dt;
        pt.m.rotation.x += 8 * dt;
        pt.life -= dt;
        pt.mat.opacity = Math.max(0, pt.life * 1.6);
        if (pt.life <= 0) {
          scene.remove(pt.m);
          pt.mat.dispose();
          particles.splice(i, 1);
        }
      }

      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.vy -= 34 * dt;
        d.mesh.position.x += d.vx * dt;
        d.mesh.position.y += d.vy * dt;
        d.mesh.position.z += d.vz * dt;
        d.mesh.rotation.x += 11 * dt;
        d.mesh.rotation.z += 7 * dt;
        d.life -= dt;
        if (d.life <= 0 || d.mesh.position.y < -20) {
          scene.remove(d.mesh);
          debris.splice(i, 1);
        }
      }

      wildMinions.forEach(wm => {
        wm.mesh.position.y = Math.abs(Math.sin(now * 0.005 + wm.bobOffset)) * 0.25;
        wm.mesh.rotation.y += 1.2 * dt;
      });

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.scale += 26 * dt;
        sw.mesh.scale.set(sw.scale, sw.scale, 1);
        sw.mat.opacity -= 1.9 * dt;
        if (sw.mat.opacity <= 0) {
          scene.remove(sw.mesh);
          shockwaves.splice(i, 1);
        }
      }

      for (let i = floatingMemes.length - 1; i >= 0; i--) {
        const fm = floatingMemes[i];
        fm.sprite.position.y += 3.2 * dt;
        fm.life -= 0.85 * dt;
        fm.mat.opacity = Math.max(0, fm.life);
        if (fm.life <= 0) {
          scene.remove(fm.sprite);
          floatingMemes.splice(i, 1);
        }
      }

      const camTargetX = localFighter.mesh.position.x * camCfg.follow;
      const camTargetZ = localFighter.mesh.position.z * camCfg.follow + 29 * camCfg.zoom;
      const camTargetY = (localFighter.swarmTimer > 0 ? 22 : 27) * camCfg.zoom;
      camera.position.x += (camTargetX - camera.position.x) * 5 * dt;
      camera.position.z += (camTargetZ - camera.position.z) * 5 * dt;
      camera.position.y += (camTargetY - camera.position.y) * 4 * dt;
      camera.lookAt(
        localFighter.mesh.position.x * camCfg.look,
        1.0,
        localFighter.mesh.position.z * camCfg.look - 3
      );

      if (now - lastNetBroadcast > 66 || netEvent) {
        lastNetBroadcast = now;
        const r2 = v => Math.round(v * 100) / 100;
        const lp = localFighter.mesh.position;
        const pkt = { t: 's', id: myIdRef.current, name: playerName, c: selectedClass.id, x: r2(lp.x), y: r2(lp.y), z: r2(lp.z), d: Math.round(localFighter.dmg), m: localFighter.minions.length, k: localFighter.kos, dt: localFighter.deaths, st: localFighter.streak || 0, ev: netEvent };
        if (net.isHost) {
          pkt.left = Math.round(match.left * 10) / 10;
          pkt.b = fighters.filter(f => f.isBot).map(b => ({ i: b.id, n: b.name, c: b.pandaClass.id, x: r2(b.mesh.position.x), y: r2(b.mesh.position.y), z: r2(b.mesh.position.z), d: Math.round(b.dmg), m: b.minions.length, k: b.kos, dt: b.deaths, st: b.streak || 0 }));
        }
        send(pkt);
      }

      if (now - lastHudSync > 200) {
        lastHudSync = now;
        setCooldowns({
          call: Number(cdState.call.toFixed(1)),
          smash: Number(cdState.smash.toFixed(1)),
          swarm: Number(cdState.swarm.toFixed(1))
        });
        setActiveBeatdownAlert(currentBeatdownBanner);
        setMyDmg(Math.round(localFighter.dmg));
        let holder = null;
        fighters.forEach(f => {
          if ((f.streak || 0) >= 3 && (!holder || f.streak > holder.streak)) holder = f;
        });
        fighters.forEach(f => {
          if (f === holder && !f.crown) {
            f.crown = makeCrown();
            f.crown.position.y = 3.05;
            f.mesh.add(f.crown);
            if (f.isLocal) announceNow('👑 YOU HAVE A BOUNTY ON YOUR HEAD', '#facc15');
          }
          if (f.crown) f.crown.visible = f === holder;
        });
        setMatchTime(Math.max(0, Math.ceil(match.left)));
        const b = localFighter.buffs;
        const hud = [];
        if (b.speed > 0) hud.push(`🍔 ${b.speed.toFixed(0)}s`);
        if (b.armor > 0) hud.push(`💎 ${b.armor.toFixed(0)}s`);
        if (b.pump > 0) hud.push(`🚀 ${b.pump.toFixed(0)}s`);
        if (localFighter.weapon) hud.push(`${localFighter.weapon.kind === 'hammer' ? '🔨' : '🧨'} x${localFighter.weapon.uses} · E`);
        setBuffHud(hud);
        let nearest = 999;
        fighters.forEach(o => {
          if (o.id !== localFighter.id) nearest = Math.min(nearest, o.mesh.position.distanceTo(localFighter.mesh.position));
        });
        sfx.setIntensity(nearest < 8 || localFighter.swarmTimer > 0 ? 1 : nearest < 16 ? 0.5 : 0.1);

        Object.keys(remotePlayersRef.current).forEach(pid => {
          if (now - remotePlayersRef.current[pid].lastSeen > 5000) {
            delete remotePlayersRef.current[pid];
            pushKillFeed(`🔴 Player left the room`, '#94a3b8');
          }
        });
        [...fighters].forEach(f => {
          if (f.remote && now - (net.remoteSeen[f.id] || 0) > 5000) removeFighter(f);
        });
        // host = smallest id in the room; only the host runs the AI pandas
        const peers = Object.keys(remotePlayersRef.current);
        const hostId = [myIdRef.current, ...peers].sort()[0];
        net.hostId = hostId;
        const amHost = hostId === myIdRef.current;
        if (amHost !== net.isHost) {
          net.isHost = amHost;
          if (!amHost) {
            fighters.filter(f => f.isBot).forEach(removeFighter);
            pushKillFeed('🔗 Synced with room host', '#38bdf8');
          }
        }
        if (net.isHost && fillWithBots && !fighters.some(f => f.isBot)) {
          spawnBots(Math.max(0, 7 - peers.length));
        }
        setOnlinePeersCount(1 + Object.keys(remotePlayersRef.current).length);

        const sortedBoard = [...fighters]
          .map(f => ({
            id: f.id,
            name: f.name,
            isLocal: f.isLocal,
            isBot: f.isBot,
            kos: f.kos,
            deaths: f.deaths || 0,
            gangSize: f.minions.length + 1,
            score: f.kos * 100 - (f.deaths || 0) * 40 + (f.minions.length + 1) * 3
          }))
          .sort((a, b) => b.score - a.score);
        setLeaderboard(sortedBoard);
      }

      let shakeX = 0, shakeY = 0;
      if (fx.shake > 0.01) {
        shakeX = (Math.random() - 0.5) * fx.shake * 1.4;
        shakeY = (Math.random() - 0.5) * fx.shake * 1.4;
        fx.shake *= Math.exp(-7 * rawDt);
      }
      camera.position.x += shakeX;
      camera.position.y += shakeY;
      if (post) {
        post.comp.uniforms.flash.value = fx.postFlash;
        fx.postFlash = Math.max(0, fx.postFlash - rawDt * 3);
        post.render(now * 0.001);
      } else {
        renderer.render(scene, camera);
      }
      camera.position.x -= shakeX;
      camera.position.y -= shakeY;
    };

    animationFrameId = requestAnimationFrame(animate);

    const post = GFX_CINEMATIC ? createPost(renderer, scene, camera) : null;
    const handleResize = () => {
      if (!mountRef.current) return;
      const w = mountRef.current.clientWidth || window.innerWidth;
      const h = mountRef.current.clientHeight || window.innerHeight;
      fitCamera(w, h);
      renderer.setSize(w, h);
      if (post) post.setSize();
    };
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);

    return () => {
      cancelAnimationFrame(animationFrameId);
      sfx.stopMusic();
      window.removeEventListener('blur', clearKeys);
      document.removeEventListener('gesturestart', blockGesture);
      document.removeEventListener('touchmove', blockGesture);
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('resize', handleResize);
      window.removeEventListener('orientationchange', handleResize);
      if (mqttClientRef.current) {
        try {
          mqttClientRef.current.end();
        } catch (e) {}
      }
      if (post) post.dispose();
      envRT.dispose();
      pmrem.dispose();
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
    };
  }, [screen, roomCode, selectedClass, playerName, fillWithBots, matchId, gfx]);

  return (
    <div className="relative w-full h-full bg-[#04060e] text-white overflow-hidden select-none">
      <div ref={mountRef} className="absolute inset-0 w-full h-full" />

      {screen === 'lobby' && (
        <div className="absolute inset-0 z-20 overflow-hidden">
          <LobbyBackdrop />
          <div className="absolute inset-0 bg-gradient-to-b from-[#050816]/70 via-[#050816]/35 to-[#050816]/90 pointer-events-none" />

          <div className="relative h-full overflow-y-auto safe-top safe-bottom">
            <div className="min-h-full flex flex-col items-center px-4 pt-6 pb-32 md:py-10">
              <header className="text-center select-none">
                <div className="kicker text-[11px] md:text-xs font-black text-emerald-300">NGMI PANDAS</div>
                <h1 className="game-title text-[15vw] sm:text-7xl md:text-8xl mt-2">{mode === 'shootout' ? 'SHOOTOUT' : 'BEATDOWN'}</h1>
                <p className="tagline text-slate-200 text-sm md:text-lg mt-4 font-semibold">
                  {mode === 'shootout' ? (
                    soVariant === 'siege' ? (
                      <>Raid Fort HODL. Crack the <span className="text-amber-300 font-black">Moon Vault</span>. Or hold the line.</>
                    ) : (
                      <>Grab an AK. Splat your rivals. Chase the <span className="text-amber-300 font-black">Golden AK</span>.</>
                    )
                  ) : (
                    <>Gang up. Pump their <span className="text-amber-300 font-black">%</span>. Ring them out.</>
                  )}
                </p>
              </header>

              <div className="w-full max-w-6xl mt-8 grid gap-5 lg:grid-cols-[1fr_330px] items-start">
                <section className="space-y-4">
                  <div className="flex items-center gap-3">
                    <span className="font-game text-sm text-white">CHOOSE YOUR GAME</span>
                    <span className="flex-1 h-px bg-gradient-to-r from-slate-500/60 to-transparent" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    {[
                      { id: 'beatdown', icon: '🥊', title: 'BEATDOWN', sub: 'Gang brawl on the moon · ring them out', grad: 'from-emerald-500/30 to-cyan-500/10', ring: '#34d399' },
                      { id: 'shootout', icon: '🔫', title: 'SHOOTOUT', sub: 'First-person free-for-all · guns in a cartoon town', grad: 'from-rose-500/30 to-amber-400/10', ring: '#fb7185' }
                    ].map(g => (
                      <button
                        key={g.id}
                        onClick={() => setMode(g.id)}
                        className={`card relative text-left rounded-2xl border-2 p-3 md:p-4 bg-gradient-to-br ${g.grad} glass cursor-pointer ${mode === g.id ? 'selected' : 'border-slate-800 hover:border-slate-600'}`}
                        style={mode === g.id ? { borderColor: g.ring, boxShadow: `0 0 0 1px ${g.ring}, 0 14px 30px -12px ${g.ring}` } : undefined}
                      >
                        <div className="flex items-center gap-3">
                          <span className="text-3xl md:text-4xl">{g.icon}</span>
                          <div>
                            <div className="font-game text-base md:text-xl text-white leading-none">{g.title}</div>
                            <div className="text-[10px] md:text-[12px] text-slate-300 mt-1 leading-snug">{g.sub}</div>
                          </div>
                        </div>
                        {mode === g.id && <span className="absolute right-2 top-2 text-[9px] font-black px-1.5 py-0.5 rounded bg-white text-slate-900">SELECTED</span>}
                      </button>
                    ))}
                  </div>

                  {mode === 'shootout' && (
                    <div className="glass rounded-2xl border border-slate-700 p-3 space-y-2">
                      <div className="text-[10px] font-black tracking-widest text-slate-400">SHOOTOUT MODE</div>
                      <div className="grid grid-cols-2 gap-2">
                        {[
                          { id: 'ffa', icon: '🏙️', title: 'FREE-FOR-ALL', sub: 'Cartoon Town · first to 25' },
                          { id: 'siege', icon: '🏰', title: 'SIEGE', sub: 'Fort HODL · attack or defend' }
                        ].map(v => (
                          <button key={v.id} onClick={() => setSoVariant(v.id)} className={`text-left rounded-xl border-2 px-3 py-2 cursor-pointer transition ${soVariant === v.id ? 'border-amber-300 bg-amber-300/10' : 'border-slate-800 hover:border-slate-600'}`}>
                            <div className="font-game text-sm text-white">{v.icon} {v.title}</div>
                            <div className="text-[11px] text-slate-400">{v.sub}</div>
                          </button>
                        ))}
                      </div>
                      {soVariant === 'siege' && (
                        <div className="space-y-1.5">
                          <div className="grid grid-cols-3 gap-2">
                            {[['atk', '⚔️ ATTACK', '#ef4444'], ['def', '🛡️ DEFEND', '#3b82f6'], ['auto', '🎲 RANDOM', '#a3a3a3']].map(([id, label, col]) => (
                              <button key={id} onClick={() => setSoTeam(id)} className="rounded-xl border-2 py-2 font-black text-xs cursor-pointer" style={soTeam === id ? { borderColor: col, background: `${col}22`, color: '#fff' } : { borderColor: '#1e293b', color: '#cbd5e1' }}>{label}</button>
                            ))}
                          </div>
                          <div className="text-[11px] text-slate-400 leading-snug">
                            <b className="text-rose-300">NGMI Raiders</b> must capture the <b>Server Farm</b>, then crack the <b>Moon Vault</b> inside Fort HODL. <b className="text-sky-300">Diamond Hands</b> hold until the clock runs out.
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  <div className="flex items-center gap-3">
                    <span className="font-game text-sm text-white">CHOOSE YOUR PANDA</span>
                    <span className="flex-1 h-px bg-gradient-to-r from-slate-500/60 to-transparent" />
                    <span className="text-[10px] font-black text-slate-400 tracking-widest">{PANDA_CLASSES.length} FIGHTERS</span>
                  </div>

                  <div className="stagger grid gap-4 md:grid-cols-[minmax(0,1.05fr)_minmax(0,1fr)]">
                    <div
                      className="glass relative rounded-3xl border overflow-hidden"
                      style={{ borderColor: `${selectedClass.accent}66`, boxShadow: `0 24px 60px -24px ${selectedClass.accent}88` }}
                    >
                      <div className="relative h-64 md:h-80" style={{ background: 'radial-gradient(circle at 50% 120%, rgba(0,0,0,0.6), transparent 55%), #05060c' }}>
                        <div
                          className="absolute left-1/2 top-[44%] -translate-x-1/2 -translate-y-1/2 w-[78%] max-w-[300px] aspect-square rounded-full"
                          style={{ background: 'radial-gradient(circle at 38% 35%, #6d8ff0 0%, #2b4fb8 45%, #142a6b 75%, #0b1740 100%)', boxShadow: '0 0 80px rgba(80,120,255,0.35)', opacity: 0.85 }}
                        />
                        <Showcase config={selectedClass} />
                        <span className="absolute left-3 top-3 text-[10px] font-black px-2 py-0.5 rounded-full uppercase" style={{ backgroundColor: `${selectedClass.accent}2e`, color: selectedClass.accent }}>
                          {selectedClass.badge}
                        </span>
                      </div>
                      <div className="p-4">
                        <h3 className="font-game text-lg leading-tight text-white">{selectedClass.name}</h3>
                        <p className="text-[12px] text-slate-400 leading-snug mt-1">{selectedClass.desc}</p>
                        <div className="space-y-1.5 mt-3">
                          {[['POWER', selectedClass.power, '#fbbf24'], ['SPEED', selectedClass.speed, '#34d399'], ['WEIGHT', selectedClass.mass, '#38bdf8']].map(([label, v, col]) => (
                            <div key={label} className="flex items-center gap-2">
                              <span className="text-[9px] font-black text-slate-400 w-12">{label}</span>
                              <div className="flex-1 h-1.5 rounded-full bg-slate-800 overflow-hidden">
                                <div className="stat-fill h-full rounded-full" style={{ width: `${Math.min(100, (v / 1.85) * 100)}%`, background: col }} />
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-5 md:grid-cols-4 lg:grid-cols-5 gap-2 content-start">
                      {PANDA_CLASSES.map(c => {
                        const isSel = selectedClass.id === c.id;
                        const snap = getPreviewSnapshots()[c.id];
                        const num = (c.name.match(/#\d+/) || [''])[0];
                        return (
                          <button
                            key={c.id}
                            onClick={() => setSelectedClass(c)}
                            className={`card relative rounded-2xl border-2 overflow-hidden cursor-pointer text-left ${isSel ? 'selected' : 'border-slate-800 hover:border-slate-600'}`}
                            style={{ background: 'radial-gradient(circle at 50% 30%, #2b4fb855, #070a14 75%)', ...(isSel ? { borderColor: c.accent, boxShadow: `0 0 0 1px ${c.accent}, 0 10px 24px -8px ${c.accent}aa` } : {}) }}
                            title={c.name}
                          >
                            <div className="aspect-[4/5] flex items-end justify-center">
                              {snap ? <img src={snap} alt={c.name} className="w-full h-full object-cover pointer-events-none" draggable={false} /> : <span className="text-3xl mb-4">🐼</span>}
                            </div>
                            <div className="absolute inset-x-0 bottom-0 px-1.5 py-1 bg-gradient-to-t from-black/90 to-transparent">
                              <div className="font-game text-[10px] text-white leading-none">{num}</div>
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="glass rounded-2xl border border-slate-800 px-4 py-3 text-[12px] text-slate-300 leading-relaxed">
                    <span className="font-game text-[11px] text-emerald-300">THE COLLECTION · EST. 2022 ON SOLANA</span>
                    <p className="mt-1">
                      NGMI Pandas started as a Solana NFT collection built by a crew of software-engineer friends who met investing in GameStop, back when GME stepped into NFT marketplaces. It went live and traded on Magic Eden. These astronauts are pulled straight from that collection.
                    </p>
                    <p className="mt-1 text-slate-400">
                      <b className="text-emerald-300">GMI</b> = Gonna Make It · <b className="text-rose-300">NGMI</b> = Not Gonna Make It
                    </p>
                  </div>
                </section>

                <aside className="side-panel glass border border-slate-700/70 rounded-3xl p-5 space-y-4">
                  <div>
                    <label className="block text-[10px] font-black tracking-widest text-slate-400 mb-1.5">YOUR NAME</label>
                    <input
                      type="text"
                      maxLength={16}
                      value={playerName}
                      onChange={e => setPlayerName(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-700 text-white font-black text-lg focus:outline-none focus:border-emerald-400"
                      placeholder="PandaKing"
                    />
                  </div>

                  <button
                    onClick={() => {
                      sfx.unlock();
                      setResults(null);
                      setScreen(mode === 'shootout' ? 'shootout' : 'playing');
                    }}
                    className="play-btn hidden md:block w-full py-4 rounded-2xl font-game text-2xl text-slate-950 cursor-pointer"
                  >
                    ▶ PLAY
                  </button>

                  <div className="flex items-center justify-between gap-3 text-xs">
                    <span className="font-bold text-slate-300">Graphics</span>
                    <div className="flex rounded-xl overflow-hidden border border-slate-700">
                      {[['cinematic', 'Cinematic'], ['fast', 'Performance']].map(([k, label]) => (
                        <button key={k} onClick={() => setGfx(k)} className={`px-2.5 py-1.5 font-black cursor-pointer ${gfx === k ? 'bg-amber-400 text-slate-950' : 'bg-slate-900 text-slate-300'}`}>{label}</button>
                      ))}
                    </div>
                  </div>

                  <div className="flex items-center justify-between gap-3 text-xs">
                    <span className="font-bold text-slate-300">AI pandas fill empty slots</span>
                    <button
                      onClick={() => setFillWithBots(!fillWithBots)}
                      className={`relative w-11 h-6 rounded-full transition cursor-pointer ${fillWithBots ? 'bg-emerald-500' : 'bg-slate-700'}`}
                    >
                      <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all ${fillWithBots ? 'left-[22px]' : 'left-0.5'}`} />
                    </button>
                  </div>

                  <div>
                    <label className="block text-[10px] font-black tracking-widest text-slate-400 mb-1.5">ROOM CODE · SHARE TO PLAY WITH FRIENDS</label>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        maxLength={12}
                        value={roomCode}
                        onChange={e => setRoomCode(e.target.value.toUpperCase())}
                        className="w-full px-3 py-2 rounded-xl bg-slate-950/80 border border-slate-700 text-emerald-300 font-black tracking-wider uppercase focus:outline-none focus:border-emerald-400"
                      />
                      <button
                        onClick={handleCopyInvite}
                        className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-black whitespace-nowrap cursor-pointer"
                      >
                        {copiedNotice ? '✓ COPIED' : 'COPY LINK'}
                      </button>
                    </div>
                  </div>

                  <div className="md:hidden border-t border-slate-700/70 pt-3 text-[12px] text-slate-200">
                    <div className="text-[10px] font-black tracking-widest text-slate-400 mb-1.5">TOUCH CONTROLS</div>
                    👈 Left thumb anywhere: drag to move<br />👉 Right buttons: Jump · Smash · Gang · Swarm
                  </div>

                  {mode === 'shootout' && (
                    <div className="hidden md:block border-t border-slate-700/70 pt-3">
                      <div className="text-[10px] font-black tracking-widest text-slate-400 mb-2">SHOOTOUT CONTROLS</div>
                      <div className="grid grid-cols-[auto_1fr] gap-x-3 gap-y-1.5 items-center text-[12px] text-slate-200">
                        <span className="flex gap-1"><span className="keycap">W</span><span className="keycap">A</span><span className="keycap">S</span><span className="keycap">D</span></span><span>Move · Shift sprint</span>
                        <span><span className="keycap">MOUSE</span></span><span>Aim · click shoot · right-click ADS</span>
                        <span><span className="keycap">SPACE</span></span><span>Jump</span>
                        <span><span className="keycap">R</span></span><span>Reload</span>
                        <span><span className="keycap">WHEEL</span></span><span>Switch weapon · ammo is endless</span>
                        <span><span className="keycap">V</span></span><span>Dance · heal to 100 HP</span>
                        <span><span className="keycap">ESC</span></span><span>Pause · free your mouse</span>
                      </div>
                    </div>
                  )}

                  <div className={`${mode === 'shootout' ? 'hidden' : 'hidden md:block'} border-t border-slate-700/70 pt-3`}>
                    <div className="text-[10px] font-black tracking-widest text-slate-400 mb-2">CONTROLS</div>
                    <div className="grid grid-cols-[auto_1fr] gap-x-3 gap-y-1.5 items-center text-[12px] text-slate-200">
                      <span className="flex gap-1"><span className="keycap">W</span><span className="keycap">A</span><span className="keycap">S</span><span className="keycap">D</span></span><span>Move</span>
                      <span><span className="keycap">SPACE</span></span><span>Jump · double jump</span>
                      <span><span className="keycap">E</span></span><span>Ring Smash · air = ground pound</span>
                      <span><span className="keycap">R</span></span><span>Call gang (recruit grey pandas)</span>
                      <span><span className="keycap">Q</span></span><span>Swarm (gang goes berserk)</span>
                      <span><span className="keycap">M</span></span><span>Mute</span>
                    </div>
                  </div>

                  <div className={`${mode === 'shootout' ? 'hidden' : ''} border-t border-slate-700/70 pt-3 space-y-1.5 text-[12px] text-slate-300`}>
                    <div><span className="font-black text-amber-300">① </span>Hits raise their <b className="text-white">%</b>. Higher % = they fly further.</div>
                    <div><span className="font-black text-pink-300">② </span>Bounce rivals off the pink <b className="text-white">bumpers</b>.</div>
                    <div><span className="font-black text-cyan-300">③ </span>Grab 🍔 💎 🚀 🎁 power-ups. Most K.O.s in 3 minutes wins.</div>
                  </div>
                </aside>
              </div>
            </div>
          </div>

          <div className="md:hidden absolute inset-x-0 bottom-0 z-10 px-4 pt-6 safe-bottom bg-gradient-to-t from-[#050816] via-[#050816]/90 to-transparent">
            <button
              onClick={() => {
                sfx.unlock();
                setResults(null);
                setScreen(mode === 'shootout' ? 'shootout' : 'playing');
              }}
              className="play-btn w-full py-4 rounded-2xl font-game text-2xl text-slate-950 cursor-pointer"
            >
              ▶ PLAY AS {selectedClass.badge}
            </button>
          </div>
        </div>
      )}

      {screen === 'playing' && (
        <div ref={flashRef} className="absolute inset-0 z-30 pointer-events-none bg-white" style={{ opacity: 0 }} />
      )}

      {screen === 'shootout' && (
        <ShootoutGame
          key={`so_${matchId}_${soVariant}`}
          variant={soVariant}
          team={soTeam}
          cls={selectedClass}
          name={playerName}
          room={roomCode}
          fillBots={fillWithBots}
          gfx={gfx}
          onExit={() => setScreen('lobby')}
          onAgain={() => setMatchId(m => m + 1)}
        />
      )}

      {screen === 'playing' && results && (
        <div className="absolute inset-0 z-40 flex items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4">
          <div data-scroll="1" className="w-full max-w-lg max-h-[92%] overflow-y-auto glass border border-slate-700 rounded-3xl p-4 md:p-6 text-center" style={{ animation: 'fadeUp 0.5s ease-out both' }}>
            <div className="font-game text-4xl md:text-5xl" style={{ color: results.myRank === 1 ? '#facc15' : '#ffffff' }}>
              {results.myRank === 1 ? '🏆 VICTORY' : `#${results.myRank} PLACE`}
            </div>
            <div className="text-slate-400 text-sm mt-1">Match over · ranked by ring-out K.O.s</div>
            <div className="mt-4 space-y-1.5 text-left">
              {results.board.slice(0, 8).map((r, i) => (
                <div key={r.id} className={`flex items-center gap-3 px-3 py-2 rounded-xl ${r.isLocal ? 'bg-emerald-500/20 border border-emerald-400/60' : 'bg-slate-900/70'}`}>
                  <span className="font-game w-6 text-slate-400">{i + 1}</span>
                  <span className="w-3 h-3 rounded-full" style={{ background: r.color }} />
                  <span className="flex-1 font-bold truncate">{r.name}{r.isLocal ? ' (you)' : ''}</span>
                  <span className="font-black text-amber-300">{r.kos}K<span className="text-slate-500"> / </span><span className="text-rose-300">{r.deaths}D</span></span>
                  <span className="font-black text-emerald-300 w-12 text-right">{r.gang} 🐼</span>
                </div>
              ))}
            </div>
            <div className="grid grid-cols-3 gap-2 mt-4">
              <div className="bg-slate-900/80 rounded-xl py-2"><div className="font-game text-xl text-orange-300">x{results.bestCombo}</div><div className="text-[10px] text-slate-400 font-bold">BEST COMBO</div></div>
              <div className="bg-slate-900/80 rounded-xl py-2"><div className="font-game text-xl text-pink-300">{Math.round(results.biggestHit)}</div><div className="text-[10px] text-slate-400 font-bold">BIGGEST HIT</div></div>
              <div className="bg-slate-900/80 rounded-xl py-2"><div className="font-game text-xl text-sky-300">{results.falls}</div><div className="text-[10px] text-slate-400 font-bold">TIMES YOU FELL</div></div>
            </div>
            <div className="flex gap-3 mt-5">
              <button
                onClick={() => {
                  setResults(null);
                  setMatchId(m => m + 1);
                }}
                className="play-btn flex-1 py-3 rounded-2xl font-game text-lg text-slate-950 cursor-pointer"
              >
                PLAY AGAIN
              </button>
              <button
                onClick={() => {
                  setResults(null);
                  setScreen('lobby');
                }}
                className="px-5 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold cursor-pointer"
              >
                LOBBY
              </button>
            </div>
          </div>
        </div>
      )}

      {screen === 'playing' && announce && (
        <div key={announce.id} className="absolute inset-x-0 top-[24%] z-30 pointer-events-none flex justify-center px-4 text-center">
          <div
            className="font-game text-4xl sm:text-5xl md:text-7xl tracking-tight animate-bounce"
            style={{ color: announce.color, textShadow: `0 0 30px ${announce.color}, 0 6px 0 #000` }}
          >
            {announce.text}
          </div>
        </div>
      )}

      {screen === 'playing' && (
        <div className="game-layer absolute inset-0 z-10 pointer-events-none safe-top safe-bottom safe-x">
          {/* ---------- top-left: you ---------- */}
          <div className="absolute left-0 top-0 safe-top safe-x pointer-events-auto">
            <div className="glass border border-slate-800 rounded-2xl px-2.5 py-2 md:p-3.5 shadow-xl">
              <div className="hidden md:flex items-center justify-between gap-3 mb-2">
                <span className="text-xs font-black px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">ROOM: {roomCode}</span>
                <span className="text-[11px] font-bold text-cyan-300">● {netStatus} ({onlinePeersCount} LIVE)</span>
              </div>
              <div className={`md:hidden font-game text-lg leading-none mb-1 ${matchTime <= 30 ? 'text-orange-300 animate-pulse' : 'text-white'}`}>
                ⏱ {Math.floor(matchTime / 60)}:{String(matchTime % 60).padStart(2, '0')}
              </div>
              <div className="flex flex-wrap items-center gap-x-2.5 gap-y-1.5 md:gap-4 max-w-[104px] md:max-w-none">
                <div className="leading-none">
                  <span className="text-slate-400 block text-[9px] md:text-[10px] font-bold">GANG</span>
                  <span className="text-base md:text-lg font-black text-emerald-400">{myGangSize}🐼</span>
                </div>
                <div className="leading-none">
                  <span className="text-slate-400 block text-[9px] md:text-[10px] font-bold">K / D</span>
                  <span className="text-base md:text-lg font-black text-amber-400">{myKos}<span className="text-slate-400">/</span><span className="text-rose-400">{myDeaths}</span></span>
                </div>
                <button
                  onClick={() => {
                    const m = !muted;
                    sfx.setMuted(m);
                    setMuted(m);
                  }}
                  className="touch-btn w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-[15px] cursor-pointer"
                  title="Mute (M)"
                >
                  {muted ? '🔇' : '🔊'}
                </button>
                <button
                  onClick={() => {
                    setResults(null);
                    setScreen('lobby');
                  }}
                  className="touch-btn h-9 px-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-[11px] font-black text-slate-300 cursor-pointer"
                >
                  ✕<span className="hidden md:inline"> LOBBY</span>
                </button>
              </div>
            </div>
          </div>

          {/* ---------- top-centre: timer + event ---------- */}
          <div className="absolute left-1/2 -translate-x-1/2 top-0 safe-top flex flex-col items-center gap-1.5 w-[38vw] max-w-[170px] md:max-w-none md:w-auto">
            <div className={`hidden md:block font-game text-xl md:text-3xl px-3 md:px-4 py-0.5 rounded-xl glass border ${matchTime <= 30 ? 'border-orange-400 text-orange-300 animate-pulse' : 'border-slate-700 text-white'}`}>
              {Math.floor(matchTime / 60)}:{String(matchTime % 60).padStart(2, '0')}
            </div>
            <div className="max-w-full px-2.5 md:px-4 py-1 rounded-full glass border border-cyan-500/40 text-cyan-300 text-[9px] md:text-xs font-extrabold tracking-wide text-center leading-tight">
              {arenaEventText}
            </div>
            {activeBeatdownAlert && !IS_TOUCH && (
              <div className="hidden md:block px-5 py-2 rounded-xl bg-rose-600/90 border-2 border-amber-300 text-white text-sm font-black uppercase tracking-wider animate-bounce shadow-[0_0_25px_rgba(225,29,72,0.8)]">
                🔥 {activeBeatdownAlert}
              </div>
            )}
          </div>

          {/* ---------- top-right: leaderboard ---------- */}
          <div className="absolute right-0 top-0 safe-top safe-x flex flex-col items-end gap-2">
            <div className="glass border border-slate-800 rounded-2xl p-2 md:p-3 shadow-xl w-[132px] md:w-[240px]">
              <div className="text-[9px] md:text-[11px] font-black uppercase tracking-wider text-slate-400 mb-1 flex justify-between">
                <span>🏆 TOP</span>
                <span className="hidden md:inline">GANG · K/D</span>
              </div>
              <div className="space-y-0.5 md:space-y-1">
                {leaderboard.slice(0, IS_SMALL() ? 3 : 6).map((item, idx) => (
                  <div
                    key={item.id}
                    className={`flex items-center justify-between gap-1 text-[10px] md:text-xs px-1.5 md:px-2 py-0.5 md:py-1 rounded-lg ${item.isLocal ? 'bg-emerald-500/25 border border-emerald-400/50 font-black text-white' : 'text-slate-300'}`}
                  >
                    <span className="truncate">{idx + 1}. {item.name}</span>
                    <span className="font-mono font-bold shrink-0">
                      <span className="hidden md:inline text-emerald-300">{item.gangSize}🐼 / </span>
                      <span className="text-amber-400">{item.kos}<span className="text-slate-500">/</span><span className="text-rose-400">{item.deaths}</span></span>
                    </span>
                  </div>
                ))}
              </div>
            </div>
            <div className={`${IS_TOUCH ? "hidden" : "hidden md:block"} space-y-1 w-[240px]`}>
              {killFeed.map(kf => (
                <div key={kf.id} className="glass border border-slate-800 px-3 py-1 rounded-lg text-[11px] font-bold shadow" style={{ color: kf.color }}>
                  {kf.msg}
                </div>
              ))}
            </div>
          </div>

          {/* ---------- damage % + buffs ---------- */}
          <div className={`absolute left-1/2 -translate-x-1/2 flex flex-col items-center ${IS_TOUCH ? 'top-[82px] md:top-[92px]' : 'bottom-6'} safe-top`}>
            <div className="flex gap-1 mb-1">
              {buffHud.map(t => (
                <span key={t} className="px-2 py-0.5 rounded-full glass border border-cyan-400/50 text-[10px] md:text-[11px] font-black text-cyan-200">{t}</span>
              ))}
            </div>
            <div
              className={`font-game leading-none ${IS_TOUCH ? 'text-3xl md:text-5xl' : 'text-5xl md:text-6xl'}`}
              style={{
                color: `rgb(255,${Math.round(255 - Math.min(1, myDmg / 150) * 215)},${Math.round(255 - Math.min(1, myDmg / 75) * 255)})`,
                textShadow: '0 4px 0 #000, 0 0 18px rgba(0,0,0,0.8)'
              }}
            >
              {myDmg}%
            </div>
            <div className="text-[9px] md:text-[10px] font-black tracking-widest text-slate-300">YOUR DAMAGE</div>
          </div>

          {IS_TOUCH ? (
            <>
              {/* ---------- floating joystick: touch anywhere on the left side ---------- */}
              <div
                className="absolute left-0 bottom-0 w-[55%] h-[62%] pointer-events-auto"
                onPointerDown={e => {
                  if (joyPtrRef.current !== null) return;
                  joyPtrRef.current = e.pointerId;
                  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
                  const rect = e.currentTarget.getBoundingClientRect();
                  const ox = e.clientX - rect.left;
                  const oy = e.clientY - rect.top;
                  joystickRef.current = { active: true, dx: 0, dy: 0, ox: e.clientX, oy: e.clientY };
                  const base = joyBaseRef.current;
                  if (base) {
                    base.style.left = `${ox}px`;
                    base.style.top = `${oy}px`;
                    base.style.opacity = '1';
                  }
                  if (joyKnobRef.current) joyKnobRef.current.style.transform = 'translate(-50%, -50%)';
                }}
                onPointerMove={e => {
                  if (joyPtrRef.current !== e.pointerId) return;
                  const j = joystickRef.current;
                  const R = 52;
                  let dx = e.clientX - j.ox;
                  let dy = e.clientY - j.oy;
                  const len = Math.hypot(dx, dy);
                  if (len > R) {
                    dx = (dx / len) * R;
                    dy = (dy / len) * R;
                  }
                  j.dx = dx / R;
                  j.dy = dy / R;
                  if (joyKnobRef.current) joyKnobRef.current.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                }}
                onPointerUp={e => {
                  if (joyPtrRef.current !== e.pointerId) return;
                  joyPtrRef.current = null;
                  joystickRef.current = { active: false, dx: 0, dy: 0 };
                  if (joyBaseRef.current) {
                    joyBaseRef.current.style.left = '';
                    joyBaseRef.current.style.top = '';
                    joyBaseRef.current.style.opacity = '';
                  }
                  if (joyKnobRef.current) joyKnobRef.current.style.transform = 'translate(-50%, -50%)';
                }}
                onPointerCancel={e => {
                  joyPtrRef.current = null;
                  joystickRef.current = { active: false, dx: 0, dy: 0 };
                  if (joyBaseRef.current) {
                    joyBaseRef.current.style.left = '';
                    joyBaseRef.current.style.top = '';
                    joyBaseRef.current.style.opacity = '';
                  }
                  if (joyKnobRef.current) joyKnobRef.current.style.transform = 'translate(-50%, -50%)';
                }}
              >
                <div
                  ref={joyBaseRef}
                  className="absolute w-[120px] h-[120px] -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white/25 bg-slate-900/40 opacity-60"
                  style={{ left: '90px', top: 'calc(100% - 100px)' }}
                >
                  <div
                    ref={joyKnobRef}
                    className="absolute left-1/2 top-1/2 w-14 h-14 rounded-full bg-emerald-400/85 border-2 border-white/60 shadow-lg"
                    style={{ transform: 'translate(-50%, -50%)' }}
                  />
                </div>
              </div>

              {/* ---------- action cluster (right thumb) ---------- */}
              <div className="absolute right-0 bottom-0 safe-bottom safe-x pointer-events-auto">
                <div className="relative w-[196px] h-[196px]">
                  {[
                    { key: 'jump', icon: '🦘', label: 'JUMP', cls: 'w-[84px] h-[84px] right-0 bottom-0 bg-sky-500 border-sky-200', cd: 0, max: 1 },
                    { key: 'smash', icon: '💍', label: 'SMASH', cls: 'w-[66px] h-[66px] right-[92px] bottom-[4px] bg-amber-400 border-yellow-100', cd: cooldowns.smash, max: CD_MAX.smash },
                    { key: 'swarm', icon: '🔥', label: 'SWARM', cls: 'w-[66px] h-[66px] right-[78px] bottom-[78px] bg-rose-500 border-rose-200', cd: cooldowns.swarm, max: CD_MAX.swarm },
                    { key: 'call', icon: '📱', label: 'GANG', cls: 'w-[66px] h-[66px] right-[6px] bottom-[96px] bg-emerald-500 border-emerald-200', cd: cooldowns.call, max: CD_MAX.call }
                  ].map(b => (
                    <button
                      key={b.key}
                      onPointerDown={e => {
                        e.preventDefault();
                        actionTriggerRef.current[b.key] = true;
                      }}
                      className={`touch-btn absolute rounded-full border-2 shadow-xl flex flex-col items-center justify-center overflow-hidden ${b.cls} ${b.cd > 0 ? 'grayscale brightness-50' : ''}`}
                    >
                      <span className="text-2xl leading-none">{b.icon}</span>
                      <span className="text-[9px] font-black text-slate-950 mt-0.5">{b.label}</span>
                      {b.cd > 0 && (
                        <span className="absolute inset-0 flex items-center justify-center font-game text-xl text-white bg-black/40">{Math.ceil(b.cd)}</span>
                      )}
                    </button>
                  ))}
                </div>
              </div>
            </>
          ) : (
            <div className="absolute right-0 bottom-0 safe-bottom safe-x pointer-events-auto flex items-end gap-2 md:gap-3">
              {[
                { key: 'jump', keyLabel: 'SPACE', title: '🦘 JUMP', desc: 'Double jump · dodge smashes · save yourself at the edge', bg: 'bg-sky-500', border: 'border-sky-300', text: 'text-slate-950', cd: 0, max: 1 },
                { key: 'call', keyLabel: 'R', title: '📱 CALL GANG', desc: 'Recruit nearby grey pandas into your gang', bg: 'bg-emerald-500', border: 'border-emerald-300', text: 'text-slate-950', cd: cooldowns.call, max: CD_MAX.call },
                { key: 'smash', keyLabel: 'E', title: '💍 RING SMASH', desc: 'Blast everyone near you away · in the air = ground pound', bg: 'bg-amber-400', border: 'border-yellow-200', text: 'text-slate-950', cd: cooldowns.smash, max: CD_MAX.smash },
                { key: 'swarm', keyLabel: 'Q', title: '🔥 SWARM', desc: '3.6s: gang punches 2x faster & you run faster', bg: 'bg-rose-500', border: 'border-rose-300', text: 'text-white', cd: cooldowns.swarm, max: CD_MAX.swarm }
              ].map(b => (
                <button
                  key={b.key}
                  onClick={() => (actionTriggerRef.current[b.key] = true)}
                  className={`relative overflow-hidden w-[118px] lg:w-[150px] text-left px-3 py-2.5 rounded-2xl border-2 transition cursor-pointer ${
                    b.cd > 0 ? 'bg-slate-900/85 border-slate-700 text-slate-400' : `${b.bg} ${b.border} ${b.text} shadow-lg hover:brightness-110`
                  }`}
                >
                  <div className="flex items-center justify-between">
                    <span className="font-game text-[12px] lg:text-[13px] leading-none">{b.title}</span>
                    <span className="text-[9px] font-black px-1.5 py-0.5 rounded bg-black/25">{b.keyLabel}</span>
                  </div>
                  <div className="text-[9.5px] lg:text-[10.5px] font-semibold leading-tight mt-1 opacity-90">
                    {b.cd > 0 ? `Ready in ${b.cd}s` : b.desc}
                  </div>
                  {b.cd > 0 && <div className="absolute left-0 bottom-0 h-1 bg-white/60" style={{ width: `${(1 - b.cd / b.max) * 100}%` }} />}
                </button>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
