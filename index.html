// Suit look for every astronaut in the collection (helmet + black visor, no face showing)
const SUITS = {
  astro_gmi: { color: '#c9a227', metal: 0.95, rough: 0.22, badge: 'GMI', badgeColor: '#4d3a05' },
  dark_gmi: { shell: '#1c1c21', color: '#151515', metal: 0.15, rough: 0.55, tee: 'wife\nchanging\nmoney', visor: 'GMI' },
  astro_5833: { color: '#d32f2f', pattern: 'checker', metal: 0, rough: 0.8 },
  astro_1778: { shell: '#2b2b30', color: '#121212', metal: 0.35, rough: 0.4, badge: 'GMI', badgeColor: '#6b7280' },
  astro_8817: { color: '#1a1712', pattern: 'glitter', metal: 0.6, rough: 0.35 },
  astro_3424: { color: '#c62828', metal: 0.85, rough: 0.25, badge: 'GMI', badgeColor: '#fde047', glowBadge: true },
  astro_149: { color: '#a9bde0', metal: 1, rough: 0.12, badge: 'GMI', badgeColor: '#1e3a8a' },

};

function makeSuitTexture(suit) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = suit.color;
  g.fillRect(0, 0, 512, 256);
  if (suit.pattern === 'checker') {
    const sq = 32;
    for (let y = 0; y < 256; y += sq) for (let x = 0; x < 512; x += sq) {
      if (((x + y) / sq) % 2 === 0) { g.fillStyle = '#f5f5f4'; g.fillRect(x, y, sq, sq); }
    }
  } else if (suit.pattern === 'glitter') {
    for (let i = 0; i < 2600; i++) {
      g.fillStyle = Math.random() < 0.7 ? '#d4a640' : '#fff1b0';
      const r = Math.random() * 2.4 + 0.6;
      g.fillRect(Math.random() * 512, Math.random() * 256, r, r);
    }
  }
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  if (suit.tee) {
    g.fillStyle = '#f4f4f5';
    g.fillRect(176, 40, 160, 190);
    g.fillStyle = '#111111';
    g.font = '800 26px "Rubik", sans-serif';
    suit.tee.split('\n').forEach((t, i) => g.fillText(t, 256, 100 + i * 34));
  } else if (suit.badge) {
    if (suit.glowBadge) { g.shadowColor = suit.badgeColor; g.shadowBlur = 18; }
    g.fillStyle = suit.badgeColor;
    g.font = '900 52px "Arial Black", sans-serif';
    g.fillText(suit.badge, 256, 120);
    g.shadowBlur = 0;
  }
  return srgbTex(new THREE.CanvasTexture(c));
}

// ============================================================================
// AUDIO: every sound is synthesised live with WebAudio (no files to load)
// ============================================================================
const sfx = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null, recDest = null;
  let muted = false, lastHit = 0, musicTimer = null, nextStepTime = 0, step = 0, intensity = 0;

  const ensure = () => {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      // iOS 17+: play game audio even when the ringer/silent switch is on
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.ratio.value = 5;
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(comp);
      comp.connect(ctx.destination);
      sfxBus = ctx.createGain();
      sfxBus.gain.value = 0.85;
      sfxBus.connect(master);
      musicBus = ctx.createGain();
      musicBus.gain.value = 0.42;
      musicBus.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state !== 'running' && ctx.state !== 'closed') {
      try { const pr = ctx.resume(); if (pr && pr.catch) pr.catch(() => {}); } catch (e) {}
    }
    return ctx;
  };

  const env = (g, t, peak, dur) => {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  };

  const tone = (type, f0, f1, dur, vol, bus, at, filterHz) => {
    const t = at || ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    env(g, t, vol, dur);
    if (filterHz) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(filterHz, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(80, filterHz * 0.25), t + dur);
      o.connect(f);
      f.connect(g);
    } else {
      o.connect(g);
    }
    g.connect(bus || sfxBus);
    o.start(t);
    o.stop(t + dur + 0.05);
  };

  const hiss = (dur, vol, type, f0, f1, bus, at) => {
    const t = at || ctx.currentTime;
    const n = ctx.createBufferSource();
    n.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    env(g, t, vol, dur);
    n.connect(f);
    f.connect(g);
    g.connect(bus || sfxBus);
    n.start(t, Math.random() * 0.5);
    n.stop(t + dur + 0.05);
  };

  const play = (name, vol = 1, p = 1) => {
    if (!ctx || muted || vol <= 0.02) return;
    const now = ctx.currentTime;
    switch (name) {
      case 'hit':
        if (now - lastHit < 0.045) return;
        lastHit = now;
        tone('sine', 170 * p, 55, 0.14, 0.55 * vol);
        hiss(0.07, 0.4 * vol, 'bandpass', 2400 * p, 700);
        break;
      case 'crit':
        tone('sine', 140, 32, 0.45, 1.0 * vol);
        tone('square', 1000, 260, 0.09, 0.2 * vol);
        hiss(0.22, 0.75 * vol, 'highpass', 3500, 900);
        tone('triangle', 1975, 1900, 0.35, 0.16 * vol, null, now + 0.03);
        break;
      case 'dash':
        hiss(0.24, 0.42 * vol, 'bandpass', 500, 3200);
        tone('sine', 260, 820, 0.14, 0.16 * vol);
        break;
      case 'cannon':
        tone('square', 210, 55, 0.2, 0.28 * vol, null, null, 1400);
        hiss(0.16, 0.35 * vol, 'lowpass', 1600, 300);
        break;
      case 'tornado':
        hiss(1.3, 0.45 * vol, 'bandpass', 260, 2200);
        tone('sawtooth', 70, 240, 1.1, 0.12 * vol, null, null, 1200);
        tone('sine', 110, 55, 0.6, 0.4 * vol);
        break;
      case 'smash':
        hiss(0.38, 0.55 * vol, 'bandpass', 250, 3800);
        tone('sawtooth', 90, 38, 0.32, 0.35 * vol, null, null, 900);

// Procedural noise canvas (value noise, a few octaves) -> used for stone, patina, bump, moon craters
function noiseCanvas(size, scale, octaves, seed = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const G = 64;
  const grid = new Float32Array(G * G);
  let st = seed * 9301 + 49297;
  for (let i = 0; i < grid.length; i++) {
    st = (st * 9301 + 49297) % 233280;
    grid[i] = st / 233280;
  }
  const at = (x, y) => grid[((y % G + G) % G) * G + ((x % G + G) % G)];
  const smooth = t => t * t * (3 - 2 * t);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let v = 0, amp = 0.5, f = scale / size;
      for (let o = 0; o < octaves; o++) {
        const fx = x * f, fy = y * f;
        const ix = Math.floor(fx), iy = Math.floor(fy);
        const tx = smooth(fx - ix), ty = smooth(fy - iy);
        const a = at(ix, iy), b = at(ix + 1, iy), cc = at(ix, iy + 1), d = at(ix + 1, iy + 1);
        v += amp * ((a + (b - a) * tx) + ((cc + (d - cc) * tx) - (a + (b - a) * tx)) * ty);
        amp *= 0.5;
        f *= 2;
      }
      const k = (y * size + x) * 4;
      const g = Math.max(0, Math.min(255, v * 255));
      img.data[k] = img.data[k + 1] = img.data[k + 2] = g;
      img.data[k + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

// ---------- cinematic post: bloom + ACES + split-tone grade + vignette + grain + subtle CA ----------
function createPost(renderer, scene, camera) {
  const isGL2 = renderer.capabilities.isWebGL2;
  const canHalf = isGL2 && (renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float'));

  const rtA = new THREE.WebGLRenderTarget(1, 1, { type });
  const rtB = new THREE.WebGLRenderTarget(1, 1, { type });

  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  const mat = (uniforms, fs) => new THREE.ShaderMaterial({ uniforms, vertexShader: vs, fragmentShader: fs, depthTest: false, depthWrite: false, toneMapped: false });

    'uniform sampler2D tex; uniform float threshold; varying vec2 vUv;' +
    'void main(){ vec3 c = texture2D(tex, vUv).rgb; float l = max(max(c.r, c.g), c.b);' +
    'gl_FragColor = vec4(c * smoothstep(threshold, threshold + 0.8, l), 1.0); }');
  const blur = mat({ tex: { value: null }, dir: { value: new THREE.Vector2() } },
    'uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;' +
    'void main(){ vec3 c = texture2D(tex, vUv).rgb * 0.227;' +
    'c += texture2D(tex, vUv + dir * 1.385).rgb * 0.316; c += texture2D(tex, vUv - dir * 1.385).rgb * 0.316;' +
    'c += texture2D(tex, vUv + dir * 3.231).rgb * 0.070; c += texture2D(tex, vUv - dir * 3.231).rgb * 0.070;' +
    'gl_FragColor = vec4(c, 1.0); }');

    { tScene: { value: null }, tBloom: { value: null }, time: { value: 0 }, res: { value: new THREE.Vector2() }, bloomStrength: { value: 0.55 }, exposure: { value: 0.88 }, flash: { value: 0 } },
    `uniform sampler2D tScene; uniform sampler2D tBloom; uniform float time; uniform vec2 res; uniform float bloomStrength; uniform float exposure; uniform float flash; varying vec2 vUv;
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }

      col = mix(vec3(l), col, 1.04);
      col = pow(max(col, 0.0), vec3(1.0 / 2.2));
      col *= 1.0 - r2 * 0.95;

    renderer.getDrawingBufferSize(size);

    rtB.setSize(bw, bh);
    comp.uniforms.res.value.set(size.x, size.y);
  };
  setSize();
  const pass = (m, target) => {
    quad.material = m;
    renderer.setRenderTarget(target);
    renderer.render(quadScene, quadCam);
  };

    comp,
    setSize,
    render(t) {
      renderer.setRenderTarget(rtScene);
      renderer.render(scene, camera);
      bright.uniforms.tex.value = rtScene.texture;
      pass(bright, rtA);
      for (let i = 1; i <= 2; i++) {
        blur.uniforms.tex.value = rtA.texture;
        blur.uniforms.dir.value.set(i / rtA.width, 0);

        blur.uniforms.tex.value = rtB.texture;

      comp.uniforms.tBloom.value = rtA.texture;
      comp.uniforms.time.value = t;
      pass(comp, null);
    },
    dispose() {
      [rtScene, rtA, rtB].forEach(r => r.dispose());

  };

// PBR upgrade for panda parts: fur gets sheen, metal/helmets get a lacquer clearcoat
const physCache = new Map();
function upgradePandaMaterials(root) {
  if (!GFX_CINEMATIC) return;
  const conv = m => {
    if (!m || !m.isMeshStandardMaterial || m.isMeshPhysicalMaterial) return m;
    if (physCache.has(m)) return physCache.get(m);
    const pm = new THREE.MeshPhysicalMaterial({
      color: m.color, map: m.map, roughness: m.roughness, metalness: m.metalness,
      emissive: m.emissive, emissiveIntensity: m.emissiveIntensity, emissiveMap: m.emissiveMap,
      transparent: m.transparent, opacity: m.opacity, side: m.side
    });
    if (m.metalness >= 0.5) {
      pm.clearcoat = 1;
      pm.clearcoatRoughness = 0.22;
      pm.roughness = Math.max(0.18, m.roughness);
    } else if (m.roughness >= 0.4) {
      pm.sheen = 0.35;
      pm.sheenRoughness = 0.85;
      pm.sheenColor = m.color.clone().multiplyScalar(0.5);
      pm.roughness = Math.min(1, m.roughness + 0.05);
    } else {
      pm.clearcoat = 0.5;
      pm.clearcoatRoughness = 0.3;
    }
    physCache.set(m, pm);
    return pm;
  };
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
  });
}

function makeGlowTexture(inner, outer) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  return srgbTex(new THREE.CanvasTexture(c));
}

let arenaTexCache = null;
function makeArenaTextures() {
  if (arenaTexCache) return arenaTexCache;
  const S = 1024, C = S / 2;
  const n1 = noiseCanvas(S, 18, 5, 3);
  const n2 = noiseCanvas(S, 90, 3, 7);
  const draw = (mode) => {
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const ctx = c.getContext('2d');
    if (mode === 'albedo') {
      const bg = ctx.createRadialGradient(C, C, 0, C, C, C);
      bg.addColorStop(0, '#5a524a');
      bg.addColorStop(0.6, '#3d3832');
      bg.addColorStop(0.86, '#2c2824');
      bg.addColorStop(1, '#1d1a17');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, S, S);
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = 0.9;
      ctx.drawImage(n1, 0, 0);
      ctx.globalAlpha = 0.35;
      ctx.drawImage(n2, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = mode === 'bump' ? '#9a9a9a' : '#b8b8b8';
      ctx.fillRect(0, 0, S, S);
      ctx.globalAlpha = mode === 'bump' ? 0.75 : 0.55;
      ctx.drawImage(mode === 'bump' ? n2 : n1, 0, 0);
      ctx.globalAlpha = 1;
    }
    // flagstone seams: rings + radial joints
    const seam = mode === 'albedo' ? 'rgba(10,8,6,0.75)' : mode === 'bump' ? '#202020' : '#ffffff';
    ctx.strokeStyle = seam;
    ctx.lineWidth = 5;
    const rings = [0.16, 0.32, 0.5, 0.68, 0.86];
    rings.forEach(f => { ctx.beginPath(); ctx.arc(C, C, C * f, 0, Math.PI * 2); ctx.stroke(); });
    rings.forEach((f, i) => {
      const inner = i === 0 ? 0 : rings[i - 1];
      const count = 6 + i * 5;
      for (let k = 0; k < count; k++) {
        const a = (k / count) * Math.PI * 2 + i * 0.31;
        ctx.beginPath();
        ctx.moveTo(C + Math.cos(a) * C * inner, C + Math.sin(a) * C * inner);
        ctx.lineTo(C + Math.cos(a) * C * f, C + Math.sin(a) * C * f);
        ctx.stroke();
      }
    });
    // bronze inlay rings + carved centre seal
    if (mode === 'albedo') {
      ctx.strokeStyle = '#8a6a3a';
      ctx.lineWidth = 7;
      [0.24, 0.9].forEach(f => { ctx.beginPath(); ctx.arc(C, C, C * f, 0, Math.PI * 2); ctx.stroke(); });
      ctx.strokeStyle = 'rgba(88,140,110,0.55)'; // verdigris patina on the bronze
      ctx.lineWidth = 3;
      [0.24, 0.9].forEach(f => { ctx.beginPath(); ctx.arc(C, C, C * f + 2, 0.4, 2.4); ctx.stroke(); });
      ctx.font = '900 120px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(15,12,9,0.65)';
      ctx.fillText('NGMI', C + 3, C + 3);
      ctx.fillStyle = 'rgba(170,140,90,0.45)';
      ctx.fillText('NGMI', C, C);
      // danger band: dark scorched edge with ember runes
      const edge = ctx.createRadialGradient(C, C, C * 0.86, C, C, C);
      edge.addColorStop(0, 'rgba(0,0,0,0)');
      edge.addColorStop(1, 'rgba(60,10,0,0.7)');
      ctx.fillStyle = edge;
      ctx.beginPath();
      ctx.arc(C, C, C, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,110,40,0.55)';
      for (let k = 0; k < 48; k++) {
        const a = (k / 48) * Math.PI * 2;
        ctx.fillRect(C + Math.cos(a) * C * 0.93 - 4, C + Math.sin(a) * C * 0.93 - 4, 8, 8);
      }
    } else if (mode === 'bump') {
      ctx.font = '900 120px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#303030';
      ctx.fillText('NGMI', C, C);
    }
    return c;
  };
  const map = srgbTex(new THREE.CanvasTexture(draw('albedo')));
  map.anisotropy = 8;
  const bump = new THREE.CanvasTexture(draw('bump'));
  const rough = new THREE.CanvasTexture(draw('rough'));
  arenaTexCache = { map, bump, rough };
  return arenaTexCache;
}
function makeArenaTexture() {
  return makeArenaTextures().map;
}

        wk.m.position.set(Math.cos(wk.a) * wk.r, Math.max(0, Math.sin(s * 3 + wk.hop)) * 1.6, Math.sin(wk.a) * wk.r);

        const ud = wk.m.userData;
        if (ud && ud.rightArmGroup) ud.rightArmGroup.position.z = Math.sin(s * 4 + wk.hop) > 0.7 ? 0.65 : 0.2;

      [w, h] = size();
      cam.aspect = w / h;
      cam.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    window.addEventListener('resize', onResize);
    return () => {
      cancelAnimationFrame(id);
      window.removeEventListener('resize', onResize);
      window.removeEventListener('pointermove', onMove);
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();

// ---------- HIGHLIGHT CLIPS ----------
// Two overlapping MediaRecorders keep the last 30-60 s of gameplay. A multi-kill (or the 🎬 button)
// finalises the older one, so every clip is a standalone 30-60 s video that ends just after the action.
const CLIP_OK = typeof window !== 'undefined' && !!window.MediaRecorder && typeof HTMLCanvasElement !== 'undefined' && !!HTMLCanvasElement.prototype.captureStream;
const pickClipMime = () => {
  const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return list.find(m => { try { return MediaRecorder.isTypeSupported(m); } catch (e) { return false; } }) || '';
};
function createClipper({ src, onClip, crosshair = false, stat = null }) {
  if (!CLIP_OK || !src) return null;
  const mime = pickClipMime();
  const cv = document.createElement('canvas');
  const g = cv.getContext('2d');
  const longSide = IS_TOUCH ? 960 : 1280;
  const size = () => {
    const w = src.width || 1280, h = src.height || 720;
    const k = Math.min(1, longSide / Math.max(w, h));
    cv.width = Math.max(2, Math.round((w * k) / 2) * 2);
    cv.height = Math.max(2, Math.round((h * k) / 2) * 2);
  };
  size();
  let stream;
  try { stream = cv.captureStream(30); } catch (e) { return null; }
  try {
    const aud = sfx.stream();
    if (aud) aud.getAudioTracks().forEach(t => stream.addTrack(t));
  } catch (e) {}
  const recs = [];
  let alive = true, pending = null, lastFrame = 0, callout = null;
  const startRec = () => {
    if (!alive) return;
    let mr;
    try {
      mr = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: IS_TOUCH ? 2200000 : 4000000 } : { videoBitsPerSecond: 3000000 });
    } catch (e) { return; }
    const r = { mr, chunks: [], t0: performance.now(), keep: false, t1: 0, label: '' };
    mr.ondataavailable = e => { if (e.data && e.data.size) r.chunks.push(e.data); };
    mr.onstop = () => {
      if (r.keep && r.chunks.length) {
        const type = ((mr.mimeType || mime || 'video/webm').split(';')[0]) || 'video/webm';
        const blob = new Blob(r.chunks, { type });
        onClip({ blob, secs: Math.max(1, Math.round((r.t1 - r.t0) / 1000)), ext: type.includes('mp4') ? 'mp4' : 'webm', label: r.label || 'HIGHLIGHT' });
      }
      r.chunks = [];
    };
    try { mr.start(1000); } catch (e) { return; }
    recs.push(r);
  };
  startRec();
  const rotate = setInterval(() => {
    const now = performance.now();
    recs.forEach(r => { if (!r.keep && r.mr.state === 'recording' && now - r.t0 >= 60000) { try { r.mr.stop(); } catch (e) {} } });
    for (let i = recs.length - 1; i >= 0; i--) if (recs[i].mr.state === 'inactive') recs.splice(i, 1);
    const newest = recs[recs.length - 1];
    if (!newest || now - newest.t0 >= 30000) startRec();
  }, 1000);
  const finalize = label => {
    pending = null;
    if (!alive) return;
    const now = performance.now();
    const r = recs.filter(x => !x.keep && x.mr.state === 'recording').sort((a, b) => a.t0 - b.t0)[0];
    if (!r) return;
    r.keep = true;
    r.t1 = now;
    r.label = label;
    try { r.mr.stop(); } catch (e) {}
    const i = recs.indexOf(r);
    if (i >= 0) recs.splice(i, 1);
    const newest = recs[recs.length - 1];
    if (!newest || now - newest.t0 > 15000) startRec();
  };
  // debounce: keeps rolling while kills keep coming (max ~10 s) so the whole streak is in the clip
  const highlight = (label, delay = 3500) => {
    const now = performance.now();
    if (pending) {
      clearTimeout(pending.t);
      pending.label = label;
      if (now - pending.first > 10000) { finalize(label); return; }
    } else pending = { first: now, label };
    pending.t = setTimeout(() => finalize(pending ? pending.label : label), delay);
  };
  const outline = (txt, x, y, fill, lw) => {
    g.lineWidth = lw;
    g.strokeStyle = 'rgba(0,0,0,0.85)';
    g.strokeText(txt, x, y);
    g.fillStyle = fill;
    g.fillText(txt, x, y);
  };
  const frame = () => {
    if (!alive) return;
    const now = performance.now();
    if (now - lastFrame < 30) return;
    lastFrame = now;
    if (Math.abs(src.width / src.height - cv.width / cv.height) > 0.02) size();
    try { g.drawImage(src, 0, 0, cv.width, cv.height); } catch (e) { return; }
    const W = cv.width, H = cv.height, k = Math.min(W, H) / 720;
    g.lineJoin = 'round';
    if (crosshair) {
      g.strokeStyle = 'rgba(0,0,0,0.7)';
      g.lineWidth = 4 * k;
      const cx = W / 2, cy = H / 2, a = 9 * k, b = 3 * k;
      const plus = () => { g.beginPath(); g.moveTo(cx - a - b, cy); g.lineTo(cx - b, cy); g.moveTo(cx + b, cy); g.lineTo(cx + a + b, cy); g.moveTo(cx, cy - a - b); g.lineTo(cx, cy - b); g.moveTo(cx, cy + b); g.lineTo(cx, cy + a + b); g.stroke(); };
      plus();
      g.strokeStyle = '#ffffff';
      g.lineWidth = 2 * k;
      plus();
    }
    g.textBaseline = 'top';
    g.textAlign = 'left';
    g.font = `900 ${Math.round(26 * k)}px Bungee, 'Arial Black', sans-serif`;
    outline('🐼 NGMI PANDAS', 18 * k, 16 * k, '#34d399', 6 * k);
    if (stat) {
      g.font = `900 ${Math.round(18 * k)}px Rubik, 'Arial Black', sans-serif`;
      outline(stat(), 20 * k, 52 * k, '#ffffff', 5 * k);
    }
    g.textAlign = 'right';
    g.textBaseline = 'bottom';
    g.font = `800 ${Math.round(16 * k)}px Rubik, Arial, sans-serif`;
    outline('play free · ngmipandas-beatdown.vercel.app', W - 16 * k, H - 14 * k, 'rgba(255,255,255,0.92)', 4 * k);
    if (callout && now < callout.until) {
      const age = (now - callout.t0) / 1000;
      const pop = age < 0.18 ? 0.6 + (age / 0.18) * 0.55 : age < 0.3 ? 1.15 - ((age - 0.18) / 0.12) * 0.15 : 1;
      const fade = Math.min(1, (callout.until - now) / 300);
      g.save();
      g.globalAlpha = fade;
      g.translate(W / 2, H * 0.26);
      g.scale(pop, pop);
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = `900 ${Math.round(Math.min(64 * k, (W * 0.9) / Math.max(6, callout.text.length) * 1.5))}px Bungee, 'Arial Black', sans-serif`;
      outline(callout.text, 0, 0, callout.color || '#facc15', 10 * k);
      g.restore();
    }
  };
  const destroy = () => {
    alive = false;
    clearInterval(rotate);
    if (pending) clearTimeout(pending.t);
    recs.forEach(r => { try { if (r.mr.state !== 'inactive') r.mr.stop(); } catch (e) {} });
    try { stream.getVideoTracks().forEach(t => t.stop()); } catch (e) {}
  };
  return {
    frame,
    highlight,
    flash: (text, color) => { callout = { text, color, t0: performance.now(), until: performance.now() + 1700 }; },
    destroy
  };
}

// clips live in IndexedDB so they survive going back to the lobby or closing the tab (newest 12 kept)
const clipDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('ngmi_clips', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('clips', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('clips', mode);
      const req = fn(t.objectStore('clips'));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  return {
    put: c => run('readwrite', st => st.put(c)),
    all: () => run('readonly', st => st.getAll()),
    del: id => run('readwrite', st => st.delete(id))
  };
})();
const clipStore = (() => {
  let list = [], loaded = false;
  const subs = new Set(), urls = new Map();
  const emit = () => subs.forEach(f => f(list));
  const withUrl = r => {
    if (!urls.has(r.id)) urls.set(r.id, URL.createObjectURL(r.blob));
    return { ...r, url: urls.get(r.id) };
  };
  const drop = id => { if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); } };
  const load = async () => {
    loaded = true;
    try {
      const all = await clipDB.all();
      const known = new Set(list.map(x => x.id));
      list = [...list, ...all.filter(r => !known.has(r.id)).map(withUrl)].sort((a, b) => b.ts - a.ts);
    } catch (e) {}
    emit();
  };
  return {
    subscribe(f) {
      subs.add(f);
      if (!loaded) load();
      f(list);
      return () => subs.delete(f);
    },
    add(c) {
      const rec = { id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, ts: Date.now(), blob: c.blob, secs: c.secs, ext: c.ext, label: c.label, game: c.game || 'Game' };
      list = [withUrl(rec), ...list];
      const extra = list.slice(12);
      list = list.slice(0, 12);
      emit();
      clipDB.put(rec).then(() => Promise.all(extra.map(x => clipDB.del(x.id)))).catch(() => {});
      extra.forEach(x => drop(x.id));
    },
    remove(id) {
      list = list.filter(x => x.id !== id);
      drop(id);
      emit();
      clipDB.del(id).catch(() => {});
    }
  };
})();
function useClips() {
  const [l, setL] = useState([]);
  useEffect(() => clipStore.subscribe(setL), []);
  return l;
}
const clipName = c => `ngmi-pandas-${String(c.game || 'clip').toLowerCase()}-${c.secs}s.${c.ext}`;
const downloadClip = c => {
  const a = document.createElement('a');
  a.href = c.url;
  a.download = clipName(c);
  document.body.appendChild(a);

// Websites can't write into the Photos app directly. The phone's own share sheet can:
// iPhone shows "Save Video" (→ Photos), Android shows "Save to device"/Google Photos.
// Files only — adding text/title makes iOS hide "Save Video".
const clipFile = c => {
  try { return new File([c.blob], clipName(c), { type: c.blob.type || 'video/mp4' }); } catch (e) { return null; }
};
const canShareFile = f => {
  if (!f || !navigator.share || !navigator.canShare) return false;
  try { return navigator.canShare({ files: [f] }); } catch (e) { return false; }
};
const CAN_SAVE_TO_PHOTOS = IS_TOUCH && typeof navigator !== 'undefined' && !!navigator.share && !!navigator.canShare;
// returns 'sheet' | 'cancel' | 'download' via callback
const sendClip = (c, done) => {
  const f = clipFile(c);
  if (IS_TOUCH && canShareFile(f)) {
    navigator.share({ files: [f] }).then(() => done && done('sheet')).catch(err => {
      if (err && err.name === 'AbortError') { if (done) done('cancel'); return; }
      downloadClip(c);
      if (done) done('download');
    });
    return;
  }
  downloadClip(c);
  if (done) done('download');
};
const shareClip = c => sendClip(c);
function ClipCard({ c, onDelete, w = '' }) {

  return (

function Showcase({ config, cosmetic }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return undefined;
    const w = el.clientWidth || 360;
    const h = el.clientHeight || 300;
    let renderer;
    try {
      renderer = styleRenderer(new THREE.WebGLRenderer({ antialias: true, alpha: true }));
    } catch (e) {
      return undefined;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_TOUCH ? 1.5 : 2));
    renderer.setSize(w, h);
    el.appendChild(renderer.domElement);
    const { scene, cam, hero } = makePreviewScene(config, w, h, true);
    applyCosmetic(hero, cosmetic);
    let id;
    const loop = t => {
      id = requestAnimationFrame(loop);
      hero.rotation.y = 0.35 + Math.sin(t * 0.0006) * 0.9;
      hero.position.y = Math.sin(t * 0.0022) * 0.08;
      const ud = hero.userData;
      if (ud && ud.headGroup) ud.headGroup.position.y = 2.08 + Math.sin(t * 0.003) * 0.04;
      if (ud && ud.rightArmGroup) ud.rightArmGroup.position.z = t % 2200 < 220 ? 0.65 : 0.2;
      if (ud && ud.ringSpark) ud.ringSpark.rotation.y = t * 0.004;
      renderer.render(scene, cam);
    };
    id = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(id);
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
      el.innerHTML = '';
    };
  }, [config, cosmetic]);
  return <div ref={ref} className="absolute inset-0" />;
}

function drawNameTag(canvas, name, dmg, color, isLocal) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  // name pill
  ctx.font = '900 40px "Arial Black", sans-serif';
  const label = isLocal ? `★ YOU · ${name}` : name;
  const tw = Math.min(w - 8, ctx.measureText(label).width + 36);
  ctx.fillStyle = 'rgba(2,6,23,0.82)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect((w - tw) / 2, 6, tw, 56, 28); else ctx.rect((w - tw) / 2, 6, tw, 56);
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.fillText(label, w / 2, 35, w - 30);
  // damage %, colour shifts white -> yellow -> red as it climbs
  const pct = Math.round(dmg);
  const heat = Math.min(1, pct / 150);
  const r = 255, g = Math.round(255 - heat * 215), b = Math.round(255 - Math.min(1, heat * 2) * 255);
  ctx.font = `900 ${64 + Math.round(heat * 22)}px "Arial Black", sans-serif`;
  ctx.lineWidth = 12;
  ctx.strokeStyle = '#000000';
  ctx.strokeText(`${pct}%`, w / 2, 122);
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillText(`${pct}%`, w / 2, 122);
}

function createLabelTexture(text, bgColor, textColor, width = 256, height = 128, fontSize = 44, glowColor = null) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  if (bgColor !== 'transparent') {
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, width, height);
  }

  ctx.font = `900 ${fontSize}px "Inter", "Arial Black", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (glowColor) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 16;
  }

  ctx.fillStyle = textColor;
  const lines = text.split('\n');
  lines.forEach((line, idx) => {
    const yOffset = (idx - (lines.length - 1) / 2) * (fontSize * 1.05);
    ctx.fillText(line, width / 2, height / 2 + yOffset);
  });

  const tex = srgbTex(new THREE.CanvasTexture(canvas));
  tex.needsUpdate = true;
  return tex;
}

  // ---- team identity on the floor: unaffected by fog so colours stay pure ----

  root.userData = { headGroup, leftArmGroup, rightArmGroup, ringSpark, auraMat, isAstro };

}

function makeInkTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#0d0c12';
  g.strokeStyle = '#0d0c12';
  g.beginPath();
  g.arc(64, 64, 26, 0, Math.PI * 2);
  g.fill();
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, r = 24 + Math.random() * 34, sz = 2 + Math.random() * 8;
    g.lineWidth = sz * 0.9;
    g.beginPath();
    g.moveTo(64, 64);
    g.lineTo(64 + Math.cos(a) * r, 64 + Math.sin(a) * r);
    g.stroke();
    g.beginPath();
    g.arc(64 + Math.cos(a) * r, 64 + Math.sin(a) * r, sz, 0, Math.PI * 2);
    g.fill();
  }
  return srgbTex(new THREE.CanvasTexture(c));
}

function drawShooterTag(canvas, name, hp, color) {
  const g = canvas.getContext('2d');
  g.clearRect(0, 0, 256, 64);
  g.fillStyle = 'rgba(8,10,20,0.72)';
  g.fillRect(0, 0, 256, 64);
  g.fillStyle = color;
  g.fillRect(0, 0, 7, 64);
  g.font = '800 25px Rubik, Arial, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = '#ffffff';
  g.fillText(name, 132, 22, 230);

  g.fillRect(18, 42, 222, 12);

}

function buildShootoutMap(scene, cinematic) {
  const colliders = [], solids = [];
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x15141c, transparent: true, opacity: 0.55 });
  const box = (x, z, w, h, d, color, o = {}) => {
    const y0 = o.y || 0;
    const geo = new THREE.BoxGeometry(w, h, d);
    const m = new THREE.Mesh(geo, o.mat || new THREE.MeshStandardMaterial({ color, roughness: 0.85 }));
    m.position.set(x, y0 + h / 2, z);
    m.castShadow = cinematic;
    m.receiveShadow = true;
    scene.add(m);
    if (!o.noEdge) {
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
      e.position.copy(m.position);
      scene.add(e);
    }
    if (!o.noCollide) {
      colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, bottom: y0, top: y0 + h });
      solids.push(m);
    }
    return m;
  };
  const plane = (w, h, mat, x, y, z, rotY) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(x, y, z);
    m.rotation.y = rotY;
    scene.add(m);
    return m;
  };
  const signMat = (text, bg, fg, w, h) => {
    const cw = 512, ch = Math.max(64, Math.round(512 * h / w));
    const fs = Math.min(ch * 0.62, (cw * 1.5) / Math.max(4, text.length));
    return new THREE.MeshStandardMaterial({ map: createLabelTexture(text, bg, fg, cw, ch, Math.round(fs)), roughness: 0.7 });
  };
  // faces: 'z+' front points to +z, etc.
  const ROT = { 'z+': 0, 'z-': Math.PI, 'x+': Math.PI / 2, 'x-': -Math.PI / 2 };
  const faceOffset = (face, x, z, w, d, along, out) => {
    if (face === 'z+') return [x + along, z + d / 2 + out];
    if (face === 'z-') return [x - along, z - d / 2 - out];
    if (face === 'x+') return [x + w / 2 + out, z - along];
    return [x - w / 2 - out, z + along];
  };
  const winMat = new THREE.MeshStandardMaterial({ color: 0x1d3550, roughness: 0.25, metalness: 0.4, emissive: 0x0b1a2a, emissiveIntensity: 0.4 });
  const building = (x, z, w, h, d, color, roof, label, face, signBg, signFg) => {
    box(x, z, w, h, d, color);
    box(x, z, w + 0.9, 0.55, d + 0.9, roof, { y: h, noCollide: true });

function buildSiegeMap(scene, cinematic) {
  const colliders = [], solids = [];
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x2a1a12, transparent: true, opacity: 0.45 });
  const box = (x, z, w, h, d, color, o = {}) => {
    const y0 = o.y || 0;
    const geo = new THREE.BoxGeometry(w, h, d);
    const m = new THREE.Mesh(geo, o.mat || new THREE.MeshStandardMaterial({ color, roughness: 0.85 }));
    m.position.set(x, y0 + h / 2, z);
    m.castShadow = cinematic;
    m.receiveShadow = true;
    scene.add(m);
    if (!o.noEdge) {
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
      e.position.copy(m.position);
      scene.add(e);
    }
    if (!o.noCollide) {
      colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, bottom: y0, top: y0 + h });
      solids.push(m);
    }
    return m;
  };
  const plane = (w, h, mat, x, y, z, rotY) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(x, y, z);
    m.rotation.y = rotY;
    scene.add(m);
    return m;
  };
  const signMat = (text, bg, fg, w, h) => {
    const cw = 512, ch = Math.max(64, Math.round(512 * h / w));
    const fs = Math.min(ch * 0.62, (cw * 1.5) / Math.max(4, text.length));
    return new THREE.MeshStandardMaterial({ map: createLabelTexture(text, bg, fg, cw, ch, Math.round(fs)), roughness: 0.7, side: THREE.DoubleSide });
  };

  // ---- sunset sky, warm fog ----
  const sky = document.createElement('canvas');
  sky.width = 4;
  sky.height = 256;
  const sg = sky.getContext('2d');
  const grd = sg.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#23295a');
  grd.addColorStop(0.35, '#6e4a8c');
  grd.addColorStop(0.68, '#f0874f');
  grd.addColorStop(1, '#ffd49c');
  sg.fillStyle = grd;
  sg.fillRect(0, 0, 4, 256);
  scene.background = srgbTex(new THREE.CanvasTexture(sky));
  scene.fog = new THREE.Fog(0xe9a37a, 60, 240);
  const sunDisc = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlowTexture('rgba(255,236,190,1)', 'rgba(255,150,80,0)'), transparent: true, depthWrite: false, fog: false }));
  sunDisc.position.set(-160, 28, 110);

      if (e.code === 'KeyQ') c.swap = true;
      if (/^Digit[1-5]$/.test(e.code)) c.slot = Number(e.code.slice(5)) - 1;
      if (e.code === 'KeyM') {
        const m = !sfx.isMuted();
        sfx.setMuted(m);
        setMutedS(m);
      }
    };
    const onKeyUp = e => {
      keys[e.code] = false;
      if (e.code === 'Tab') setShowBoard(false);
    };
    const locked = () => document.pointerLockElement === renderer.domElement;
    const releaseInputs = () => {
      Object.keys(keys).forEach(k => { keys[k] = false; });
      ctl.current.firing = false;
      ctl.current.ads = false;
      me.semiHeld = false;
    };
    const onLockChange = () => { if (!locked()) releaseInputs(); };
    document.addEventListener('pointerlockchange', onLockChange);
    window.addEventListener('blur', releaseInputs);
    const onMouseMove = e => {
      if (!locked() || me.dead) return;
      const sens = 0.0022 * sensRef.current / (1 + (SHOOT_WEAPONS[me.weapons[me.slot].key].zoom - 1) * me.adsT);
      me.yaw -= e.movementX * sens;
      me.swayX = Math.max(-0.07, Math.min(0.07, (me.swayX || 0) + e.movementX * 0.0007));
      me.swayY = Math.max(-0.05, Math.min(0.05, (me.swayY || 0) + e.movementY * 0.0006));
      me.pitch = Math.max(-1.45, Math.min(1.45, me.pitch - e.movementY * sens));
    };
    const onMouseDown = e => {
      if (!locked()) return;
      if (e.button === 0) ctl.current.firing = true;
      if (e.button === 2) ctl.current.ads = true;
    };
    const onMouseUp = e => {
      if (e.button === 0) { ctl.current.firing = false; me.semiHeld = false; }
      if (e.button === 2) ctl.current.ads = false;
    };
    const noMenu = e => e.preventDefault();
    let lastWheel = 0;
    const onWheel = e => {
      if (!locked()) return;
      e.preventDefault();
      const t = performance.now();
      if (t - lastWheel < 90) return;
      lastWheel = t;
      ctl.current.cycle = e.deltaY > 0 ? 1 : -1;
    };
    document.addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mousedown', onMouseDown);
    document.addEventListener('mouseup', onMouseUp);
    el.addEventListener('contextmenu', noMenu);
    const blockTouch = ev => {
      if (ev.target && ev.target.closest && ev.target.closest('[data-scroll]')) return;
      ev.preventDefault();
    };
    document.addEventListener('touchmove', blockTouch, { passive: false });

    // ---------- match ----------
    const match = { left: SHOOT_SECONDS, countdown: 3.2, over: false, shown: 4, evIdx: 0 };
    let everLocked = false;

    // ---------- surprise events: low gravity, bull run, golden AK airdrops ----------
    const world = { moonT: 0, bullT: 0 };
    const drops = [];
    const spawnAirdrop = () => {
      const dropList = map.dropSpots || map.spawns;
      const s0 = dropList[(match.evIdx * 5 + 3) % dropList.length];
      const [x, z] = freeSpot(s0[0] * 0.55, s0[1] * 0.55);
      const grp = new THREE.Group();
      const crate = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), new THREE.MeshStandardMaterial({ color: 0xd4a640, metalness: 0.9, roughness: 0.25, emissive: 0x5a3a00, emissiveIntensity: 0.7 }));
      crate.position.y = 0.8;
      const chute = new THREE.Mesh(new THREE.SphereGeometry(3, 18, 8, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xf43f5e, side: THREE.DoubleSide, roughness: 0.85 }));
      chute.position.y = 6;
      const lines = [];
      [[-0.8, -0.8], [0.8, -0.8], [-0.8, 0.8], [0.8, 0.8]].forEach(([ox, oz]) => { lines.push(new THREE.Vector3(ox, 1.6, oz), new THREE.Vector3(ox * 3.4, 6, oz * 3.4)); });
      const strings = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lines), new THREE.LineBasicMaterial({ color: 0xf8fafc }));
      grp.add(crate, chute, strings);
      grp.position.set(x, 55, z);
      scene.add(grp);
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 140, 16, 1, true), new THREE.MeshBasicMaterial({ color: 0xffd34d, transparent: true, opacity: 0.2, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, fog: false }));
      beam.position.set(x, 70, z);
      scene.add(beam);
      drops.push({ id: match.evIdx, grp, chute, strings, beam, x, z, landed: false });
      announceNow('👑 GOLDEN AK AIRDROP INCOMING', '#facc15');
      sayLine('Golden airdrop incoming');
      pushFeed('📦 Golden AK airdrop! Follow the light', '#facc15');
      sfx.play('powerup');
    };
    const startEvent = kind => {
      if (kind === 'moon') {
        world.moonT = 15;
        announceNow('🌕 TO THE MOON · LOW GRAVITY', '#c4b5fd');
        sfx.play('streak');
      } else if (kind === 'bull') {
        world.bullT = 15;
        announceNow('🐂 BULL RUN · EVERYONE FASTER', '#4ade80');
        sfx.play('streak');
      } else spawnAirdrop();
    };
    const EVENTS = [[150, 'moon'], [125, 'drop'], [95, 'bull'], [70, 'drop'], [45, 'moon'], [25, 'drop']];
    const objVis = siege ? map.objectives.map(o => {
      const ring = new THREE.Mesh(new THREE.RingGeometry(o.r - 0.45, o.r, 64), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false, fog: false }));
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(o.x, 0.07, o.z);
      const disc = new THREE.Mesh(new THREE.CircleGeometry(o.r - 0.45, 48), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1, side: THREE.DoubleSide, depthWrite: false, fog: false }));
      disc.rotation.x = -Math.PI / 2;
      disc.position.set(o.x, 0.06, o.z);
      const beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 80, 16, 1, true), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.18, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, fog: false }));
      beacon.position.set(o.x, 40, o.z);
      const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: createLabelTexture(`${o.key} · ${o.name}`, 'transparent', '#ffffff', 512, 96, 54), transparent: true, depthTest: false, sizeAttenuation: false }));
      label.scale.set(0.22, 0.042, 1);
      label.position.set(o.x, 7, o.z);
      label.renderOrder = 40;
      scene.add(ring, disc, beacon, label);
      return { o, ring, disc, beacon, label };
    }) : [];
    const objectiveTaken = idx => {
      const o = map.objectives[idx];
      announceNow(`${o.key} · ${o.name} CAPTURED`, SIEGE_TEAMS.atk.color);
      sayLine(`Objective ${o.key} captured`);
      pushFeed(`⚔️ Raiders captured ${o.name}${idx === 0 ? ' · +75s' : ''}`, SIEGE_TEAMS.atk.color);
      sfx.play('streak');
      if (idx === 0) {
        setTimeout(() => announceNow(me.team === 'atk' ? '⚔️ PUSH THE VAULT!' : '🛡️ FALL BACK TO THE VAULT!', me.team === 'atk' ? SIEGE_TEAMS.atk.color : SIEGE_TEAMS.def.color), 1800);
      }
    };
    const endMatch = (winner = null) => {
      if (match.over) return;
      match.over = true;
      ctl.current.firing = false;
      if (document.pointerLockElement) document.exitPointerLock();
      // no freeze: everyone breaks into a victory dance while the camera orbits you
      fighters.forEach(f => { if (f.isBot && !f.dead) f.danceT = 99; });
      if (!me.dead) me.dancing = true;
      const board = [...fighters].map(f => ({ id: f.id, name: f.name, color: f.color, isMe: f.isMe, kills: f.kills, deaths: f.deaths })).sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);
      const rank = board.findIndex(r => r.isMe) + 1;
      sayLine(rank === 1 ? 'Victory' : 'Match over');
      announceNow(rank === 1 ? 'VICTORY 🏆' : 'MATCH OVER', rank === 1 ? '#facc15' : '#ffffff');
      sfx.play(rank === 1 ? 'streak' : 'ko');
      if (siege) {
        const won = winner === me.team;
        sayLine(won ? 'Victory' : 'Defeat');
        announceNow(won ? 'VICTORY 🏆' : 'DEFEAT', won ? '#facc15' : '#f87171');
      }
      const didWin = siege ? winner === me.team : rank === 1;
      const xpRes = awardXp({ kills: me.kills, deaths: me.deaths, won: didWin, headshots: me.headshots || 0, bestStreak: me.maxStreak || 0 });
      const storyRes = storyEval(story, { game: 'shootout', variant: siege ? 'siege' : 'ffa', kills: me.kills, bestStreak: me.maxStreak || 0, won: didWin, team: me.team, rank });
      setTimeout(() => setResults({ board, rank, winner, myTeam: me.team, xp: xpRes, story: storyRes }), 1400);
    };

    // ---------- MQTT ----------
    const upsertRemote = (id, nm, c, tm) => {
      let f = fighters.find(x => x.id === id);
      if (!f) {
        const klass = PANDA_CLASSES.find(k => k.id === c) || PANDA_CLASSES[0];
        f = createFighter(id, nm, klass, { remote: true, team: siege ? tm || 'atk' : null });
        f.tx = f.pos.x;
        f.tz = f.pos.z;
      }
      net.seen[id] = performance.now();
      return f;
    };
    const applyRemote = (f, d) => {
      f.tx = d.x; f.ty = d.y; f.tz = d.z; f.tface = d.f;
      f.hp = d.hp; f.dead = !!d.dd; f.kills = d.k || 0; f.deaths = d.dt || 0;
      f.dancing = !!d.dn;
      f.remoteProt = !!d.sp;
      if (f.mesh && d.cos !== undefined && f.cosApplied !== d.cos) {
        applyCosmetic(f.mesh, d.cos);
        f.cosApplied = d.cos;
      }
      if (d.w && f.mesh && SHOOT_WEAPONS[d.w]) swapGun(f, f.mesh, d.w);
    };
    const onMsg = (tp, payload) => {
      let d;
      try { d = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!d || d.id === myId) return;
      if (d.t === 's') {
        const isNew = !net.peers[d.id];
        net.peers[d.id] = performance.now();
        const f = upsertRemote(d.id, d.n, d.c, d.tm);
        applyRemote(f, d);
        if (isNew) pushFeed(`🟢 ${d.n} joined`, '#38bdf8');
        if (d.id === net.hostId) {
          (d.b || []).forEach(bs => applyRemote(upsertRemote(bs.i, bs.n, bs.c, bs.tm), bs));
          if (siege && Array.isArray(d.obj)) {
            const [st, pg, ct, cp] = d.obj;
            if (st > obj.stage) {
              if (obj.stage === 0) objectiveTaken(0);
              if (st >= 2) {
                objectiveTaken(1);
                endMatch('atk');
              }
            }
            obj.stage = st;
            obj.prog = pg;
            obj.contested = !!ct;
            obj.capturing = !!cp;
          }
          if (typeof d.left === 'number' && Math.abs(match.left - d.left) > 1.5) match.left = d.left;
        }
        (d.ex || []).forEach(e => explodeAt(new THREE.Vector3(e[0], e[1], e[2]), null, true));
        (d.tr || []).forEach(t => {
          const a = new THREE.Vector3(t[0], t[1], t[2]), b = new THREE.Vector3(t[3], t[4], t[5]);
          spawnTracer(a, b);
          if (me.pos.distanceTo(b) < 45) spawnFx({ pos: b, size: 0.5, grow: 0.4, life: 0.07, color: 0xfff3c4, add: true });
          const vol = Math.max(0, 1 - me.pos.distanceTo(a) / 70);
          if (vol > 0.05) sfx.play('shot_rifle', vol * 0.45);
        });
      } else if (d.t === 'h') {
        const target = fighters.find(x => x.id === d.to && (x.isMe || x.isBot));
        applyDamage(target, d.from, d.fn, d.d, d.hs);
      } else if (d.t === 'p') {
          if (typeof d.i === 'number' && pickups[d.i]) {
            pickups[d.i].t = 15;
            pickups[d.i].grp.visible = false;
          }
          if (typeof d.drop === 'number') {
            const k = drops.findIndex(x => x.id === d.drop);
            if (k >= 0) {
              scene.remove(drops[k].grp);
              scene.remove(drops[k].beam);
              drops.splice(k, 1);
              pushFeed(`👑 ${d.n} grabbed the Golden AK`, '#facc15');
            }
          }
      } else if (d.t === 'x') {
        handleDeath(d);
      }
    };
    const startNet = () => {
      if (!window.mqtt) return;
      try {
        const client = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: `ngmis_${myId}`, clean: true, connectTimeout: 5000 });
        net.client = client;
        client.on('connect', () => { net.status = 'LIVE'; client.subscribe(topic); });
        client.on('error', () => { net.status = 'OFFLINE'; });
        client.on('message', onMsg);
      } catch (e) { net.status = 'OFFLINE'; }
    };
    let mqttTag = null;
    if (window.mqtt) startNet();
    else {
      mqttTag = document.createElement('script');
      mqttTag.src = 'https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js';
      mqttTag.async = true;
      mqttTag.onload = startNet;
      mqttTag.onerror = () => { net.status = 'OFFLINE'; };
      document.body.appendChild(mqttTag);
    }
    if (fillBots) spawnBots(7);

    // ---------- post ----------
    const post = cinematic ? createPost(renderer, scene, camera) : null;
    if (post) {
      post.comp.uniforms.exposure.value = 1.05;
      post.comp.uniforms.bloomStrength.value = 0.25;
    }
    const onResize = () => {
      fitFov();
      camera.aspect = W() / H();
      camera.fov = BASE_FOV;
      camera.updateProjectionMatrix();
      renderer.setSize(W(), H());
      if (post) post.setSize();
    };
    window.addEventListener('resize', onResize);

    sfx.startMusic();
    sfx.onTrack(n => pushFeed(`🎵 ${n}`, '#c084fc'));

    // ---------- main loop ----------
    let raf, prev = performance.now(), lastNet = 0, lastHud = 0, bob = 0;
    const loop = now => {
      raf = requestAnimationFrame(loop);
      if (locked()) everLocked = true;
      const paused = !IS_TOUCH && !locked() && Object.keys(net.peers).length === 0 && !match.over;
      const dt = paused ? 0 : Math.max(0, Math.min(0.05, (now - prev) / 1000));
      prev = now;
      if (match.countdown > 0) {
        match.countdown -= dt;
        const n = Math.ceil(match.countdown);
        if (n < match.shown && n >= 1) {
          match.shown = n;
          announceNow(String(n), '#ffffff');
          sfx.play('pop', 1, 0.8);
        }
        if (match.countdown <= 0) {
          sayLine(siege ? (me.team === 'atk' ? 'Attack!' : 'Defend!') : 'Fight!');
          announceNow(siege ? (me.team === 'atk' ? '⚔️ ATTACK!' : '🛡️ DEFEND!') : 'SHOOT!', siege ? SIEGE_TEAMS[me.team].color : '#4ade80');
          sfx.play('streak');
        }
      } else if (!match.over) {
        match.left -= dt;
        if (match.evIdx < EVENTS.length && match.left <= EVENTS[match.evIdx][0]) {
          startEvent(EVENTS[match.evIdx][1]);
          match.evIdx += 1;
        }
        if (siege) {
          if (match.left <= 0) endMatch('def');
        } else if (match.left <= 0 || fighters.some(f => f.kills >= KILL_TARGET)) endMatch();
        if (siege && net.isHost && obj.stage < 2 && !match.over) {
          const o = map.objectives[obj.stage];
          let na = 0, nd = 0;
          fighters.forEach(f => {
            if (f.dead || f.pos.y > 4 || Math.hypot(f.pos.x - o.x, f.pos.z - o.z) > o.r) return;
            if (f.team === 'atk') na++;
            else nd++;
          });
          obj.contested = na > 0 && nd > 0;
          obj.capturing = na > 0 && nd === 0;
          if (obj.capturing) obj.prog += dt * (4 + 2 * Math.min(3, na));
          else if (na === 0) obj.prog = Math.max(Math.floor(obj.prog / 33.4) * 33.4, obj.prog - dt * 2);
          if (obj.prog >= 100) {
            if (obj.stage === 0) {
              obj.stage = 1;
              obj.prog = 0;
              match.left += 75;
              objectiveTaken(0);
            } else {
              obj.stage = 2;
              objectiveTaken(1);
              endMatch('atk');
            }
          }
        }
        if (siege && obj.capturing && me.team === 'def' && now - obj.warnAt > 9000) {
          obj.warnAt = now;
          announceNow(`⚠️ RAIDERS ON ${map.objectives[Math.min(obj.stage, 1)].key}!`, '#f87171');
        }
      }
      if (world.moonT > 0) world.moonT -= dt;
      if (world.bullT > 0) world.bullT -= dt;
      const grav = world.moonT > 0 ? 9 : 26;

      // airdrops fall, land, get grabbed
      for (let i = drops.length - 1; i >= 0; i--) {
        const dp = drops[i];
        if (!dp.landed) {
          dp.grp.position.y -= 7 * dt;
          dp.grp.rotation.y += 0.4 * dt;
          dp.grp.rotation.z = Math.sin(now * 0.002) * 0.08;
          if (dp.grp.position.y <= 0) {
            dp.grp.position.y = 0;
            dp.grp.rotation.z = 0;
            dp.landed = true;
            dp.chute.visible = false;
            dp.strings.visible = false;
            puff(new THREE.Vector3(dp.x, 0.5, dp.z), '#e7d3a8', 14, 6);
            sfx.play('bounce', Math.max(0.2, 1 - me.pos.distanceTo(dp.grp.position) / 60));
          }
        } else {
          dp.beam.material.opacity = 0.16 + Math.sin(now * 0.006) * 0.06;
          let taker = null;
          if (!me.dead && Math.hypot(me.pos.x - dp.x, me.pos.z - dp.z) < 2.3 && me.pos.y < 2) taker = me;
          else if (net.isHost) taker = fighters.find(f => f.isBot && !f.dead && Math.hypot(f.pos.x - dp.x, f.pos.z - dp.z) < 2.3);
          if (taker) {
            scene.remove(dp.grp);
            scene.remove(dp.beam);
            drops.splice(i, 1);
            send({ t: 'p', id: myId, drop: dp.id, n: taker.name });
            if (taker.isMe) {
              addWeapon('golden');
              announceNow('👑 YOU GOT THE GOLDEN AK', '#facc15');
              sfx.play('streak');
            } else {
              taker.golden = true;
              taker.mesh.userData.rightArmGroup.remove(taker.gun);
              taker.gun = makeGunModel('golden', false);
              taker.gun.rotation.y = Math.PI;
              taker.gun.position.set(-0.05, 0.1, 0.55);
              taker.mesh.userData.rightArmGroup.add(taker.gun);
              announceNow(`⚠️ ${taker.name} HAS THE GOLDEN AK`, '#fb923c');
            }
            pushFeed(`👑 ${taker.name} grabbed the Golden AK`, '#facc15');
          }
        }
      }

      // jump pads
      map.pads.forEach(pd => {
        pd.padMat.emissiveIntensity = 0.7 + Math.sin(now * 0.008) * 0.4;
        pd.arrows.forEach((a, k) => {
          a.position.y = 0.6 + ((now * 0.0015 + k / 3) % 1) * 2.8;
          a.material.opacity = 1 - ((now * 0.0015 + k / 3) % 1);
        });
        fighters.forEach(f => {
          if (!(f.isMe || (f.isBot && net.isHost)) || f.dead) return;
          if (f.pos.y < 0.4 && f.vel.y <= 0.1 && Math.hypot(f.pos.x - pd.x, f.pos.z - pd.z) < 1.6) {
            f.vel.y = 24;
            f.vel.x += pd.dx * 4;
            f.vel.z += pd.dz * 4;
            if (f.isMe) {
              sfx.play('bumper');
              announceNow('🚀 TO THE ROOF', '#67e8f9');
            }
          }
        });
      });
      const frozen = match.countdown > 0 || match.over;
      const c = ctl.current;

      // ----- me -----
      if (c.lookDX || c.lookDY) {
        const sens = 0.0055 * (IS_TOUCH ? touchSensRef.current : sensRef.current) / (1 + (SHOOT_WEAPONS[me.weapons[me.slot].key].zoom - 1) * me.adsT);
        me.yaw -= c.lookDX * sens;
        me.pitch = Math.max(-1.45, Math.min(1.45, me.pitch - c.lookDY * sens));
        c.lookDX = 0;
        c.lookDY = 0;
      }
      if (me.dead) {
        me.respawnT -= dt;
        if (me.respawnT <= 0 && !match.over) spawnMe();
      } else {
        let fwdIn = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - c.mz;
        let strIn = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + c.mx;
        if (frozen) { fwdIn = 0; strIn = 0; }
        if (c.dance) {
          c.dance = false;
          me.dancing = !me.dancing && !frozen;
          if (me.dancing) announceNow('💃 DANCE BREAK · +15 HP/s', '#f472b6');
        }
        if (me.dancing && (Math.abs(fwdIn) + Math.abs(strIn) > 0.2 || c.firing || c.jump)) me.dancing = false;
        if (me.dancing) {
          fwdIn = 0;
          strIn = 0;
          me.hp = Math.min(100, me.hp + 15 * dt);
          me.danceBeat = (me.danceBeat || 0) - dt;
          if (me.danceBeat <= 0) {
            me.danceBeat = 0.28;
            me.danceNote = ((me.danceNote || 0) + 1) % 4;
            sfx.play('dance', 0.6, [1, 1.26, 1.5, 1.26][me.danceNote]);
            puff(new THREE.Vector3(me.pos.x, me.pos.y + 3, me.pos.z), me.hp >= 100 ? '#facc15' : '#f472b6', 3, 2.5);
          }
        }
        const sy = Math.sin(me.yaw), cy = Math.cos(me.yaw);
        let wx = -sy * fwdIn + cy * strIn, wz = -cy * fwdIn - sy * strIn;
        const wl = Math.hypot(wx, wz);
        if (wl > 1) { wx /= wl; wz /= wl; }
        const sprint = (keys.ShiftLeft || keys.ShiftRight || (IS_TOUCH && wl > 0.95)) && fwdIn > 0 && me.adsT < 0.3;
        me.sprinting = sprint && me.onGround;
        const speed = (me.adsT > 0.5 ? 5 : sprint ? 12 : 8.5) * (world.bullT > 0 ? 1.4 : 1) * (SHOOT_WEAPONS[me.weapons[me.slot].key].spinUp && me.spin > 0.2 ? 0.7 : 1);
        const accel = me.onGround ? 12 : 3;

          aim: aimRes && aimRes.fighter ? { name: aimRes.fighter.name, hp: Math.max(0, Math.round(aimRes.fighter.hp)), color: aimRes.fighter.color } : null,

          team: me.team,
          obj: siege ? { stage: obj.stage, prog: Math.min(100, Math.round(obj.prog)), contested: obj.contested, capturing: obj.capturing, name: obj.stage < 2 ? `${map.objectives[obj.stage].key} · ${map.objectives[obj.stage].name}` : 'ALL CAPTURED' } : null,
          marker: (() => {
            if (!siege || obj.stage > 1 || me.dead) return null;
            const o = map.objectives[obj.stage];
            const v = new THREE.Vector3(o.x, 4, o.z).project(camera);
            let x = (v.x * 0.5 + 0.5) * 100, y = (-v.y * 0.5 + 0.5) * 100;
            if (v.z > 1) { x = 100 - x; y = 92; }
            return { k: o.key, x: Math.max(4, Math.min(96, x)), y: Math.max(10, Math.min(90, y)), d: Math.round(Math.hypot(o.x - me.pos.x, o.z - me.pos.z)) };
          })(),
          scope: w.key === 'sniper' && me.adsT > 0.8 && !me.dead,
          weapons: me.weapons.map((wp, i) => ({ key: wp.key, short: SHOOT_WEAPONS[wp.key].short, icon: SHOOT_WEAPONS[wp.key].icon, active: i === me.slot })),
          moon: Math.max(0, Math.ceil(world.moonT)),
          bull: Math.max(0, Math.ceil(world.bullT)),
          prot: me.protT > 0 && !me.dead,
          strike: !!me.strikeReady && !me.dead,
          hurt: me.hurtAt && now - me.hurtAt < 1200 && me.hurtFrom !== undefined && !me.dead ? { ang: (-(me.hurtFrom - me.yaw - Math.PI) * 180) / Math.PI, age: now - me.hurtAt } : null,
          started: everLocked,
          dancing: me.dancing,
          spin: me.spin,
          locked: IS_TOUCH || locked(),
          peers: 1 + Object.keys(net.peers).length,
          net: net.status
        });
      }
    };
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf);
      if (clipRef.current) { clipRef.current.destroy(); clipRef.current = null; }
      sfx.stopMusic();
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('resize', onResize);
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mousedown', onMouseDown);
      document.removeEventListener('mouseup', onMouseUp);
      document.removeEventListener('touchmove', blockTouch);
      document.removeEventListener('wheel', onWheel);
      document.removeEventListener('pointerlockchange', onLockChange);
      window.removeEventListener('blur', releaseInputs);
      if (document.pointerLockElement) document.exitPointerLock();
      try { if (net.client) net.client.end(true); } catch (e) {}
      if (post) post.dispose();
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
      el.innerHTML = '';
      el.style.filter = '';
    };
  }, []);

  const c = ctl.current;

              const len = Math.hypot(dx, dy), R = 50;
              if (len > R) { dx = (dx / len) * R; dy = (dy / len) * R; }
              c.mx = dx / R;

// ============================================================================
// PLAYER PROFILE — XP, levels, cosmetics, settings (saved in this browser)
// ============================================================================
const PROFILE_KEY = 'ngmi_profile_v1';
const COSMETICS = [
  { id: 'none', name: 'None', icon: '🚫', lvl: 1 },
  { id: 'party', name: 'Party Hat', icon: '🎉', lvl: 2 },
  { id: 'chain', name: 'Gold Chain', icon: '📿', lvl: 3 },
  { id: 'halo', name: 'Angel Halo', icon: '😇', lvl: 4 },
  { id: 'crown', name: 'Royal Crown', icon: '👑', lvl: 6 },
  { id: 'jetpack', name: 'Moon Jetpack', icon: '🚀', lvl: 8 },
  { id: 'diamond', name: 'Diamond Aura', icon: '💎', lvl: 10 }
];
const xpForLevel = l => 400 + l * 250;
const defaultProfile = () => ({ xp: 0, level: 1, kills: 0, deaths: 0, wins: 0, matches: 0, bestStreak: 0, headshots: 0, cosmetic: 'none', sens: 1, botLevel: 'normal', voice: true, autoFire: true, touchSens: 1, clips: true, story: 0 });
function loadProfile() {
  try {
    const p = JSON.parse(localStorage.getItem(PROFILE_KEY));
    if (p && typeof p.xp === 'number') return { ...defaultProfile(), ...p };
  } catch (e) {}
  return defaultProfile();
}
function saveProfile(p) {
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) {}
}
function awardXp({ kills = 0, deaths = 0, won = false, headshots = 0, bestStreak = 0 }) {
  const p = loadProfile();
  const before = p.level;
  const parts = [['Match played', 150], [`Eliminations ×${kills}`, kills * 100]];
  if (headshots) parts.push([`Headshots ×${headshots}`, headshots * 25]);
  if (won) parts.push(['Victory', 500]);
  const gained = parts.reduce((a, b) => a + b[1], 0);
  p.xp += gained;
  p.kills += kills;
  p.deaths += deaths;
  p.matches += 1;
  if (won) p.wins += 1;
  p.headshots += headshots;
  p.bestStreak = Math.max(p.bestStreak, bestStreak);
  while (p.xp >= xpForLevel(p.level)) {
    p.xp -= xpForLevel(p.level);
    p.level += 1;
  }
  saveProfile(p);
  return { gained, parts, before, after: p.level, unlocked: COSMETICS.filter(c => c.lvl > before && c.lvl <= p.level), profile: p };
}
let voiceCache = null;
function sayLine() {} // announcer voice removed (kept as a no-op so call sites stay simple)
function sayLineUnused(text) {
  try {
    if (!window.speechSynthesis || sfx.isMuted() || !loadProfile().voice) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05;
    u.pitch = 0.65;
    u.volume = 0.95;
    if (!voiceCache) {
      const vs = window.speechSynthesis.getVoices();
      voiceCache = vs.find(v => /en[-_](GB|US)/i.test(v.lang) && /male|daniel|alex|fred|george/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null;
    }
    if (voiceCache) u.voice = voiceCache;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function applyCosmetic(mesh, id) {
  const ud = mesh && mesh.userData;
  if (!ud || !ud.headGroup) return;
  if (ud.cosmetic) {
    if (ud.cosmetic.parent) ud.cosmetic.parent.remove(ud.cosmetic);
    ud.cosmetic = null;
  }
  if (!id || id === 'none') return;
  const g = new THREE.Group();
  const top = ud.isAstro ? 1.02 : 0.78;
  let parent = ud.headGroup;
  const gold = new THREE.MeshStandardMaterial({ color: 0xd4a640, metalness: 1, roughness: 0.25, emissive: 0x3a2600, emissiveIntensity: 0.4 });
  if (id === 'party') {
    const hat = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.85, 18), new THREE.MeshStandardMaterial({ color: 0xec4899, roughness: 0.6 }));
    hat.position.y = top + 0.38;
    const band = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.05, 8, 20), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
    band.rotation.x = Math.PI / 2;
    band.position.y = top + 0.08;
    const pom = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), new THREE.MeshStandardMaterial({ color: 0x67e8f9 }));
    pom.position.y = top + 0.84;
    g.add(hat, band, pom);
    g.rotation.z = 0.22;
  } else if (id === 'chain') {
    parent = mesh;
    const chain = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.055, 8, 30), gold);
    chain.rotation.x = Math.PI / 2.4;
    chain.position.set(0, 1.5, 0.12);
    const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.05, 20), gold);
    coin.rotation.x = Math.PI / 2;
    coin.position.set(0, 1.16, 0.66);
    g.add(chain, coin);
  } else if (id === 'halo') {
    const halo = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.06, 10, 36), new THREE.MeshBasicMaterial({ color: 0xfff3b0 }));
    halo.rotation.x = Math.PI / 2;
    halo.position.y = top + 0.45;
    halo.onBeforeRender = () => { halo.position.y = top + 0.45 + Math.sin(performance.now() * 0.004) * 0.06; };
    g.add(halo);
  } else if (id === 'crown') {
    const cr = makeCrown();
    cr.position.y = top + 0.05;
    g.add(cr);
  } else if (id === 'jetpack') {
    parent = mesh;
    const metal = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.9, roughness: 0.3 });
    [-0.26, 0.26].forEach(x => {
      const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.85, 14), metal);
      tank.position.set(x, 1.15, -0.75);
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.25, 14), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
      tip.position.set(x, 1.7, -0.75);
      const flame = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.5, 10), new THREE.MeshBasicMaterial({ color: 0xffa94d, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }));
      flame.rotation.x = Math.PI;
      flame.position.set(x, 0.5, -0.75);
      flame.onBeforeRender = () => { const k = 0.8 + Math.random() * 0.4; flame.scale.set(1, k, 1); };
      g.add(tank, tip, flame);
    });
  } else if (id === 'diamond') {
    parent = mesh;
    const dm = new THREE.MeshStandardMaterial({ color: 0x7dd3fc, emissive: 0x38bdf8, emissiveIntensity: 0.9, metalness: 0.3, roughness: 0.1 });
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const d = new THREE.Mesh(new THREE.OctahedronGeometry(0.16, 0), dm);
      d.position.set(Math.cos(a) * 1.15, 1.3, Math.sin(a) * 1.15);
      g.add(d);
    }
    g.children[0].onBeforeRender = () => { g.rotation.y = performance.now() * 0.0015; };
  }
  parent.add(g);
  ud.cosmetic = g;
}

}

      wildMinions.push({ mesh, bobOffset: Math.random() * Math.PI * 2 });
    };

    for (let i = 0; i < 14; i++) spawnWildPanda();

    const triggerShockwave = (x, z, colorHex, maxRadius = 8) => {
      const geo = new THREE.RingGeometry(0.6, 1.25, 36);
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.95
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(x, 0.18, z);
      scene.add(mesh);
      shockwaves.push({ mesh, mat, scale: 1, maxScale: maxRadius });
    };

    const spawnMemeSprite = (x, y, z, text, color = '#22c55e') => {
      const tex = createLabelTexture(text, 'transparent', color, 512, 128, 52, '#000000');
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.position.set(x + (Math.random() - 0.5) * 1.5, y + 2.8, z);
      sprite.scale.set(5.5, 1.4, 1);
      scene.add(sprite);
      floatingMemes.push({ sprite, mat, life: 1.0 });
    };

    const addMinionToFighter = (fighter) => {
      if (fighter.minions.length >= 16) return;
      const mMesh = buildNgmiPandaMesh(fighter.pandaClass, true, fighter.gangColor);
      mMesh.position.copy(fighter.mesh.position);
      mMesh.position.y = Math.max(0, mMesh.position.y);
      scene.add(mMesh);
      fighter.minions.push({
        mesh: mMesh,
        angleOffset: Math.random() * Math.PI * 2,
        punchTimer: 0
      });
      if (fighter.isLocal) setMyGangSize(fighter.minions.length + 1);
    };

    // ---------- GAME FEEL: particles, flying minions, shake, hit-stop ----------
    const particles = [];
    const debris = [];
    const particleGeo = new THREE.BoxGeometry(0.28, 0.28, 0.28);
    const partPool = [];
    const fx = { shake: 0, hitStop: 0, liqTimer: 0, combo: 0, comboTimer: 0, slowmo: 0, postFlash: 0 };

    const burst = (x, y, z, color, count = 12, speed = 12) => {
      for (let i = 0; i < count && particles.length < 320; i++) {
        let m = partPool.pop();
        if (!m) m = new THREE.Mesh(particleGeo, new THREE.MeshBasicMaterial({ transparent: true, opacity: 1 }));
        const mat = m.material;
        mat.color.set(color);
        mat.opacity = 1;
        m.rotation.set(0, 0, 0);
        m.position.set(x, y, z);
        scene.add(m);
        const a = Math.random() * Math.PI * 2;
        const sp = speed * (0.4 + Math.random() * 0.8);
        particles.push({ m, mat, vx: Math.cos(a) * sp, vy: 4 + Math.random() * speed, vz: Math.sin(a) * sp, life: 0.55 + Math.random() * 0.35 });
      }
    };

    // Knock a minion off a gang so it visibly flies away instead of vanishing
    const flingMinion = (fighter, dirX, dirZ) => {
      const lost = fighter.minions.pop();
      if (!lost) return;
      debris.push({ mesh: lost.mesh, vx: dirX * 18 + (Math.random() - 0.5) * 8, vy: 14 + Math.random() * 6, vz: dirZ * 18 + (Math.random() - 0.5) * 8, life: 2.2 });
      if (fighter.isLocal) setMyGangSize(fighter.minions.length + 1);
    };

    const knockbackMult = () => (fx.liqTimer > 0 ? 1.35 : 1.0) * (matchRef.finalRush ? 1.5 : 1.0);
    const matchRef = { finalRush: false };
    const volAt = pos => Math.max(0, 1 - pos.distanceTo(localFighter.mesh.position) / 48);
    const flash = (strength = 0.45) => {
      const el = flashRef.current;
      if (!el) return;
      el.style.transition = 'none';
      el.style.opacity = String(strength);
      requestAnimationFrame(() => {
        el.style.transition = 'opacity 0.35s ease-out';
        el.style.opacity = '0';
      });
    };
    const announceNow = (text, color) => {
      if (bdClipRef.current) bdClipRef.current.flash(text, color);
      setAnnounce({ text, color, id: Date.now() });
      setTimeout(() => setAnnounce(a => (a && a.text === text ? null : a)), 1900);
    };

    // Smash-Bros style knockback: more damage % => flies further and higher
    const launch = (target, attacker, dirX, dirZ, base, upward, dmgAdd) => {
      if (target.respawnLock > 0) return 0;
      if (target.isLocal || target.isBot) target.dmg = Math.min(999, target.dmg + dmgAdd);
      const ratio = attacker.pandaClass.power / target.pandaClass.mass;
      const armor = target.buffs.armor > 0 ? 0.4 : 1;
      const pump = attacker.buffs.pump > 0 ? 1.7 : 1;
      const kb = Math.min(110, base * ratio * (1 + target.dmg / 45) * knockbackMult() * armor * pump);
      target.lastHitBy = attacker;
      target.lastHitAt = performance.now();
      const p = target.mesh.position;
      const isCrit = kb > 32;
      burst(p.x, p.y + 1.5, p.z, attacker.gangColor, 6 + Math.round(kb / 6), 6 + kb * 0.25);
      const vol = (target.isLocal || attacker.isLocal) ? 1 : volAt(p) * 0.7;
      if (attacker.isLocal && kb > stats.biggestHit) stats.biggestHit = kb;
      if (attacker.isLocal && !(attacker.tornadoT > 0)) ult.v = Math.min(100, ult.v + Math.min(5, 0.6 + kb * 0.1));
      if (target.isLocal && kb > 18) buzz(14);
      if (isCrit) { impactLight.position.set(p.x, p.y + 2.2, p.z); impactLight.intensity = Math.min(7, 2 + kb * 0.06); }
      if (isCrit) {
        sfx.play('crit', vol);
        burst(p.x, p.y + 1.5, p.z, '#ffffff', 14, 16);
        spawnMemeSprite(p.x, 2.2, p.z, 'CRIT!! 💥', '#ffffff');
        if (target.isLocal || attacker.isLocal) flash(target.isLocal ? 0.5 : 0.3);
      } else {
        sfx.play('hit', vol, 0.85 + Math.random() * 0.4);
      }
      if (!target.isLocal && !target.isBot) {
        // remote fighter: its owner applies the knockback with its own %
        send({ t: 'h', id: myIdRef.current, to: target.id, from: attacker.id, dx: dirX, dz: dirZ, b: base, u: upward, dm: dmgAdd, pw: attacker.pandaClass.power * (attacker.buffs.pump > 0 ? 1.7 : 1), fl: base > 8 ? 1 : 0 });
        return kb;
      }
      target.vx += dirX * kb;
      target.vz += dirZ * kb;
      target.vy = Math.max(target.vy, upward + kb * 0.16);
      target.stun = Math.max(target.stun, Math.min(1.4, 0.2 + kb / 55));
      if (target.isLocal || attacker.isLocal) {
        fx.shake = Math.min(1.6, fx.shake + kb / 45);
        if (kb > 22) fx.shake = Math.min(1.6, fx.shake + (isCrit ? 0.35 : 0.15));
      }
      if (attacker.isLocal) {
        fx.combo = fx.comboTimer > 0 ? fx.combo + 1 : 1;
        stats.bestCombo = Math.max(stats.bestCombo, fx.combo);
        fx.comboTimer = 1.4;
        if (fx.combo >= 3) {
          spawnMemeSprite(p.x, 2.6, p.z, `x${fx.combo} COMBO! 🔥`, '#fb923c');
          sfx.play('combo', 0.9, Math.pow(2, Math.min(fx.combo - 3, 12) / 12));
        }
      }
      return kb;
    };

    // ---------- match flow ----------
    const match = { left: MATCH_SECONDS, countdown: 3.3, over: false, finalRush: false };
    const stats = { bestCombo: 0, biggestHit: 0, falls: 0 };
    ['3', '2', '1'].forEach((n, i) => setTimeout(() => { announceNow(n, '#ffffff'); sfx.play('pop', 1, 0.8); }, 150 + i * 1000));
    setTimeout(() => { announceNow('FIGHT!', '#00ffa3'); sfx.play('streak'); sayLine('Fight!'); }, 3150);
    setMatchTime(MATCH_SECONDS);

    // ---------- RUG PULL: a slice of the floor collapses ----------
    let rug = null;
    const RUG_INNER = 13;
    const angleOf = (x, z) => {
      let a = Math.atan2(-z, x);
      if (a < 0) a += Math.PI * 2;
      return a;
    };
    const inRug = pos => {
      if (!rug || rug.phase !== 'open') return false;
      const r = Math.hypot(pos.x, pos.z);
      if (r < RUG_INNER) return false;
      let d = angleOf(pos.x, pos.z) - rug.a0;
      if (d < 0) d += Math.PI * 2;
      return d <= rug.len;
    };
    const crackTex = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = 'rgba(60,10,0,0.5)';
      g.fillRect(0, 0, 512, 512);
      g.strokeStyle = '#ff7a2a';
      g.shadowColor = '#ff3d00';
      g.shadowBlur = 16;
      g.lineCap = 'round';
      for (let k = 0; k < 30; k++) {
        let x = Math.random() * 512, y = Math.random() * 512;
        g.lineWidth = 1 + Math.random() * 3.5;
        g.beginPath();
        g.moveTo(x, y);
        for (let j = 0; j < 7; j++) {
          x += (Math.random() - 0.5) * 90;
          y += (Math.random() - 0.5) * 90;
          g.lineTo(x, y);
        }
        g.stroke();
      }
      const t = srgbTex(new THREE.CanvasTexture(c));
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(0.07, 0.07);
      return t;
    })();
    const sectorShape = (a0, len, r0, r1) => {
      const sh = new THREE.Shape();
      sh.absarc(0, 0, r1, a0, a0 + len, false);
      sh.absarc(0, 0, r0, a0 + len, a0, true);
      return sh;
    };
    const slabTex = arenaTex.map.clone();
    slabTex.repeat.set(1 / (2 * ARENA_RADIUS), 1 / (2 * ARENA_RADIUS));
    slabTex.offset.set(0.5, 0.5);
    slabTex.needsUpdate = true;
    const slabTop = new THREE.MeshStandardMaterial({ map: slabTex, bumpMap: arenaTex.bump, bumpScale: 0.3, roughness: 0.9 });
    const makeSlab = () => {
      const geo = new THREE.ExtrudeGeometry(sectorShape(rug.a0, rug.len, RUG_INNER, ARENA_RADIUS), { depth: 3, bevelEnabled: false, curveSegments: 24 });
      const m = new THREE.Mesh(geo, [slabTop, floorSide]);
      m.rotation.x = -Math.PI / 2;
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    };
    const sectorPoint = () => {
      const a = rug.a0 + Math.random() * rug.len;
      const r = RUG_INNER + Math.random() * (ARENA_RADIUS - RUG_INNER);
      return [Math.cos(a) * r, -Math.sin(a) * r];
    };
    const startRug = () => {
      const a0 = Math.random() * Math.PI * 2;
      const len = Math.PI / 3;
      const mat = new THREE.MeshBasicMaterial({ map: crackTex, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
      const mesh = new THREE.Mesh(new THREE.ShapeGeometry(sectorShape(a0, len, RUG_INNER, ARENA_RADIUS + 0.4), 24), mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = 0.09;
      scene.add(mesh);
      rug = { a0, len, phase: 'warn', t: 3, mesh, mat, slab: null, slabVy: 0, extras: [] };
      announceNow('⚠️ RUG PULL INCOMING!', '#ff6a2a');
      setArenaEventText('⚠️ RUG PULL: GET OFF THE CRACKING FLOOR!');
      sfx.play('fall', 0.7);
    };
    const openRug = () => {
      scene.remove(rug.mesh);
      rug.slab = makeSlab();
      rug.slab.position.y = -2.98;
      rug.slabVy = 2;
      rug.spin = (Math.random() - 0.5) * 0.9;
      const abyss = new THREE.Mesh(
        new THREE.ShapeGeometry(sectorShape(rug.a0, rug.len, RUG_INNER, ARENA_RADIUS + 0.6), 24),
        new THREE.MeshBasicMaterial({ color: 0x020104, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 })
      );
      abyss.rotation.x = -Math.PI / 2;
      abyss.position.y = 0.03;
      scene.add(abyss);
      const pts = sectorShape(rug.a0, rug.len, RUG_INNER, ARENA_RADIUS).getPoints(48).map(v => new THREE.Vector3(v.x, 0.12, -v.y));
      const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xff7a2a, transparent: true }));
      scene.add(edge);
      const mid = rug.a0 + rug.len / 2;
      const rr = (RUG_INNER + ARENA_RADIUS) / 2;
      const vortex = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlowTexture('rgba(255,90,20,0.9)', 'rgba(120,20,160,0)'), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
      vortex.position.set(Math.cos(mid) * rr, -7, -Math.sin(mid) * rr);
      vortex.scale.set(26, 26, 1);
      scene.add(vortex);
      rug.extras = [abyss, edge, vortex];
      rug.edgeMat = edge.material;
      rug.vortex = vortex;
    };

    // ---------- WEAPONS ----------
    const projectiles = [];
    const makeWeaponMesh = kind => {
      const g = new THREE.Group();
      if (kind === 'hammer') {
        const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 1.5, 8), new THREE.MeshStandardMaterial({ color: 0x4a2c17, roughness: 0.7 }));
        handle.position.y = 0.55;
        const headM = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.42, 0.42), new THREE.MeshStandardMaterial({ color: 0x8c6a3c, metalness: 1, roughness: 0.35 }));
        headM.position.y = 1.3;
        const plate = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.32, 0.32), new THREE.MeshStandardMaterial({ color: 0xd4a640, emissive: 0xff8a20, emissiveIntensity: 0.8 }));
        plate.position.set(0.4, 1.3, 0);
        g.add(handle, headM, plate);
        g.rotation.x = 0.9;
        g.position.set(0.1, -0.1, 0.55);
      } else {
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 1.5, 14), new THREE.MeshStandardMaterial({ color: 0x2f3a2a, roughness: 0.55, metalness: 0.4 }));
        tube.rotation.x = Math.PI / 2;
        const mouthM = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.05, 8, 16), new THREE.MeshStandardMaterial({ color: 0xb91c1c, emissive: 0xff3b1a, emissiveIntensity: 0.9 }));
        mouthM.position.z = 0.75;
        g.add(tube, mouthM);
        g.position.set(0.05, 0.35, 0.3);
      }
      return g;
