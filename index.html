function makeSuitTexture(suit) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = suit.color;
  g.fillRect(0, 0, 512, 256);
  if (suit.pattern === 'checker') {
    const sq = 32;
    for (let y = 0; y < 256; y += sq) for (let x = 0; x < 512; x += sq) {
      if (((x + y) / sq) % 2 === 0) { g.fillStyle = '#f5f5f4'; g.fillRect(x, y, sq, sq); }
    }
  } else if (suit.pattern === 'glitter') {
    for (let i = 0; i < 2600; i++) {
      g.fillStyle = Math.random() < 0.7 ? '#d4a640' : '#fff1b0';
      const r = Math.random() * 2.4 + 0.6;
      g.fillRect(Math.random() * 512, Math.random() * 256, r, r);
    }
  }
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  if (suit.tee) {
    g.fillStyle = '#f4f4f5';
    g.fillRect(176, 40, 160, 190);
    g.fillStyle = '#111111';
    g.font = '800 26px "Rubik", sans-serif';
    suit.tee.split('\n').forEach((t, i) => g.fillText(t, 256, 100 + i * 34));
  } else if (suit.badge) {
    if (suit.glowBadge) { g.shadowColor = suit.badgeColor; g.shadowBlur = 18; }
    g.fillStyle = suit.badgeColor;
    g.font = '900 52px "Arial Black", sans-serif';
    g.fillText(suit.badge, 256, 120);
    g.shadowBlur = 0;
  }
  return srgbTex(new THREE.CanvasTexture(c));
}

// ============================================================================
// AUDIO: every sound is synthesised live with WebAudio (no files to load)
// ============================================================================
const sfx = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;
  let muted = false, lastHit = 0, musicTimer = null, nextStepTime = 0, step = 0, intensity = 0;

  const ensure = () => {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.ratio.value = 5;
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(comp);
      comp.connect(ctx.destination);
      sfxBus = ctx.createGain();
      sfxBus.gain.value = 0.85;
      sfxBus.connect(master);
      musicBus = ctx.createGain();
      musicBus.gain.value = 0.3;
      musicBus.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };

  const env = (g, t, peak, dur) => {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  };

  const tone = (type, f0, f1, dur, vol, bus, at, filterHz) => {
    const t = at || ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    env(g, t, vol, dur);
    if (filterHz) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(filterHz, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(80, filterHz * 0.25), t + dur);
      o.connect(f);
      f.connect(g);
    } else {
      o.connect(g);
    }
    g.connect(bus || sfxBus);
    o.start(t);
    o.stop(t + dur + 0.05);
  };

  const hiss = (dur, vol, type, f0, f1, bus, at) => {
    const t = at || ctx.currentTime;
    const n = ctx.createBufferSource();
    n.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    env(g, t, vol, dur);
    n.connect(f);
    f.connect(g);
    g.connect(bus || sfxBus);
    n.start(t, Math.random() * 0.5);
    n.stop(t + dur + 0.05);
  };

  const play = (name, vol = 1, p = 1) => {
    if (!ctx || muted || vol <= 0.02) return;
    const now = ctx.currentTime;
    switch (name) {
      case 'hit':
        if (now - lastHit < 0.045) return;
        lastHit = now;
        tone('sine', 170 * p, 55, 0.14, 0.55 * vol);
        hiss(0.07, 0.4 * vol, 'bandpass', 2400 * p, 700);
        break;
      case 'crit':
        tone('sine', 140, 32, 0.45, 1.0 * vol);
        tone('square', 1000, 260, 0.09, 0.2 * vol);
        hiss(0.22, 0.75 * vol, 'highpass', 3500, 900);
        tone('triangle', 1975, 1900, 0.35, 0.16 * vol, null, now + 0.03);
        break;
      case 'smash':
        hiss(0.38, 0.55 * vol, 'bandpass', 250, 3800);
        tone('sawtooth', 90, 38, 0.32, 0.35 * vol, null, null, 900);
        break;
      case 'bounce':
        tone('sine', 260 * p, 120, 0.16, 0.38 * vol);
        break;
      case 'bumper':
        tone('square', 620, 1240, 0.1, 0.22 * vol);
        tone('sine', 1480, 1400, 0.25, 0.2 * vol, null, now + 0.04);
        break;
      case 'ko':
        tone('sine', 95, 28, 0.7, 1.0 * vol);
        hiss(0.6, 0.7 * vol, 'lowpass', 3500, 160);
        [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, 0, 0.16, 0.22 * vol, null, now + 0.12 + i * 0.07));
        break;
      case 'fall':
        tone('sine', 1100, 180, 1.1, 0.16 * vol);
        break;
      case 'call':
        for (let i = 0; i < 4; i++) tone('square', i % 2 ? 1320 : 880, 0, 0.06, 0.1 * vol, null, now + i * 0.07);
        break;
      case 'pop':
        tone('sine', 520 * p, 1250 * p, 0.09, 0.25 * vol);
        break;
      case 'swarm':
        tone('sawtooth', 110, 470, 0.55, 0.22 * vol, null, null, 2600);
        hiss(0.55, 0.32 * vol, 'bandpass', 400, 4200);
        break;
      case 'combo':
        tone('triangle', 660 * p, 0, 0.14, 0.22 * vol);
        tone('triangle', 990 * p, 0, 0.14, 0.14 * vol, null, now + 0.06);
        break;
      case 'powerup':
        [659, 880, 1175, 1568].forEach((f, i) => tone('square', f, 0, 0.08, 0.12 * vol, null, now + i * 0.06));
        break;
      case 'shot_gatling':
        tone('square', 260 * p, 90, 0.05, 0.14 * vol);
        hiss(0.05, 0.3 * vol, 'bandpass', 2800, 900);
        break;
      case 'shot_rpg':
        hiss(0.55, 0.65 * vol, 'bandpass', 300, 2200);
        tone('sawtooth', 120, 55, 0.3, 0.3 * vol, null, null, 900);
        break;
      case 'explode':

        tone('square', 62, 30, 0.4, 0.28 * vol, null, null, 600);

      case 'heart':
        tone('sine', 62, 40, 0.12, 0.7 * vol);
        tone('sine', 58, 36, 0.14, 0.55 * vol, null, now + 0.2);
        break;
      case 'land':
        tone('sine', 120, 50, 0.12, 0.45 * vol);
        hiss(0.1, 0.25 * vol, 'lowpass', 900, 200);
        break;
      case 'shield':

      case 'dance':

        tone('sine', 165 * p, 0, 0.12, 0.2 * vol);
        break;
      case 'shot_ak':
        tone('square', 150 * p, 48, 0.09, 0.28 * vol);
        hiss(0.16, 0.7 * vol, 'lowpass', 3600, 450);
        tone('sine', 82, 30, 0.2, 0.75 * vol);
        break;
      case 'shot_rifle':
        tone('square', 190 * p, 60, 0.07, 0.22 * vol);
        hiss(0.11, 0.55 * vol, 'lowpass', 5000, 700);
        tone('sine', 95, 38, 0.14, 0.55 * vol);
        break;
      case 'shot_pistol':
        hiss(0.07, 0.45 * vol, 'bandpass', 2600, 900);
        tone('sine', 230, 70, 0.09, 0.42 * vol);
        break;
      case 'shot_shotgun':
        hiss(0.32, 0.9 * vol, 'lowpass', 3200, 260);
        tone('sine', 110, 32, 0.32, 0.95 * vol);
        break;

      case 'reload':
        [0, 0.22, 0.48].forEach((d, i) => tone('square', i === 2 ? 950 : 480, 0, 0.035, 0.14 * vol, null, now + d));
        break;
      case 'hitmark':

        tone('sawtooth', 320, 110, 0.15, 0.22 * vol, null, null, 1200);

  // ---------- music: rotating playlist, each song builds in sections ----------
  const TRACKS = [
    { name: 'MOON SYNTHWAVE', bpm: 124, roots: [55, 43.65, 65.41, 49], chords: [[0, 3, 7, 10], [0, 4, 7, 11], [0, 4, 7, 9], [0, 4, 7, 10]], kick: [0, 4, 8, 12], snare: [4, 12], bass: [0, 3, 6, 8, 11, 14], bassWave: 'sawtooth', arpWave: 'square', arpEvery: 2, scale: [0, 3, 5, 7, 10] },

  const RUSH = { name: 'FINAL RUSH', bpm: 160, roots: [55, 55, 43.65, 49], chords: [[0, 3, 7], [0, 3, 7], [0, 4, 7], [0, 4, 7]], kick: [0, 4, 8, 12], snare: [4, 12], openHat: true, bass: [0, 2, 4, 6, 8, 10, 12, 14], bassWave: 'sawtooth', arpWave: 'sawtooth', arpEvery: 1, scale: [0, 2, 3, 5, 7, 8, 10] };
  const BARS_PER_SONG = 32;
  let trackIdx = 0, rush = false, songBar = 0, melody = [], onTrackChange = null;
  const cur = () => (rush ? RUSH : TRACKS[trackIdx]);
  const semis = (f, n) => f * Math.pow(2, n / 12);
  const newMelody = tr => {
    // 8-step phrase from the song's scale; repeats so it becomes a hook

    if (s16 === 0) {

    if (tr.kick.includes(s16) || (rush && s16 % 2 === 0 && songBar % 4 === 3)) tone('sine', 150, 42, 0.26, 0.9, musicBus, tt);
    if (section > 0 && (tr.snare.includes(s16) || fill)) hiss(fill ? 0.08 : 0.16, fill ? 0.25 : 0.35, 'bandpass', 1700, 900, musicBus, tt);

    if ((intensity > 0.4 || rush) && s16 % 2 === 1) hiss(0.025, 0.06 + intensity * 0.04, 'highpass', 9000, null, musicBus, tt);
    if (tr.bass.includes(s16)) {

  const tick = () => {
    if (!ctx) return;
    while (nextStepTime < ctx.currentTime + 0.15) {
      scheduleStep(step, nextStepTime);
      nextStepTime += 60 / cur().bpm / 4;
      step++;

    play,

    setRush(on) {

      newMelody(cur());
      if (onTrackChange) onTrackChange(cur().name);
    },
    onTrack(fn) { onTrackChange = fn; },
    trackName() { return cur().name; },

      songBar = 0;
      trackIdx = Math.floor(Math.random() * TRACKS.length);

      musicTimer = setInterval(tick, 25);
    },

    }

// Procedural noise canvas (value noise, a few octaves) -> used for stone, patina, bump, moon craters
function noiseCanvas(size, scale, octaves, seed = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const G = 64;
  const grid = new Float32Array(G * G);
  let st = seed * 9301 + 49297;
  for (let i = 0; i < grid.length; i++) {
    st = (st * 9301 + 49297) % 233280;
    grid[i] = st / 233280;
  }
  const at = (x, y) => grid[((y % G + G) % G) * G + ((x % G + G) % G)];
  const smooth = t => t * t * (3 - 2 * t);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let v = 0, amp = 0.5, f = scale / size;
      for (let o = 0; o < octaves; o++) {
        const fx = x * f, fy = y * f;
        const ix = Math.floor(fx), iy = Math.floor(fy);
        const tx = smooth(fx - ix), ty = smooth(fy - iy);
        const a = at(ix, iy), b = at(ix + 1, iy), cc = at(ix, iy + 1), d = at(ix + 1, iy + 1);
        v += amp * ((a + (b - a) * tx) + ((cc + (d - cc) * tx) - (a + (b - a) * tx)) * ty);
        amp *= 0.5;
        f *= 2;
      }
      const k = (y * size + x) * 4;
      const g = Math.max(0, Math.min(255, v * 255));
      img.data[k] = img.data[k + 1] = img.data[k + 2] = g;
      img.data[k + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

// ---------- cinematic post: bloom + ACES + split-tone grade + vignette + grain + subtle CA ----------
function createPost(renderer, scene, camera) {
  const isGL2 = renderer.capabilities.isWebGL2;
  const canHalf = isGL2 && (renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float'));
  const type = canHalf ? THREE.HalfFloatType : THREE.UnsignedByteType;
  const size = new THREE.Vector2();
  renderer.getDrawingBufferSize(size);
  const rtScene = new THREE.WebGLRenderTarget(size.x, size.y, { type, samples: isGL2 ? 4 : 0 });
  const rtA = new THREE.WebGLRenderTarget(1, 1, { type });
  const rtB = new THREE.WebGLRenderTarget(1, 1, { type });
  const quadScene = new THREE.Scene();
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
  quad.frustumCulled = false;
  quadScene.add(quad);
  const vs = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
  const mat = (uniforms, fs) => new THREE.ShaderMaterial({ uniforms, vertexShader: vs, fragmentShader: fs, depthTest: false, depthWrite: false, toneMapped: false });
  const bright = mat({ tex: { value: null }, threshold: { value: 0.9 } },
    'uniform sampler2D tex; uniform float threshold; varying vec2 vUv;' +
    'void main(){ vec3 c = texture2D(tex, vUv).rgb; float l = max(max(c.r, c.g), c.b);' +
    'gl_FragColor = vec4(c * smoothstep(threshold, threshold + 0.8, l), 1.0); }');
  const blur = mat({ tex: { value: null }, dir: { value: new THREE.Vector2() } },
    'uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;' +
    'void main(){ vec3 c = texture2D(tex, vUv).rgb * 0.227;' +
    'c += texture2D(tex, vUv + dir * 1.385).rgb * 0.316; c += texture2D(tex, vUv - dir * 1.385).rgb * 0.316;' +
    'c += texture2D(tex, vUv + dir * 3.231).rgb * 0.070; c += texture2D(tex, vUv - dir * 3.231).rgb * 0.070;' +
    'gl_FragColor = vec4(c, 1.0); }');
  const comp = mat(
    { tScene: { value: null }, tBloom: { value: null }, time: { value: 0 }, res: { value: new THREE.Vector2() }, bloomStrength: { value: 0.55 }, exposure: { value: 0.88 }, flash: { value: 0 } },
    `uniform sampler2D tScene; uniform sampler2D tBloom; uniform float time; uniform vec2 res; uniform float bloomStrength; uniform float exposure; uniform float flash; varying vec2 vUv;
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
    float rnd(vec2 co){ return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453); }

      col = mix(vec3(l), col, 1.04);

  const setSize = () => {
    renderer.getDrawingBufferSize(size);
    rtScene.setSize(size.x, size.y);
    const bw = Math.max(1, size.x >> 2), bh = Math.max(1, size.y >> 2);
    rtA.setSize(bw, bh);
    rtB.setSize(bw, bh);
    comp.uniforms.res.value.set(size.x, size.y);
  };
  setSize();
  const pass = (m, target) => {
    quad.material = m;
    renderer.setRenderTarget(target);
    renderer.render(quadScene, quadCam);
  };
  return {
    comp,
    setSize,
    render(t) {
      renderer.setRenderTarget(rtScene);
      renderer.render(scene, camera);
      bright.uniforms.tex.value = rtScene.texture;
      pass(bright, rtA);
      for (let i = 1; i <= 2; i++) {
        blur.uniforms.tex.value = rtA.texture;
        blur.uniforms.dir.value.set(i / rtA.width, 0);
        pass(blur, rtB);
        blur.uniforms.tex.value = rtB.texture;
        blur.uniforms.dir.value.set(0, i / rtA.height);
        pass(blur, rtA);
      }
      comp.uniforms.tScene.value = rtScene.texture;
      comp.uniforms.tBloom.value = rtA.texture;
      comp.uniforms.time.value = t;
      pass(comp, null);
    },
    dispose() {
      [rtScene, rtA, rtB].forEach(r => r.dispose());
      [bright, blur, comp].forEach(m => m.dispose());
    }
  };
}

// PBR upgrade for panda parts: fur gets sheen, metal/helmets get a lacquer clearcoat
const physCache = new Map();
function upgradePandaMaterials(root) {
  if (!GFX_CINEMATIC) return;
  const conv = m => {
    if (!m || !m.isMeshStandardMaterial || m.isMeshPhysicalMaterial) return m;
    if (physCache.has(m)) return physCache.get(m);
    const pm = new THREE.MeshPhysicalMaterial({
      color: m.color, map: m.map, roughness: m.roughness, metalness: m.metalness,
      emissive: m.emissive, emissiveIntensity: m.emissiveIntensity, emissiveMap: m.emissiveMap,
      transparent: m.transparent, opacity: m.opacity, side: m.side
    });
    if (m.metalness >= 0.5) {
      pm.clearcoat = 1;
      pm.clearcoatRoughness = 0.22;
      pm.roughness = Math.max(0.18, m.roughness);
    } else if (m.roughness >= 0.4) {
      pm.sheen = 0.35;
      pm.sheenRoughness = 0.85;
      pm.sheenColor = m.color.clone().multiplyScalar(0.5);
      pm.roughness = Math.min(1, m.roughness + 0.05);
    } else {
      pm.clearcoat = 0.5;
      pm.clearcoatRoughness = 0.3;
    }
    physCache.set(m, pm);
    return pm;
  };
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
  });
}

let arenaTexCache = null;
function makeArenaTextures() {
  if (arenaTexCache) return arenaTexCache;
  const S = 1024, C = S / 2;
  const n1 = noiseCanvas(S, 18, 5, 3);
  const n2 = noiseCanvas(S, 90, 3, 7);
  const draw = (mode) => {
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const ctx = c.getContext('2d');
    if (mode === 'albedo') {
      const bg = ctx.createRadialGradient(C, C, 0, C, C, C);
      bg.addColorStop(0, '#5a524a');
      bg.addColorStop(0.6, '#3d3832');
      bg.addColorStop(0.86, '#2c2824');
      bg.addColorStop(1, '#1d1a17');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, S, S);
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = 0.9;
      ctx.drawImage(n1, 0, 0);
      ctx.globalAlpha = 0.35;
      ctx.drawImage(n2, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = mode === 'bump' ? '#9a9a9a' : '#b8b8b8';
      ctx.fillRect(0, 0, S, S);
      ctx.globalAlpha = mode === 'bump' ? 0.75 : 0.55;
      ctx.drawImage(mode === 'bump' ? n2 : n1, 0, 0);
      ctx.globalAlpha = 1;
    }
    // flagstone seams: rings + radial joints
    const seam = mode === 'albedo' ? 'rgba(10,8,6,0.75)' : mode === 'bump' ? '#202020' : '#ffffff';
    ctx.strokeStyle = seam;
    ctx.lineWidth = 5;
    const rings = [0.16, 0.32, 0.5, 0.68, 0.86];
    rings.forEach(f => { ctx.beginPath(); ctx.arc(C, C, C * f, 0, Math.PI * 2); ctx.stroke(); });
    rings.forEach((f, i) => {
      const inner = i === 0 ? 0 : rings[i - 1];
      const count = 6 + i * 5;
      for (let k = 0; k < count; k++) {
        const a = (k / count) * Math.PI * 2 + i * 0.31;
        ctx.beginPath();
        ctx.moveTo(C + Math.cos(a) * C * inner, C + Math.sin(a) * C * inner);
        ctx.lineTo(C + Math.cos(a) * C * f, C + Math.sin(a) * C * f);
        ctx.stroke();
      }
    });

    if (mode === 'albedo') {
      ctx.strokeStyle = '#8a6a3a';
      ctx.lineWidth = 7;
      [0.24, 0.9].forEach(f => { ctx.beginPath(); ctx.arc(C, C, C * f, 0, Math.PI * 2); ctx.stroke(); });
      ctx.strokeStyle = 'rgba(88,140,110,0.55)'; // verdigris patina on the bronze
      ctx.lineWidth = 3;
      [0.24, 0.9].forEach(f => { ctx.beginPath(); ctx.arc(C, C, C * f + 2, 0.4, 2.4); ctx.stroke(); });
      ctx.font = '900 120px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(15,12,9,0.65)';
      ctx.fillText('NGMI', C + 3, C + 3);
      ctx.fillStyle = 'rgba(170,140,90,0.45)';
      ctx.fillText('NGMI', C, C);
      // danger band: dark scorched edge with ember runes
      const edge = ctx.createRadialGradient(C, C, C * 0.86, C, C, C);
      edge.addColorStop(0, 'rgba(0,0,0,0)');
      edge.addColorStop(1, 'rgba(60,10,0,0.7)');
      ctx.fillStyle = edge;
      ctx.beginPath();
      ctx.arc(C, C, C, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,110,40,0.55)';
      for (let k = 0; k < 48; k++) {

    } else if (mode === 'bump') {
      ctx.font = '900 120px Georgia, serif';

    glow.scale.set(90, 90, 1);
    glow.position.y = -8;
    arena.add(glow);

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(20, 40, 40),
      new THREE.MeshStandardMaterial({ color: 0x1d4ed8, emissive: 0x1e3a8a, emissiveIntensity: 0.7, roughness: 0.8 })
    );
    moon.position.set(-38, 22, -90);
    scene.add(moon);

    const starGeo = new THREE.BufferGeometry();
    const sp = new Float32Array(1200 * 3);
    for (let i = 0; i < sp.length; i += 3) {
      sp[i] = (Math.random() - 0.5) * 300;
      sp[i + 1] = Math.random() * 140 - 30;
      sp[i + 2] = (Math.random() - 0.5) * 300 - 50;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xe2e8f0, size: 0.6, transparent: true, opacity: 0.85 }));
    scene.add(stars);

    // pandas wandering + hopping on the arena
    const walkers = [];
    for (let i = 0; i < (IS_TOUCH ? 5 : 7); i++) {
      const cls = PANDA_CLASSES[i % PANDA_CLASSES.length];
      const color = i === 0 ? LOCAL_GANG_COLOR : GANG_COLORS[i % GANG_COLORS.length];
      const m = buildNgmiPandaMesh(cls, i > 3, color);
      arena.add(m);
      walkers.push({ m, a: (i / 7) * Math.PI * 2, r: 6 + (i % 3) * 5, sp: 0.25 + Math.random() * 0.35, hop: Math.random() * 6, dir: i % 2 ? 1 : -1 });
    }

    let id;
    const loop = t => {
      id = requestAnimationFrame(loop);
      const s = t * 0.001;
      arena.rotation.y = s * 0.08;
      walkers.forEach(wk => {
        wk.a += wk.sp * 0.016 * wk.dir;
        wk.m.position.set(Math.cos(wk.a) * wk.r, Math.max(0, Math.sin(s * 3 + wk.hop)) * 1.6, Math.sin(wk.a) * wk.r);
        wk.m.rotation.y = -wk.a + (wk.dir > 0 ? Math.PI : 0);
        const ud = wk.m.userData;
        if (ud && ud.rightArmGroup) ud.rightArmGroup.position.z = Math.sin(s * 4 + wk.hop) > 0.7 ? 0.65 : 0.2;
      });
      stars.rotation.y = s * 0.01;
      cam.position.x = Math.sin(s * 0.15) * 6;
      cam.lookAt(0, 0, 0);
      renderer.render(scene, cam);
    };
    id = requestAnimationFrame(loop);
    const onResize = () => {
      [w, h] = size();
      cam.aspect = w / h;
      cam.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    window.addEventListener('resize', onResize);
    return () => {
      cancelAnimationFrame(id);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
      el.innerHTML = '';
    };
  }, []);
  return <div ref={ref} className="absolute inset-0" />;
}

  scene.add(fill);

  rim.position.set(-2.5, 4, -3);

let previewSnapshots = null;
function getPreviewSnapshots() {
  if (previewSnapshots) return previewSnapshots;
  previewSnapshots = {};
  let r = null;
  try {
    r = styleRenderer(new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }));
    r.setPixelRatio(1);
    r.setSize(480, 340, false);
    PANDA_CLASSES.forEach(c => {
      const { scene, cam } = makePreviewScene(c, 480, 340);
      r.clear();
      r.render(scene, cam);
      previewSnapshots[c.id] = r.domElement.toDataURL('image/png');
    });
  } catch (e) {}
  if (r) {
    r.dispose();
    if (r.forceContextLoss) r.forceContextLoss();
  }
  return previewSnapshots;
}

function Showcase({ config }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return undefined;
    const w = el.clientWidth || 360;
    const h = el.clientHeight || 300;
    let renderer;
    try {
      renderer = styleRenderer(new THREE.WebGLRenderer({ antialias: true, alpha: true }));
    } catch (e) {
      return undefined;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_TOUCH ? 1.5 : 2));
    renderer.setSize(w, h);
    el.appendChild(renderer.domElement);
    const { scene, cam, hero } = makePreviewScene(config, w, h, true);
    let id;
    const loop = t => {
      id = requestAnimationFrame(loop);
      hero.rotation.y = 0.35 + Math.sin(t * 0.0006) * 0.9;
      hero.position.y = Math.sin(t * 0.0022) * 0.08;
      const ud = hero.userData;
      if (ud && ud.headGroup) ud.headGroup.position.y = 2.08 + Math.sin(t * 0.003) * 0.04;
      if (ud && ud.rightArmGroup) ud.rightArmGroup.position.z = t % 2200 < 220 ? 0.65 : 0.2;
      if (ud && ud.ringSpark) ud.ringSpark.rotation.y = t * 0.004;
      renderer.render(scene, cam);
    };
    id = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(id);
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
      el.innerHTML = '';
    };
  }, [config]);
  return <div ref={ref} className="absolute inset-0" />;
}

    return () => {

function drawNameTag(canvas, name, dmg, color, isLocal) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  // name pill
  ctx.font = '900 40px "Arial Black", sans-serif';
  const label = isLocal ? `★ YOU · ${name}` : name;
  const tw = Math.min(w - 8, ctx.measureText(label).width + 36);
  ctx.fillStyle = 'rgba(2,6,23,0.82)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect((w - tw) / 2, 6, tw, 56, 28); else ctx.rect((w - tw) / 2, 6, tw, 56);
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.fillText(label, w / 2, 35, w - 30);
  // damage %, colour shifts white -> yellow -> red as it climbs
  const pct = Math.round(dmg);
  const heat = Math.min(1, pct / 150);
  const r = 255, g = Math.round(255 - heat * 215), b = Math.round(255 - Math.min(1, heat * 2) * 255);
  ctx.font = `900 ${64 + Math.round(heat * 22)}px "Arial Black", sans-serif`;
  ctx.lineWidth = 12;
  ctx.strokeStyle = '#000000';
  ctx.strokeText(`${pct}%`, w / 2, 122);
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillText(`${pct}%`, w / 2, 122);
}

function createLabelTexture(text, bgColor, textColor, width = 256, height = 128, fontSize = 44, glowColor = null) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  if (bgColor !== 'transparent') {
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, width, height);
  }

  ctx.font = `900 ${fontSize}px "Inter", "Arial Black", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (glowColor) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 16;
  }

  ctx.fillStyle = textColor;
  const lines = text.split('\n');
  lines.forEach((line, idx) => {
    const yOffset = (idx - (lines.length - 1) / 2) * (fontSize * 1.05);
    ctx.fillText(line, width / 2, height / 2 + yOffset);
  });

  const tex = srgbTex(new THREE.CanvasTexture(canvas));
  tex.needsUpdate = true;
  return tex;
}

  const phone = new THREE.Mesh(
    new THREE.BoxGeometry(0.26, 0.5, 0.05),

  );
  phone.position.set(-0.1, 0.1, 0.6);

  leftArmGroup.add(phone);

  const rightArmGroup = new THREE.Group();
  rightArmGroup.position.set(0.78, 1.35, 0.2);
  root.add(rightArmGroup);
  const rightArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.21, 0.54, 8, 12), isAstro ? glove : blackFur);
  rightArm.rotation.x = -Math.PI * 0.42;
  rightArm.rotation.z = -0.2;
  rightArm.position.set(0.06, -0.06, 0.32);
  rightArmGroup.add(rightArm);
  const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.035, 10, 18), new THREE.MeshStandardMaterial({ color: 0xd4a640, metalness: 1, roughness: 0.2 }));
  ringMesh.position.set(0.14, 0.12, 0.68);
  const ringSpark = new THREE.Mesh(new THREE.OctahedronGeometry(0.09, 0), new THREE.MeshBasicMaterial({ color: 0xfff1b0 }));
  ringSpark.position.set(0.14, 0.18, 0.72);
  rightArmGroup.add(ringMesh, ringSpark);

  // ---- team identity on the floor: unaffected by fog so colours stay pure ----
  const auraMat = new THREE.MeshBasicMaterial({ color: teamColor, side: THREE.DoubleSide, transparent: true, opacity: 1, fog: false });
  const aura = new THREE.Mesh(new THREE.RingGeometry(0.98, 1.42, 40), auraMat);
  aura.rotation.x = -Math.PI / 2;
  aura.position.y = 0.05;
  root.add(aura);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(0.98, 32), new THREE.MeshBasicMaterial({ color: teamColor, transparent: true, opacity: 0.32, side: THREE.DoubleSide, fog: false, depthWrite: false }));
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = 0.04;
  root.add(disc);

  root.userData = { headGroup, leftArmGroup, rightArmGroup, ringSpark, auraMat };
  upgradePandaMaterials(root);
  return root;
}

function makeInkTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#0d0c12';
  g.strokeStyle = '#0d0c12';
  g.beginPath();
  g.arc(64, 64, 26, 0, Math.PI * 2);
  g.fill();
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, r = 24 + Math.random() * 34, sz = 2 + Math.random() * 8;
    g.lineWidth = sz * 0.9;
    g.beginPath();
    g.moveTo(64, 64);
    g.lineTo(64 + Math.cos(a) * r, 64 + Math.sin(a) * r);
    g.stroke();
    g.beginPath();
    g.arc(64 + Math.cos(a) * r, 64 + Math.sin(a) * r, sz, 0, Math.PI * 2);
    g.fill();
  }
  return srgbTex(new THREE.CanvasTexture(c));
}

function drawShooterTag(canvas, name, hp, color) {
  const g = canvas.getContext('2d');
  g.clearRect(0, 0, 256, 64);

  g.fillRect(0, 0, 256, 64);

}

function buildShootoutMap(scene, cinematic) {
  const colliders = [], solids = [];
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x15141c, transparent: true, opacity: 0.55 });
  const box = (x, z, w, h, d, color, o = {}) => {
    const y0 = o.y || 0;
    const geo = new THREE.BoxGeometry(w, h, d);
    const m = new THREE.Mesh(geo, o.mat || new THREE.MeshStandardMaterial({ color, roughness: 0.85 }));
    m.position.set(x, y0 + h / 2, z);
    m.castShadow = cinematic;
    m.receiveShadow = true;
    scene.add(m);
    if (!o.noEdge) {
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
      e.position.copy(m.position);
      scene.add(e);
    }
    if (!o.noCollide) {
      colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, bottom: y0, top: y0 + h });
      solids.push(m);
    }
    return m;
  };
  const plane = (w, h, mat, x, y, z, rotY) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(x, y, z);
    m.rotation.y = rotY;
    scene.add(m);
    return m;
  };
  const signMat = (text, bg, fg, w, h) => {
    const cw = 512, ch = Math.max(64, Math.round(512 * h / w));
    const fs = Math.min(ch * 0.62, (cw * 1.5) / Math.max(4, text.length));
    return new THREE.MeshStandardMaterial({ map: createLabelTexture(text, bg, fg, cw, ch, Math.round(fs)), roughness: 0.7 });
  };
  // faces: 'z+' front points to +z, etc.
  const ROT = { 'z+': 0, 'z-': Math.PI, 'x+': Math.PI / 2, 'x-': -Math.PI / 2 };
  const faceOffset = (face, x, z, w, d, along, out) => {
    if (face === 'z+') return [x + along, z + d / 2 + out];
    if (face === 'z-') return [x - along, z - d / 2 - out];
    if (face === 'x+') return [x + w / 2 + out, z - along];
    return [x - w / 2 - out, z + along];
  };
  const winMat = new THREE.MeshStandardMaterial({ color: 0x1d3550, roughness: 0.25, metalness: 0.4, emissive: 0x0b1a2a, emissiveIntensity: 0.4 });
  const building = (x, z, w, h, d, color, roof, label, face, signBg, signFg) => {
    box(x, z, w, h, d, color);
    box(x, z, w + 0.9, 0.55, d + 0.9, roof, { y: h, noCollide: true });
    const span = face === 'z+' || face === 'z-' ? w : d;
    const n = Math.max(1, Math.floor(span / 4.5));
    ['z+', 'z-', 'x+', 'x-'].forEach(f => {
      const fs = f === 'z+' || f === 'z-' ? w : d;
      const k = Math.max(1, Math.floor(fs / 4.5));
      for (let i = 0; i < k; i++) {
        const along = (i - (k - 1) / 2) * (fs / k);
        if (f === face && Math.abs(along) < 2.5) continue; // door space
        const [px, pz] = faceOffset(f, x, z, w, d, along, 0.03);
        plane(1.8, 1.5, winMat, px, Math.min(h - 1.6, 3.4), pz, ROT[f]);
      }
    });
    const [dx, dz] = faceOffset(face, x, z, w, d, 0, 0.03);
    plane(2.4, 3.2, new THREE.MeshStandardMaterial({ color: 0x3b2a20, roughness: 0.8 }), dx, 1.6, dz, ROT[face]);
    const sw = Math.min(span * 0.8, label.length * 1.1 + 2);
    const [sx, sz] = faceOffset(face, x, z, w, d, 0, 0.06);
    plane(sw, 1.6, signMat(label, signBg, signFg, sw, 1.6), sx, h - 1.1, sz, ROT[face]);
    const [ax, az] = faceOffset(face, x, z, w, d, 0, 0.9);
    const awn = face === 'z+' || face === 'z-' ? box(ax, az, 4.2, 0.22, 1.8, roof, { y: 3.35, noCollide: true }) : box(ax, az, 1.8, 0.22, 4.2, roof, { y: 3.35, noCollide: true });
    awn.rotation[face === 'z+' || face === 'z-' ? 'x' : 'z'] = (face === 'z+' || face === 'x-' ? 1 : -1) * 0.18;
    box(x - w * 0.22, z - d * 0.2, 1.6, 1, 1.4, 0xcbd5e1, { y: h + 0.55, noCollide: true });
    box(x + w * 0.25, z + d * 0.18, 1.2, 0.8, 1.2, 0x94a3b8, { y: h + 0.55, noCollide: true });
    box(x + w * 0.3, z - d * 0.3, 0.12, 3, 0.12, 0x475569, { y: h + 0.55, noCollide: true, noEdge: true });
    void n;
  };

  // ---- sky, ground, roads ----
  const sky = document.createElement('canvas');
  sky.width = 4;
  sky.height = 256;
  const sg = sky.getContext('2d');
  const grd = sg.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#4f9fe0');
  grd.addColorStop(0.55, '#9ed0f2');
  grd.addColorStop(1, '#f3e9d6');
  sg.fillStyle = grd;
  sg.fillRect(0, 0, 4, 256);
  scene.background = srgbTex(new THREE.CanvasTexture(sky));
  scene.fog = new THREE.Fog(0xcfe6f3, 70, 230);

  const sandC = document.createElement('canvas');
  sandC.width = sandC.height = 256;
  const sgc = sandC.getContext('2d');
  sgc.fillStyle = '#d9bb84';
  sgc.fillRect(0, 0, 256, 256);
  sgc.globalAlpha = 0.22;
  sgc.drawImage(noiseCanvas(256, 22, 4, 31), 0, 0);
  const sandTex = srgbTex(new THREE.CanvasTexture(sandC));
  sandTex.wrapS = sandTex.wrapT = THREE.RepeatWrapping;
  sandTex.repeat.set(40, 40);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0xffffff, map: sandTex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  solids.push(ground);

function makeSmokeTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  for (let i = 0; i < 16; i++) {
    const x = 64 + (Math.random() - 0.5) * 46, y = 64 + (Math.random() - 0.5) * 46, r = 16 + Math.random() * 28;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.32)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
  return srgbTex(new THREE.CanvasTexture(c));
}

function buildSiegeMap(scene, cinematic) {
  const colliders = [], solids = [];
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x2a1a12, transparent: true, opacity: 0.45 });
  const box = (x, z, w, h, d, color, o = {}) => {
    const y0 = o.y || 0;
    const geo = new THREE.BoxGeometry(w, h, d);
    const m = new THREE.Mesh(geo, o.mat || new THREE.MeshStandardMaterial({ color, roughness: 0.85 }));
    m.position.set(x, y0 + h / 2, z);
    m.castShadow = cinematic;
    m.receiveShadow = true;
    scene.add(m);
    if (!o.noEdge) {
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
      e.position.copy(m.position);
      scene.add(e);
    }
    if (!o.noCollide) {
      colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, bottom: y0, top: y0 + h });
      solids.push(m);
    }
    return m;
  };
  const plane = (w, h, mat, x, y, z, rotY) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(x, y, z);
    m.rotation.y = rotY;
    scene.add(m);
    return m;
  };
  const signMat = (text, bg, fg, w, h) => {
    const cw = 512, ch = Math.max(64, Math.round(512 * h / w));
    const fs = Math.min(ch * 0.62, (cw * 1.5) / Math.max(4, text.length));
    return new THREE.MeshStandardMaterial({ map: createLabelTexture(text, bg, fg, cw, ch, Math.round(fs)), roughness: 0.7, side: THREE.DoubleSide });
  };

  // ---- sunset sky, warm fog ----
  const sky = document.createElement('canvas');
  sky.width = 4;
  sky.height = 256;
  const sg = sky.getContext('2d');
  const grd = sg.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#23295a');
  grd.addColorStop(0.35, '#6e4a8c');
  grd.addColorStop(0.68, '#f0874f');
  grd.addColorStop(1, '#ffd49c');
  sg.fillStyle = grd;
  sg.fillRect(0, 0, 4, 256);
  scene.background = srgbTex(new THREE.CanvasTexture(sky));
  scene.fog = new THREE.Fog(0xe9a37a, 60, 240);
  const sunDisc = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlowTexture('rgba(255,236,190,1)', 'rgba(255,150,80,0)'), transparent: true, depthWrite: false, fog: false }));
  sunDisc.position.set(-160, 28, 110);
  sunDisc.scale.set(70, 70, 1);
  scene.add(sunDisc);

  // ---- desert ground + road ----
  const sandC = document.createElement('canvas');
  sandC.width = sandC.height = 256;
  const sgc = sandC.getContext('2d');
  sgc.fillStyle = '#c48a5a';
  sgc.fillRect(0, 0, 256, 256);
  sgc.globalAlpha = 0.25;
  sgc.drawImage(noiseCanvas(256, 20, 4, 77), 0, 0);
  const sandTex = srgbTex(new THREE.CanvasTexture(sandC));
  sandTex.wrapS = sandTex.wrapT = THREE.RepeatWrapping;
  sandTex.repeat.set(40, 40);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ map: sandTex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  solids.push(ground);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(10, 84), new THREE.MeshStandardMaterial({ color: 0xa8714a, roughness: 1 }));
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0.02, 20);
  road.receiveShadow = true;
  scene.add(road);

  // ---- canyon cliffs around the map ----
  const rockMat = new THREE.MeshStandardMaterial({ color: 0xa35f3c, roughness: 1, flatShading: true });
  for (let i = 0; i < 46; i++) {
    const a = (i / 46) * Math.PI * 2;
    const r = 74 + Math.random() * 12;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(9 + Math.random() * 9, 0), rockMat);
    rock.scale.y = 1.2 + Math.random() * 1.3;
    rock.rotation.set(Math.random(), Math.random() * 6, Math.random());
    rock.position.set(Math.cos(a) * r, 2 + Math.random() * 5, Math.sin(a) * r);
    scene.add(rock);
  }
  const L = 63;
  [[0, -L, 2 * L, 2], [0, L, 2 * L, 2], [-L, 0, 2, 2 * L], [L, 0, 2, 2 * L]].forEach(([x, z, w, d]) => {
    colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, bottom: 0, top: 60 });
  });

  // ---- Fort HODL: walls with a south gate and two side doors ----
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xcdb596, roughness: 0.9 });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0x7c6a58, roughness: 0.8 });
  const wireMat = new THREE.LineBasicMaterial({ color: 0x3f3f46 });
  const wall = (x1, z1, x2, z2) => {
    const horiz = z1 === z2;
    const len = horiz ? Math.abs(x2 - x1) : Math.abs(z2 - z1);
    const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
    box(cx, cz, horiz ? len : 2, 6, horiz ? 2 : len, 0, { mat: wallMat });
    box(cx, cz, horiz ? len + 0.4 : 2.5, 0.45, horiz ? 2.5 : len + 0.4, 0, { mat: trimMat, y: 6, noCollide: true });
    const pts = [];
    const n = Math.floor(len / 0.8);
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const px = horiz ? x1 + (x2 - x1) * t : x1, pz = horiz ? z1 : z1 + (z2 - z1) * t;
      pts.push(new THREE.Vector3(px + (horiz ? 0 : (i % 2 ? 0.3 : -0.3)), 6.9 + (i % 2 ? 0.3 : 0), pz + (horiz ? (i % 2 ? 0.3 : -0.3) : 0)));
    }
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wireMat));
  };
  wall(-40, -22, -7, -22);
  wall(7, -22, 40, -22);
  wall(-40, -62, -40, -45);
  wall(-40, -38, -40, -22);

    }

    const obj = { stage: 0, prog: 0, contested: false, capturing: false, warnAt: 0 };
    const { colliders, solids } = map;
    const raycaster = new THREE.Raycaster();

    // ---------- helpers ----------
    const announceNow = (text, color) => {

        if (!colliders.some(c => ox > c.minX - 1 && ox < c.maxX + 1 && oz > c.minZ - 1 && oz < c.maxZ + 1 && c.bottom < 2)) return [ox, oz];
      }
      return [x, z];

    const moveBody = (pos, vel, r, dt) => {
      const axis = (ax) => {
        for (const c of colliders) {
          if (pos.y >= c.top - 0.5 || pos.y + 2.6 <= c.bottom) continue;
          if (pos.x > c.minX - r && pos.x < c.maxX + r && pos.z > c.minZ - r && pos.z < c.maxZ + r) {
            if (ax === 'x') {
              const v = vel.x !== 0 ? vel.x : (pos.x < (c.minX + c.maxX) / 2 ? 1 : -1);
              pos.x = v > 0 ? c.minX - r : c.maxX + r;
              vel.x = 0;
            } else {
              const v = vel.z !== 0 ? vel.z : (pos.z < (c.minZ + c.maxZ) / 2 ? 1 : -1);
              pos.z = v > 0 ? c.minZ - r : c.maxZ + r;
              vel.z = 0;
            }
          }
        }
      };
      pos.x += vel.x * dt;
      axis('x');
      pos.z += vel.z * dt;
      axis('z');
      pos.y += vel.y * dt;
      let ground = 0;
      const rr = r * 0.6;
      for (const c of colliders) {
        if (c.top <= pos.y + 0.5 && pos.x > c.minX - rr && pos.x < c.maxX + rr && pos.z > c.minZ - rr && pos.z < c.maxZ + rr) ground = Math.max(ground, c.top);
      }
      if (pos.y <= ground) {
        pos.y = ground;
        if (vel.y < 0) vel.y = 0;
        return true;
      }
      return pos.y - ground < 0.06;
    };
    const raySphere = (o, d, cx, cy, cz, r) => {
      const ox = o.x - cx, oy = o.y - cy, oz = o.z - cz;
      const b = ox * d.x + oy * d.y + oz * d.z;
      const c = ox * ox + oy * oy + oz * oz - r * r;
      const h = b * b - c;
      if (h < 0) return -1;
      const t = -b - Math.sqrt(h);
      return t > 0 ? t : -1;

      sfx.play('explode', Math.max(0.15, 1 - dme / 90));
      if (dme < 6) inkSplat(new THREE.Vector3(point.x, 0.02, point.z), new THREE.Vector3(0, 1, 0), 3.2);
      if (visualOnly) return;
      net.pendingEx.push([r1(point.x), r1(point.y), r1(point.z)]);
      if (start) queueTracer(start, point);
      fighters.forEach(f => {
        if (f.dead) return;
        if (siege && owner && f !== owner && f.team === owner.team) return;
        const cx = f.pos.x, cy = f.pos.y + 1.2, cz = f.pos.z;
        const d = Math.hypot(cx - point.x, cy - point.y, cz - point.z);
        if (d > 7) return;
        let dmg = d < 1.6 ? 100 : 100 * (1 - (d - 1.6) / 5.4);
        if (f === owner) dmg *= 0.3;
        if (dmg < 1) return;
        if (f.isMe || (f.isBot && net.isHost)) {
          const kx = (cx - point.x) / (d || 1), kz = (cz - point.z) / (d || 1), kb = 16 * (1 - d / 7);
          f.vel.x += kx * kb;
          f.vel.z += kz * kb;
          f.vel.y = Math.max(f.vel.y, 6 + 9 * (1 - d / 7));
        }
        damage(f, owner, Math.round(dmg), false);
        if (owner && owner.isMe && f !== owner) dmgNumber(new THREE.Vector3(f.pos.x, f.pos.y + 2.6, f.pos.z), Math.round(dmg), false, true);
      });
    };
    const selectSlot = i => {
      if (i === me.slot || !me.weapons[i]) return;
      me.lastSlot = me.slot;
      me.slot = i;
      me.reloadT = 0;
      me.shotCd = Math.max(me.shotCd, 0.12);
      equipModel(me.weapons[i].key);
      sfx.play('reload', 0.45);
    };
    const addWeapon = key => {
      const i = me.weapons.findIndex(w => w.key === key);
      if (i >= 0) {
        me.weapons[i].mag = SHOOT_WEAPONS[key].mag;
        selectSlot(i);
        return;
      }
      if (me.weapons.length >= 5) me.weapons.splice(me.slot, 1, { key, mag: SHOOT_WEAPONS[key].mag });
      else me.weapons.push({ key, mag: SHOOT_WEAPONS[key].mag });
      const idx = me.weapons.findIndex(w => w.key === key);
      me.slot = -1;
      selectSlot(idx);
    };
    const botShoot = (b, t) => {
      const fx0 = Math.sin(b.face), fz0 = Math.cos(b.face);
      const muzzle = new THREE.Vector3(b.pos.x + fx0 * 0.9 + fz0 * 0.35, b.pos.y + 1.45, b.pos.z + fz0 * 0.9 - fx0 * 0.35);
      const d0 = Math.hypot(t.pos.x - b.pos.x, t.pos.z - b.pos.z);
      const movingT = Math.hypot(t.vel.x, t.vel.z) > 2;
      const err = (0.35 + d0 * 0.028) * (movingT ? 1.35 : 1) * b.skill;
      const aim = new THREE.Vector3(t.pos.x + (Math.random() - 0.5) * err * 2, t.pos.y + 1.3 + (Math.random() - 0.5) * err * 2, t.pos.z + (Math.random() - 0.5) * err * 2);
      const dir = aim.sub(muzzle).normalize();
      const res = traceShot(muzzle, dir, b);
      spawnTracer(muzzle, res.point, b.golden ? 0xffc93c : 0xfff1a8);
      queueTracer(muzzle, res.point);
      const vol = Math.max(0, 1 - me.pos.distanceTo(b.pos) / 70);
      sfx.play('shot_ak', vol * 0.5);
      b.protT = 0;
      if (res.fighter) {
        damage(res.fighter, b, (b.golden ? 20 : b.wkey === 'gatling' ? 6 : 11) * (res.head ? 1.6 : 1), res.head);
        if (!res.fighter.isMe) hitFx(res.fighter, res.point, res.head);
      } else if (res.wall && res.normal) {
        inkSplat(res.point, res.normal, 0.6);
        if (vol > 0.25) impactFx(res.point, res.normal);
      }
    };

    // ---------- bots ----------
    const spawnBots = count => {
      for (let i = 0; i < count; i++) {
        const klass = PANDA_CLASSES[Math.floor(Math.random() * PANDA_CLASSES.length)];
        const nAtk = fighters.filter(f => f.team === 'atk').length, nDef = fighters.filter(f => f.team === 'def').length;
        const b = createFighter(`${myId}_b${i}`, RIVAL_NAMES[i % RIVAL_NAMES.length], klass, { isBot: true, team: siege ? (nAtk <= nDef ? 'atk' : 'def') : null });
        b.skill = 0.85 + Math.random() * 0.5;
        b.wkey = ['ak', 'ak', 'ak', 'gatling', 'rpg'][Math.floor(Math.random() * 5)];
        swapGun(b, b.mesh, b.wkey);
        b.dropSeeker = Math.random() < 0.5;
        const [x, z] = pickSpawn(b);
        b.pos.set(x, 0, z);
      }
    };
    const randomGoal = () => {
      const s = map.spawns[Math.floor(Math.random() * map.spawns.length)];
      const p = map.pickupSpots[Math.floor(Math.random() * map.pickupSpots.length)];
      const src = Math.random() < 0.5 ? s : p;
      return new THREE.Vector3(src[0] + (Math.random() - 0.5) * 6, 0, src[1] + (Math.random() - 0.5) * 6);
    };
    const siegeGoal = b => {
      const o = map.objectives[Math.min(obj.stage, 1)];
      const inFort = z => z < -23;
      const goalIn = inFort(o.z);
      if (inFort(b.pos.z) !== goalIn) {
        if (Math.abs(b.pos.x) > 4) return new THREE.Vector3((Math.random() - 0.5) * 5, 0, goalIn ? -16 : -28);
        return new THREE.Vector3((Math.random() - 0.5) * 4, 0, goalIn ? -29 : -15);
      }
      const spread = b.team === 'atk' ? 4 : 10;
      return new THREE.Vector3(o.x + (Math.random() - 0.5) * spread * 2, 0, o.z + (Math.random() - 0.5) * spread * 2);
    };
    const eyeOf = f => new THREE.Vector3(f.pos.x, f.pos.y + 2.0, f.pos.z);
    const chestOf = f => new THREE.Vector3(f.pos.x, f.pos.y + 1.3, f.pos.z);
    const updateBot = (b, dt, frozen) => {
      if (b.dead) {
        b.respawnT -= dt;
        b.mesh.rotation.x += (-Math.PI / 2 - b.mesh.rotation.x) * Math.min(1, dt * 6);
        b.vel.x *= Math.exp(-dt * 2.5);
        b.vel.z *= Math.exp(-dt * 2.5);
        b.vel.y -= 26 * dt;
        moveBody(b.pos, b.vel, 0.7, dt);
        if (b.respawnT <= 0) {
          const [x, z] = pickSpawn(b);
          b.pos.set(x, 0, z);
          b.vel.set(0, 0, 0);
          b.hp = 100;
          b.dead = false;
          b.protT = 2.5;
          b.target = null;
          b.mesh.rotation.x = 0;
          if (b.golden) {
            b.golden = false;
            b.gunKey = null;
            swapGun(b, b.mesh, b.wkey || 'ak');
          }
        }
        return;
      }
      if (b.danceT > 0) {
        b.danceT -= dt;
        b.dancing = b.danceT > 0;
        b.hp = Math.min(100, b.hp + 15 * dt);
        b.vel.x *= 0.85;
        b.vel.z *= 0.85;
        b.vel.y -= (world.moonT > 0 ? 9 : 26) * dt;
        b.onGround = moveBody(b.pos, b.vel, 0.7, dt);
        return;
      }
      b.thinkT -= dt;
      if (b.thinkT <= 0) {
        b.thinkT = 0.25 + Math.random() * 0.25;
        let best = null, bd = 1e9;
        const eye = eyeOf(b);
        for (const f of fighters) {
          if (f === b || f.dead || (siege && f.team === b.team)) continue;
          const d = f.pos.distanceTo(b.pos);
          if (d < 75 && d < bd && hasLOS(eye, chestOf(f))) { bd = d; best = f; }
        }
        if (best !== b.target) {
          b.target = best;
          b.react = 0.4 + Math.random() * 0.4;
        }
        if (Math.random() < 0.25) b.strafe = -b.strafe;
        if (!best && (!b.goal || b.goal.distanceTo(b.pos) < 3 || b.stuckT > 1.2)) {
          b.goal = siege ? siegeGoal(b) : randomGoal();
          b.stuckT = 0;
        }
      }
      const drop = drops.find(dp => dp.landed);
      if (!b.target && drop && b.dropSeeker) b.goal = new THREE.Vector3(drop.x, 0, drop.z);
      let dx = 0, dz = 0, speed = 6.5 * (world.bullT > 0 ? 1.4 : 1);
      const t = b.target;
      if (t && !t.dead) {
        const tx = t.pos.x - b.pos.x, tz = t.pos.z - b.pos.z, d = Math.hypot(tx, tz) || 1;
        const ux = tx / d, uz = tz / d;
        const want = d > 30 ? 0.9 : d < 10 ? -0.5 : 0.1;
        dx = ux * want - uz * b.strafe * 0.8;
        dz = uz * want + ux * b.strafe * 0.8;
        b.face = Math.atan2(tx, tz);
        speed = 7;
        b.react -= dt;
        b.fireCd -= dt;
        if (!frozen && b.react <= 0 && b.fireCd <= 0) {
          const tdist = Math.hypot(t.pos.x - b.pos.x, t.pos.z - b.pos.z);
          if (b.wkey === 'rpg' && !b.golden) {
            b.fireCd = 3.5 + Math.random() * 2;
            if (tdist > 9) {
              const fx0 = Math.sin(b.face), fz0 = Math.cos(b.face);
              const mz = new THREE.Vector3(b.pos.x + fx0 * 1.2, b.pos.y + 1.7, b.pos.z + fz0 * 1.2);
              const aim = new THREE.Vector3(t.pos.x + (Math.random() - 0.5) * 2, t.pos.y + 0.9, t.pos.z + (Math.random() - 0.5) * 2);
              fireRocket(mz, aim.sub(mz).normalize(), b);
              b.protT = 0;
              sfx.play('shot_rpg', Math.max(0, 1 - me.pos.distanceTo(b.pos) / 70) * 0.6);
            } else botShoot(b, t);
          } else {
            const gat = b.wkey === 'gatling' && !b.golden;
            if (b.burst > 0) {
              b.burst -= 1;
              b.fireCd = gat ? 0.06 : 0.14;
            } else {
              b.burst = gat ? 10 + Math.floor(Math.random() * 10) : 2 + Math.floor(Math.random() * 3);
              b.fireCd = 0.55 + Math.random() * 0.6;
            }
            botShoot(b, t);
          }
        }
        if (b.onGround && Math.random() < 0.004) b.vel.y = 10;
      } else if (b.goal) {
        const gx = b.goal.x - b.pos.x, gz = b.goal.z - b.pos.z, d = Math.hypot(gx, gz) || 1;
        dx = gx / d;
        dz = gz / d;
        b.face = Math.atan2(dx, dz);
      }
      if (frozen) { dx = 0; dz = 0; }
      if (dx || dz) {
        const blocked = (ax, az) => colliders.some(c => c.top > b.pos.y + 0.6 && c.bottom < b.pos.y + 2 && ax > c.minX - 0.6 && ax < c.maxX + 0.6 && az > c.minZ - 0.6 && az < c.maxZ + 0.6);
        const ll = Math.hypot(dx, dz) || 1;
        const ux = dx / ll, uz = dz / ll;
        if (blocked(b.pos.x + ux * 2.4, b.pos.z + uz * 2.4)) {
          const side = b.avoid || (Math.random() < 0.5 ? 1 : -1);
          let found = false;
          for (const ang of [0.8, 1.5, 2.2]) {
            const ca = Math.cos(ang * side), sa = Math.sin(ang * side);
            const nx = ux * ca - uz * sa, nz = ux * sa + uz * ca;
            if (!blocked(b.pos.x + nx * 2.4, b.pos.z + nz * 2.4)) {
              dx = nx * ll;
              dz = nz * ll;
              b.avoid = side;
              found = true;
              break;
            }
          }
          if (!found) b.avoid = -side;
        } else b.avoid = 0;
      }
      const l = Math.hypot(dx, dz);
      if (l > 1) { dx /= l; dz /= l; }
      b.vel.x += (dx * speed - b.vel.x) * Math.min(1, dt * 8);
      b.vel.z += (dz * speed - b.vel.z) * Math.min(1, dt * 8);
      b.vel.y -= (world.moonT > 0 ? 9 : 26) * dt;
      const ox = b.pos.x, oz = b.pos.z;
      b.onGround = moveBody(b.pos, b.vel, 0.7, dt);
      const moved = Math.hypot(b.pos.x - ox, b.pos.z - oz);
      if (l > 0.3 && moved < speed * dt * 0.3) b.stuckT += dt;
      else b.stuckT = Math.max(0, b.stuckT - dt);
      if (b.stuckT > 0.6 && b.onGround) b.vel.y = 10;
    };

    // ---------- pickups ----------
    const pickups = map.pickupSpots.map(([px, pz, kind, py = 0]) => {
      const [x, z] = py > 0 ? [px, pz] : freeSpot(px, pz);
      const def = SHOOT_PICKUPS[kind];
      const grp = new THREE.Group();
      const icon = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeEmojiTexture(def.icon), transparent: true }));
      icon.scale.set(1.3, 1.3, 1);
      icon.position.y = 1.4;
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.75, 1.0, 28), new THREE.MeshBasicMaterial({ color: def.color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.05;
      const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.75, 0.3, 16), new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 }));
      ped.position.y = 0.15;
      grp.add(icon, ring, ped);
      grp.position.set(x, py, z);
      scene.add(grp);
      return { x, y: py, z, kind, grp, icon, t: 0, ph: Math.random() * 6 };
    });

    // ---------- input ----------
    const keys = {};
    const onKeyDown = e => {
      if (e.code === 'Tab') {
        e.preventDefault();
        setShowBoard(true);
      }
      if (e.repeat) return;
      keys[e.code] = true;
      const c = ctl.current;
      if (e.code === 'Space') { e.preventDefault(); c.jump = true; }
      if (e.code === 'KeyR') c.reload = true;
      if (e.code === 'KeyV') c.dance = true;
      if (e.code === 'KeyQ') c.swap = true;
      if (/^Digit[1-5]$/.test(e.code)) c.slot = Number(e.code.slice(5)) - 1;
      if (e.code === 'KeyM') {
        const m = !sfx.isMuted();
        sfx.setMuted(m);
        setMutedS(m);
      }
    };
    const onKeyUp = e => {
      keys[e.code] = false;
      if (e.code === 'Tab') setShowBoard(false);
    };
    const locked = () => document.pointerLockElement === renderer.domElement;
    const releaseInputs = () => {
      Object.keys(keys).forEach(k => { keys[k] = false; });
      ctl.current.firing = false;
      ctl.current.ads = false;
      me.semiHeld = false;
    };
    const onLockChange = () => { if (!locked()) releaseInputs(); };
    document.addEventListener('pointerlockchange', onLockChange);
    window.addEventListener('blur', releaseInputs);
    const onMouseMove = e => {
      if (!locked() || me.dead) return;
      const sens = 0.0022 / (1 + (SHOOT_WEAPONS[me.weapons[me.slot].key].zoom - 1) * me.adsT);
      me.yaw -= e.movementX * sens;
      me.swayX = Math.max(-0.07, Math.min(0.07, (me.swayX || 0) + e.movementX * 0.0007));
      me.swayY = Math.max(-0.05, Math.min(0.05, (me.swayY || 0) + e.movementY * 0.0006));
      me.pitch = Math.max(-1.45, Math.min(1.45, me.pitch - e.movementY * sens));
    };
    const onMouseDown = e => {
      if (!locked()) return;

      if (e.button === 2) ctl.current.ads = true;
    };

    };
    const noMenu = e => e.preventDefault();

    const onWheel = e => {

    };

    // ---------- match ----------

    let everLocked = false;

    // ---------- surprise events: low gravity, bull run, golden AK airdrops ----------
    const world = { moonT: 0, bullT: 0 };
    const drops = [];
    const spawnAirdrop = () => {
      const dropList = map.dropSpots || map.spawns;

      const grp = new THREE.Group();

      crate.position.y = 0.8;

      chute.position.y = 6;

      const strings = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lines), new THREE.LineBasicMaterial({ color: 0xf8fafc }));
      grp.add(crate, chute, strings);

    const objVis = siege ? map.objectives.map(o => {
      const ring = new THREE.Mesh(new THREE.RingGeometry(o.r - 0.45, o.r, 64), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false, fog: false }));

    }) : [];
    const objectiveTaken = idx => {

      pushFeed(`⚔️ Raiders captured ${o.name}${idx === 0 ? ' · +75s' : ''}`, SIEGE_TEAMS.atk.color);

      }

    const endMatch = (winner = null) => {
      if (match.over) return;
      match.over = true;
      ctl.current.firing = false;
      if (document.pointerLockElement) document.exitPointerLock();
      // no freeze: everyone breaks into a victory dance while the camera orbits you
      fighters.forEach(f => { if (f.isBot && !f.dead) f.danceT = 99; });
      if (!me.dead) me.dancing = true;
      const board = [...fighters].map(f => ({ id: f.id, name: f.name, color: f.color, isMe: f.isMe, kills: f.kills, deaths: f.deaths })).sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);

      sfx.play(rank === 1 ? 'streak' : 'ko');
      if (siege) {
        const won = winner === me.team;
